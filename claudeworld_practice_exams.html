ontains toxic gases, ultrafine particulates, viable bacteria/viruses, and potential carcinogens, which is why smoke evacuation is a standard safety recommendation.</p>\\n<p><strong>Why the others are incorrect (they ARE rare events):</strong></p>\\n<ul>\\n<li><strong>Explosion</strong> and <strong>Fire</strong> --- Surgical fires/explosions (oxygen-enriched field, ignition source, fuel) are recognized but uncommon &quot;never events.&quot;</li>\\n\\n<li><strong>Toxic chemical spill</strong> --- An uncommon environmental hazard.</li>\\n\\n<li><strong>Hostage situation</strong> --- A rare workplace-violence scenario.</li>\\n</ul>\\n<p><strong>Background:</strong> Because smoke plume exposure is continuous and frequent rather than rare, mitigation (local smoke evacuators, high-filtration masks) is emphasized as routine OR practice.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":84,\"stem\":\"A 4-year-old male presents to the ER following a motor vehicle collision. He is crying but consoled by his mother. He opens his eyes when his name is called, and he withdraws from painful stimuli. Which of the following is an appropriate calculation for the child's current GCS?\",\"options\":[{\"letter\":\"A\",\"text\":\"9\"},{\"letter\":\"B\",\"text\":\"10\"},{\"letter\":\"C\",\"text\":\"11\"},{\"letter\":\"D\",\"text\":\"12\"},{\"letter\":\"E\",\"text\":\"8\"}],\"correct\":\"C\",\"explanation\":\"<p><strong>Why C is correct:</strong> Using the pediatric GCS (modified verbal scale for young children):</p>\\n<ul>\\n<li><strong>Eye opening = 3</strong> --- opens eyes to speech/voice (to name).</li>\\n\\n<li><strong>Verbal = 4</strong> --- &quot;cries but consolable&quot; corresponds to the pediatric V4 (irritable, consolable).</li>\\n\\n<li><strong>Motor = 4</strong> --- withdraws to (from) painful stimuli.</li>\\n</ul>\\n<p>Total = E3 + V4 + M4 = <strong>11</strong>.</p>\\n<p><strong>Why the others are incorrect:</strong> They result from misassigning one or more components. Eye-to-speech is 3 (not 4), consolable crying is the pediatric V4 (not V5, which is age-appropriate/socially interactive/coos-babbles), and withdrawal to pain is M4 (not M5 localizing or M3 flexion).</p>\\n<p><strong>Background:</strong> The pediatric verbal scale replaces adult responses for pre-verbal/young children: V5 coos/babbles or is interactive; V4 irritable, consolable crying; V3 cries to pain; V2 moans to pain; V1 none. Eye and motor scales are essentially the same as the adult scale.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":85,\"stem\":\"A 37-year-old man is involved in a high-speed motor vehicle collision. He is hemodynamically stable. A supine chest x-ray shows a pulmonary contusion and possible widened mediastinum. What is the most appropriate study to diagnose the presence of a traumatic injury to the aorta?\",\"options\":[{\"letter\":\"A\",\"text\":\"Diagnostic peritoneal lavage\"},{\"letter\":\"B\",\"text\":\"Helical thin-cut CT angiography\"},{\"letter\":\"C\",\"text\":\"Thoracic aortography\"},{\"letter\":\"D\",\"text\":\"MRI of the chest\"},{\"letter\":\"E\",\"text\":\"FAST scan\"}],\"correct\":\"B\",\"explanation\":\"<p><strong>Why B is correct:</strong> In the hemodynamically stable trauma patient with a widened mediastinum or other signs of possible blunt thoracic aortic injury, CT angiography of the chest is the diagnostic study of choice. It is fast, widely available, highly sensitive and specific, and non-invasive, and it simultaneously evaluates other thoracic injuries.</p>\\n<p><strong>Why the others are incorrect:</strong></p>\\n<ul>\\n<li><strong>A (DPL)</strong> and <strong>E (FAST)</strong> evaluate the abdomen/pericardium for hemorrhage; neither assesses the thoracic aorta.</li>\\n\\n<li><strong>C (Aortography)</strong> was the historic gold standard but is now reserved for equivocal cases or when endovascular repair is planned; it is invasive and slower.</li>\\n\\n<li><strong>D (MRI)</strong> is not practical for acute trauma (time, monitoring, and access constraints).</li>\\n</ul>\\n<p><strong>Background:</strong> Blunt thoracic aortic injury classically occurs at the aortic isthmus (distal to the left subclavian artery). Plain-film clues include a widened mediastinum, obscured aortic knob, left apical cap, depressed left mainstem bronchus, and NG-tube deviation --- all indications to proceed to CT angiography.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":86,\"stem\":\"Which ONE of the following is correct?\",\"options\":[{\"letter\":\"A\",\"text\":\"Inclusion/exclusion criteria determine internal validity\"},{\"letter\":\"B\",\"text\":\"Decreasing chance outcomes not related to treatment increases external validity\"},{\"letter\":\"C\",\"text\":\"An effectiveness trial determines whether the treatment helps under ideal circumstances\"},{\"letter\":\"D\",\"text\":\"Benefits of RCTs include comparable groups and lack of bias\"}],\"correct\":\"D\",\"explanation\":\"<p><strong>Why D is correct:</strong> Randomization distributes both known and unknown confounders evenly, producing comparable groups at baseline and minimizing selection and confounding bias. This is the defining strength of the randomized controlled trial (RCT).</p>\\n<p><strong>Why the others are incorrect:</strong></p>\\n<ul>\\n<li><strong>A</strong> --- Inclusion/exclusion criteria primarily determine external validity (generalizability), by defining the population to whom results apply --- not internal validity.</li>\\n\\n<li><strong>B</strong> --- Reducing outcomes unrelated to treatment (i.e., controlling for extraneous factors/bias) increases internal validity, not external validity.</li>\\n\\n<li><strong>C</strong> --- A trial testing a treatment under ideal/controlled conditions is an efficacy trial. An effectiveness (pragmatic) trial tests performance under real-world, routine conditions.</li>\\n</ul>\\n<p><strong>Background:</strong> Internal validity = the degree to which the observed effect is truly due to the intervention (freedom from bias/confounding). External validity = generalizability to other populations/settings. Efficacy = ideal conditions; effectiveness = real-world conditions.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":87,\"stem\":\"Which ONE of the following is true regarding systematic reviews?\",\"options\":[{\"letter\":\"A\",\"text\":\"A Forest plot is a graphical representation of individual studies, typically representing the area under the curve\"},{\"letter\":\"B\",\"text\":\"Statistical heterogeneity means the similarity in results between studies which have different research questions\"},{\"letter\":\"C\",\"text\":\"A sensitivity analysis is a technique to determine whether the inclusion of poor-quality studies influences the size of the effect\"},{\"letter\":\"D\",\"text\":\"Precision refers to the extent to which the result represents the \\\"truth\\\"\"}],\"correct\":\"C\",\"explanation\":\"<p><strong>Why C is correct:</strong> A sensitivity analysis re-runs the meta-analysis after altering assumptions or excluding certain studies (e.g., low-quality or high-risk-of-bias studies) to test how robust the pooled estimate is. If the effect size changes materially when poor-quality studies are removed, the result is not robust.</p>\\n<p><strong>Why the others are incorrect:</strong></p>\\n<ul>\\n<li><strong>A</strong> --- A forest plot displays the point estimate and confidence interval of each individual study plus the pooled summary estimate; it does not represent an &quot;area under the curve.&quot;</li>\\n\\n<li><strong>B</strong> --- Statistical heterogeneity refers to variability/differences in results across studies beyond chance (quantified by I\\u00b2, Cochran&#x27;s Q), not similarity.</li>\\n\\n<li><strong>D</strong> --- Precision reflects the degree of random error (width of the confidence interval); it is validity/accuracy that refers to closeness to the &quot;truth.&quot;</li>\\n</ul>\\n<p><strong>Background:</strong> Heterogeneity is commonly assessed with the I\\u00b2 statistic; substantial heterogeneity may argue against pooling or prompt subgroup/random-effects analysis. Precision improves with larger sample size (narrower confidence intervals).</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":88,\"stem\":\"Which of the following about lactated Ringer solution is TRUE?\",\"options\":[{\"letter\":\"A\",\"text\":\"The pH is slightly basic (7.4)\"},{\"letter\":\"B\",\"text\":\"It is a good source of bicarbonate during resuscitative efforts\"},{\"letter\":\"C\",\"text\":\"Positive ion composition includes high Na (130 mmol/L) and a small amount of calcium (3 mmol/L) and K (4 mmol/L)\"},{\"letter\":\"D\",\"text\":\"Lactated Ringer solution contains trace amounts of magnesium and gluconate\"},{\"letter\":\"E\",\"text\":\"It has potent anti-inflammatory properties when used for resuscitative measures\"}],\"correct\":\"C\",\"explanation\":\"<p><strong>Why C is correct:</strong> Lactated Ringer (Hartmann) solution contains sodium ~130 mmol/L, potassium ~4 mmol/L, and calcium ~2.7--3 mmol/L, along with chloride ~109 mmol/L and lactate ~28 mmol/L. The cation composition described in option C is accurate.</p>\\n<p><strong>Why the others are incorrect:</strong></p>\\n<ul>\\n<li><strong>A</strong> --- LR is mildly acidic, with a pH of approximately 6.5, not 7.4.</li>\\n\\n<li><strong>B</strong> --- LR contains lactate, not bicarbonate; lactate is metabolized by the liver to bicarbonate, so it is a bicarbonate precursor, not a direct source, and is not relied on for acute buffering.</li>\\n\\n<li><strong>D</strong> --- LR does not contain magnesium or gluconate; those are components of other balanced solutions (e.g., Plasma-Lyte contains magnesium, acetate, and gluconate).</li>\\n\\n<li><strong>E</strong> --- LR has no &quot;potent anti-inflammatory properties.&quot;</li>\\n</ul>\\n<p><strong>Background:</strong> Because LR contains calcium, it can theoretically bind the citrate anticoagulant in blood products; historically it was avoided in the same line as blood, though modern data question the clinical significance. Its lower chloride versus normal saline avoids hyperchloremic metabolic acidosis with large volumes.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":89,\"stem\":\"When comparing the composition of plasma and normal saline, which of the following statements is TRUE?\",\"options\":[{\"letter\":\"A\",\"text\":\"NS has a greater concentration of sodium versus plasma\"},{\"letter\":\"B\",\"text\":\"NS has a lower osmolality versus plasma\"},{\"letter\":\"C\",\"text\":\"NS has a higher pH versus plasma\"},{\"letter\":\"D\",\"text\":\"NS and plasma have similar bicarbonate concentrations\"},{\"letter\":\"E\",\"text\":\"NS and plasma have similar magnesium concentrations\"}],\"correct\":\"A\",\"explanation\":\"<p><strong>Why A is correct:</strong> Normal saline (0.9% NaCl) contains sodium 154 mmol/L, which is higher than the plasma sodium of approximately 135--145 mmol/L. (Its chloride, 154 mmol/L, is also markedly higher than plasma chloride ~100--106 mmol/L, which drives hyperchloremic metabolic acidosis with large volumes.)</p>\\n<p><strong>Why the others are incorrect:</strong></p>\\n<ul>\\n<li><strong>B</strong> --- NS has a calculated osmolarity of ~308 mOsm/L, which is higher than (or roughly equal to/slightly above) plasma (~285--295 mOsm/kg), not lower.</li>\\n\\n<li><strong>C</strong> --- NS is mildly acidic (pH ~5.5), lower than plasma pH (~7.4).</li>\\n\\n<li><strong>D</strong> --- NS contains no bicarbonate (0 mmol/L), unlike plasma (~24 mmol/L).</li>\\n\\n<li><strong>E</strong> --- NS contains no magnesium, whereas plasma contains physiologic magnesium.</li>\\n</ul>\\n<p><strong>Background:</strong> Because NS provides a supraphysiologic chloride load and no buffer, large-volume resuscitation can produce hyperchloremic (non-anion-gap) metabolic acidosis; balanced crystalloids (LR, Plasma-Lyte) more closely approximate plasma electrolyte composition.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":90,\"stem\":\"Which statement is true regarding the fractional excretion of sodium (FeNa)?\",\"options\":null,\"correct\":null,\"explanation\":\"<p>(no lettered choice provided).</p>\\n<p>FeNa (%) = 100 \\u00d7 (Urine Na \\u00d7 Serum Creatinine) / (Serum Na \\u00d7 Urine Creatinine)</p>\\n<p><strong>Explanation:</strong> FeNa expresses the percentage of filtered sodium excreted in the urine and is used to differentiate prerenal azotemia from acute tubular necrosis (ATN) in oliguric acute kidney injury. A <strong>FeNa &lt;1%</strong> indicates avid tubular sodium reabsorption (intact tubules \\u2192 prerenal state, e.g., hypovolemia, hepatorenal syndrome, early sepsis). A <strong>FeNa &gt;2% (&gt;1%)</strong> indicates tubular sodium wasting from damaged tubules (ATN). A pooled meta-analysis of oliguric patients without CKD or diuretic use found sensitivity ~95% and specificity ~91% at the 1% threshold (Abdelhafez et al., CJASN, 2022). The index loses accuracy in patients on diuretics or with CKD, where fractional excretion of urea (FeUrea &lt;35%) is preferred (Thadhani et al., NEJM, 1996; Flamm et al., AGA, 2022).</p><div class=\\\"addendum\\\"><p class=\\\"addendum-label\\\">Note (from answer-key addendum)</p><p>No answer originally given. FENa = (urine Na \\u00d7 plasma Cr)/(plasma Na \\u00d7 urine Cr) \\u00d7 100; <strong>&lt;1% suggests prerenal</strong>.</p></div>\",\"no_key\":false,\"no_options\":true,\"free_answer\":\"Know the FeNa formula: FeNa (%) = 100 \\u00d7 (Urine Na \\u00d7 Serum Creatinine) / (Serum Na \\u00d7 Urine Creatinine)\"},{\"number\":91,\"stem\":\"You are on your ICU rotation caring for a 51-year-old patient who suffered extensive burns to his face, torso, and abdomen in a house fire. He is intubated and ventilated, but the nurse and respiratory therapists are concerned because his peak inspiratory pressures on the ventilator have gone from 22 to 30. In addition, the urine output has been 2 mL per hour for the past 2 hours and blood pressure has steadily decreased from 110/5 to 70/50 an hour ago. His abdomen is tense and hard. His bladder pressure is 31. What is the most appropriate treatment?\",\"options\":[{\"letter\":\"A\",\"text\":\"Emergent decompressive laparotomy\"},{\"letter\":\"B\",\"text\":\"Intravenous Lasix\"},{\"letter\":\"C\",\"text\":\"Paracentesis\"},{\"letter\":\"D\",\"text\":\"Paralysis\"}],\"correct\":\"A\",\"explanation\":\"<p><strong>Why A is correct:</strong> This is abdominal compartment syndrome (ACS) --- sustained intra-abdominal pressure (bladder pressure surrogate) &gt;20 mmHg (here 31) with new organ dysfunction (oliguria, hypotension, rising airway pressures). Large-volume crystalloid resuscitation in extensive burns is a classic precipitant. Once ACS with organ failure is established, <strong>decompressive midline laparotomy is the definitive, gold-standard treatment</strong> (Rogers &amp; Garcia, Chest, 2018; ACS Gastrointestinal Surgical Emergencies textbook, 2021; Balogh et al., Lancet, 2014). Delay increases mortality.</p>\\n<p><strong>Why the others are wrong:</strong></p>\\n<ul>\\n<li><strong>B. IV Lasix / D. Paralysis</strong> --- Diuresis and neuromuscular blockade are non-operative measures to lower intra-abdominal pressure in intra-abdominal hypertension <em>before</em> full-blown ACS; they are inadequate once organ dysfunction has developed and would dangerously delay decompression.</li>\\n\\n<li><strong>C. Paracentesis</strong> --- Percutaneous drainage helps only when the pressure is from free fluid/ascites (e.g., some secondary or post-burn ACS); it does not relieve the tissue/visceral edema driving ACS in this patient and is not the definitive treatment for established ACS with organ failure.</li>\\n</ul>\\n<p><strong>Background:</strong> ACS is defined as intra-abdominal pressure &gt;20 mmHg plus new end-organ injury; measured via bladder (intravesical) pressure (Gottlieb et al., J Emerg Med, 2020).</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":92,\"stem\":\"Typical signs of abdominal wound dehiscence include which ONE of the following?\",\"options\":[{\"letter\":\"A\",\"text\":\"Severe pain\"},{\"letter\":\"B\",\"text\":\"Copious purulent discharge\"},{\"letter\":\"C\",\"text\":\"Drainage of interior contents through wound\"},{\"letter\":\"D\",\"text\":\"Copious serosanguineous discharge\"}],\"correct\":\"D\",\"explanation\":\"<p><strong>Why D is correct:</strong> A sudden gush of pink/salmon-colored <strong>serosanguineous fluid</strong> from the wound is the classic herald sign of fascial dehiscence, often preceding evisceration by hours to a day. It reflects peritoneal fluid escaping through a disrupted fascial closure.</p>\\n<p><strong>Why the others are wrong:</strong></p>\\n<ul>\\n<li><strong>A. Severe pain</strong> --- Dehiscence is frequently painless; pain is not the typical or reliable sign.</li>\\n\\n<li><strong>B. Copious purulent discharge</strong> --- This indicates a wound/surgical-site infection, not the fascial separation of dehiscence per se (though infection is a risk factor).</li>\\n\\n<li><strong>C. Drainage of interior contents</strong> --- Protrusion of bowel (evisceration) is the end result of complete dehiscence, not the <em>typical early sign</em>; the question asks for the characteristic warning finding, which is serosanguineous drainage.</li>\\n</ul>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":93,\"stem\":\"Which of the following is a potential manifestation of hypercalcemia?\",\"options\":[{\"letter\":\"A\",\"text\":\"Paresthesias\"},{\"letter\":\"B\",\"text\":\"Painful muscle spasms\"},{\"letter\":\"C\",\"text\":\"Seizures\"},{\"letter\":\"D\",\"text\":\"Kidney stones\"},{\"letter\":\"E\",\"text\":\"Prolonged QT interval\"}],\"correct\":\"D\",\"explanation\":\"<p><strong>Why D is correct:</strong> Hypercalcemia causes nephrolithiasis (and nephrocalcinosis/polyuria) --- captured by the mnemonic &quot;stones, bones, groans, thrones, and psychiatric overtones.&quot;</p>\\n<p><strong>Why the others are wrong:</strong></p>\\n<ul>\\n<li>**A. Paresthesias, B. Painful muscle spasms (tetany), C. Seizures, E. Prolonged QT** --- These are features of <strong>hypo</strong>calcemia. Hypercalcemia does the opposite on the ECG, producing a <strong>shortened QT interval</strong>, and causes neuromuscular depression (weakness, hyporeflexia) rather than tetany/seizures.</li>\\n</ul>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":94,\"stem\":\"A wide range of blood glucose levels are seen in patients undergoing pancreatic islet transplantation. When designing a study to compare blood glucose levels before and after transplant in a group of patients undergoing islet cell transplant, the most appropriate statistical test is:\",\"options\":[{\"letter\":\"A\",\"text\":\"Paired t-test\"},{\"letter\":\"B\",\"text\":\"Mann-Whitney U Test\"},{\"letter\":\"C\",\"text\":\"Logistic regression\"},{\"letter\":\"D\",\"text\":\"Chi-square test\"}],\"correct\":\"A\",\"explanation\":\"<p><strong>Why A is correct:</strong> The same patients are measured twice (before vs after transplant), giving <em>paired</em> continuous data. The paired t-test compares the mean of within-subject differences for a continuous, approximately normally distributed outcome.</p>\\n<p><strong>Why the others are wrong:</strong></p>\\n<ul>\\n<li><strong>B. Mann-Whitney U</strong> --- A non-parametric test for *two independent* groups (unpaired), not repeated measures on the same subjects.</li>\\n\\n<li><strong>C. Logistic regression</strong> --- Used when the outcome is <em>binary/categorical</em>, not a continuous glucose level.</li>\\n\\n<li><strong>D. Chi-square</strong> --- Compares proportions/frequencies between categorical variables, not continuous paired measurements.</li>\\n</ul>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":95,\"stem\":\"Recovery after coronary artery bypass grafting is being studied to compare differences between smokers and non-smokers. Preoperative exercise tolerance and intraoperative blood loss may also impact recovery time; it is noted that smokers have lower preoperative exercise tolerance. Which factor is a confounding variable?\",\"options\":[{\"letter\":\"A\",\"text\":\"Smoking habits\"},{\"letter\":\"B\",\"text\":\"Exercise tolerance\"},{\"letter\":\"C\",\"text\":\"Intraoperative blood loss\"},{\"letter\":\"D\",\"text\":\"Recovery time\"}],\"correct\":\"B\",\"explanation\":\"<p><strong>Why B is correct:</strong> A confounder must be associated with <em>both</em> the exposure and the outcome, without being on the causal pathway. Exercise tolerance is linked to the exposure (smokers have lower tolerance) <em>and</em> independently affects the outcome (recovery time), so it distorts the apparent smoking--recovery relationship.</p>\\n<p><strong>Why the others are wrong:</strong></p>\\n<ul>\\n<li><strong>A. Smoking habits</strong> --- This is the exposure/independent variable being studied, not a confounder.</li>\\n\\n<li><strong>C. Intraoperative blood loss</strong> --- Although it can affect recovery, the stem does not establish a link between blood loss and smoking status, so it is not shown to be a confounder here (it functions more as an independent predictor).</li>\\n\\n<li><strong>D. Recovery time</strong> --- This is the outcome/dependent variable.</li>\\n</ul>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":96,\"stem\":\"A 55 kg adult female patient is undergoing elective knee arthroplasty due to chronic complications associated with juvenile arthritis. The most appropriate antibiotic prophylaxis order is:\",\"options\":[{\"letter\":\"A\",\"text\":\"Cefazolin 2 g IV within 60 minutes prior to skin incision\"},{\"letter\":\"B\",\"text\":\"Cefazolin 1 g IV within 30 minutes prior to skin incision\"},{\"letter\":\"C\",\"text\":\"Cefazolin 2 g IV within 20 minutes prior to skin incision\"},{\"letter\":\"D\",\"text\":\"Cefazolin 1 g IV within 90 minutes prior to skin incision\"}],\"correct\":\"A\",\"explanation\":\"<p><strong>Why A is correct:</strong> Standard adult surgical prophylaxis is <strong>cefazolin 2 g</strong> (patients \\u2265120 kg receive 3 g) administered <strong>within 60 minutes before incision</strong>. At 55 kg the patient still receives the standard 2 g dose, and the \\u226460-minute window ensures adequate serum/tissue concentrations at incision (ACOG, 2018; FDA cefazolin label perioperative prophylaxis table). A 1 g dose is now generally reserved only for patients \\u226480 kg and is a less-preferred simplification.</p>\\n<p><strong>Why the others are wrong:</strong></p>\\n<ul>\\n<li><strong>B &amp; D. Cefazolin 1 g</strong> --- Underdoses relative to the current 2 g standard for adults; the D timing (90 min) also exceeds the recommended 60-minute pre-incision window.</li>\\n\\n<li><strong>C. 2 g within 20 minutes</strong> --- Correct dose but the specific &quot;within 60 minutes&quot; window is the guideline-endorsed answer; option A is the standard phrasing. (Vancomycin/fluoroquinolones, not cefazolin, use a longer up-to-120-minute window because of infusion time.)</li>\\n</ul>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":97,\"stem\":\"Three days following a liver resection for cancer, the hemoglobin has slowly drifted to 68. Transfusion of packed red blood cells is administered. Which early complication of blood transfusion is least likely?\",\"options\":[{\"letter\":\"A\",\"text\":\"Bacterial infection\"},{\"letter\":\"B\",\"text\":\"Hepatitis\"},{\"letter\":\"C\",\"text\":\"Transient fever\"},{\"letter\":\"D\",\"text\":\"Pain and hematuria\"}],\"correct\":\"B\",\"explanation\":\"<p><strong>Why B is correct:</strong> Viral hepatitis (HBV/HCV) is a <em>delayed</em> complication with an incubation period of weeks to months and, in North America, an extraordinarily low per-unit risk (&lt;1 in a million for HCV). It is therefore the <strong>least likely early</strong> event (Carson et al., NEJM, 2017).</p>\\n<p><strong>Why the others are wrong (all can occur acutely):</strong></p>\\n<ul>\\n<li><strong>A. Bacterial infection</strong> --- Bacterial contamination (especially of platelets, but also RBCs) can cause acute septic transfusion reactions during/shortly after transfusion.</li>\\n\\n<li><strong>C. Transient fever</strong> --- Febrile non-hemolytic transfusion reactions are among the most common <em>early</em> reactions (~0.5--1% of episodes).</li>\\n\\n<li><strong>D. Pain and hematuria</strong> --- Classic signs of an <em>acute</em> hemolytic transfusion reaction (flank/back pain and hemoglobinuria), an immediate life-threatening event.</li>\\n</ul>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":98,\"stem\":\"Which of the following is an absolute contraindication to thrombolytic therapy?\",\"options\":[{\"letter\":\"A\",\"text\":\"Uncontrolled severe hypertension\"},{\"letter\":\"B\",\"text\":\"Surgery more than 10 days prior\"},{\"letter\":\"C\",\"text\":\"Pre-existing coagulopathy\"},{\"letter\":\"D\",\"text\":\"Intracranial tumor\"}],\"correct\":\"D\",\"explanation\":\"<p><strong>Why D is correct:</strong> A known malignant intracranial neoplasm (and known structural cerebrovascular lesion, any prior intracranial hemorrhage, ischemic stroke within 3 months, suspected aortic dissection, active bleeding, significant closed-head trauma) is an <strong>absolute</strong> contraindication to fibrinolysis because of the catastrophic risk of intracranial bleeding (ACC/AHA, 2025; ESC PE guideline, 2019).</p>\\n<p><strong>Why the others are wrong (these are relative, not absolute):</strong></p>\\n<ul>\\n<li><strong>A. Uncontrolled severe hypertension</strong> --- Only severe hypertension truly <em>unresponsive to therapy</em> (SBP &gt;180/DBP &gt;110) is classed as absolute; &quot;uncontrolled hypertension&quot; as generally phrased is a relative contraindication that may be corrected before lysis.</li>\\n\\n<li><strong>B. Surgery &gt;10 days prior</strong> --- Major surgery is a concern only when <em>recent</em> (within ~3 weeks); surgery more than 10 days out is at most a relative contraindication.</li>\\n\\n<li><strong>C. Pre-existing coagulopathy / oral anticoagulation</strong> --- Bleeding diathesis is listed as a relative contraindication (an active bleeding diathesis is absolute), and anticoagulant use is relative.</li>\\n</ul>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":99,\"stem\":\"A 36-year-old female's one day postop from a right nephrectomy (abdominal approach). You're called to the ward to assess for increased abdominal pain, tachycardia of 115 and fever of 38.7\\u00b0C. Blood pressure is 110/70 and respiratory rate of 24. The patient complains of severe abdominal pain and is diffusely tender with rigid abdomen. You have the attending paged and order initial resuscitations and investigations. The following is most likely working diagnosis?\",\"options\":[{\"letter\":\"A\",\"text\":\"Retroperitoneal urine collection\"},{\"letter\":\"B\",\"text\":\"Line sepsis\"},{\"letter\":\"C\",\"text\":\"Hollow viscous perforation\"},{\"letter\":\"D\",\"text\":\"Mesenteric ischemia\"}],\"correct\":\"C\",\"explanation\":\"<p>A diffusely tender, rigid (&quot;board-like&quot;) abdomen with fever and tachycardia is the hallmark of generalized peritonitis, which in the immediate postoperative period after an open abdominal nephrectomy most often reflects perforation/injury of a hollow viscus (e.g., inadvertent bowel injury or an unrecognized enterotomy). The combination of peritoneal signs plus a systemic inflammatory response points to intraperitoneal contamination requiring urgent imaging and likely re-exploration.</p>\\n<p>Why the others are incorrect:</p>\\n<ul>\\n<li><strong>A. Retroperitoneal urine collection</strong> --- A urinoma from the resected renal bed is confined to the retroperitoneum and typically causes flank fullness/pain and slowly rising creatinine or drain output, not a diffusely rigid peritonitic abdomen on postoperative day 1.</li>\\n\\n<li><strong>B. Line sepsis</strong> --- Catheter-related bloodstream infection can cause fever and tachycardia but does not produce a diffusely tender, rigid abdomen, and is uncommon this early.</li>\\n\\n<li><strong>D. Mesenteric ischemia</strong> --- Classically causes &quot;pain out of proportion to exam&quot; with relatively benign early findings; frank peritonitis is a late sign. It is also less likely than direct operative visceral injury in this immediate postoperative context.</li>\\n</ul>\\n<p>Background: Peritoneal signs after abdominal surgery mandate resuscitation, broad-spectrum antibiotics, upright/lateral decubitus or CT imaging to detect free air/leak, and prompt surgical re-exploration for source control.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":100,\"stem\":\"When tackling number needed to treat the impact incidence of breast cancer. The following variable must be known:\",\"options\":[{\"letter\":\"A\",\"text\":\"Relative risk reduction\"},{\"letter\":\"B\",\"text\":\"Effect size\"},{\"letter\":\"C\",\"text\":\"P value\"},{\"letter\":\"D\",\"text\":\"Probability of outcome\"}],\"correct\":\"D\",\"explanation\":\"<p>Number needed to treat (NNT) is the reciprocal of the absolute risk reduction (ARR): NNT = 1/ARR. The ARR is derived from the actual event probabilities (incidence of the outcome) in the treatment and control groups (ARR = control event rate \\u2212 treatment event rate). Therefore the absolute probability of the outcome in each group must be known to calculate NNT.</p>\\n<p>Why the others are incorrect:</p>\\n<ul>\\n<li><strong>A. Relative risk reduction</strong> --- RRR alone cannot generate NNT; the same RRR corresponds to vastly different NNTs depending on baseline risk. To convert RRR to NNT you still need the baseline (control) event probability.</li>\\n\\n<li><strong>B. Effect size</strong> --- A generic standardized effect size does not directly yield NNT without the underlying absolute event rates.</li>\\n\\n<li><strong>C. P value</strong> --- The p value reflects statistical significance (probability the result is due to chance), not the magnitude of absolute risk difference, so it is irrelevant to NNT calculation.</li>\\n</ul>\\n<p>Background: NNT expresses how many patients must be treated to prevent one additional adverse outcome. It is clinically intuitive but must always be interpreted alongside baseline risk and the time horizon over which the ARR was measured.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":101,\"stem\":\"A surgeon notices a trend and decides to review their own pediatric surgical patients over a two-year period to examine the possible link between 2 rare diseases. Low numbers of patients included in the review may lead to:\",\"options\":[{\"letter\":\"A\",\"text\":\"Type I error\"},{\"letter\":\"B\",\"text\":\"Type II error\"},{\"letter\":\"C\",\"text\":\"Confounding variables\"},{\"letter\":\"D\",\"text\":\"Incorrect sample size calculations\"}],\"correct\":\"B\",\"explanation\":\"<p>A small sample size reduces statistical power (1 \\u2212 \\u03b2). An underpowered study is prone to a Type II (\\u03b2) error --- failing to detect a true difference or association that actually exists (a false negative). Studying two rare diseases with few patients is a classic setup for an underpowered, false-negative result.</p>\\n<p>Why the others are incorrect:</p>\\n<ul>\\n<li><strong>A. Type I error</strong> --- A Type I (\\u03b1) error is concluding an effect exists when it does not (false positive); it is governed by the significance threshold, not by having too few patients.</li>\\n\\n<li><strong>C. Confounding variables</strong> --- Confounding arises from an unmeasured/uncontrolled variable associated with both exposure and outcome; it is a bias issue independent of sample size.</li>\\n\\n<li><strong>D. Incorrect sample size calculations</strong> --- This describes a planning error in determining how many subjects are needed, not the consequence of actually enrolling too few.</li>\\n</ul>\\n<p>Background: Power increases with larger sample size and larger effect size. Rare-disease research is inherently prone to Type II error, which is why multicenter collaboration and registries are often required.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":102,\"stem\":\"Which ONE of the following is an example of the action of cortisol in the metabolically distressed patient?\",\"options\":[{\"letter\":\"A\",\"text\":\"Results in increased T cell natural killer function and T cell regeneration\"},{\"letter\":\"B\",\"text\":\"Potentiates the effect of glucagon\"},{\"letter\":\"C\",\"text\":\"Increases protein stores in muscles\"},{\"letter\":\"D\",\"text\":\"Decreases triglyceride release from adipose tissue\"}],\"correct\":\"B\",\"explanation\":\"<p>Cortisol is a counterregulatory (catabolic) stress hormone. It acts permissively, potentiating the hyperglycemic and catabolic actions of glucagon and catecholamines, thereby augmenting hepatic gluconeogenesis and glycogenolysis, and sustaining stress hyperglycemia. It suppresses anabolism and stimulates catabolism to mobilize energy substrates.</p>\\n<p>Why the others are incorrect:</p>\\n<ul>\\n<li><strong>A. Increased NK/T-cell function and regeneration</strong> --- At the elevated concentrations seen in stress, cortisol is immunosuppressive/anti-inflammatory (decreases lymphocyte and cytokine activity), not immunostimulatory.</li>\\n\\n<li><strong>C. Increases protein stores in muscles</strong> --- Cortisol promotes muscle proteolysis and negative nitrogen balance to liberate amino acids for gluconeogenesis; it does not build protein stores.</li>\\n\\n<li><strong>D. Decreases triglyceride release from adipose tissue</strong> --- Cortisol promotes lipolysis (permissive with catecholamines), increasing release of free fatty acids and glycerol, not decreasing it.</li>\\n</ul>\\n<p>Background: The catabolic response to critical illness is driven by cortisol, glucagon, catecholamines, and growth hormone acting in concert, producing hyperglycemia, lipolysis, and protein wasting to fuel the &quot;fight-or-flight&quot; response and immune system.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":103,\"stem\":\"Informed consent for chest tube insertion for a malignant pleural effusion is completed. The following is not an essential component of the consent documentation in this case:\",\"options\":[{\"letter\":\"A\",\"text\":\"Patient or substitute decision-maker signature\"},{\"letter\":\"B\",\"text\":\"Documented assessment of capacity to consent\"},{\"letter\":\"C\",\"text\":\"Risk of pneumothorax and lung parenchymal injury\"},{\"letter\":\"D\",\"text\":\"Risk of death if procedure refused\"}],\"correct\":\"A\",\"explanation\":\"<p>Informed consent is a process, not the signature. The legally and ethically essential elements are the disclosure of the diagnosis, the nature of the procedure, its material risks/benefits, and alternatives; confirmation that the patient has decision-making capacity; and that consent is given voluntarily and with understanding. A signature merely documents that the process occurred and is not itself the essential substantive component (valid consent can be verbal in many settings).</p>\\n<p>Why the others are essential (and therefore incorrect choices here):</p>\\n<ul>\\n<li><strong>B. Documented assessment of capacity</strong> --- Capacity is a prerequisite for valid consent and should be documented.</li>\\n\\n<li><strong>C. Risk of pneumothorax and parenchymal injury</strong> --- Disclosure of material procedural risks is a core requirement.</li>\\n\\n<li><strong>D. Risk of death if procedure refused</strong> --- Disclosing the consequences of refusing (including serious harm/death) is part of informed refusal and adequate disclosure.</li>\\n</ul>\\n<p>Background: The pillars of informed consent are capacity, disclosure, understanding, and voluntariness. Documentation supports but does not replace the underlying process; the signed form is evidence, not the essence, of consent.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":104,\"stem\":\"Confirmation of preoperative administration of prophylactic antibiotics must be reviewed during which phase of the surgical safety checklist?\",\"options\":[{\"letter\":\"A\",\"text\":\"Inpatient preparation unit\"},{\"letter\":\"B\",\"text\":\"Prior to induction of anesthesia\"},{\"letter\":\"C\",\"text\":\"Prior to skin incision\"},{\"letter\":\"D\",\"text\":\"During procedure debrief\"}],\"correct\":\"C\",\"explanation\":\"<p>The WHO Surgical Safety Checklist has three phases: Sign In (before induction of anesthesia), Time Out (before skin incision), and Sign Out (before the patient leaves the OR). Confirmation that prophylactic antibiotics have been given within 60 minutes before incision (or that they are not indicated) occurs during the Time Out, immediately prior to skin incision.</p>\\n<p>Why the others are incorrect:</p>\\n<ul>\\n<li><strong>A. Inpatient preparation unit</strong> --- Not a defined checklist phase.</li>\\n\\n<li><strong>B. Prior to induction of anesthesia (Sign In)</strong> --- This phase confirms identity, site marking, consent, pulse oximetry, allergies, airway/aspiration risk, and blood-loss risk --- not antibiotic confirmation.</li>\\n\\n<li><strong>D. During procedure debrief (Sign Out)</strong> --- This phase reviews the procedure name, instrument/sponge/needle counts, specimen labeling, equipment issues, and key recovery concerns --- not preoperative antibiotic timing.</li>\\n</ul>\\n<p>Background: Timing antibiotic confirmation to the Time Out ensures the dose was given close enough to incision for adequate tissue concentrations. Adding antibiotic confirmation to the checklist measurably improves prophylaxis compliance and reduces surgical site infection.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":105,\"stem\":\"The most likely cause of renal wasting of potassium leading to hypokalemia in the postoperative patient is:\",\"options\":[{\"letter\":\"A\",\"text\":\"Proteinuria\"},{\"letter\":\"B\",\"text\":\"Hypernatremia\"},{\"letter\":\"C\",\"text\":\"Hyperphosphatemia\"},{\"letter\":\"D\",\"text\":\"Hypomagnesemia\"}],\"correct\":\"D\",\"explanation\":\"<p>Hypomagnesemia is a common and frequently overlooked cause of renal potassium wasting and refractory hypokalemia. Low intracellular magnesium releases the magnesium-mediated inhibition of renal outer medullary potassium (ROMK) channels in the distal nephron and impairs Na\\u207a/K\\u207a-ATPase activity, increasing urinary potassium secretion. Hypokalemia in this setting cannot be corrected until the magnesium deficit is repleted.</p>\\n<p>Why the others are incorrect:</p>\\n<ul>\\n<li><strong>A. Proteinuria</strong> --- Not a recognized mechanism of renal potassium wasting.</li>\\n\\n<li><strong>B. Hypernatremia</strong> --- Not a direct cause of kaliuresis; potassium handling depends on distal sodium delivery and aldosterone, not the serum sodium concentration per se.</li>\\n\\n<li><strong>C. Hyperphosphatemia</strong> --- Not associated with renal potassium wasting.</li>\\n</ul>\\n<p>Background: Postoperative and ICU patients often become magnesium-depleted (GI losses, diuretics, PPIs, poor intake). Any patient with refractory hypokalemia should have magnesium checked and repleted concurrently; correcting magnesium is essential to correcting the potassium.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":106,\"stem\":\"Which ONE of the following is correct?\",\"options\":[{\"letter\":\"A\",\"text\":\"Standard deviation is better than standard error of the mean for describing scatter of the data\"},{\"letter\":\"B\",\"text\":\"SEM = SD/number\\u00b2\"},{\"letter\":\"C\",\"text\":\"If the sample size is large, the SD will be small\"},{\"letter\":\"D\",\"text\":\"Variance = the sum of the absolute differences between each sample point and the mean\"}],\"correct\":\"A\",\"explanation\":\"<p>The standard deviation (SD) quantifies the dispersion (scatter) of individual data points around the sample mean and is the appropriate descriptive statistic for variability. The standard error of the mean (SEM) describes the precision of the estimate of the mean, not the scatter of the raw data, so SD is the correct choice for describing how spread out the data are.</p>\\n<p>Why the others are incorrect:</p>\\n<ul>\\n<li><strong>B. SEM = SD/number\\u00b2</strong> --- Incorrect formula. SEM = SD / \\u221an (square root of n, not n\\u00b2).</li>\\n\\n<li><strong>C. If the sample size is large, the SD will be small</strong> --- SD is a property of the underlying data distribution and does not systematically shrink with larger n; the SEM (not the SD) decreases as n increases.</li>\\n\\n<li><strong>D. Variance = sum of absolute differences from the mean</strong> --- Variance is the mean of the squared (not absolute) deviations from the mean. The mean absolute deviation is a different statistic.</li>\\n</ul>\\n<p>Background: Use SD to report the spread of data and SEM (or confidence intervals) to convey the precision of the estimated mean. Reporting SEM to make data appear less variable is a common misuse.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":107,\"stem\":\"Which ONE of the following is correct about descriptions and estimations of populations?\",\"options\":[{\"letter\":\"A\",\"text\":\"Nonparametric statistics is most useful for large populations with normally distributed data\"},{\"letter\":\"B\",\"text\":\"The number of degrees of freedom is inversely proportional to the sample size\"},{\"letter\":\"C\",\"text\":\"The 95% confidence interval of the mean becomes smaller as sample size increases\"},{\"letter\":\"D\",\"text\":\"The 95% reference range will include 95% of the data 95% of the time\"}],\"correct\":\"C\",\"explanation\":\"<p>The width of a confidence interval depends on the SEM (= SD/\\u221an). As sample size (n) increases, the SEM shrinks, so the 95% confidence interval of the mean narrows, reflecting a more precise estimate of the population mean.</p>\\n<p>Why the others are incorrect:</p>\\n<ul>\\n<li><strong>A. Nonparametric statistics for large, normally distributed data</strong> --- Nonparametric methods are used when data are NOT normally distributed or are ordinal/small-sample; parametric tests are preferred for normally distributed data.</li>\\n\\n<li><strong>B. Degrees of freedom inversely proportional to sample size</strong> --- Degrees of freedom increase (are directly, not inversely, related) with sample size (e.g., df = n \\u2212 1).</li>\\n\\n<li><strong>D. 95% reference range includes 95% of data 95% of the time</strong> --- A 95% reference range is defined to encompass the central 95% of the data values; the &quot;95% of the time&quot; phrasing conflates it with a confidence interval and is incorrect as stated.</li>\\n</ul>\\n<p>Background: Larger samples improve precision (narrower CIs) without necessarily changing the underlying data spread (SD). Distinguish the reference range (spread of individuals) from the confidence interval (precision of a parameter estimate).</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":108,\"stem\":\"Which of the following is true?\",\"options\":[{\"letter\":\"A\",\"text\":\"Bias in a study is best addressed by increasing sample size\"},{\"letter\":\"B\",\"text\":\"Type I errors are mainly associated with tests which have poor sensitivity\"},{\"letter\":\"C\",\"text\":\"Type II error is the probability of concluding a difference exists when it does not\"},{\"letter\":\"D\",\"text\":\"Power in a study increases with increasing sample size and effect size but decreases as Type I error decreases\"}],\"correct\":\"D\",\"explanation\":\"<p>Statistical power (1 \\u2212 \\u03b2) increases with larger sample size and larger true effect size, and with a higher (less stringent) \\u03b1. Conversely, making the significance threshold more stringent (decreasing \\u03b1, e.g., from 0.05 to 0.01) reduces power, all else equal. This trade-off is correctly captured in option D.</p>\\n<p>Why the others are incorrect:</p>\\n<ul>\\n<li><strong>A. Bias addressed by increasing sample size</strong> --- Increasing n reduces random error but does NOT eliminate systematic bias; a larger biased study just yields a more precise wrong answer. Bias is addressed by study design (randomization, blinding, etc.).</li>\\n\\n<li><strong>B. Type I errors associated with poor sensitivity</strong> --- Type I error is a false positive (claiming an effect that isn&#x27;t there), conceptually related to specificity, not sensitivity. Poor sensitivity relates to false negatives (Type II).</li>\\n\\n<li>**C. Type II error = concluding a difference exists when it does not** --- That description is a Type I error (false positive). A Type II error is failing to detect a difference that truly exists (false negative).</li>\\n</ul>\\n<p>Background: Power analysis balances \\u03b1 (Type I error), \\u03b2 (Type II error), effect size, and sample size. Investigators typically fix \\u03b1 at 0.05 and target power \\u2265 0.80, then solve for the required sample size given the anticipated effect size.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":109,\"stem\":\"When planning regression analysis of a study of the incidence of renal cell cancer across Canada, the following is considered a categorical variable:\",\"options\":[{\"letter\":\"A\",\"text\":\"Age\"},{\"letter\":\"B\",\"text\":\"Weight\"},{\"letter\":\"C\",\"text\":\"Patient home province\"},{\"letter\":\"D\",\"text\":\"Creatinine at diagnosis\"}],\"correct\":\"C\",\"explanation\":\"<p>A categorical (nominal) variable places subjects into discrete, unordered groups with no inherent numeric value or ranking. Home province is a classic nominal categorical variable --- each province is a distinct labeled category (Ontario, Quebec, etc.) with no arithmetic meaning.</p>\\n<p><strong>Why the others are incorrect:</strong></p>\\n<ul>\\n<li><strong>A. Age</strong> --- a continuous variable measured on a ratio scale (any value within a range).</li>\\n\\n<li><strong>B. Weight</strong> --- likewise continuous/ratio-scaled.</li>\\n\\n<li><strong>D. Creatinine at diagnosis</strong> --- a continuous laboratory measurement.</li>\\n</ul>\\n<p><strong>Background:</strong> Variables are broadly continuous (interval/ratio), ordinal (ordered categories, e.g., cancer stage), or nominal (unordered categories). Correctly classifying variables dictates the appropriate statistical test and regression model (e.g., dummy-coding nominal variables such as province in a regression).</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":110,\"stem\":\"Which of the following medications decreases the blood levels of cyclosporine?\",\"options\":[{\"letter\":\"A\",\"text\":\"Verapamil\"},{\"letter\":\"B\",\"text\":\"Isoniazid\"},{\"letter\":\"C\",\"text\":\"Diltiazem\"},{\"letter\":\"D\",\"text\":\"Erythromycin\"}],\"correct\":\"B\",\"explanation\":\"<p>Cyclosporine is metabolized by hepatic cytochrome P450 3A4. Drugs that <strong>induce</strong> CYP3A4 accelerate cyclosporine metabolism and lower its blood levels, risking subtherapeutic immunosuppression and rejection. Enzyme inducers classically include rifampin and the anticonvulsants phenytoin, phenobarbital, and carbamazepine (Baciewicz &amp; Baciewicz, American Journal of Surgery, 1989). Antituberculous therapy --- particularly the rifampin-containing regimens with which isoniazid is co-administered --- reduces cyclosporine concentrations, and isoniazid is grouped with the agents that lower calcineurin-inhibitor levels; it is the only listed drug that does not inhibit CYP3A4.</p>\\n<p><strong>Why the others are incorrect:</strong></p>\\n<ul>\\n<li><strong>A. Verapamil</strong>, <strong>C. Diltiazem</strong> --- non-dihydropyridine calcium channel blockers are CYP3A4 <strong>inhibitors</strong> that <strong>raise</strong> cyclosporine levels (diltiazem is sometimes used deliberately as a cyclosporine-sparing agent).</li>\\n\\n<li><strong>D. Erythromycin</strong> --- a macrolide and potent CYP3A4 inhibitor that <strong>increases</strong> cyclosporine concentrations and can precipitate nephrotoxicity (Pichard et al., Drug Metabolism and Disposition, 1990).</li>\\n</ul>\\n<p><strong>Background:</strong> Because cyclosporine has a narrow therapeutic index, any concurrent CYP3A4 inducer or inhibitor mandates close level monitoring and dose adjustment. Grapefruit juice (inhibitor) raises levels; St. John&#x27;s Wort (inducer) lowers them.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":111,\"stem\":\"Which of the following is true regarding kidney transplant?\",\"options\":[{\"letter\":\"A\",\"text\":\"The one-year survival is equal between deceased donor kidneys and living donor kidneys\"},{\"letter\":\"B\",\"text\":\"The most common cause of graft loss is recipient death from cardiovascular disease\"},{\"letter\":\"C\",\"text\":\"Kidney allografts are usually placed as close as possible to original kidney location\"},{\"letter\":\"D\",\"text\":\"HLA typing is not necessary preoperatively\"}],\"correct\":\"B\",\"explanation\":\"<p>When all-cause graft loss is considered, <strong>death with a functioning graft</strong> --- driven predominantly by cardiovascular disease --- is a leading cause of graft loss, on par with or exceeding chronic alloimmune injury. Cardiovascular disease is the most frequent cause of death with a functioning graft, and death with function accounts for roughly half of late graft losses (Hariharan et al., New England Journal of Medicine, 2021; Pascual et al., NEJM, 2002).</p>\\n<p><strong>Why the others are incorrect:</strong></p>\\n<ul>\\n<li><strong>A</strong> --- Living-donor kidneys have <strong>superior</strong> graft and patient survival at 1 year and beyond, owing to better organ quality, shorter cold ischemia, and elective timing.</li>\\n\\n<li><strong>C</strong> --- The allograft is placed **heterotopically in the iliac fossa (extraperitoneal)**, anastomosed to the iliac vessels and bladder; the native kidneys are usually left in situ.</li>\\n\\n<li><strong>D</strong> --- HLA typing (and crossmatching) <strong>is</strong> performed preoperatively; better HLA matching improves long-term graft survival.</li>\\n</ul>\\n<p><strong>Background:</strong> Among losses excluding death, chronic rejection/alloimmune injury and recurrent glomerulonephritis predominate beyond the first year, while technical and vascular complications dominate within the first year (Hariharan et al., NEJM, 2021).</p><div class=\\\"addendum\\\"><p class=\\\"addendum-label\\\">Note (from answer-key addendum)</p><p>Keyed: B (recipient death from cardiovascular disease). Note: Correct only when graft loss is counted inclusive of death with a functioning graft; on a death-censored basis, chronic alloimmune injury/rejection and recurrent glomerulonephritis lead (Hariharan et al., NEJM, 2021). Ambiguous framing.</p></div>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":112,\"stem\":\"A severely traumatized patient with Crohn's disease has a significant brain and lung injury. It is determined that he will require over 4 weeks of enteral feeding. Which of the following is most appropriate:\",\"options\":[{\"letter\":\"A\",\"text\":\"Nasogastric feeds\"},{\"letter\":\"B\",\"text\":\"Nasoduodenal feeds\"},{\"letter\":\"C\",\"text\":\"Surgical jejunostomy\"},{\"letter\":\"D\",\"text\":\"Percutaneous endoscopic gastrostomy (PEG)\"}],\"correct\":\"D\",\"explanation\":\"<p>The duration of anticipated enteral access drives the decision. Nasoenteric routes (NG, nasoduodenal) are appropriate for <strong>short-term</strong> feeding (generally &lt; 4 weeks). When enteral nutrition is expected to be required <strong>beyond 4 weeks</strong>, a durable enterostomy is preferred, and <strong>PEG is the standard, least-invasive long-term option</strong>, particularly in a neurologically injured patient at aspiration risk who cannot protect the airway.</p>\\n<p><strong>Why the others are incorrect:</strong></p>\\n<ul>\\n<li><strong>A. Nasogastric</strong> and <strong>B. Nasoduodenal</strong> --- suitable only for short-term feeding; prolonged use causes nasal/esophageal erosion, sinusitis, and tube displacement.</li>\\n\\n<li><strong>C. Surgical jejunostomy</strong> --- more invasive; reserved for patients who cannot undergo PEG (e.g., inaccessible stomach, gastric outlet obstruction, prior gastric surgery) or who require post-pyloric feeding for intractable aspiration/gastroparesis. Not the first choice absent such indications.</li>\\n</ul>\\n<p><strong>Background:</strong> The 4-week threshold is the conventional dividing line between temporary (nasoenteric) and long-term (gastrostomy/jejunostomy) enteral access. In active Crohn&#x27;s disease, small-bowel involvement should be considered, but this does not by itself mandate jejunostomy over PEG.</p><div class=\\\"addendum\\\"><p class=\\\"addendum-label\\\">Note (from answer-key addendum)</p><p>No answer marked. For anticipated feeding &gt;4 weeks, durable enteral access is indicated; <strong>PEG (D)</strong> is standard, though Crohn&#x27;s and the need for post-pyloric feeding in a brain-injured patient with high aspiration risk make this genuinely nuanced.</p></div>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":113,\"stem\":\"Which of the following is a predominant energy source during critical illness?\",\"options\":[{\"letter\":\"A\",\"text\":\"Carbohydrates\"},{\"letter\":\"B\",\"text\":\"Protein\"},{\"letter\":\"C\",\"text\":\"Triglycerides\"},{\"letter\":\"D\",\"text\":\"Amino acids\"}],\"correct\":\"C\",\"explanation\":\"<p>Critical illness is characterized by stress-induced insulin resistance, accelerated lipolysis, and a shift toward <strong>fat as the dominant oxidative fuel</strong>. Lipolysis liberates free fatty acids and glycerol, and fat oxidation supplies the majority of energy once the limited endogenous carbohydrate (glucose oxidation) capacity (~5 mg/kg/min) is saturated; lipid oxidation in critically ill patients is roughly 25% higher than in healthy subjects (Wolfe, European Journal of Clinical Nutrition, 1999; Patkova et al., Advances in Nutrition, 2017).</p>\\n<p><strong>Why the others are incorrect:</strong></p>\\n<ul>\\n<li><strong>A. Carbohydrates</strong> --- hepatic gluconeogenesis is accelerated, but the capacity for exogenous glucose oxidation is limited and further glucose provision drives hyperglycemia rather than serving as the predominant fuel.</li>\\n\\n<li><strong>B. Protein / D. Amino acids</strong> --- muscle proteolysis is accelerated and amino acids feed gluconeogenesis, but protein is a bioenergetically costly, inefficient fuel that the body preferentially spares; its catabolism reflects substrate demand for gluconeogenesis and immune/inflammatory function rather than being the main energy currency.</li>\\n</ul>\\n<p><strong>Background:</strong> Because of insulin resistance and enhanced lipid oxidation, lipid emulsions are used to supply non-protein calories in the critically ill.\\u00a0Overfeeding carbohydrate raises CO\\u2082 production and can aggravate respiratory failure.</p><div class=\\\"addendum\\\"><p class=\\\"addendum-label\\\">Note (from answer-key addendum)</p><p>Keyed: C (triglycerides/fat). Note: Well supported as the predominant oxidative fuel, but modern ICU nutrition emphasizes restrictive early feeding regardless of substrate.</p></div>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":114,\"stem\":\"The following are ALL classical physiological changes (hallmarks) associated with progressive conversion of normal cells into malignant tumor cells:\",\"options\":[{\"letter\":\"A\",\"text\":\"Resisting cell death; enabling replicative immortality; inducing apoptosis; tumor-promoting anti-inflammation\"},{\"letter\":\"B\",\"text\":\"Sustaining proliferative signaling; avoiding immune destruction; inducing apoptosis; evading growth suppressors\"},{\"letter\":\"C\",\"text\":\"Inducing angiogenesis; enabling replicative immortality; resisting cell death; evading growth suppressors\"},{\"letter\":\"D\",\"text\":\"Accelerated cell death; avoiding immune destruction; inducing angiogenesis; tumor-promoting anti-inflammation\"}],\"correct\":\"C\",\"explanation\":\"<p>These are four of the recognized &quot;hallmarks of cancer.&quot; All four are genuine pro-tumorigenic capabilities, and --- critically --- this is the only option that does not contain a self-contradictory (anti-cancer) term.</p>\\n<p><strong>Why the others are incorrect:</strong></p>\\n<ul>\\n<li><strong>A</strong> and <strong>B</strong> both include <strong>&quot;inducing apoptosis&quot;</strong> --- cancer cells <strong>resist</strong> apoptosis; promoting programmed cell death is anti-tumor, not a hallmark.</li>\\n\\n<li><strong>A</strong> and <strong>D</strong> include <strong>&quot;tumor-promoting anti-inflammation&quot;</strong> --- the hallmark is tumor-<strong>promoting inflammation</strong>, not anti-inflammation.</li>\\n\\n<li><strong>D</strong> also lists <strong>&quot;accelerated cell death&quot;</strong>, which is the opposite of the resistance to cell death that cancers exhibit.</li>\\n</ul>\\n<p><strong>Background:</strong> The canonical hallmarks (Hanahan &amp; Weinberg) include sustaining proliferative signaling, evading growth suppressors, resisting cell death, enabling replicative immortality, inducing angiogenesis, activating invasion/metastasis, reprogramming energy metabolism, and avoiding immune destruction, with tumor-promoting inflammation and genome instability as enabling characteristics.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":115,\"stem\":\"You are taking a history of a patient and you are worried about hereditary cancer. Each of the following statements is consistent with hereditary cancer EXCEPT / which is most consistent:\",\"options\":[{\"letter\":\"A\",\"text\":\"Tumor development at an older age than usual\"},{\"letter\":\"B\",\"text\":\"Presence of unilateral disease\"},{\"letter\":\"C\",\"text\":\"Clustering of different cancer types in relatives\"},{\"letter\":\"D\",\"text\":\"Presence of multiple primary malignancies\"}],\"correct\":\"D\",\"explanation\":\"<p>Multiple primary malignancies in one individual is a hallmark of an underlying germline cancer-predisposition syndrome, reflecting a heritable &quot;first hit&quot; present in every cell. Individuals with syndromes such as Li-Fraumeni have a very high risk of multiple primaries over their lifetime (de Andrade et al., Lancet Oncology, 2021).</p>\\n<p><strong>Why the others are incorrect / less consistent:</strong></p>\\n<ul>\\n<li><strong>A</strong> --- Hereditary cancers characteristically present at a <strong>younger</strong>, not older, age than sporadic cancers.</li>\\n\\n<li><strong>B</strong> --- Hereditary cancers of paired organs are more often <strong>bilateral/multifocal</strong> (e.g., bilateral retinoblastoma, bilateral breast cancer), not unilateral.</li>\\n\\n<li><strong>C</strong> --- Clustering of <strong>different</strong> cancer types in relatives is also a recognized red flag for hereditary syndromes; however, among the options the single finding most specific to and diagnostic of hereditary cancer in the individual being interviewed is multiple primary malignancies. (Note: family clustering is a legitimate feature --- this item is best read as identifying the strongest individual-level marker.)</li>\\n</ul>\\n<p><strong>Background:</strong> Features raising suspicion for hereditary cancer: early age of onset, multiple primaries, bilaterality/multifocality, clustering of related cancers across generations, and rare tumor types (e.g., male breast cancer, adrenocortical carcinoma).</p><div class=\\\"addendum\\\"><p class=\\\"addendum-label\\\">Note (from answer-key addendum)</p><p>Keyed: D (multiple primary malignancies). Note: Slightly ambiguous --- option (c), clustering of different cancer types in relatives, is an equally valid hereditary red flag; (d) is the strongest individual-level marker but not uniquely correct (de Andrade et al., Lancet Oncol, 2021).</p></div>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":116,\"stem\":\"A 16-year-old male with an osteosarcoma of his proximal tibia presents to an orthopedic clinic. His mother was diagnosed with breast cancer at the age of 40 and his cousin has recently been diagnosed with a sarcoma. This is most consistent with:\",\"options\":[{\"letter\":\"A\",\"text\":\"Familial adenomatous polyposis\"},{\"letter\":\"B\",\"text\":\"Multiple endocrine neoplasia type II\"},{\"letter\":\"C\",\"text\":\"Li-Fraumeni syndrome\"},{\"letter\":\"D\",\"text\":\"PTEN (Cowden) syndrome\"}],\"correct\":\"C\",\"explanation\":\"<p>Li-Fraumeni syndrome (LFS) is an autosomal dominant cancer-predisposition syndrome caused by germline pathogenic variants in the tumor suppressor gene <strong>TP53</strong>. Its core cancers are <strong>premenopausal breast cancer, osteosarcoma and soft-tissue sarcomas, brain tumors, and adrenocortical carcinoma</strong>, typically at younger-than-expected ages (de Andrade et al., Lancet Oncology, 2021; ACOG Committee Opinion, 2019). This vignette --- early osteosarcoma in an adolescent, a mother with breast cancer at 40, and a relative with sarcoma --- fits the classic and Chompret criteria for LFS.</p>\\n<p><strong>Why the others are incorrect:</strong></p>\\n<ul>\\n<li><strong>Familial adenomatous polyposis (APC)</strong> --- hundreds of colonic adenomas and near-inevitable colorectal cancer; not sarcoma/breast clustering.</li>\\n\\n<li><strong>MEN type II (RET)</strong> --- medullary thyroid carcinoma, pheochromocytoma, and hyperparathyroidism (2A) or mucosal neuromas/marfanoid habitus (2B).</li>\\n\\n<li><strong>PTEN / Cowden syndrome</strong> --- hamartomas, breast, thyroid, and endometrial cancers with macrocephaly and mucocutaneous lesions; not osteosarcoma-defined.</li>\\n</ul>\\n<p><strong>Background:</strong> LFS confers a nearly 90% lifetime cancer risk (higher in women) and a high rate of multiple primaries; surveillance follows the whole-body MRI-based &quot;Toronto protocol,&quot; and radiation is minimized because of radiation-induced second-cancer risk.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":117,\"stem\":\"A severely ill patient on total parenteral nutrition (TPN) for 2 weeks develops dermatitis and alopecia. What is the most likely trace mineral deficiency?\",\"options\":[{\"letter\":\"A\",\"text\":\"Copper\"},{\"letter\":\"B\",\"text\":\"Chromium\"},{\"letter\":\"C\",\"text\":\"Zinc\"},{\"letter\":\"D\",\"text\":\"Selenium\"}],\"correct\":\"C\",\"explanation\":\"<p>Acute zinc deficiency during TPN produces a characteristic syndrome of <strong>periorificial/acral dermatitis, alopecia, and diarrhea</strong> (acquired acrodermatitis enteropathica), with a striking response to zinc repletion (Kay et al., Annals of Surgery, 1976; McClain, JPEN, 1981). Zinc is required for numerous metalloenzymes and for epidermal and hair-follicle turnover, so deficiency preferentially affects skin and hair.</p>\\n<p><strong>Why the others are incorrect:</strong></p>\\n<ul>\\n<li><strong>A. Copper</strong> --- deficiency causes <strong>hematologic</strong> abnormalities (anemia, leukopenia/neutropenia) and, chronically, myeloneuropathy --- not the dermatitis-alopecia picture.</li>\\n\\n<li><strong>B. Chromium</strong> --- deficiency causes **glucose intolerance/insulin resistance** and peripheral neuropathy.</li>\\n\\n<li><strong>D. Selenium</strong> --- deficiency causes <strong>cardiomyopathy</strong> (Keshan disease) and myopathy; it can contribute to alopecia in infants but is not the classic dermatitis-alopecia-diarrhea triad.</li>\\n</ul>\\n<p><strong>Background:</strong> Trace elements (zinc, copper, chromium, selenium, manganese) must be routinely added to TPN. Zinc losses are especially high during catabolism and with GI losses (diarrhea, fistula output), and the dermatitis-alopecia syndrome appears during the sustained anabolic/weight-gain phase.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":118,\"stem\":\"The following is true regarding refeeding syndrome:\",\"options\":[{\"letter\":\"A\",\"text\":\"It usually causes hyperkalemia\"},{\"letter\":\"B\",\"text\":\"It is only associated with TPN\"},{\"letter\":\"C\",\"text\":\"It often causes hypophosphatemia\"},{\"letter\":\"D\",\"text\":\"Results from starting enteral feeding at an inadequately low volume\"}],\"correct\":\"C\",\"explanation\":\"<p>Refeeding syndrome occurs when nutrition is reintroduced to a malnourished patient. The carbohydrate load raises <strong>insulin</strong>, which drives <strong>phosphate, potassium, and magnesium intracellularly</strong> and increases phosphate consumption for ATP and glycolysis. <strong>Hypophosphatemia is the most consistent and characteristic biochemical abnormality</strong> and can precipitate respiratory muscle failure, cardiac dysfunction, and arrhythmias (da Silva et al., ASPEN Consensus Recommendations, 2020; Cederholm &amp; Bosaeus, New England Journal of Medicine, 2024).</p>\\n<p><strong>Why the others are incorrect:</strong></p>\\n<ul>\\n<li><strong>A</strong> --- Insulin drives potassium <strong>into</strong> cells, causing <strong>hypo</strong>kalemia, not hyperkalemia.</li>\\n\\n<li><strong>B</strong> --- Refeeding syndrome occurs with **oral, enteral, or parenteral** nutrition; enteral/oral feeding actually carries higher risk than PN because of the incretin effect (Schuetz et al., Lancet, 2021).</li>\\n\\n<li><strong>D</strong> --- It results from <strong>rapid/excessive</strong> reintroduction of calories (especially carbohydrate), not from feeding at too low a volume. Prevention relies on <strong>slow</strong> initiation, electrolyte repletion, and thiamine supplementation.</li>\\n</ul>\\n<p><strong>Background:</strong> High-risk patients include those with very low BMI, substantial weight loss, minimal intake, alcohol use disorder, and low baseline phosphate/potassium/magnesium. Give thiamine before/with refeeding to prevent Wernicke encephalopathy, start at reduced calories, and monitor electrolytes closely for the first several days.</p><div class=\\\"addendum\\\"><p class=\\\"addendum-label\\\">Note (from answer-key addendum)</p><p>Keyed: C (hypophosphatemia). Note: Correct, but refeeding syndrome occurs with enteral or parenteral feeding, and enteral/oral feeding actually carries higher risk than TPN via the incretin effect (da Silva et al., Nutr Clin Pract, 2020).</p></div>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":119,\"stem\":\"Which of the following is the major fuel source for the brain after 24 days of fasting or starvation.\",\"options\":[{\"letter\":\"A\",\"text\":\"Ketone bodies\"},{\"letter\":\"B\",\"text\":\"Glucose\"},{\"letter\":\"C\",\"text\":\"fatty acids\"},{\"letter\":\"D\",\"text\":\"Amino acids\"}],\"correct\":null,\"explanation\":\"<p><em>No answer key was available for this question in the source material.</em></p>\",\"no_key\":true,\"no_options\":false,\"free_answer\":null},{\"number\":120,\"stem\":\"Which of the following conditions is an absolute contraindication to cardiac transplantation\",\"options\":[{\"letter\":\"A\",\"text\":\"Pulmonary hypertension\"},{\"letter\":\"B\",\"text\":\"HIV infection\"},{\"letter\":\"C\",\"text\":\"Stage IV heart failure (New York classification)\"},{\"letter\":\"D\",\"text\":\"Recurrent ventricular arrhythmia\"}],\"correct\":\"A\",\"explanation\":\"<div class=\\\"addendum\\\"><p class=\\\"addendum-label\\\">Note (from answer-key addendum)</p><p>Keyed: a (pulmonary hypertension). Note: Correct only for pharmacologically irreversible/fixed PH (PVR ~5--6 Wood units, or not reducible &lt;2.5 WU on vasodilator challenge). Reversible PH is merely a relative contraindication and may be reversed with LVAD support (Guglin et al., JACC, 2020).</p></div>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":121,\"stem\":\"Which of the following is an absolute contraindication to renal transplantation\",\"options\":[{\"letter\":\"A\",\"text\":\"HIV infection\"},{\"letter\":\"B\",\"text\":\"Hepatitis B infection\"},{\"letter\":\"C\",\"text\":\"Cardiac stent placed 2 years ago.\"},{\"letter\":\"D\",\"text\":\"A patient with Hodgkin's lymphoma on chemotherapy\"}],\"correct\":\"D\",\"explanation\":\"<div class=\\\"addendum\\\"><p class=\\\"addendum-label\\\">Note (from answer-key addendum)</p><p>Keyed: D (Hodgkin&#x27;s lymphoma on chemotherapy). Note: Correct --- active malignancy on chemotherapy is the absolute contraindication. Worth flagging that (a) HIV is no longer absolute if virologically controlled with CD4 &gt;200, and (b) treated hepatitis B is only relative (KDIGO, 2020).</p></div>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":122,\"stem\":\"With regards to clinical rejection and transplant medicine which of the following is true?\",\"options\":[{\"letter\":\"A\",\"text\":\"Chronic rejection is most common\"},{\"letter\":\"B\",\"text\":\"Acute rejection occurs within 12 hours\"},{\"letter\":\"C\",\"text\":\"Hyperacute rejection is triggered by donors ABO blood group antigens\"},{\"letter\":\"D\",\"text\":\"Pre transplant blood cross matching does not decrease the incidence\"}],\"correct\":null,\"explanation\":\"<p><em>No answer key was available for this question in the source material.</em></p>\",\"no_key\":true,\"no_options\":false,\"free_answer\":null},{\"number\":123,\"stem\":\"Which of the following oncological definitions is true?\",\"options\":[{\"letter\":\"A\",\"text\":\"In situ cancer refers to tumors in which the malignant cells are demonstrated to preach the basement membrane and penetrate into the surrounding stroma.\"},{\"letter\":\"B\",\"text\":\"Dysplasia is cells that look abnormal under the microscope but are not cancer\"},{\"letter\":\"C\",\"text\":\"Metaplasia is the uncontrolled proliferation of cells.\"},{\"letter\":\"D\",\"text\":\"Neoplasia is a state of being not typical or normal (abnormality and sells tissue)\"}],\"correct\":null,\"explanation\":\"<p><em>No answer key was available for this question in the source material.</em></p>\",\"no_key\":true,\"no_options\":false,\"free_answer\":null},{\"number\":124,\"stem\":\"The American joint committee on cancer (AJCC) is one of the most widely accepted and regularly updated staging systems. Which of the following statements is true with regards to AJCC staging system (TNM)?\",\"options\":[{\"letter\":\"A\",\"text\":\"If no distant metastases are found in imaging the term MX is used.\"},{\"letter\":\"B\",\"text\":\"T is best based on the initial physical exam findings\"},{\"letter\":\"C\",\"text\":\"Many solid tumors are graded as N0 or N1 depending on the absence or presence of node involvement\"},{\"letter\":\"D\",\"text\":\"M1, M2, M3, and M4 suggest increasing abnormalities based on size, characteristics and location\"}],\"correct\":null,\"explanation\":\"<p><em>No answer key was available for this question in the source material.</em></p>\",\"no_key\":true,\"no_options\":false,\"free_answer\":null},{\"number\":125,\"stem\":\"Each of the following is an expected alteration in the immune system with aging EXCEPT:\",\"options\":[{\"letter\":\"A\",\"text\":\"Involution of the thymus gland\"},{\"letter\":\"B\",\"text\":\"Relative increase in inflammatory cytokines\"},{\"letter\":\"C\",\"text\":\"Decreased autoantibody production\"},{\"letter\":\"D\",\"text\":\"Decreased T cell mitogenic activity\"},{\"letter\":\"E\",\"text\":\"Decreased production and differentiation of na\\u00efve T cells\"}],\"correct\":\"C\",\"explanation\":\"<div class=\\\"addendum\\\"><p class=\\\"addendum-label\\\">Note (from answer-key addendum)</p><p>Keyed: C (decreased autoantibody production). Note: Confirmed correct --- aging increases autoantibody production via age-associated B cells and loss of self-tolerance, alongside thymic involution and inflammaging (Zheng et al., Semin Immunol, 2023).</p></div>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":126,\"stem\":\"The colon cancer was diagnosed in a 66-year-old man who a kidney transplantation 3 years ago the patient is getting sirolimus as an immunosuppressive agent. A colon resection is planned for this cancer which complication would be most frequent in this situation?\",\"options\":[{\"letter\":\"A\",\"text\":\"Perioperative bleeding\"},{\"letter\":\"B\",\"text\":\"Dehiscence\"},{\"letter\":\"C\",\"text\":\"Deep vein thrombosis\"},{\"letter\":\"D\",\"text\":\"Postoperative diabetes\"}],\"correct\":\"B\",\"explanation\":\"<div class=\\\"addendum\\\"><p class=\\\"addendum-label\\\">Note (from answer-key addendum)</p><p>Keyed: B (dehiscence). Note: Confirmed --- sirolimus (mTOR inhibitor) impairs fibroblast proliferation and angiogenesis; wound-healing complication rates reach 20--50%, and risk is higher with BMI &gt;30 (Sirolimus FDA label).</p></div>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":127,\"stem\":\"Postoperative adjuvant chemotherapy is associated with multiple adverse events. Which one of these adverse effects is related to the specific treatment?\",\"options\":[{\"letter\":\"A\",\"text\":\"Transverse myelitis\"},{\"letter\":\"B\",\"text\":\"Meningitis\"},{\"letter\":\"C\",\"text\":\"Bone marrow suppression\"},{\"letter\":\"D\",\"text\":\"Diverticulitis\"}],\"correct\":null,\"explanation\":\"<p><em>No answer key was available for this question in the source material.</em></p>\",\"no_key\":true,\"no_options\":false,\"free_answer\":null},{\"number\":128,\"stem\":\"What cell component is radiotherapy target?\",\"options\":[{\"letter\":\"A\",\"text\":\"Mitochondria\"},{\"letter\":\"B\",\"text\":\"Nucleus\"},{\"letter\":\"C\",\"text\":\"Nucleolus\"},{\"letter\":\"D\",\"text\":\"Cell membrane\"}],\"correct\":null,\"explanation\":\"<p><em>No answer key was available for this question in the source material.</em></p>\",\"no_key\":true,\"no_options\":false,\"free_answer\":null},{\"number\":129,\"stem\":\"Which one of these oncogenes is a proto-oncogene that supports tumor growth by gene amplification?\",\"options\":[{\"letter\":\"A\",\"text\":\"BRCA1\"},{\"letter\":\"B\",\"text\":\"Ras (via gene amplification\"},{\"letter\":\"C\",\"text\":\"HER-2/neu\"},{\"letter\":\"D\",\"text\":\"p53\"}],\"correct\":\"C\",\"explanation\":\"<div class=\\\"addendum\\\"><p class=\\\"addendum-label\\\">Note (from answer-key addendum)</p><p>No answer originally marked. Correct answer: <strong>HER-2/neu</strong> (amplified in breast cancer); Ras acts by mutation, and p53/BRCA1 are tumor suppressors.</p></div>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":130,\"stem\":\"Which one of these oncology statements is false?\",\"options\":[{\"letter\":\"A\",\"text\":\"Barrett's esophagus example of metaplasia\"},{\"letter\":\"B\",\"text\":\"In situ cancer means it does not cross the basal membrane\"},{\"letter\":\"C\",\"text\":\"Benign tumors are often associated with cell anaplasia\"},{\"letter\":\"D\",\"text\":\"Hyperplasia happens when there's multiplication of benign cells\"}],\"correct\":null,\"explanation\":\"<p><em>No answer key was available for this question in the source material.</em></p>\",\"no_key\":true,\"no_options\":false,\"free_answer\":null}];<\/script>\n<script>\n(function(){\n  const STORAGE_KEY = 'progress-v1';\n  // Namespaced by page title so multiple quiz files hosted/opened together\n  // (outside Claude, where window.storage isn't available) don't clobber\n  // each other's saved progress in the same browser's localStorage.\n  const LOCAL_STORAGE_KEY = 'examquiz-progress:' + (document.title || 'default');\n  let state = { answers: {}, flagged: {}, struck: {} }; // answers[num]={selected,correct}; struck[num]={LETTER:true}\n  let filter = 'all';\n  let currentIndex = 0;\n  let pendingSelections = {}; // qnum -> letter, chosen but not yet confirmed (session-only)\n\n  const FILTERS = [\n    ['all', 'All'],\n    ['unanswered', 'Unanswered'],\n    ['incorrect', 'Incorrect'],\n    ['flagged', 'Flagged'],\n  ];\n\n  function questionStatus(q) {\n    const a = state.answers[q.number];\n    if (!a) return 'unanswered';\n    if (q.no_options || q.no_key) return 'nokey-done';\n    return a.correct ? 'correct' : 'incorrect';\n  }\n\n  function visibleList() {\n    return QUIZ_DATA.filter(q => {\n      if (filter === 'unanswered') return !state.answers[q.number];\n      if (filter === 'incorrect') {\n        const a = state.answers[q.number];\n        return a && !a.correct && !q.no_options && !q.no_key;\n      }\n      if (filter === 'flagged') return !!state.flagged[q.number];\n      return true;\n    });\n  }\n\n  function renderFilters() {\n    const el = document.getElementById('filter-tabs');\n    el.innerHTML = '';\n    FILTERS.forEach(([key, label]) => {\n      const b = document.createElement('button');\n      b.textContent = label;\n      if (filter === key) b.classList.add('active');\n      b.onclick = () => { filter = key; currentIndex = 0; renderAll(); };\n      el.appendChild(b);\n    });\n  }\n\n  function renderGrid() {\n    const grid = document.getElementById('qgrid');\n    grid.innerHTML = '';\n    const list = visibleList();\n    if (list.length === 0) {\n      const empty = document.createElement('div');\n      empty.style.gridColumn = '1 / -1';\n      empty.style.color = 'var(--muted)';\n      empty.style.fontSize = '12.5px';\n      empty.style.textAlign = 'center';\n      empty.style.padding = '10px 0';\n      empty.textContent = 'No questions here.';\n      grid.appendChild(empty);\n      return;\n    }\n    list.forEach((q, i) => {\n      const b = document.createElement('button');\n      b.textContent = q.number;\n      const status = questionStatus(q);\n      if (status !== 'unanswered') b.classList.add(status);\n      if (i === currentIndex) b.classList.add('current');\n      if (state.flagged[q.number]) {\n        const dot = document.createElement('span');\n        dot.className = 'flagdot';\n        b.appendChild(dot);\n      }\n      b.onclick = () => { currentIndex = i; renderAll(); scrollToTop(); };\n      grid.appendChild(b);\n    });\n  }\n\n  function renderStats() {\n    const answeredNums = Object.keys(state.answers);\n    const gradable = answeredNums.filter(n => {\n      const q = QUIZ_DATA.find(x => x.number == n);\n      return q && !q.no_options && !q.no_key;\n    });\n    const correctCount = gradable.filter(n => state.answers[n].correct).length;\n    document.getElementById('stat-answered').textContent = answeredNums.length;\n    document.getElementById('stat-correct').textContent = correctCount;\n    document.getElementById('stat-pct').textContent = gradable.length\n      ? Math.round(100 * correctCount / gradable.length) + '%'\n      : '\u2014';\n  }\n\n  function escapeHtml(s) {\n    con
