rect:</strong> they would require a lower motor or verbal score than the stimulus responses describe (e.g., localizing withheld or withdrawal scored as flexion).</li>\\n\\n<li><strong>D (8) is incorrect:</strong> would require eye opening to pain (E2) or localization of pain (M5), neither of which is present.</li>\\n</ul>\\n<p>Background reading: Glasgow Coma Scale scoring (Teasdale &amp; Jennett).</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"53\",\"stem\":\"Which ONE of the following is true regarding sharps injuries in the operating room.\",\"options\":[{\"letter\":\"A\",\"text\":\"Medical students are the least likely team members to sustain a sharps-related injury\"},{\"letter\":\"B\",\"text\":\"Hand to hand passing of sharps amongst team members results in the majority of sharps injuries\"},{\"letter\":\"C\",\"text\":\"Blunt suture needles have not been shown to decrease injury rates.\"},{\"letter\":\"D\",\"text\":\"Double gloving has been shown to decrease sharps-related injuries\"}],\"correct\":\"D\",\"explanation\":\"<p>A Cochrane systematic review of 34 RCTs found moderate-quality evidence that double gloving reduces inner-glove perforations by 71% (RR 0.29) and blood contamination of the skin by 65% (RR 0.35) compared with single gloving, with a non-significant 42% reduction in reported needlestick injuries (Mischke et al., Cochrane Database of Systematic Reviews, 2014). Double gloving is now regarded as standard of care for procedures involving an incision (Provenzano et al., ASRA guideline, 2025).</p>\\n<ul>\\n<li><strong>A is incorrect:</strong> trainees and less experienced team members are generally at <em>higher</em>, not lower, risk of sharps injury.</li>\\n\\n<li><strong>B is incorrect:</strong> a large share of sharps injuries occur during device use and instrument handling rather than being predominantly attributable to hand-to-hand passing; &quot;hands-free&quot;/neutral-zone passing is in fact a mitigation strategy, but hand-to-hand passing is not the source of the majority of injuries.</li>\\n\\n<li><strong>C is incorrect:</strong> blunt (blunt-tipped) suture needles have been shown to reduce glove perforations and sharps injuries, so the statement (that they have not) is false.</li>\\n</ul>\\n<p>Background reading: Cochrane review on gloves for percutaneous exposure (Mischke et al., 2014); double-gloving meta-analysis (Zhang et al., Journal of Advanced Nursing, 2021).</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"54\",\"stem\":\"Regarding prevention of surgical site infections (SSI's), which ONE of the following is correct?\",\"options\":[{\"letter\":\"A\",\"text\":\"Tunnelled central lines have an increased infection rate compared to non-tunnelled central venous lines\"},{\"letter\":\"B\",\"text\":\"Decrease in foley catheter use has been associated with decrease in SSI's\"},{\"letter\":\"C\",\"text\":\"In clean wounds skin closure with staples compared to subcuticular sutures have been proven to significantly decrease SSI's\"},{\"letter\":\"D\",\"text\":\"Antibiotic administration just prior to incision for clean operations decreases SSI's.\"}],\"correct\":\"B\",\"explanation\":\"<p>The strongest, most consistent evidence-based SSI-prevention measure across the CDC, WHO, and professional-society guidelines is correctly timed parenteral antimicrobial prophylaxis, dosed so that a bactericidal concentration is present in serum and tissue at the time of incision (Berr\\u00edos-Torres et al., JAMA Surgery, 2017; Fields et al., JAMA, 2020; Seidelman et al., JAMA, 2023). Statement D captures that principle. The only weakness in D is the phrase &quot;for clean operations&quot;: routine antibiotic prophylaxis is not indicated for <em>every</em> clean case (it is generally reserved for clean-contaminated procedures, or clean procedures involving a prosthesis or where infection would be catastrophic). That nuance is presumably why the exam treated D as false --- but the general statement that antibiotics given just before incision decrease SSI is correct and is the backbone of every modern SSI bundle.</p>\\n<p>Statement B (reducing Foley catheter use decreases SSIs) is weakly supported at best: Foley catheter minimization reduces catheter-associated <em>urinary tract infections</em> (CAUTI), a different healthcare-associated infection, not surgical-site infections. The mechanistic and guideline link between Foley use and SSI is not established, making B a questionable &quot;best answer.&quot;</p>\\n<ul>\\n<li><strong>A is incorrect:</strong> tunnelled central lines have a <em>lower</em> infection rate than non-tunnelled lines, so the statement is false.</li>\\n\\n<li><strong>C is incorrect:</strong> staples have not been proven superior to subcuticular sutures for reducing SSI; if anything, some data favor sutures for wound complications.</li>\\n</ul>\\n<p>Practical takeaway: regardless of which single option the exam intended, the durable teaching points are that appropriately timed preoperative antibiotics, alcohol-based chlorhexidine skin prep, normothermia, and perioperative glycemic control are the interventions with the strongest randomized evidence for reducing SSI (Seidelman et al., JAMA, 2023).</p>\\n<p>Background reading: CDC SSI prevention guideline (Berr\\u00edos-Torres et al., JAMA Surgery, 2017); SSI prevention review (Seidelman et al., JAMA, 2023).</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"55\",\"stem\":\"A study is designed with a type 1 error rate of 5%. Which of the following is correct about the type 1 error?\",\"options\":[{\"letter\":\"A\",\"text\":\"Type 1 error is when a study shows there is a difference, when in fact there is none\"},{\"letter\":\"B\",\"text\":\"If the type 1 error is 5%, then the power of the study is 95%\"},{\"letter\":\"C\",\"text\":\"If you decrease the type 1 error rate in a study design (e.g. down to 1%), you can decrease the sample size needed in the study\"},{\"letter\":\"D\",\"text\":\"Type 1 error means you are accepting the null hypothesis, when in fact it is false.\"}],\"correct\":\"A\",\"explanation\":\"<p>A type I error (\\u03b1) is a false-positive result: rejecting a true null hypothesis, i.e., concluding a difference exists when in truth there is none. It is conventionally set at 0.05 (Schulz &amp; Grimes, Lancet, 2005; Gaddis &amp; Gaddis, Annals of Emergency Medicine, 1990).</p>\\n<ul>\\n<li><strong>B is incorrect:</strong> power is 1 \\u2212 \\u03b2 (the type II error), not 1 \\u2212 \\u03b1. An \\u03b1 of 5% says nothing directly about power, which is typically set at 80--90%.</li>\\n\\n<li><strong>C is incorrect:</strong> lowering \\u03b1 (e.g., to 1%) makes the significance threshold more stringent and <em>increases</em> the required sample size, all else equal --- it does not decrease it.</li>\\n\\n<li><strong>D is incorrect:</strong> this describes a type II error (failing to reject a false null hypothesis). A type I error involves erroneously <em>rejecting</em> a true null hypothesis.</li>\\n</ul>\\n<p>Background reading: sample-size and error definitions (Schulz &amp; Grimes, Lancet, 2005; Mascha &amp; Vetter, Anesthesia &amp; Analgesia, 2018).</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"56\",\"stem\":\"Which of the following is NOT correct regarding diabetic patients?\",\"options\":[{\"letter\":\"A\",\"text\":\"Diabetes guideline bodies recommend glycemic targets of between 9.1 to 14.2 mmol/L for non-critically ill hospitalized patients\"},{\"letter\":\"B\",\"text\":\"DM Type 1 patients are insulin deficient and are prone to developing ketosis\"},{\"letter\":\"C\",\"text\":\"DM Type 2 patients are susceptible to developing hyperosmolar hyperglycemic states\"},{\"letter\":\"D\",\"text\":\"Elevated HBA1C predicts a higher rate of post-operative adverse events\"}],\"correct\":\"A\",\"explanation\":\"<p>A is false because the recommended inpatient/perioperative glucose target is substantially lower than 9.1--14.2 mmol/L (164--256 mg/dL). The American Diabetes Association recommends maintaining perioperative glucose between 100 and 180 mg/dL (5.6--10.0 mmol/L), and general non-critical inpatient targets are 140--180 mg/dL (7.8--10.0 mmol/L) (ADA Standards of Care, 2026; Korytkowski et al., Endocrine Society guideline, 2022). A target of 9.1--14.2 mmol/L would tolerate frank hyperglycemia and is not recommended.</p>\\n<ul>\\n<li><strong>B is true (so not the answer):</strong> type 1 diabetes is characterized by absolute insulin deficiency and predisposition to diabetic ketoacidosis.</li>\\n\\n<li><strong>C is true:</strong> type 2 diabetes is the classic setting for hyperosmolar hyperglycemic state.</li>\\n\\n<li><strong>D is true:</strong> elevated preoperative HbA1c is associated with higher rates of postoperative complications, including surgical-site infection; the ADA recommends a preoperative HbA1c goal &lt;8% when feasible.</li>\\n</ul>\\n<p>Background reading: ADA Diabetes Care in the Hospital, Standards of Care 2026; Endocrine Society inpatient hyperglycemia guideline (Korytkowski et al., 2022).</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"57\",\"stem\":\"What is the target value for optimum perioperative glycemic control?\",\"options\":[{\"letter\":\"A\",\"text\":\"2.8 - 4.2 mmol/L\"},{\"letter\":\"B\",\"text\":\"4.6 - 6.2 mmol/L\"},{\"letter\":\"C\",\"text\":\"7.8 -- 11 mmol/L\"},{\"letter\":\"D\",\"text\":\"9.1 -- 14.2 mmol/L\"}],\"correct\":\"C\",\"explanation\":\"<p>Of the options offered, C (7.8--11 mmol/L \\u2248 140--198 mg/dL) is closest to the accepted perioperative target and is the best answer. The most current guideline target is slightly tighter: the ADA recommends maintaining perioperative glucose between 100 and 180 mg/dL (5.6--10.0 mmol/L), initiating insulin for persistent glucose &gt;180 mg/dL (10 mmol/L) (ADA Standards of Care, 2026; Duggan &amp; Chen, Current Diabetes Reports, 2019). The commonly quoted intra-/postoperative insulin-infusion target once treatment is started is 140--180 mg/dL (7.8--10 mmol/L).</p>\\n<ul>\\n<li><strong>A (2.8--4.2 mmol/L) is incorrect:</strong> this is in the hypoglycemic range and dangerous.</li>\\n\\n<li><strong>B (4.6--6.2 mmol/L \\u2248 83--112 mg/dL) is incorrect:</strong> tight normoglycemia of this degree increases hypoglycemia risk without outcome benefit and is associated with harm in critically ill patients.</li>\\n\\n<li><strong>D (9.1--14.2 mmol/L) is incorrect:</strong> too permissive; sustained hyperglycemia increases infection and other complications.</li>\\n</ul>\\n<p>Background reading: ADA perioperative recommendations, Standards of Care 2026; perioperative glycemic-management review (Duggan &amp; Chen, 2019).</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"58\",\"stem\":\"Which ONE of the following is true regarding loop diuretics?\",\"options\":[{\"letter\":\"A\",\"text\":\"They decrease blood flow to the kidney\"},{\"letter\":\"B\",\"text\":\"They inhibit the sodium-potasssium-chloride co-transporter\"},{\"letter\":\"C\",\"text\":\"They do not affect calcium\"},{\"letter\":\"D\",\"text\":\"They decrease venous capacitance\"}],\"correct\":\"B\",\"explanation\":\"<p>Loop diuretics (e.g., furosemide) act on the thick ascending limb of the loop of Henle, inhibiting the Na\\u207a-K\\u207a-2Cl\\u207b (NKCC2) cotransporter and thereby producing a potent natriuresis and diuresis.</p>\\n<ul>\\n<li><strong>A is incorrect:</strong> loop diuretics tend to <em>increase</em> renal blood flow (in part via prostaglandin-mediated vasodilation), rather than decrease it.</li>\\n\\n<li><strong>C is incorrect:</strong> by abolishing the lumen-positive transepithelial potential that drives paracellular calcium reabsorption, loop diuretics <em>increase</em> urinary calcium excretion --- which is why they are used in hypercalcemia.</li>\\n\\n<li><strong>D is incorrect:</strong> loop diuretics <em>increase</em> venous capacitance (venodilation), an effect that contributes to their rapid benefit in acute pulmonary edema; they do not decrease it.</li>\\n</ul>\\n<p>Background reading: renal tubular pharmacology of loop diuretics.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"59\",\"stem\":\"A 35 year old male fell from a 2 story construction site and suffered a femur fracture and spinal cord injury. He is stable and has just returned from the OR where he underwent repair of the femur fracture. There is no active bleeding. What venous thromboembolic prophylaxis orders are most appropriate?\",\"options\":[{\"letter\":\"A\",\"text\":\"Pneumatic stockings and early ambulation\"},{\"letter\":\"B\",\"text\":\"Dalteparin (Fragmin) 5000 units subcutaneously daily\"},{\"letter\":\"C\",\"text\":\"Enoxaparin (Lovenox) 30 mg subcutaneously daily\"},{\"letter\":\"D\",\"text\":\"Heparin 5000 units subcutaneously twice a day\"},{\"letter\":\"E\",\"text\":\"None of the above\"}],\"correct\":\"B\",\"explanation\":\"<p>This is a very high VTE-risk patient (major trauma with acute spinal cord injury plus a lower-extremity long-bone fracture) who is now hemostatically stable with no active bleeding, so pharmacologic prophylaxis with low-molecular-weight heparin is indicated. The ACCP guideline notes that in trauma patients at especially high risk such as acute spinal cord injury, LMWH prevents roughly ten times as many nonfatal VTE events as bleeding complications caused (Gould et al., CHEST, 2012), and LMWH is preferred over unfractionated heparin in trauma (Byrne &amp; Schellenberg, 2024). Among the listed options, dalteparin 5000 units once daily is a correct, guideline-consistent LMWH prophylactic regimen.</p>\\n<ul>\\n<li><strong>A is incorrect:</strong> mechanical prophylaxis alone is inadequate for this risk stratum once pharmacologic prophylaxis is safe; it is an adjunct, not a substitute.</li>\\n\\n<li><strong>C is incorrect as written:</strong> the standard enoxaparin prophylactic regimen is 30 mg subcutaneously <em>twice daily</em> (or 40 mg daily); enoxaparin 30 mg once daily is underdosed for a high-risk trauma patient.</li>\\n\\n<li><strong>D is incorrect:</strong> twice-daily unfractionated heparin is inferior to LMWH for VTE prevention in major trauma.</li>\\n\\n<li><strong>E is incorrect:</strong> an appropriate option (B) is present.</li>\\n</ul>\\n<p>Dosing update: current Western Trauma Association/AAST guidance favors enoxaparin 40 mg twice daily (rather than 30 mg twice daily) for many trauma patients, except in the setting of active bleeding, reduced creatinine clearance, TBI, or spinal cord injury, where dosing is individualized; anti-Xa--guided dosing is an option (Ley et al., 2020; Byrne &amp; Schellenberg, 2024).</p>\\n<p>Background reading: ACCP prevention of VTE in nonorthopedic surgical/trauma patients (Gould et al., CHEST, 2012); Western Trauma Association VTE algorithm (Ley et al., 2020).</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"60\",\"stem\":\"A patient with 80% body surface area burns and inhalational injury has been intubated in the burn ICU for 5 days and continues to require ICU support and surgeries for skin coverage. Which of the following interventions increases the risk of respiratory complications in this patient?\",\"options\":[{\"letter\":\"A\",\"text\":\"Performing a percutaneous tracheostomy\"},{\"letter\":\"B\",\"text\":\"Ventilating with a high tidal volume (12 cc/kg) to correct hypoxia\"},{\"letter\":\"C\",\"text\":\"Aggressive pulmonary toilet\"},{\"letter\":\"D\",\"text\":\"Administering bronchodilators routinely via the tracheal tube\"}],\"correct\":\"B\",\"explanation\":\"<p>High tidal volume ventilation (12 cc/kg) causes volutrauma and ventilator-induced lung injury and increases respiratory complications and mortality. The landmark ARMA trial and subsequent meta-analyses established that low tidal volume ventilation (6 cc/kg predicted body weight, plateau pressure &lt;30 cm H\\u2082O) reduces mortality compared with 12 cc/kg (31% vs 40% in ARMA) and is the standard of care in ARDS and at-risk ventilated patients (Meyer et al., Lancet, 2021; Yamamoto et al., Scientific Reports, 2022; Fawley et al., AAST/ACS-COT protocol, 2023). A patient with 80% burns and inhalation injury is at high risk for ARDS, making lung-protective ventilation essential.</p>\\n<ul>\\n<li><strong>A is incorrect (it is beneficial/appropriate):</strong> percutaneous tracheostomy is reasonable and safe in a patient with prolonged intubation and anticipated extended ICU/ventilator need, and facilitates pulmonary care.</li>\\n\\n<li><strong>C is incorrect (beneficial):</strong> aggressive pulmonary toilet clears secretions and casts, which is particularly important in inhalation injury, and reduces respiratory complications.</li>\\n\\n<li><strong>D is incorrect (beneficial):</strong> bronchodilators help manage bronchospasm and airway obstruction associated with inhalation injury.</li>\\n</ul>\\n<p>Background reading: lung-protective ventilation in ARDS (Meyer et al., Lancet, 2021); AAST/ACS-COT ARDS protocol (Fawley et al., 2023).</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"61\",\"stem\":\"Regarding surgical preparation solutions, which ONE of the following is true?\",\"options\":[{\"letter\":\"A\",\"text\":\"An iodine based solution is superior to a chlorhexidine solution to decrease surgical site infections.\"},{\"letter\":\"B\",\"text\":\"Waiting for 3 minutes after a chlorhexidine prep prior to surgery will prevent surgical fires related to prep flammability.\"},{\"letter\":\"C\",\"text\":\"Assurance that all prep has dried and that no pooling exists will decrease the risk of fires related to chlorhexidine preparation.\"},{\"letter\":\"D\",\"text\":\"All iodine prep is free of alcohol and thus non-flammable.\"}],\"correct\":\"C\",\"explanation\":\"<p>--- Agrees with the original answer key.</p>\\n<p>Alcohol-based antiseptics (including chlorhexidine-alcohol) are flammable and act as fuel for operating-room fires, one of the recognized &quot;never events.&quot; The single most important preventive measure is ensuring the prep has fully dried and that no liquid has pooled beneath drapes or in skin folds before drapes or ignition sources (electrocautery) are introduced (Mastrocola et al., Scientific Reports, 2021).</p>\\n<p>Why the others are wrong:</p>\\n<ul>\\n<li><strong>A</strong> is false. Alcoholic chlorhexidine is at least equivalent and generally superior to povidone-iodine for reducing skin flora and surgical site infection, particularly in clean surgery --- the reverse of the statement (Mastrocola et al., Scientific Reports, 2021).</li>\\n\\n<li><strong>B</strong> is false. A fixed 3-minute wait is not well supported. An ex vivo flammability study found no support for a 3-minute cutoff; prep appeared dry and non-ignitable at ~40 seconds, and the presence of pooling/persistently wet prep --- not the elapsed time --- was the more important fire risk (Ryan et al., Journal of Orthopaedic Trauma, 2021).</li>\\n\\n<li><strong>D</strong> is false. Many iodine-based preps are formulated with alcohol (e.g., iodine povacrylex in isopropyl alcohol) and are therefore flammable.</li>\\n</ul>\\n<p>Background: Fire prevention also includes soaked/removed drapes, allowing adequate drying, and adjuncts such as local CO\\u2082 delivery or smoke evacuation, which reduce flame formation with alcohol-based preps (Samuels et al., Surgical Endoscopy, 2020).</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"62\",\"stem\":\"What ECG changes are associated with hyperkalemia?\",\"options\":[{\"letter\":\"A\",\"text\":\"Diffuse peaked T waves, QRS widening\"},{\"letter\":\"B\",\"text\":\"U wave, QT prolongation\"},{\"letter\":\"C\",\"text\":\"Inverted T wave\"},{\"letter\":\"D\",\"text\":\"ST elevations in V2 and V4\"}],\"correct\":\"A\",\"explanation\":\"<p>--- Agrees with the original answer key.</p>\\n<p>Hyperkalemia produces a characteristic, roughly potassium-dependent ECG progression: tall/peaked T waves appear first (K\\u207a &gt;5.5 mEq/L), followed by PR prolongation and P-wave flattening, then QRS widening (K\\u207a &gt;6.5--7.0 mEq/L), and finally a sine-wave pattern preceding ventricular fibrillation or asystole (Lee &amp; Asirvatham, J Cardiovasc Electrophysiol, 2019; Sandau et al., AHA Scientific Statement, Circulation, 2017).</p>\\n<p>Why the others are wrong:</p>\\n<ul>\\n<li><strong>B</strong> (U waves, QT prolongation) describes hypokalemia.</li>\\n\\n<li><strong>C</strong> (isolated T-wave inversion) is a nonspecific finding of ischemia/strain, not hyperkalemia.</li>\\n\\n<li><strong>D</strong> (ST elevation in V2/V4) suggests anterior STEMI. Note that hyperkalemia can rarely produce a pseudo-injury ST-elevation pattern, but discrete anterior ST elevation is not the classic answer.</li>\\n</ul>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"63\",\"stem\":\"The most common ECG finding in patients with pulmonary embolism:\",\"options\":[{\"letter\":\"A\",\"text\":\"Sinus tachycardia\"},{\"letter\":\"B\",\"text\":\"S1-Q3-T3 pattern\"},{\"letter\":\"C\",\"text\":\"ST segment elevation\"},{\"letter\":\"D\",\"text\":\"Electrical alternans\"}],\"correct\":\"A\",\"explanation\":\"<p>--- Agrees with the original answer key.</p>\\n<p>Sinus tachycardia is the most frequent ECG abnormality in acute PE. A 2025 systematic review/meta-analysis of 7,467 patients found sinus tachycardia in ~31%, versus S1Q3T3 in only ~15% and RBBB in ~14%; 10--25% of PE patients have an entirely normal ECG (Krintratun et al., J Clin Med, 2025; McGrann &amp; Jackson, JAMA Intern Med, 2019).</p>\\n<p>Why the others are wrong:</p>\\n<ul>\\n<li><strong>B</strong> (S1Q3T3, the McGinn-White sign) is classically taught but insensitive (~10--15%), reflecting acute cor pulmonale rather than being the most common finding.</li>\\n\\n<li><strong>C</strong> (ST elevation) is uncommon and nonspecific.</li>\\n\\n<li><strong>D</strong> (electrical alternans) suggests large pericardial effusion/tamponade, not PE.</li>\\n</ul>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"64\",\"stem\":\"Which of the following statements about study design is true?\",\"options\":[{\"letter\":\"A\",\"text\":\"Cohort studies are always prospective\"},{\"letter\":\"B\",\"text\":\"Patients in a cohort study are randomly assigned to the exposure or intervention, then followed over time to assess for the outcome\"},{\"letter\":\"C\",\"text\":\"Case series in surgery have little value and are rarely published\"},{\"letter\":\"D\",\"text\":\"Case-control studies always identify subjects by the outcome, then assess for exposure\"},{\"letter\":\"E\",\"text\":\"Case-control studies are ideal for rare exposures or risk factors\"}],\"correct\":\"D\",\"explanation\":\"<p>--- Agrees with the original answer key.</p>\\n<p>Case-control studies are defined by enrolling participants on the basis of outcome status (cases with the outcome, controls without) and then looking backward to ascertain exposure --- &quot;research in reverse&quot; (Schulz &amp; Grimes, Lancet, 2002; Irony, JAMA, 2018).</p>\\n<p>Why the others are wrong:</p>\\n<ul>\\n<li><strong>A</strong> is false. Cohort studies may be prospective or retrospective; the label depends on when exposure data are collected relative to the outcome (Hewson &amp; Stuart, BJA Education, 2025).</li>\\n\\n<li><strong>B</strong> is false. Random assignment to exposure defines a randomized controlled trial, not a cohort study; in a cohort, exposure is observed, not assigned.</li>\\n\\n<li><strong>C</strong> is false. Case series are common, frequently published, and useful for describing new conditions or techniques.</li>\\n\\n<li><strong>E</strong> is false. Case-control designs are ideal for rare <strong>outcomes</strong>; <strong>cohort</strong> designs are best for rare <strong>exposures</strong> and for studying multiple outcomes (Hewson &amp; Stuart, BJA Education, 2025).</li>\\n</ul>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"65\",\"stem\":\"In a study of ICU length of stay after cardiac arrest, the length of stay in 10 subjects was (in days): 1, 1, 2, 3, 3, 5, 5, 9, 20, 58. Which statement about the data is true:\",\"options\":[{\"letter\":\"A\",\"text\":\"Length of stay is a continuous variable\"},{\"letter\":\"B\",\"text\":\"Mean length of stay is lower than median, since the data are skewed\"},{\"letter\":\"C\",\"text\":\"The outliers should be excluded from this data\"},{\"letter\":\"D\",\"text\":\"The length of stay is normally distributed\"}],\"correct\":\"A\",\"explanation\":\"<p>--- Agrees with the original answer key.</p>\\n<p>Length of stay is treated as a continuous variable (time can, in principle, take any value across a range). This is the only true statement offered.</p>\\n<p>Why the others are wrong:</p>\\n<ul>\\n<li><strong>B</strong> is false and is the most important teaching point: with a right (positive) skew driven by high outliers (20, 58), the mean (~10.7 days) is pulled <strong>above</strong> the median (4 days). The statement has the direction backward --- in right-skewed data the mean is <strong>higher</strong> than the median (Mascha &amp; Vetter, Anesthesia &amp; Analgesia, 2018).</li>\\n\\n<li><strong>C</strong> is false. Outliers should not be discarded simply because they are extreme; they are real observations, and their presence argues for reporting the median/IQR rather than mean.</li>\\n\\n<li><strong>D</strong> is false. The data are clearly right-skewed, not normally distributed.</li>\\n</ul>\\n<p>Note: A pedantic objection is that days recorded as whole numbers can be viewed as discrete counts, but by convention time-to-event/length-of-stay is classified as continuous, and every other option is definitively false --- so A remains the best answer.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"66\",\"stem\":\"CRP as a predictor of appendicitis (60 appendicitis, 40 normal): ------------------------------------------------------------------------ Appendicitis Normal Total appendix ----------------- ------------------ ----------------- ----------------- CRP >20 (high) 30 4 34 CRP <20 (normal) 30 36 66 Total 60 40 100 ------------------------------------------------------------------------ Which of the following is true:\",\"options\":[{\"letter\":\"A\",\"text\":\"The sensitivity of CRP in appendicitis patients is high with a low false negative rate\"},{\"letter\":\"B\",\"text\":\"The false positive rate is 50%\"},{\"letter\":\"C\",\"text\":\"CRP has a high positive predictive value (PPV 88%) but a low negative predictive value (NPV 55%), so a positive result would be useful but a negative result would not help much\"},{\"letter\":\"D\",\"text\":\"CRP testing has a high specificity so it is useful to rule out appendicitis\"}],\"correct\":\"C\",\"explanation\":\"<p>--- Agrees with the original answer key.</p>\\n<p>Working the 2\\u00d72 table (Thomas et al., Pediatric Radiology, 2015):</p>\\n<ul>\\n<li>Sensitivity = TP/(TP+FN) = 30/60 = <strong>50%</strong></li>\\n\\n<li>Specificity = TN/(TN+FP) = 36/40 = <strong>90%</strong></li>\\n\\n<li>PPV = TP/(TP+FP) = 30/34 = <strong>88%</strong></li>\\n\\n<li>NPV = TN/(TN+FN) = 36/66 = <strong>55%</strong></li>\\n\\n<li>False-positive rate = FP/(FP+TN) = 4/40 = <strong>10%</strong></li>\\n</ul>\\n<p>So a positive CRP meaningfully raises the probability of appendicitis (PPV 88%), but a negative CRP does not reliably exclude it (NPV 55%).</p>\\n<p>Why the others are wrong:</p>\\n<ul>\\n<li><strong>A</strong> is false. Sensitivity is only 50%, meaning a high false-negative rate.</li>\\n\\n<li><strong>B</strong> is false. The false-positive rate is 10%, not 50%.</li>\\n\\n<li><strong>D</strong> is false on two counts: the false-positive rate is 10% (not 50%, correcting a common misread), and, more importantly, a highly <strong>specific</strong> test is used to rule <strong>in</strong> disease (SpPIn), not to rule it out. Ruling out requires high <strong>sensitivity</strong> (SnNOut), which CRP lacks here.</li>\\n</ul>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"67\",\"stem\":\"Which of the following statements is correct about the power of a study?\",\"options\":[{\"letter\":\"A\",\"text\":\"Power is the probability of finding a statistically significant result when in fact there is no difference in the study populations\"},{\"letter\":\"B\",\"text\":\"Increasing the power of the study decreases the type 1 (or alpha) error\"},{\"letter\":\"C\",\"text\":\"Increasing the sample size increases the power of a study\"},{\"letter\":\"D\",\"text\":\"Decreasing the difference in outcomes between the two study populations increases the power of a study\"}],\"correct\":\"C\",\"explanation\":\"<p>--- Agrees with the original answer key.</p>\\n<p>Power (1 \\u2212 \\u03b2) is the probability of correctly detecting a true effect. For a fixed effect size and \\u03b1, increasing the sample size reduces the standard error and increases power (Mascha &amp; Vetter, Anesthesia &amp; Analgesia, 2018; Peterson &amp; Foley, Nutrition in Clinical Practice, 2021).</p>\\n<p>Why the others are wrong:</p>\\n<ul>\\n<li><strong>A</strong> describes the <strong>type I (alpha) error</strong> --- a false-positive --- not power. Power is finding significance when a difference truly exists.</li>\\n\\n<li><strong>B</strong> is false. Power and \\u03b1 are distinct; lowering \\u03b1 (making the test more stringent) actually <strong>reduces</strong> power unless the sample size is increased. Raising power does not itself lower \\u03b1.</li>\\n\\n<li><strong>D</strong> is false. A smaller true difference (smaller effect size) is harder to detect and <strong>decreases</strong> power.</li>\\n</ul>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"68\",\"stem\":\"Which of the following is NOT an early complication of tracheostomy:\",\"options\":[{\"letter\":\"A\",\"text\":\"Bleeding around the surgical site\"},{\"letter\":\"B\",\"text\":\"Wound Infection\"},{\"letter\":\"C\",\"text\":\"Airway Obstruction\"},{\"letter\":\"D\",\"text\":\"Tracheoesophageal fistula\"}],\"correct\":\"D\",\"explanation\":\"<p>--- Agrees with the original answer key.</p>\\n<p>Tracheoesophageal fistula is a <strong>late</strong> complication (&gt;7 days), arising from posterior tracheal wall pressure necrosis (classically from cuff overinflation with a stiff nasogastric tube in place). Early complications (\\u22647 days) include bleeding, wound infection, tube obstruction/airway obstruction, posterior tracheal wall injury, tube displacement, pneumothorax, and subcutaneous emphysema (Ansems et al., Cochrane Database Syst Rev, 2025; Epstein, Respiratory Care, 2005).</p>\\n<p>Why the others are wrong: bleeding (A), wound infection (B), and airway obstruction (C) are all recognized early perioperative complications.</p>\\n<p>Background: Other late complications include tracheal stenosis, tracheomalacia, granulation tissue, and the life-threatening tracheoinnominate artery fistula.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"69\",\"stem\":\"Which ONE of the following is true regarding total body water (TBW)?\",\"options\":[{\"letter\":\"A\",\"text\":\"Females typically have higher TBW than males\"},{\"letter\":\"B\",\"text\":\"The extracellular fluid compartment accounts for more % of body weight than the intracellular fluid compartment\"},{\"letter\":\"C\",\"text\":\"TBW usually decreases with increasing age\"},{\"letter\":\"D\",\"text\":\"The higher the proportion of muscle compared to fat, the higher the TBW\"}],\"correct\":\"D\",\"explanation\":\"<p>Statement <strong>D</strong> is true: skeletal muscle is ~73% water while adipose tissue is nearly water-free, so a higher muscle-to-fat ratio yields a higher TBW as a fraction of body weight (Ohashi et al., Seminars in Dialysis, 2018).</p>\\n<p>However, statement <strong>C</strong> is also physiologically true: TBW as a percentage of body weight declines with age (from ~60% in young adult males toward ~50% in the elderly), owing largely to loss of lean mass and intracellular water (Ohashi et al., Seminars in Dialysis, 2018; AAP, Body Fluid Composition, 2015). Because both C and D are correct, the item does not have a single best answer as written. If forced to choose, D is the most directly and universally correct statement and matches the keyed answer, but the flaw should be noted.</p>\\n<p>Why the remaining options are wrong:</p>\\n<ul>\\n<li><strong>A</strong> is false. Females have <strong>lower</strong> TBW than males (~55% vs ~60% of body weight) because of higher body fat and lower muscle mass (AAP, Body Fluid Composition, 2015).</li>\\n\\n<li><strong>B</strong> is false. The intracellular compartment holds about two-thirds of TBW and the extracellular compartment about one-third; ICF exceeds ECF.</li>\\n</ul>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"72\",\"stem\":\"A 32 yr insulin dependent diabetic F presents in septic shock related to a post operative necrotizing soft tissue infection following an uncomplicated caesarian section. Which of the following is most important during her early preoperative resuscitation?\",\"options\":[{\"letter\":\"A\",\"text\":\"initiation of antimicrobial therapy\"},{\"letter\":\"B\",\"text\":\"insertion of a CVP line\"},{\"letter\":\"C\",\"text\":\"crystalloid resuscitation\"},{\"letter\":\"D\",\"text\":\"glucose level and insulin infusion\"}],\"correct\":\"C\",\"explanation\":\"<p>Crystalloid resuscitation is the core hemodynamic intervention in early septic shock. The Surviving Sepsis Campaign recommends beginning resuscitation immediately and giving at least 30 mL/kg of IV crystalloid within the first 3 hours for sepsis-induced hypoperfusion or septic shock, to restore intravascular volume and perfusion before and during source control (Evans et al., Surviving Sepsis Campaign 2021; Prescott et al., 2026).</p>\\n<ul>\\n<li><strong>b (CVP line)</strong> is incorrect: CVP is a poor, static predictor of fluid responsiveness and is not a resuscitation priority; dynamic measures are preferred. Line placement should not delay volume resuscitation.</li>\\n\\n<li><strong>d (glucose/insulin)</strong> is incorrect as the single most important step: glycemic control matters in a diabetic patient but does not take precedence over restoring perfusion.</li>\\n</ul>\\n<p>Caveat worth teaching: <strong>early antimicrobial therapy (option a) is equally time-critical</strong> --- the Surviving Sepsis Campaign directs antibiotics within the first hour, and observational data (Seymour et al., New England Journal of Medicine, 2017) link delayed antibiotics, but not delayed fluid-bolus completion, to higher mortality. In a necrotizing soft-tissue infection, the definitive intervention is emergent surgical debridement. The item&#x27;s framing (&quot;resuscitation&quot;) makes crystalloid the best answer, but antibiotics plus source control are inseparable early priorities.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"73\",\"stem\":\"Six days after initiation of warfarin for new onset atrial fibrillation an 82 year old obese, female presents to the emergency department with painful and dark eschar of the arms, breasts, buttocks and feet. The most likely diagnosis is a deficiency of which of the following?\",\"options\":[{\"letter\":\"A\",\"text\":\"vitamin C\"},{\"letter\":\"B\",\"text\":\"Vitamin K\"},{\"letter\":\"C\",\"text\":\"Protein C\"},{\"letter\":\"D\",\"text\":\"Collagen\"}],\"correct\":\"C\",\"explanation\":\"<p>This is warfarin-induced skin necrosis. Warfarin suppresses the vitamin K--dependent factors, but protein C (a natural anticoagulant with a short half-life) falls fastest, producing a transient hypercoagulable state with microvascular thrombosis in fat-rich skin (breasts, buttocks, thighs) 3--5 days after initiation, classically in patients with underlying protein C or S deficiency and after large loading doses (Ginsberg, New England Journal of Medicine, 1996; King et al., Annals of Hematology, 2024).</p>\\n<ul>\\n<li><strong>a (vitamin C)</strong> --- scurvy causes perifollicular hemorrhage and poor healing, not acute eschar after warfarin.</li>\\n\\n<li><strong>b (vitamin K)</strong> --- warfarin functionally lowers vitamin K--dependent factors, but the necrosis is driven by the protein C imbalance, not a primary vitamin K deficiency state; vitamin K is part of treatment.</li>\\n\\n<li><strong>d (collagen)</strong> --- collagen defects (e.g., Ehlers-Danlos) do not cause this picture.</li>\\n</ul>\\n<p>Management: stop warfarin, give IV vitamin K, and anticoagulate with heparin; protein C concentrate in severe/deficient cases.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"74\",\"stem\":\"In a massive transfusion protocol involving greater than 10 units of packed RBC's there is evidence of continued oozing from cut surgical sites. Which of the following may be deplete and require correction to facilitate hemostasis?\",\"options\":[{\"letter\":\"A\",\"text\":\"glucose\"},{\"letter\":\"B\",\"text\":\"calcium\"},{\"letter\":\"C\",\"text\":\"vitamin K\"},{\"letter\":\"D\",\"text\":\"potassium\"}],\"correct\":\"B\",\"explanation\":\"<p>Stored blood products contain citrate (~3 g per unit of pRBC or FFP) as an anticoagulant/preservative. During massive transfusion, citrate chelates ionized calcium faster than the (often hypoperfused) liver can metabolize it, producing acute hypocalcemia. Ionized calcium (Factor IV) is a cofactor for activation of factors II, VII, IX, X and proteins C/S and is required for platelet adhesion and fibrin polymerization, so hypocalcemia directly worsens coagulopathic oozing (Rossaint et al., European trauma guideline 6th ed., Critical Care, 2023; Spahn et al., 5th ed., 2019).</p>\\n<ul>\\n<li><strong>a (glucose)</strong> --- citrate metabolism and stress typically raise glucose; hypoglycemia is not the cause of bleeding.</li>\\n\\n<li><strong>c (vitamin K)</strong> --- not acutely depleted over the timeframe of a massive transfusion.</li>\\n\\n<li><strong>d (potassium)</strong> --- stored blood tends to cause hyperkalemia, not depletion, and hyperkalemia does not cause oozing.</li>\\n</ul>\\n<p>Monitor ionized calcium on blood gas and replace with IV calcium during massive transfusion.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"75\",\"stem\":\"A 46-year-old male with HTN, DLP, and type II DM, returns to the ER 2 weeks post emergent cholecystectomy. He reports chest pain, SOB, and has a significant elevation in his troponins. EKG suggests an acute myocardial infarction. The most appropriate disposition for this patient is:\",\"options\":[{\"letter\":\"A\",\"text\":\"Admission to surgery (he was discharged less than one month ago)\"},{\"letter\":\"B\",\"text\":\"Cardiology consultation for admission to the Coronary Care Unit (CCU)\"},{\"letter\":\"C\",\"text\":\"Consult internal medicine to confirm the diagnosis of myocardial infarction\"},{\"letter\":\"D\",\"text\":\"Keep patient under observation in the ER for 48hrs or until the chest pain resolves\"}],\"correct\":\"B\",\"explanation\":\"<p>An acute MI (ischemic symptoms + troponin rise + diagnostic ECG) is a cardiac emergency requiring cardiology and CCU-level care for risk stratification, antithrombotic/anti-ischemic therapy, and revascularization decisions --- irrespective of the recent operation. Disposition follows the active diagnosis, not the discharging service.</p>\\n<ul>\\n<li><strong>a</strong> --- admitting to surgery misdirects care away from the acute cardiac problem.</li>\\n\\n<li><strong>c</strong> --- the diagnosis is already established; internal medicine consultation to &quot;confirm&quot; only delays definitive management.</li>\\n\\n<li><strong>d</strong> --- ER observation for an evolving MI is unsafe.</li>\\n</ul>\\n<p>The recent surgery is relevant to bleeding risk and the timing/choice of antithrombotics and revascularization, which is precisely why cardiology should co-manage.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"76\",\"stem\":\"The initial step in managing hypotension in a patient receiving epidural analgesia is:\",\"options\":[{\"letter\":\"A\",\"text\":\"IV fluid bolus\"},{\"letter\":\"B\",\"text\":\"Norepinephrine\"},{\"letter\":\"C\",\"text\":\"Stop the epidural\"},{\"letter\":\"D\",\"text\":\"Vasopressin\"}],\"correct\":\"C\",\"explanation\":\"<p>Hypotension from a neuraxial (epidural) block results from local-anesthetic sympathetic blockade causing vasodilation and reduced systemic vascular resistance (and reduced venous return). Standard management targets that mechanism directly: <strong>an IV fluid bolus/co-load and a vasopressor</strong> (phenylephrine or norepinephrine to restore SVR), together with positioning. The American Society of Anesthesiologists explicitly recommends vasopressor infusion (phenylephrine or norepinephrine) to address the primary cause --- SVR reduction --- with IV crystalloid co-load as an additional strategy (ASA Statement on Quality Metrics, 2022; ACOG Practice Bulletin, Obstetric Analgesia and Anesthesia, 2019).</p>\\n<p>Of the listed options, <strong>a (IV fluid bolus)</strong> is the most defensible &quot;initial step&quot; in a hemodynamically significant but non-crisis setting, and <strong>b (norepinephrine)</strong> or phenylephrine is the intervention that corrects the underlying vasodilation. Simply &quot;stopping the epidural&quot; does not rapidly reverse an established block and is not the recognized first-line response; reducing/holding the infusion is a secondary consideration once perfusion is supported. This item&#x27;s keyed answer does not align with current neuraxial-hypotension management.</p>\\n<ul>\\n<li><strong>d (vasopressin)</strong> --- not first-line for neuraxial sympathectomy hypotension.</li>\\n</ul>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"77\",\"stem\":\"All of the following are true about Ogilvie's syndrome EXCEPT:\",\"options\":[{\"letter\":\"A\",\"text\":\"Signs and symptoms of obstruction are present in the absence of a mechanical cause.\"},{\"letter\":\"B\",\"text\":\"The main clinical feature is abdominal distension and obstipation.\"},{\"letter\":\"C\",\"text\":\"The diagnosis is usually established by colonoscopy without bowel prep.\"},{\"letter\":\"D\",\"text\":\"Usually, the cecum and the right colon are involved in the functional problem\"}],\"correct\":\"C\",\"explanation\":\"<p>Acute colonic pseudo-obstruction (Ogilvie syndrome) is diagnosed by excluding mechanical obstruction, primarily with <strong>CT (gold standard) or water-soluble contrast enema</strong>, not by colonoscopy. The American Society of Colon and Rectal Surgeons states that endoscopy is not typically recommended for diagnostic purposes because of the perforation risk in a dilated colon (Alavi et al., ASCRS guideline, 2021; Sen &amp; Chokshi, Current Gastroenterology Reports, 2023). Colonoscopy is a therapeutic (decompressive) tool when conservative measures and neostigmine fail --- not a first-line diagnostic test.</p>\\n<ul>\\n<li><strong>a</strong> --- true; obstructive signs without a mechanical lesion is the defining feature.</li>\\n\\n<li><strong>b</strong> --- true; massive distension with obstipation is the hallmark.</li>\\n\\n<li><strong>d</strong> --- true; dilation predominates in the cecum and right/ascending colon, where perforation risk is greatest (cecal diameter &gt;12 cm).</li>\\n</ul>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"78\",\"stem\":\"A 55 yr female with a history of a mechanical aortic valve replacement 5 years ago is undergoing an abdominal hysterectomy for symptomatic fibroids causing discomfort and significant menorrhagia. What would be the most appropriate antimicrobial prophylaxis?\",\"options\":[{\"letter\":\"A\",\"text\":\"IV penicillin and gentamycin\"},{\"letter\":\"B\",\"text\":\"IV Ampicillin and Tobramycin\"},{\"letter\":\"C\",\"text\":\"IV Clindamycin\"},{\"letter\":\"D\",\"text\":\"IV Vancomycin\"}],\"correct\":\"B\",\"explanation\":\"<p>The keyed answer (ampicillin + an aminoglycoside) mirrors the pre-2007 AHA regimen for endocarditis prophylaxis before genitourinary/gastrointestinal procedures. That approach has been abandoned: current ACC/AHA and ESC guidance does <strong>not</strong> recommend infective-endocarditis prophylaxis for GU/GI procedures (including hysterectomy) in the absence of active infection, even in the highest-risk patients such as those with prosthetic valves (Otto et al., 2020 ACC/AHA Valvular Heart Disease Guideline --- Class 3, No Benefit; Praz et al., 2025 ESC/EACTS).</p>\\n<p>What this patient actually needs is standard <strong>surgical site infection prophylaxis for hysterectomy, which is single-dose IV cefazolin</strong> (a clean-contaminated case), with cefoxitin, cefotetan, or ampicillin-sulbactam as alternatives, and clindamycin or metronidazole plus an aminoglycoside/fluoroquinolone reserved for severe \\u03b2-lactam allergy (Bratzler et al., IDSA/ASHP Surgical Prophylaxis Guideline, 2013; ACOG Practice Bulletin, Prevention of Infection After Gynecologic Procedures, 2018).</p>\\n<ul>\\n<li>Cefazolin is not offered as a choice, so the item is constructed around outdated endocarditis logic. If forced to pick from the list, <strong>clindamycin (c)</strong> would be the closest single-agent option consistent with a \\u03b2-lactam-allergy alternative, but the correct real-world answer is cefazolin. The mechanical valve does not change SSI prophylaxis and does not by itself mandate additional endocarditis coverage for this procedure.</li>\\n</ul>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"79\",\"stem\":\"An 85 yr F with a history of COPD is scheduled to undergo a thoracotomy and left lobectomy for localized NSCLC. Which of the following most closely correlates with post operative respiratory performance?\",\"options\":[{\"letter\":\"A\",\"text\":\"chest CT\"},{\"letter\":\"B\",\"text\":\"6 minute walk test\"},{\"letter\":\"C\",\"text\":\"forced expiratory volume in 1 sec\"},{\"letter\":\"D\",\"text\":\"diffusion of carbon monoxide in the lung\"}],\"correct\":\"C\",\"explanation\":\"<p>FEV1 (and predicted postoperative FEV1) is the traditional cornerstone spirometric predictor of postoperative respiratory morbidity and mortality after lung resection, with risk rising as ppoFEV1 falls (Brunelli et al., ACCP Physiologic Evaluation Guideline, Chest, 2013).</p>\\n<p>However, the same guideline emphasizes that <strong>DLCO (option d) is an independent, co-equal predictor</strong> --- it correlates with postoperative mortality even when FEV1 is normal, and should be measured routinely in all resection candidates because &gt;40% of patients with FEV1 &gt;80% have an abnormal DLCO. In a COPD patient in particular, DLCO carries substantial predictive weight. The exam accepts FEV1 as the single best answer, but a complete assessment pairs ppoFEV1 with ppoDLCO (and exercise testing/VO2max when either is &lt;40% predicted).</p>\\n<ul>\\n<li><strong>a (chest CT)</strong> --- defines anatomy/resectability, not functional reserve.</li>\\n\\n<li><strong>b (6-minute walk test)</strong> --- a functional adjunct, less standardized than FEV1/DLCO for this purpose.</li>\\n</ul>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"80\",\"stem\":\"A 78 year old female has sustained a fall at home and is identified to have a fractured left hip and a lacerated spleen requiring emergent operative intervention. She has a history of atrial fibrillation and is currently on oral warfarin therapy. Her admission INR is 3.0. Which of the following is the most appropriate management of her OAC?\",\"options\":[{\"letter\":\"A\",\"text\":\"Vit K 2.5 mg IV and 2 units of FFP, repeat INR and repeat if > 1.4\"},{\"letter\":\"B\",\"text\":\"4 units of FFP, repeat INR and repeat if > 1.4\"},{\"letter\":\"C\",\"text\":\"octaplex (adult dose) and proceed with OR\"},{\"letter\":\"D\",\"text\":\"octaplex (adult dose), repeat INR and repeat if > 1.4\"}],\"correct\":\"C\",\"explanation\":\"<p>For a warfarin-anticoagulated patient needing emergent surgery, 4-factor PCC (octaplex) provides the fastest, most complete INR correction and is preferred over FFP, allowing the patient to proceed to the OR without the delay and volume load of plasma (Tomaselli et al., 2020 ACC Expert Consensus Decision Pathway; Rocca &amp; Ten Cate, New England Journal of Medicine, 2026). Compared with FFP, 4F-PCC achieves faster INR correction, superior hemostasis, less transfusion, shorter time to surgery, and less volume --- important in a 78-year-old.</p>\\n<ul>\\n<li><strong>a and b (FFP-based)</strong> --- FFP corrects more slowly, requires large volumes (risking TACO, the leading cause of transfusion-related death in older adults), and delays a time-critical operation for a splenic laceration.</li>\\n\\n<li><strong>d</strong> --- waiting to &quot;repeat INR&quot; before proceeding introduces unnecessary delay in a patient who needs immediate hemorrhage control; PCC works within minutes and the patient should go to the OR.</li>\\n</ul>\\n<p>Important adjunct not captured by the option wording: <strong>IV vitamin K should be co-administered</strong> with PCC. PCC has a shorter duration than warfarin, so without vitamin K the INR can rebound as PCC factors are cleared.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"81\",\"stem\":\"With regards to von Willebrand disease which of the following is true?\",\"options\":[{\"letter\":\"A\",\"text\":\"It is less common than hemophilia\"},{\"letter\":\"B\",\"text\":\"It is best treated with cryoprecipitate and FFP\"},{\"letter\":\"C\",\"text\":\"There is an associated platelet abnormality in most patients\"},{\"letter\":\"D\",\"text\":\"Bleeding following elective surgery is rare\"}],\"correct\":\"C\",\"explanation\":\"<p>--- agrees with the original key (with a wording caveat).</p>\\n<p>Von Willebrand disease (VWD) is the most common inherited bleeding disorder, characterized fundamentally by defective platelet adhesion and aggregation. Von Willebrand factor (VWF) binds collagen at sites of vascular injury and mediates platelet adhesion (via platelet GPIb) and aggregation, and also serves as the carrier protein for factor VIII (Leebeek and Eikenboom, New England Journal of Medicine, 2016). Because the disorder impairs VWF-mediated primary hemostasis, option C is the intended best answer.</p>\\n<p>Wording caveat: strictly speaking, the platelets themselves are usually intrinsically normal in most VWD --- the defect is in VWF-mediated platelet adhesion rather than a platelet-intrinsic abnormality. The phrase &quot;associated platelet abnormality&quot; is best read as &quot;abnormal platelet-dependent primary hemostasis,&quot; which is present in essentially all symptomatic patients.</p>\\n<p>Why the others are incorrect:</p>\\n<ul>\\n<li><strong>a. Incorrect</strong> --- VWD is more common than hemophilia, affecting up to ~1% of the population, and is the most common inherited bleeding disorder (Seidizadeh et al., Nature Reviews Disease Primers, 2024).</li>\\n\\n<li><strong>b. Incorrect</strong> --- First-line treatment is desmopressin (for responsive type 1) or VWF-containing concentrates; cryoprecipitate and FFP are not the preferred therapy because of infectious risk and inferior efficacy (Leebeek and Eikenboom, New England Journal of Medicine, 2016).</li>\\n\\n<li><strong>d. Incorrect</strong> --- Bleeding after surgery and trauma is a hallmark of VWD, not a rare event.</li>\\n</ul>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"82\",\"stem\":\"Which of the following is the most common cause of post operative VTE?\",\"options\":[{\"letter\":\"A\",\"text\":\"unrecognized Factor V leiden\"},{\"letter\":\"B\",\"text\":\"history of malignancy\"},{\"letter\":\"C\",\"text\":\"protein C deficiency\"},{\"letter\":\"D\",\"text\":\"prolonged immobilization\"}],\"correct\":\"D\",\"explanation\":\"<p>The original key selected &quot;unrecognized Factor V Leiden.&quot; Factor V Leiden is indeed the most common <em>inherited</em> thrombophilia (present with the prothrombin gene variant in ~50--60% of identified hereditary cases), but the question asks for the most common <em>cause of postoperative VTE</em>, which is a different question.</p>\\n<p>Postoperative VTE is overwhelmingly a <em>provoked</em> event driven by the transient risk factors captured in Virchow&#x27;s triad --- venous stasis from immobilization, endothelial injury from the operation, and a surgery-induced hypercoagulable state. Major surgery, prolonged immobilization, and major trauma are classified as strong transient provoking factors and together account for roughly 20% of all VTE, and immobilization is a dominant, modifiable contributor in the surgical patient (Khan et al., Lancet, 2021). In the fracture-surgery meta-analysis, immobility carried an odds ratio of ~3.45 for postoperative VTE (Xia et al., International Wound Journal, 2023). By contrast, most surgical patients with postoperative VTE do not carry Factor V Leiden.</p>\\n<p>Why the others are less correct:</p>\\n<ul>\\n<li><strong>a. Factor V Leiden</strong> --- the most common <em>hereditary</em> thrombophilia, but not the most common cause of postoperative VTE overall; most postoperative events occur in patients without it.</li>\\n\\n<li><strong>b. Malignancy</strong> --- a strong persistent risk factor (~20% of all VTE) and highly relevant in cancer surgery, but not the single most common cause across all postoperative patients (Khan et al., Lancet, 2021).</li>\\n\\n<li><strong>c. Protein C deficiency</strong> --- a relatively uncommon inherited thrombophilia; a minor contributor overall.</li>\\n</ul>\\n<p>Note: if the exam&#x27;s intended concept was &quot;most common <em>inherited/hereditary</em> cause,&quot; then Factor V Leiden (A) would be correct. As literally worded (&quot;most common cause of post operative VTE&quot;), prolonged immobilization is the more defensible answer.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"83\",\"stem\":\"Which of the following patients is most at risk for post-operative wound dehiscence?\",\"options\":[{\"letter\":\"A\",\"text\":\"An 18 year old healthy female undergoing emergency open appendectomy\"},{\"letter\":\"B\",\"text\":\"A 55 year old thin male undergoing open anterior low resection for rectal carcinoma\"},{\"letter\":\"C\",\"text\":\"A 60 year old previously healthy female undergoing TAH-BSO for low-stage endometrial carcinoma\"},{\"letter\":\"D\",\"text\":\"A 65 year old obese diabetic male on hemodialysis receiving a kidney transplant\"},{\"letter\":\"E\",\"text\":\"A 45 year old female with BMI of 32 undergoing laparoscopic cholecystectomy\"}],\"correct\":\"D\",\"explanation\":\"<p>--- agrees with the original key.</p>\\n<p>Wound dehiscence risk rises with the <em>number</em> of coexisting systemic and local risk factors. Patient D stacks multiple independent, well-validated predictors: obesity, diabetes, uremia/renal failure (hemodialysis), advanced age, male sex, and post-transplant immunosuppression --- each repeatedly identified as an independent risk factor for fascial dehiscence (Riou et al., American Journal of Surgery, 1992; Gonzalez et al., Langenbeck&#x27;s Archives of Surgery, 2023). Immunosuppressive drugs specifically delay granulation tissue formation and impair healing.</p>\\n<p>Why the others are incorrect:</p>\\n<ul>\\n<li><strong>a. Incorrect</strong> --- a young, healthy patient has minimal systemic risk factors despite the emergency/contaminated setting.</li>\\n\\n<li><strong>b. Incorrect</strong> --- carries malignancy and a major open procedure, but &quot;thin&quot; and otherwise unspecified comorbidity places this patient below D; note hypoalbuminemia/malnutrition would raise risk if present.</li>\\n\\n<li><strong>c. Incorrect</strong> --- &quot;previously healthy,&quot; low-stage disease, fewer stacked systemic factors than D.</li>\\n\\n<li><strong>e. Incorrect</strong> --- laparoscopic cholecystectomy carries low dehiscence risk; small port-site incisions and BMI 32 alone are far below the risk profile of D.</li>\\n</ul>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"84\",\"stem\":\"Which of the following is NOT a well-described risk factor for ARDS in the surgical patient?\",\"options\":[{\"letter\":\"A\",\"text\":\"Poorly controlled diabetes mellitus\"},{\"letter\":\"B\",\"text\":\"Sepsis\"},{\"letter\":\"C\",\"text\":\"Chronic CHF\"},{\"letter\":\"D\",\"text\":\"Gastric content aspiration\"},{\"letter\":\"E\",\"text\":\"Uremia\"}],\"correct\":\"A\",\"explanation\":\"<p>--- agrees with the original key (with an evolving-evidence caveat).</p>\\n<p>Classic, well-established ARDS risk factors include sepsis, aspiration of gastric contents, severe trauma, pneumonia, pancreatitis, massive transfusion, and uremia. Poorly controlled diabetes is <em>not</em> a classically described ARDS risk factor, and several analyses have suggested diabetes is neutral or even associated with a <em>reduced</em> incidence of ARDS in some populations --- the LUNG SAFE database analysis found no association between diabetes and ARDS among patients with acute hypoxemic respiratory failure (Boyle et al., Critical Care, 2018). This makes A the best &quot;NOT a risk factor&quot; answer.</p>\\n<p>Evolving-evidence caveat: more recent work, particularly from COVID-19 and sepsis cohorts, indicates that chronic hyperglycemia and stress hyperglycemia may amplify ARDS risk and severity through immune dysregulation and alveolar-capillary barrier injury (Yu et al., Lung, 2025; Jin et al., Scientific Reports, 2025). The relationship is therefore more nuanced than the exam implies, but within the offered options A remains the intended and most defensible answer.</p>\\n<p>Why the others are incorrect (i.e., they ARE risk factors):</p>\\n<ul>\\n<li><strong>b. Sepsis</strong> --- the single most common cause of ARDS.</li>\\n\\n<li><strong>c. Chronic CHF</strong> --- a recognized contributor/risk association in surgical patients (though hydrostatic edema must be distinguished from ARDS).</li>\\n\\n<li><strong>d. Gastric content aspiration</strong> --- a classic direct pulmonary insult.</li>\\n\\n<li><strong>e. Uremia</strong> --- a described ARDS risk factor in the surgical literature.</li>\\n</ul>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"85\",\"stem\":\"A colon cancer was diagnosed in a 66-year old man who had a kidney transplantation three years ago. This patient is getting Sirolimus as an immunosuppressive agent. A colon resection is planned for this cancer. Which complication would be more frequent in this situation?\",\"options\":[{\"letter\":\"A\",\"text\":\"Perioperative bleeding\"},{\"letter\":\"B\",\"text\":\"Wound dehiscence\"},{\"letter\":\"C\",\"text\":\"Deep vein thrombosis\"},{\"letter\":\"D\",\"text\":\"Postoperative diabetes\"}],\"correct\":\"B\",\"explanation\":\"<p>--- agrees with the original key.</p>\\n<p>Sirolimus is a mammalian target of rapamycin (mTOR) inhibitor, and impaired/delayed wound healing is one of its signature adverse effects. The FDA label carries a specific warning: mTOR inhibitors inhibit production of growth factors affecting angiogenesis, fibroblast proliferation, and vascular permeability, with reports of impaired wound healing, lymphocele, and wound dehiscence (FDA sirolimus label). A prospective randomized trial in kidney transplant recipients found wound-healing complications in 47% of sirolimus patients versus 8% of tacrolimus patients (Dean et al., Transplantation, 2004), and a Cochrane meta-analysis found mTOR inhibitors roughly 2.5-fold increased the risk of wound complications versus calcineurin inhibitors (Hahn et al., Cochrane Database, 2019).</p>\\n<p>Why the others are incorrect:</p>\\n<ul>\\n<li><strong>a. Perioperative bleeding</strong> --- not a characteristic sirolimus effect (thrombocytopenia can occur but is not the dominant surgical risk here).</li>\\n\\n<li><strong>c. Deep vein thrombosis</strong> --- not a signature mTOR inhibitor complication.</li>\\n\\n<li><strong>d. Postoperative diabetes</strong> --- new-onset diabetes after transplant is more classically associated with calcineurin inhibitors (tacrolimus) and corticosteroids, not sirolimus.</li>\\n</ul>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"86\",\"stem\":\"Postoperative adjuvant chemotherapy is associated with multiple adverse effects. Which one of this adverse effect is related to this specific treatment?\",\"options\":[{\"letter\":\"A\",\"text\":\"Transverse myelitis\"},{\"letter\":\"B\",\"text\":\"Meningitis\"},{\"letter\":\"C\",\"text\":\"Bone marrow suppression\"},{\"letter\":\"D\",\"text\":\"Diverticulitis\"}],\"correct\":\"C\",\"explanation\":\"<p>--- agrees with the original key.</p>\\n<p>Myelosuppression is the classic dose-limiting toxicity of most cytotoxic chemotherapeutic agents, reflecting their action on rapidly dividing cells including hematopoietic precursors, and manifests as neutropenia, anemia, and thrombocytopenia.</p>\\n<p>Why the others are incorrect:</p>\\n<ul>\\n<li><strong>a. Transverse myelitis</strong> --- not a characteristic systemic chemotherapy toxicity (a rare consideration only with certain intrathecal agents).</li>\\n\\n<li><strong>b. Meningitis</strong> --- not a direct chemotherapy adverse effect (infection can complicate neutropenia, but it is not the specific treatment-related toxicity).</li>\\n\\n<li><strong>d. Diverticulitis</strong> --- unrelated to chemotherapy toxicity mechanisms.</li>\\n</ul>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"87\",\"stem\":\"What cell component does radiotherapy target?\",\"options\":[{\"letter\":\"A\",\"text\":\"Mitochondria\"},{\"letter\":\"B\",\"text\":\"Nucleus\"},{\"letter\":\"C\",\"text\":\"Nucleolus\"},{\"letter\":\"D\",\"text\":\"Cell membrane\"}],\"correct\":\"B\",\"explanation\":\"<p>--- agrees with the original key.</p>\\n<p>Nuclear DNA is the principal target of ionizing radiation. Radiation damages DNA both directly (charged particles ionizing DNA) and indirectly (reactive oxygen species from radiolysis of water), producing base damage, single-strand breaks, and --- most lethally --- double-strand breaks. Unrepaired double-strand breaks drive cell death via mitotic catastrophe, apoptosis, or senescence (Price et al., Nature Reviews Clinical Oncology, 2023; Frey et al., Strahlentherapie und Onkologie, 2023).</p>\\n<p>Why the others are incorrect:</p>\\n<ul>\\n<li><strong>a. Mitochondria</strong> --- mitochondrial DNA can be a secondary target, but the nucleus/genomic DNA is the principal one.</li>\\n\\n<li><strong>c. Nucleolus</strong> --- a subnuclear structure for ribosome assembly; not the specific radiation target.</li>\\n\\n<li><strong>d. Cell membrane</strong> --- can sustain ROS-mediated damage, but is not the primary lethal target.</li>\\n</ul>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"88\",\"stem\":\"Which of the following statements about the Canadian Malnutrition Task Force study is FALSE?\",\"options\":[{\"letter\":\"A\",\"text\":\"Patients who were malnourished on admission, who improved their intake had a shorter length of stay than their counterparts who did not improve.\"},{\"letter\":\"B\",\"text\":\"Patients that were well nourished on admission but had poor food intake during admission had longer lengths of stay than well nourished, stable patients.\"},{\"letter\":\"C\",\"text\":\"Based on the subjective global assessment (SGA) 45% of adults were identified to be malnourished upon admission to hospital.\"},{\"letter\":\"D\",\"text\":\"The study showed that malnutrition in hospital is not common.\"},{\"letter\":\"E\",\"text\":\"The study was designed to look at the prevalence of malnutrition in patients admitted and discharged from the hospital -- and how this affected health outcomes.\"}],\"correct\":\"D\",\"explanation\":\"<p>--- agrees with the original key.</p>\\n<p>Hospital malnutrition is <em>common</em>, not rare --- roughly 45% of adults were identified as malnourished on admission by subjective global assessment, so statement D is the false one. This prevalence is consistent with the broader malnutrition literature, where cancer-related and hospital malnutrition affects a large minority to nearly half of patients and independently worsens outcomes (Cederholm and Bosaeus, New England Journal of Medicine, 2024).</p>\\n<p>Why the others are true statements:</p>\\n<ul>\\n<li><strong>a. True</strong> --- improved intake in malnourished patients was associated with shorter length of stay.</li>\\n\\n<li><strong>b. True</strong> --- well-nourished patients with poor in-hospital intake had longer stays than stable well-nourished patients.</li>\\n\\n<li><strong>c. True</strong> --- ~45% malnourished on admission by SGA.</li>\\n\\n<li><strong>e. True</strong> --- accurately describes the study&#x27;s design and aims.</li>\\n</ul>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"89\",\"stem\":\"How much protein per day is routinely recommended for most post-op surgical patients?\",\"options\":[{\"letter\":\"A\",\"text\":\"0.86 g / kg\"},{\"letter\":\"B\",\"text\":\"3.0 g / kg\"},{\"letter\":\"C\",\"text\":\"1.2-1.5 g / kg\"},{\"letter\":\"D\",\"text\":\"There is no specific protein amount recommended post-op\"},{\"letter\":\"E\",\"text\":\"0.7 g / kg for women and 1.0 g / kg for men\"}],\"correct\":\"C\",\"explanation\":\"<p>--- agrees with the original key.</p>\\n<p>Current consensus recommends 1.2--1.5 g of protein per kilogram per day for acutely ill or well-nourished post-surgical patients, rising to 1.5--2.0 g/kg/day (or higher) in burns and major trauma, versus 0.8--1.2 g/kg/day in healthy adults (Cederholm and Bosaeus, New England Journal of Medicine, 2024). ESPEN surgical/cancer guidance similarly recommends at least 1.0 g/kg, increasing toward 1.5 g/kg in sarcopenia, advanced age, or malnutrition.</p>\\n<p>Why the others are incorrect:</p>\\n<ul>\\n<li><strong>a. 0.86 g/kg</strong> and <strong>e. 0.7--1.0 g/kg</strong> --- approximate the baseline requirement for healthy, non-stressed adults; too low for the postoperative catabolic state.</li>\\n\\n<li><strong>b. 3.0 g/kg</strong> --- exceeds recommended intake and is not supported (even burn/trauma targets are generally \\u22642.0 g/kg).</li>\\n\\n<li><strong>d. Incorrect</strong> --- specific targets are well described.</li>\\n</ul>\\n<p>Caveat: targets are lower in patients with hepatic or renal insufficiency and impaired protein utilization (eGFR &lt;30--40 mL/min/1.73 m\\u00b2) unless on dialysis (Cederholm and Bosaeus, New England Journal of Medicine, 2024).</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"90\",\"stem\":\"Which of the following conditions does NOT lead to an increase in protein requirements?\",\"options\":[{\"letter\":\"A\",\"text\":\"Stress\"},{\"letter\":\"B\",\"text\":\"Chronic Wound complication\"},{\"letter\":\"C\",\"text\":\"Obesity\"},{\"letter\":\"D\",\"text\":\"Fistula\"},{\"letter\":\"E\",\"text\":\"Burns\"}],\"correct\":\"C\",\"explanation\":\"<p>--- agrees with the original key.</p>\\n<p>Obesity per se does not raise protein requirements the way catabolic/hypermetabolic states do. Metabolic stress, chronic wounds, enterocutaneous fistulae (protein-rich losses), and burns all increase protein requirements substantially --- burns and major trauma drive requirements to 1.5--2.0 g/kg/day or higher (Cederholm and Bosaeus, New England Journal of Medicine, 2024). (In practice, protein dosing in obese critically ill patients is calculated against adjusted or ideal body weight rather than being intrinsically increased by adiposity.)</p>\\n<p>Why the others are incorrect (they DO increase protein requirements):</p>\\n<ul>\\n<li><strong>a. Stress</strong> --- hypermetabolism and accelerated proteolysis.</li>\\n\\n<li><strong>b. Chronic wound complication</strong> --- ongoing tissue repair and protein loss.</li>\\n\\n<li><strong>d. Fistula</strong> --- direct protein/nitrogen losses through effluent.</li>\\n\\n<li><strong>e. Burns</strong> --- the archetypal hypercatabolic state, with the highest protein targets.</li>\\n</ul>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"91\",\"stem\":\"Which one of these oncogenes is a proto-oncogene that supports tumor growth by gene amplification?\",\"options\":[{\"letter\":\"A\",\"text\":\"BRCA1\"},{\"letter\":\"B\",\"text\":\"Ras (via gene mutation)\"},{\"letter\":\"C\",\"text\":\"HER2/neu\"},{\"letter\":\"D\",\"text\":\"p53\"}],\"correct\":\"C\",\"explanation\":\"<p>Agrees with the original key.</p>\\n<p><strong>Why C is correct:</strong> HER2/neu (ERBB2) is the classic example of a proto-oncogene activated by <em>gene amplification</em> --- multiple copies of the gene drive overexpression of the HER2 receptor tyrosine kinase, promoting proliferation. This mechanism is exploited clinically (HER2 amplification testing in breast and gastric cancer, targeted therapy with trastuzumab).</p>\\n<p><strong>Why the others are incorrect:</strong></p>\\n<ul>\\n<li><strong>A. BRCA1</strong> --- a <em>tumor suppressor</em> gene, not a proto-oncogene; it is inactivated (loss of function), not amplified, in carcinogenesis.</li>\\n\\n<li><strong>B. Ras (via gene mutation)</strong> --- Ras is indeed a proto-oncogene, but it is activated by <em>point mutation</em>, not gene amplification. The stem specifically asks about amplification, so this is the intended distractor.</li>\\n\\n<li><strong>D. p53</strong> --- the prototypical <em>tumor suppressor</em> gene (guardian of the genome), inactivated by mutation/deletion, not an amplified oncogene.</li>\\n</ul>\\n<p><strong>Background:</strong> Proto-oncogenes are activated to oncogenes by three broad mechanisms --- point mutation (e.g., Ras), gene amplification (e.g., HER2/neu, N-myc), and chromosomal translocation (e.g., BCR-ABL). Distinguishing the activating mechanism is the point of this item.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"92\",\"stem\":\"Which one of these oncology statements is false?\",\"options\":[{\"letter\":\"A\",\"text\":\"Barrett's esophagus is an example of metaplasia\"},{\"letter\":\"B\",\"text\":\"In situ cancer means that it does not cross the basal membrane\"},{\"letter\":\"C\",\"text\":\"Benign tumors are often associated with cell anaplasia\"},{\"letter\":\"D\",\"text\":\"Hyperplasia happens when there is a multiplication of benign cells\"}],\"correct\":\"C\",\"explanation\":\"<p>Agrees with the original key.</p>\\n<p><strong>Why C is the false (and therefore correct) answer:</strong> Anaplasia --- loss of cellular differentiation with marked nuclear pleomorphism, high nuclear-to-cytoplasmic ratio, and disordered architecture --- is a hallmark of <em>malignancy</em>, not benign tumors. Benign tumors are, by definition, well-differentiated. Stating that benign tumors are &quot;often associated with anaplasia&quot; is therefore false.</p>\\n<p><strong>Why the other statements are true:</strong></p>\\n<ul>\\n<li><strong>A.</strong> Barrett&#x27;s esophagus (replacement of squamous with columnar/intestinal-type epithelium) is the textbook example of <em>metaplasia</em>.</li>\\n\\n<li><strong>B.</strong> Carcinoma in situ is defined by malignant cells that have <strong>not</strong> breached the basement membrane; invasion across the basement membrane defines invasive carcinoma.</li>\\n\\n<li><strong>D.</strong> Hyperplasia is an increase in the number of (normal, benign) cells within a tissue.</li>\\n</ul>\\n<p><strong>Background:</strong> The differentiation hierarchy --- metaplasia \\u2192 dysplasia \\u2192 carcinoma in situ \\u2192 invasive carcinoma --- is a recurring exam theme. Anaplasia sits at the malignant, undifferentiated end of the spectrum.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"93\",\"stem\":\"A 45 yo woman presents with a 1 cm chronic ulceration of the skin over a burn scar on the forearm. The lesion is there for 6 months and is not painful. She was burned 15 years ago and no skin graft was needed. Which of the following is the most likely diagnosis?\",\"options\":[{\"letter\":\"A\",\"text\":\"Squamous cell carcinoma\"},{\"letter\":\"B\",\"text\":\"Malignant fibrous histiocytoma\"},{\"letter\":\"C\",\"text\":\"Chronic infection\"},{\"letter\":\"D\",\"text\":\"Heterotopic ossification\"}],\"correct\":\"A\",\"explanation\":\"<p>Agrees with the original key.</p>\\n<p><strong>Why A is correct:</strong> A chronic, non-healing ulcer arising in an old burn scar is the classic presentation of a <strong>Marjolin ulcer</strong> --- an aggressive squamous cell carcinoma that develops in chronically inflamed or scarred tissue (burn scars, chronic wounds, sinus tracts) after a long latency (typically years to decades). The 15-year interval, the location in a burn scar, and the chronic non-healing ulceration are all characteristic.</p>\\n<p><strong>Why the others are incorrect:</strong></p>\\n<ul>\\n<li><strong>B. Malignant fibrous histiocytoma</strong> (undifferentiated pleomorphic sarcoma) is a deep soft-tissue sarcoma, not a superficial chronic skin ulcer over a scar.</li>\\n\\n<li><strong>C. Chronic infection</strong> could cause a non-healing wound but does not fit the classic long-latency scar-associated malignant transformation, and any chronic ulcer in a burn scar must be biopsied to exclude carcinoma.</li>\\n\\n<li><strong>D. Heterotopic ossification</strong> is abnormal bone formation in soft tissue (e.g., after trauma or burns), presenting as a firm mass, not a cutaneous ulcer.</li>\\n</ul>\\n<p><strong>Background:</strong> Any chronic wound or burn-scar ulcer that fails to heal warrants biopsy to exclude a Marjolin ulcer. These SCCs tend to be more aggressive with higher metastatic potential than sun-exposed cutaneous SCC.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"94\",\"stem\":\"Which of the following is the most important cytokine in the Inflammatory Bowel Disease pathway?\",\"options\":[{\"letter\":\"A\",\"text\":\"TNF-\\u03b1\"},{\"letter\":\"B\",\"text\":\"IL-6\"},{\"letter\":\"C\",\"text\":\"IL-12\"},{\"letter\":\"D\",\"text\":\"IL-23\"}],\"correct\":\"A\",\"explanation\":\"<p>Agrees with the original key.</p>\\n<p><strong>Why A is correct:</strong> TNF-\\u03b1 is the central pro-inflammatory cytokine in IBD (both Crohn&#x27;s disease and ulcerative colitis) and the validated therapeutic target --- anti-TNF agents (infliximab, adalimumab) are cornerstone biologics. On a single-best-answer basis, TNF-\\u03b1 is the expected answer.</p>\\n<p><strong>Why the others are less correct:</strong></p>\\n<ul>\\n<li><strong>B. IL-6</strong> contributes to mucosal inflammation but is not the dominant IBD target.</li>\\n\\n<li><strong>C. IL-12 and D. IL-23</strong> are genuinely important in IBD pathogenesis (the IL-12/23 axis is targeted by ustekinumab, and IL-23 by risankizumab). This makes the item somewhat dated --- modern IBD therapeutics increasingly target IL-23 --- but TNF-\\u03b1 remains the historically &quot;most important&quot; single cytokine the question is seeking.</li>\\n</ul>\\n<p><strong>Background:</strong> The expanding biologic armamentarium (anti-TNF, anti-integrin [vedolizumab], anti-IL-12/23, anti-IL-23, JAK inhibitors) reflects multiple relevant pathways; the exam answer keys to the anti-TNF paradigm.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"95\",\"stem\":\"Which of the following patient will require prophylactic antibiotics prior to the specified procedure?\",\"options\":[{\"letter\":\"A\",\"text\":\"A 65 yo man undergoing a cholecystectomy\"},{\"letter\":\"B\",\"text\":\"A 25 yo woman undergoing an emergency caesarian section\"},{\"letter\":\"C\",\"text\":\"A 35 yo woman undergoing a splenectomy for ITP\"},{\"letter\":\"D\",\"text\":\"A 60 yo man undergoing a colonoscopy\"}],\"correct\":\"B\",\"explanation\":\"<p>Agrees with the original key.</p>\\n<p><strong>Why B is correct:</strong> Cesarean delivery is the single most important risk factor for postpartum infection, with markedly higher surgical-site infection and endometritis rates than most other clean-contaminated procedures. Professional guidance (ACOG) recommends antibiotic prophylaxis (cefazolin, ideally within 60 minutes before incision) for <strong>all</strong> cesarean deliveries --- emergent or elective --- unless the patient is already on an equivalent broad-spectrum regimen. A Cochrane review of &gt;15,000 women confirmed significant reductions in febrile morbidity, wound complications, and endometritis.</p>\\n<p><strong>Why the others are weaker choices as worded:</strong></p>\\n<ul>\\n<li><strong>A. Elective cholecystectomy</strong> in a low-risk patient --- routine antibiotic prophylaxis is <em>not</em> required for low-risk laparoscopic cholecystectomy, though it is used for higher-risk (acute cholecystitis, older/diabetic, converted) cases.</li>\\n\\n<li><strong>C. Splenectomy for ITP</strong> --- the critical infection issue is <em>post-splenectomy</em> vaccination against encapsulated organisms and, in some patients, long-term penicillin prophylaxis; a single pre-incision surgical prophylactic dose is not the defining answer this item seeks.</li>\\n\\n<li><strong>D. Colonoscopy</strong> --- routine diagnostic/screening colonoscopy does not require antibiotic prophylaxis.</li>\\n</ul>\\n<p><strong>Background:</strong> Cefazolin is the standard cesarean prophylactic agent; adjunctive azithromycin is beneficial in unscheduled/higher-risk cesareans, and a 3-g cefazolin dose is recommended for patients \\u2265120 kg. All cesareans qualify regardless of urgency.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"96\",\"stem\":\"A patient is undergoing preoperative evaluation. During the anesthetic assessment he is asked to open the mouth in order to evaluate his risk for intubation. You can see the soft palate, fauces and the base of the uvula. According to the Mallampati Classification, which of the following is correct?\",\"options\":[{\"letter\":\"A\",\"text\":\"Class I\"},{\"letter\":\"B\",\"text\":\"Class II\"},{\"letter\":\"C\",\"text\":\"Class III\"},{\"letter\":\"D\",\"text\":\"Class IV\"}],\"correct\":\"C\",\"explanation\":\"<p>Agrees with the original key.</p>\\n<p><strong>Why C is correct:</strong> In the modified Mallampati classification, <strong>Class III</strong> is defined as visibility of the <em>soft palate and the base of the uvula only</em>. The stem&#x27;s key discriminator --- visualization of the <strong>base of the uvula</strong> (rather than the whole uvula) --- places this at Class III.</p>\\n<p><strong>Why the others are incorrect:</strong></p>\\n<ul>\\n<li><strong>A. Class I</strong> --- soft palate, fauces, uvula, <em>and</em> pillars all visible.</li>\\n\\n<li><strong>B. Class II</strong> --- soft palate, fauce
