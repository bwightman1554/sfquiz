s, and (whole) uvula visible; pillars masked.</li>\\n\\n<li><strong>D. Class IV</strong> --- only the hard palate visible; soft palate not seen at all.</li>\\n</ul>\\n<p><strong>Note on wording:</strong> The stem&#x27;s inclusion of &quot;fauces&quot; is slightly inconsistent with the strict Class III definition (fauces/pillars are typically obscured by Class III). The intended discriminator is &quot;base of the uvula,&quot; which is specific to Class III, so C stands. Classes III--IV predict difficult laryngoscopy.</p>\\n<p><strong>Background:</strong> The modified (Samsoon and Young) 4-class system is performed with the patient seated, head neutral, mouth maximally open, tongue protruded, without phonation. It is one component of a multi-part difficult-airway assessment (with interincisor gap, thyromental distance, etc.).</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"97\",\"stem\":\"A 65 yo man presents with a symptomatic inguinal hernia. Physical examination reveals a small reducible mass in the left groin. He had a balloon angioplasty and drug-eluted stent implantation (DES) 6 weeks ago. Which of the following is the best recommendation for the timing of surgery after stent implantation?\",\"options\":[{\"letter\":\"A\",\"text\":\"14 days\"},{\"letter\":\"B\",\"text\":\"3 months\"},{\"letter\":\"C\",\"text\":\"6 months\"},{\"letter\":\"D\",\"text\":\"12 months\"}],\"correct\":\"D\",\"explanation\":\"<p><strong>Assessment:</strong> At the time this exam was written (referencing Sabiston, ~2017), the standard teaching was to delay elective noncardiac surgery <strong>12 months</strong> after DES implantation, and answer D was correct against that source. Contemporary guidance has changed:</p>\\n<ul>\\n<li>The <strong>2024 AHA/ACC perioperative guideline</strong> now stratifies by the <em>indication</em> for the stent. For a DES placed for <strong>chronic coronary disease</strong>, it is reasonable to delay elective noncardiac surgery <strong>\\u22656 months</strong> (Class 2a). Delay of <strong>\\u226512 months</strong> is a Class 1 recommendation specifically when the DES was placed for <strong>acute coronary syndrome</strong>. Time-sensitive surgery may proceed \\u22653 months after PCI if the risk of delay outweighs the thrombotic risk.</li>\\n\\n<li>Surgery at 6 weeks (the patient&#x27;s current status) falls within the highest-risk window for stent thrombosis and elective surgery should not proceed now regardless of framework.</li>\\n</ul>\\n<p><strong>How to answer as written:</strong> If the exam intends the legacy single threshold, <strong>D (12 months)</strong> matches the keyed source. Under current guidelines, the most defensible answer for an elective/semi-elective hernia repair after a DES placed for stable disease would be <strong>C (6 months)</strong>. Because the stem does not specify the stent indication and reflects older teaching, the disagreement is flagged rather than a hard correction --- the safest test-taking answer to the legacy key remains D, but the current standard of care is 6 months for stable-CAD DES.</p>\\n<p><strong>Background:</strong> The DAPT-duration/perioperative-timing decision should be made by a multidisciplinary team weighing stent thrombosis risk against bleeding and the consequences of delay. Aspirin is generally continued perioperatively whenever feasible.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"98\",\"stem\":\"A 46 yo woman is planned for a laparoscopic cholecystectomy. She has asthma, well controlled with occasional salbutamol. Which of the following corresponds to her ASA score?\",\"options\":[{\"letter\":\"A\",\"text\":\"I\"},{\"letter\":\"B\",\"text\":\"II\"},{\"letter\":\"C\",\"text\":\"III\"},{\"letter\":\"D\",\"text\":\"IV\"}],\"correct\":\"B\",\"explanation\":\"<p>Agrees with the original key.</p>\\n<p><strong>Why B is correct:</strong> ASA II is a patient with <strong>mild systemic disease</strong> that is well controlled and without substantive functional limitation. Mild, well-controlled asthma requiring only occasional short-acting bronchodilator is the textbook example of an ASA II condition (comparable to well-controlled hypertension or a current smoker).</p>\\n<p><strong>Why the others are incorrect:</strong></p>\\n<ul>\\n<li><strong>A. ASA I</strong> --- a normal healthy patient with <em>no</em> systemic disease. Her asthma, though mild, is a systemic disease.</li>\\n\\n<li><strong>C. ASA III</strong> --- <em>severe</em> systemic disease with substantive functional limitation (e.g., poorly controlled asthma with frequent exacerbations, COPD, or a recent [&lt;3 months] MI/stroke).</li>\\n\\n<li><strong>D. ASA IV</strong> --- severe systemic disease that is a <em>constant threat to life</em> (e.g., recent MI with ongoing ischemia, sepsis, severe symptomatic heart failure).</li>\\n</ul>\\n<p><strong>Background:</strong> The ASA Physical Status system (I--VI) grades preoperative comorbidity burden; &quot;E&quot; is appended for emergencies. Well-controlled, low-severity chronic disease = ASA II.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"99\",\"stem\":\"You are using Monocryl stitches for skin closure after a laparoscopic surgery. Which of the following describes the raw material of that kind of suture?\",\"options\":[{\"letter\":\"A\",\"text\":\"Polyester polymer\"},{\"letter\":\"B\",\"text\":\"Glycolide and L-lactide coated with copolymer of lactide and calcium stearate\"},{\"letter\":\"C\",\"text\":\"Copolymer of lactide and epsilon-caprolactone\"},{\"letter\":\"D\",\"text\":\"Collagen derived from healthy cattle and sheep\"}],\"correct\":\"C\",\"explanation\":\"<p>Agrees with the original key, with a factual-precision caveat.</p>\\n<p><strong>Why C is correct (by elimination and intent):</strong> Monocryl is the trade name for <strong>poliglecaprone 25</strong>, an absorbable synthetic monofilament made from a copolymer of <strong>glycolide and epsilon-caprolactone</strong>. Among the four choices, only C names epsilon-caprolactone, which is the distinguishing component, so C is the intended and correct answer.</p>\\n<p><strong>Caveat / precision note:</strong> As written, option C says &quot;lactide and epsilon-caprolactone.&quot; Strictly, poliglecaprone 25 is a copolymer of <strong>glycolide</strong> (not lactide) and epsilon-caprolactone. The choice is therefore chemically imprecise, but it remains the only option identifying caprolactone and is unambiguously the answer relative to the distractors.</p>\\n<p><strong>Why the others are incorrect:</strong></p>\\n<ul>\\n<li><strong>A. Polyester polymer</strong> describes non-absorbable braided polyester (e.g., Ethibond).</li>\\n\\n<li><strong>B. Glycolide and L-lactide coated with a copolymer of lactide and calcium stearate</strong> describes <strong>polyglactin 910 (Vicryl)</strong> --- a braided absorbable suture, not Monocryl.</li>\\n\\n<li><strong>D. Collagen derived from cattle/sheep</strong> describes <strong>surgical gut (catgut)</strong>, a natural absorbable suture.</li>\\n</ul>\\n<p><strong>Background:</strong> Monocryl is a monofilament (low tissue drag, good for subcuticular skin closure), retaining ~20--30% tensile strength at 2 weeks and fully absorbed by hydrolysis in ~91--119 days. Vicryl is braided glycolide/L-lactide; PDS (polydioxanone) is a longer-lasting monofilament.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"100\",\"stem\":\"In biostatistics, what does the median indicate?\",\"options\":[{\"letter\":\"A\",\"text\":\"The average value\"},{\"letter\":\"B\",\"text\":\"The number present the most times in a sample\"},{\"letter\":\"C\",\"text\":\"The smallest and the largest value\"},{\"letter\":\"D\",\"text\":\"The middle value, where 50% of the numbers are higher and 50% are lower\"}],\"correct\":\"D\",\"explanation\":\"<p>Agrees with the original key.</p>\\n<p><strong>Why D is correct:</strong> The median is the 50th percentile --- the central value of an ordered dataset (or the mean of the two central values when n is even). It is the measure of central tendency most robust to skew and outliers.</p>\\n<p><strong>Why the others are incorrect:</strong></p>\\n<ul>\\n<li><strong>A. The average value</strong> describes the <strong>mean</strong>.</li>\\n\\n<li><strong>B. The number present most often</strong> describes the <strong>mode</strong>.</li>\\n\\n<li><strong>C. The smallest and largest value</strong> describes the <strong>range</strong> (a measure of spread, not central tendency).</li>\\n</ul>\\n<p><strong>Background:</strong> For skewed data (e.g., length of stay, cost), the median is preferred over the mean because it is not distorted by extreme values --- the same concept underlying the earlier ICU length-of-stay item in this exam.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"101\",\"stem\":\"What type of study design would be best for minimizing the effect of confounding variables?\",\"options\":[{\"letter\":\"A\",\"text\":\"Randomized Controlled Trial\"},{\"letter\":\"B\",\"text\":\"Case Control Study\"},{\"letter\":\"C\",\"text\":\"Cohort Study\"},{\"letter\":\"D\",\"text\":\"Cross-Sectional Study\"}],\"correct\":\"A\",\"explanation\":\"<p>Agrees with the exam key.</p>\\n<p>Randomization is the only design feature that distributes <em>both</em> known and unknown confounders evenly (on average) between groups. Observational designs can only adjust for confounders that are measured and anticipated; randomization additionally balances the confounders no one thought to measure.</p>\\n<p>Why the others are incorrect:</p>\\n<ul>\\n<li><strong>b. Case-control</strong> --- susceptible to confounding as well as recall and selection bias; adjustment is limited to measured variables.</li>\\n\\n<li><strong>c. Cohort</strong> --- controls only for measured confounders (via matching/multivariable adjustment); residual and unmeasured confounding persist.</li>\\n\\n<li><strong>d. Cross-sectional</strong> --- captures a single time point, cannot establish temporality, and does not control confounding.</li>\\n</ul>\\n<p>Background: This is why the RCT sits at the top of the evidence hierarchy for questions of therapy. Its main threat is not confounding but generalizability (efficacy vs. effectiveness --- see Q102).</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"102\",\"stem\":\"When referring to efficacy and effectiveness, which of the following is true?\",\"options\":[{\"letter\":\"A\",\"text\":\"Efficacy refers to real life outcomes\"},{\"letter\":\"B\",\"text\":\"Effectiveness is determined using RCT's with stringent inclusion criteria\"},{\"letter\":\"C\",\"text\":\"Efficacy refers to the extent to which a treatment intervention achieves its purported benefit\"},{\"letter\":\"D\",\"text\":\"Effectiveness studies include a small number of participants\"}],\"correct\":\"C\",\"explanation\":\"<p>Agrees with the exam key.</p>\\n<p><strong>Efficacy</strong> = does the intervention work under <em>ideal, controlled</em> conditions (explanatory RCT with strict inclusion criteria)? <strong>Effectiveness</strong> = does it work in <em>real-world</em> practice with heterogeneous patients (pragmatic trials, large observational cohorts)?</p>\\n<p>Why the others are incorrect:</p>\\n<ul>\\n<li><strong>a.</strong> Reverses the definitions --- real-life outcomes describe <em>effectiveness</em>.</li>\\n\\n<li><strong>b.</strong> Stringent inclusion criteria characterize <em>efficacy</em> (explanatory) trials, not effectiveness studies.</li>\\n\\n<li><strong>d.</strong> Effectiveness/pragmatic studies typically enroll <em>large</em>, broadly representative populations.</li>\\n</ul>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"103\",\"stem\":\"You are on call at the surgical ICU and asked to evaluate an 82-year old patient who underwent an aortic valve replacement three hours ago. The patient is intubated and ventilated under sedation. The nurse tells you that the patient blood pressure does not respond to vasopressors. You examine the patient: warm skin, BP = 80/40 (levophed 25 \\u00b5g/kg/min or 100 mL/hr), HR = 110, CVP 8, diuresis 100 mL/hour and chest tube output 50 mL/hr. You perform a targeted subcostal FAST exam and do not find clots or a pericardial effusion. You order volume repletion and give 1.5 L of crystalloids in the next hour. The patient does not respond and the blood pressure continues to drop. What complication could happen to this patient?\",\"options\":[{\"letter\":\"A\",\"text\":\"Cardiac tamponade\"},{\"letter\":\"B\",\"text\":\"Right ventricular dysfunction\"},{\"letter\":\"C\",\"text\":\"Hypovolemic shock\"},{\"letter\":\"D\",\"text\":\"Adrenal insufficiency\"}],\"correct\":\"D\",\"explanation\":\"<p>Agrees with the exam key.</p>\\n<p>The physiology is distributive/vasoplegic: <strong>warm</strong> skin, adequate filling (CVP 8), preserved urine output and low chest-tube output, yet hypotension refractory to a high-dose vasopressor <em>and</em> to a 1.5 L fluid challenge. Adrenal (cortisol) insufficiency classically produces shock that resists both fluids and catecholamines but reverses with corticosteroids. Relative adrenal insufficiency is common after cardiopulmonary bypass and independently predicts persistent postoperative hemodynamic instability.</p>\\n<p>Why the others are incorrect:</p>\\n<ul>\\n<li><strong>a. Cardiac tamponade</strong> --- actively excluded by the negative subcostal FAST (no effusion/clot) and does not fit warm, vasodilated shock with a normal CVP.</li>\\n\\n<li><strong>b. Right ventricular dysfunction</strong> --- would typically raise CVP and produce a congested, not warm/vasodilated, picture; not the best fit for fluid- and pressor-refractory vasoplegia.</li>\\n\\n<li><strong>c. Hypovolemic shock</strong> --- refuted by adequate CVP, good urine output, low chest-tube output, and failure to respond to volume.</li>\\n</ul>\\n<p>Background and caveat: The unifying diagnosis for catecholamine-resistant vasodilatory shock after cardiac surgery is <strong>vasoplegic syndrome</strong> (low SVR, preserved/high cardiac output, incidence up to ~40%). Adrenal insufficiency is one contributor within that syndrome and the only listed option that explains refractoriness to both fluids and pressors. Management escalates norepinephrine \\u2192 vasopressin \\u2192 angiotensin II, with hydrocortisone, methylene blue, or hydroxocobalamin as adjuncts in refractory cases --- an ACTH-stimulation test and empiric stress-dose steroids are reasonable here.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"104\",\"stem\":\"Cardiac output can be improved by which of these conditions/treatments?\",\"options\":[{\"letter\":\"A\",\"text\":\"Beta-blockers\"},{\"letter\":\"B\",\"text\":\"Diuretics\"},{\"letter\":\"C\",\"text\":\"Inotropic drugs\"},{\"letter\":\"D\",\"text\":\"Postoperative atrial fibrillation\"},{\"letter\":\"E\",\"text\":\"Temporary ventricular pacing\"}],\"correct\":\"C\",\"explanation\":\"<p>Agrees with the exam key.</p>\\n<p>Cardiac output = stroke volume \\u00d7 heart rate. Inotropes (e.g., dobutamine, epinephrine, milrinone) augment contractility and therefore stroke volume and CO.</p>\\n<p>Why the others are incorrect:</p>\\n<ul>\\n<li><strong>a. Beta-blockers</strong> --- negatively inotropic and chronotropic; lower CO.</li>\\n\\n<li><strong>b. Diuretics</strong> --- reduce preload; primarily used to relieve congestion, not to raise CO (and can lower it if preload falls excessively).</li>\\n\\n<li><strong>d. Postoperative atrial fibrillation</strong> --- loss of the atrial &quot;kick&quot; (up to ~20--30% of ventricular filling) plus rapid rate reduces CO.</li>\\n\\n<li><strong>e. Temporary ventricular pacing</strong> --- RV-only pacing causes AV dyssynchrony and loss of atrial contribution; <strong>atrioventricular (sequential)</strong> pacing would help, but isolated ventricular pacing generally does not improve CO.</li>\\n</ul>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"105\",\"stem\":\"A 79-year old lady underwent a coronary artery bypass surgery six hours ago. She accidentally removes her endotracheal tube and complains of sternal pain. You ask the nurse to give her Hydromorphone 0.5 mg s/c. Later on, the nurse comes to you because the patient is asleep and does not breathe while not stimulated. She shows you the patient's blood gas. Which result corresponds best to the patient's condition?\",\"options\":[{\"letter\":\"A\",\"text\":\"pH = 7.36, pCO2 = 41, HCO3- = 22, paO2 = 81\"},{\"letter\":\"B\",\"text\":\"pH = 7.48, pCO2 = 25, HCO3- = 30, paO2 = 100\"},{\"letter\":\"C\",\"text\":\"pH = 7.32, pCO2 = 25, HCO3- = 25, paO2 = 65\"},{\"letter\":\"D\",\"text\":\"pH = 7.21, pCO2 = 85, HCO3- = 24, paO2 = 60\"}],\"correct\":\"D\",\"explanation\":\"<p>Agrees with the exam key.</p>\\n<p>Opioid-induced hypoventilation causes <strong>acute respiratory acidosis</strong>: CO2 retention (pCO2 85) drives pH down (7.21) with a still-normal bicarbonate (24) because renal compensation has not had time to occur, plus hypoxemia (paO2 60).</p>\\n<p>Why the others are incorrect:</p>\\n<ul>\\n<li><strong>a.</strong> Entirely normal ABG --- inconsistent with apnea.</li>\\n\\n<li><strong>b.</strong> Respiratory alkalosis (low pCO2, high pH) --- the opposite of hypoventilation.</li>\\n\\n<li><strong>c.</strong> Low pCO2 with mild acidemia suggests a partly compensated metabolic acidosis, not CO2 retention from apnea.</li>\\n</ul>\\n<p>Background: Immediate management is stimulation/airway support, ventilation, and naloxone titrated to restore respiratory drive.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"106\",\"stem\":\"A 50 yo patient known for Child B cirrhosis had a blood work-up before a surgical procedure. Which of the following coagulation factors is less likely to be affected?\",\"options\":[{\"letter\":\"A\",\"text\":\"Factor V\"},{\"letter\":\"B\",\"text\":\"Factor VII\"},{\"letter\":\"C\",\"text\":\"Factor VIII\"},{\"letter\":\"D\",\"text\":\"Factor IX\"}],\"correct\":\"C\",\"explanation\":\"<p>Agrees with the exam key.</p>\\n<p>Nearly all clotting factors are synthesized by hepatocytes, so their levels fall in cirrhosis. <strong>Factor VIII is the exception</strong>: it is produced largely by hepatic sinusoidal endothelium and extrahepatic endothelial cells and circulates bound to von Willebrand factor, so it is typically <strong>normal or even elevated</strong> in liver disease (as an acute-phase reactant).</p>\\n<p>Why the others are incorrect:</p>\\n<ul>\\n<li><strong>a. Factor V</strong> --- hepatocyte-synthesized and vitamin K--<em>independent</em>; a sensitive marker of synthetic function that falls in cirrhosis.</li>\\n\\n<li><strong>b. Factor VII</strong> --- hepatocyte-synthesized, vitamin K--dependent, shortest half-life, so it drops early (drives early PT/INR prolongation).</li>\\n\\n<li><strong>d. Factor IX</strong> --- hepatocyte-synthesized, vitamin K--dependent; reduced in cirrhosis.</li>\\n</ul>\\n<p>Background: A preserved Factor VIII with reduced Factor V helps distinguish liver disease from disseminated intravascular coagulation, where Factor VIII also falls.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"107\",\"stem\":\"A 45 year-old patient had a Chest X-Ray in the emergency room during an initial evaluation after a car accident. Which of the following signs is suggestive of an aortic tear?\",\"options\":[{\"letter\":\"A\",\"text\":\"Elevation of the left main bronchus\"},{\"letter\":\"B\",\"text\":\"Nasogastric tube shift\"},{\"letter\":\"C\",\"text\":\"Right apical cap\"},{\"letter\":\"D\",\"text\":\"Pneumomediastinum\"}],\"correct\":\"B\",\"explanation\":\"<p>Agrees with the exam key.</p>\\n<p>A mediastinal hematoma from blunt aortic injury displaces adjacent structures. Recognized chest-X-ray signs include a <strong>widened mediastinum, obscured aortic knob, rightward deviation of the trachea or nasogastric (esophageal) tube, depression of the left mainstem bronchus, left apical cap, and left hemothorax</strong>. Rightward deviation of the NG tube is on that list.</p>\\n<p>Why the others are incorrect:</p>\\n<ul>\\n<li><strong>a.</strong> The described sign is <strong>depression</strong> of the <strong>left</strong> mainstem bronchus, not elevation --- as written this is incorrect.</li>\\n\\n<li><strong>c.</strong> The classic finding is a <strong>left</strong> (not right) apical cap.</li>\\n\\n<li><strong>d.</strong> Pneumomediastinum points to aerodigestive (tracheobronchial/esophageal) injury, not aortic transection.</li>\\n</ul>\\n<p>Background and important caveat: No CXR sign, alone or combined, is sensitive or specific enough to rule aortic injury in or out --- widened mediastinum, the most consistent single finding, appears in only ~28% of confirmed injuries. <strong>CT angiography is the diagnostic standard</strong> and must be obtained whenever mechanism or CXR raises suspicion, even with a normal film.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"108\",\"stem\":\"A 25 yo man is assessed for abdominal trauma following a ski accident in a snowpark. After resuscitation, he underwent a CT scan that demonstrates a linear section of the pancreatic isthmus with fluid surrounding the pancreas. The distal pancreas is oedematous and not enhanced. Vitals are stable. Which of the following is the best management?\",\"options\":[{\"letter\":\"A\",\"text\":\"Distal pancreatectomy\"},{\"letter\":\"B\",\"text\":\"Radiologic drainage\"},{\"letter\":\"C\",\"text\":\"Observation and serial imaging\"},{\"letter\":\"D\",\"text\":\"Pancreaticojejunostomy\"}],\"correct\":\"A\",\"explanation\":\"<p>Agrees with the exam key.</p>\\n<p>The CT shows a <strong>transection at the neck/isthmus with presumed main pancreatic duct disruption</strong> (linear cleft, peripancreatic fluid) and a <strong>devascularized distal segment</strong> (oedematous, non-enhancing). This is a high-grade injury (AAST grade III) with the transection at/left of the mesenteric vessels. The standard, definitive operation is <strong>distal pancreatectomy</strong> (with or without splenectomy), which removes the injured, non-viable distal gland and the ductal leak.</p>\\n<p>Why the others are incorrect:</p>\\n<ul>\\n<li><strong>b. Radiologic drainage</strong> --- treats collections/fistula but does not address a transected main duct or a devascularized segment; at best a temporizing adjunct.</li>\\n\\n<li><strong>c. Observation/serial imaging</strong> --- nonoperative management is reserved for low-grade injuries with intact duct continuity; a transected duct with dead distal parenchyma will not heal with observation.</li>\\n\\n<li><strong>d. Pancreaticojejunostomy</strong> --- reserved for selected proximal (head/neck) duct injuries where distal gland preservation is desired; it is more complex and unnecessary when the distal segment is already non-viable and can simply be resected.</li>\\n</ul>\\n<p>Background and nuance: Main pancreatic duct integrity is the key determinant of management. In highly selected, stable patients at high-volume centers, ERCP with transpapillary stenting can be attempted for main-duct injuries with preserved continuity --- but a frank transection with a non-enhancing distal remnant is a resection injury, so distal pancreatectomy is the best listed answer.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"109\",\"stem\":\"Each of the following is an indication for hemodialysis in the surgical patient EXCEPT:\",\"options\":[{\"letter\":\"A\",\"text\":\"serum K+ > 4.5 mEq/L\"},{\"letter\":\"B\",\"text\":\"acute fluid overload\"},{\"letter\":\"C\",\"text\":\"persistent metabolic acidosis\"},{\"letter\":\"D\",\"text\":\"hyperphosphatemia with hypercalcemia\"},{\"letter\":\"E\",\"text\":\"removal of toxins\"}],\"correct\":\"A\",\"explanation\":\"<p>Agrees with the exam key.</p>\\n<p>Urgent dialysis is indicated for the classic &quot;AEIOU&quot; problems: <strong>A</strong>cidosis (refractory metabolic acidosis), <strong>E</strong>lectrolytes (refractory/severe hyperkalemia), <strong>I</strong>ntoxications (dialyzable toxins), <strong>O</strong>verload (refractory pulmonary edema/fluid overload), and <strong>U</strong>remia (pericarditis, encephalopathy, bleeding). A potassium of &gt;4.5 mEq/L is within/near the normal range and is <strong>not</strong> an indication --- only <em>severe, refractory</em> hyperkalemia (with ECG changes) qualifies.</p>\\n<p>Why the others are correct indications (and thus not the &quot;EXCEPT&quot;):</p>\\n<ul>\\n<li><strong>b.</strong> Refractory fluid overload/pulmonary edema is a recognized urgent indication.</li>\\n\\n<li><strong>c.</strong> Severe, medically refractory metabolic acidosis is an accepted indication.</li>\\n\\n<li><strong>d.</strong> Severe phosphate/calcium derangements can require dialysis (the specific pairing is oddly worded, but it is not the intended &quot;except&quot;).</li>\\n\\n<li><strong>e.</strong> Removal of dialyzable toxins/intoxications is a classic indication even without AKI.</li>\\n</ul>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"110\",\"stem\":\"Each of the following is a potential cause of acute renal failure in the post-operative surgical patient EXCEPT:\",\"options\":[{\"letter\":\"A\",\"text\":\"excessive hemorrhage\"},{\"letter\":\"B\",\"text\":\"NSAIDs analgesia\"},{\"letter\":\"C\",\"text\":\"Hypervolemia\"},{\"letter\":\"D\",\"text\":\"Aminoglycosides\"},{\"letter\":\"E\",\"text\":\"Interstitial nephritis\"}],\"correct\":\"C\",\"explanation\":\"<p>Agrees with the exam key (with a nuance noted below).</p>\\n<p>In the classic surgical framework, postoperative AKI is driven by prerenal hypoperfusion and nephrotoxic/intrinsic insults, none of which is volume excess.</p>\\n<p>Why the others are recognized causes (and thus not the &quot;except&quot;):</p>\\n<ul>\\n<li><strong>a. Excessive hemorrhage</strong> --- prerenal azotemia/ischemic ATN from hypovolemia and hypotension.</li>\\n\\n<li><strong>b. NSAIDs</strong> --- impair prostaglandin-mediated afferent vasodilation, reducing GFR (and can cause interstitial nephritis).</li>\\n\\n<li><strong>d. Aminoglycosides</strong> --- direct nephrotoxic (proximal tubular) injury.</li>\\n\\n<li><strong>e. Interstitial nephritis</strong> --- an intrinsic renal cause (often drug-induced).</li>\\n</ul>\\n<p>Nuance / partial disagreement with the framing: The classic teaching that hypervolemia is <em>not</em> a cause is an oversimplification. Contemporary evidence shows that fluid overload / a positive perioperative balance can itself precipitate and worsen AKI through renal venous congestion, elevated renal subcapsular pressure, and interstitial edema (e.g., positive balance &gt;2 L after hepatectomy carried ~1.85\\u00d7 the AKI risk). By the letter of the exam&#x27;s intended framework, <strong>c remains the best answer</strong> among these choices, but &quot;hypervolemia never causes AKI&quot; should not be taken as absolute.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"111\",\"stem\":\"Based on the American Heart Association for cardiac risk stratification for non-cardiac surgery which of the following procedures would be deemed LOW risk (~ < 1%) for a peri-operative cardiac event?\",\"options\":[{\"letter\":\"A\",\"text\":\"Femoral-popliteal bypass surgery\"},{\"letter\":\"B\",\"text\":\"Open AAA repair\"},{\"letter\":\"C\",\"text\":\"Radical retropubic prostatectomy\"},{\"letter\":\"D\",\"text\":\"ORIF of hip in 82 year old male\"},{\"letter\":\"E\",\"text\":\"Ureteroscopy and lithotripsy of an obstructing ureteric stone\"}],\"correct\":\"E\",\"explanation\":\"<p>--- Agrees with the exam key.</p>\\n<p>Surgical risk is stratified by the procedure-specific incidence of major adverse cardiac events (MACE). Low-risk procedures carry a predicted MACE of less than 1% and, by expert consensus, include superficial, endoscopic, and minimally invasive operations. Ureteroscopy with lithotripsy is an endoscopic, minimally invasive genitourinary procedure with negligible fluid shifts and blood loss, placing it firmly in the low-risk (&lt;1%) category (Thompson et al., Journal of the American College of Cardiology, 2024; Smilowitz and Berger, JAMA, 2020).</p>\\n<ul>\\n<li><strong>a and b (incorrect):</strong> Vascular procedures --- including infrainguinal/femoral-popliteal bypass and especially open abdominal aortic aneurysm repair --- are among the highest-risk operations (suprainguinal vascular MACE ~7.7%). Open AAA repair carries substantially higher 30-day operative mortality than endovascular repair (4.3% vs 1.8%).</li>\\n\\n<li><strong>c (incorrect):</strong> Radical retropubic prostatectomy is a major intra-abdominal/pelvic procedure with meaningful blood loss and fluid shifts, classified as intermediate risk (\\u22651%).</li>\\n\\n<li><strong>d (incorrect):</strong> Hip ORIF in an 82-year-old is an orthopedic procedure of intermediate risk, further elevated by age &gt;75, which independently roughly doubles perioperative cardiac risk.</li>\\n</ul>\\n<p>Background: The 2024 AHA/ACC perioperative guideline defines low risk as combined surgical and patient characteristics predicting MACE &lt;1%, and elevated risk as \\u22651%. Vascular, thoracic, transplant, and neurosurgery carry the highest procedural risk; endocrine, breast, and superficial/endoscopic procedures the lowest.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"112\",\"stem\":\"It's late at night. You are called to the surgery yard to evaluate a 65-year old male who had a transurethral resection of the prostate four days ago. The patient is confused and does not open his eyes when you talk to him. His respiratory rate is 38, his heart rate is 115 beat/min., and is blood pressure 75/40 mm Hg. His rectal temperature is 39.5 C. You call the ICU senior resident and tell him that this patient needs to be transferred immediately. Which hemodynamic parameter explains this patient complication?\",\"options\":[{\"letter\":\"A\",\"text\":\"Elevated systemic vascular resistance\"},{\"letter\":\"B\",\"text\":\"Low cardiac output\"},{\"letter\":\"C\",\"text\":\"Higher mixed saturated venous saturation\"},{\"letter\":\"D\",\"text\":\"High paO2\"}],\"correct\":\"C\",\"explanation\":\"<p>--- Agrees with the exam key.</p>\\n<p>The clinical picture --- fever (39.5\\u00b0C), tachycardia, tachypnea, hypotension, and altered mentation four days after an instrumented genitourinary procedure --- is septic shock (a distributive shock). In sepsis, peripheral oxygen extraction is impaired by microcirculatory shunting and mitochondrial/cytopathic dysfunction, so blood returns to the venous side still highly saturated. Mixed venous (SvO\\u2082) and central venous (ScvO\\u2082) oxygen saturations are therefore characteristically normal or elevated despite inadequate tissue oxygenation, and markedly high values reflect the severity of microcirculatory derangement (De Backer et al., Critical Care, 2022; Teboul et al., Critical Care, 2011).</p>\\n<ul>\\n<li><strong>a (incorrect):</strong> Distributive/septic shock is defined by low systemic vascular resistance from inflammatory vasodilation, not elevated SVR (elevated SVR characterizes cardiogenic or hypovolemic shock).</li>\\n\\n<li><strong>b (incorrect):</strong> Septic shock typically produces a high or preserved cardiac output (&quot;warm shock&quot;); a low cardiac output is not the explanatory parameter, though a septic cardiomyopathy can be superimposed.</li>\\n\\n<li><strong>d (incorrect):</strong> Arterial pO\\u2082 is unrelated to the hemodynamic mechanism of shock here and is not characteristically high.</li>\\n</ul>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"113\",\"stem\":\"Mixed venous saturation (SVO2) is a function of:\",\"options\":[{\"letter\":\"A\",\"text\":\"Metabolic rate\"},{\"letter\":\"B\",\"text\":\"Cardiac output\"},{\"letter\":\"C\",\"text\":\"Hemoglobin level\"},{\"letter\":\"D\",\"text\":\"Arterial saturation\"},{\"letter\":\"E\",\"text\":\"All of the above\"}],\"correct\":\"E\",\"explanation\":\"<p>--- Agrees with the exam key.</p>\\n<p>SvO\\u2082 reflects the global balance between oxygen delivery and oxygen consumption. Oxygen delivery is the product of cardiac output, hemoglobin concentration, and arterial oxygen saturation; oxygen consumption is driven by metabolic rate. A change in any one of these four variables alters SvO\\u2082, so it is a function of all of them (De Backer et al., Critical Care, 2022).</p>\\n<ul>\\n<li><strong>a--d individually (incorrect as sole answer):</strong> Each is a genuine determinant, but none alone fully accounts for SvO\\u2082; selecting any single option ignores the others. This is why a low SvO\\u2082 can result from low cardiac output, anemia, arterial desaturation, or increased metabolic demand.</li>\\n</ul>\\n<p>Background: The Fick relationship gives SvO\\u2082 \\u2248 SaO\\u2082 \\u2212 VO\\u2082/(CO \\u00d7 Hb \\u00d7 1.34). This underlies why SvO\\u2082 falls with impaired delivery (as in cardiogenic/hypovolemic shock) but rises when extraction fails (as in sepsis, Question 112).</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"114\",\"stem\":\"Which of the following is NOT a finding in class IV shock?\",\"options\":[{\"letter\":\"A\",\"text\":\"confusion\"},{\"letter\":\"B\",\"text\":\"increased pulse pressure\"},{\"letter\":\"C\",\"text\":\"negligible urine output\"},{\"letter\":\"D\",\"text\":\"tachypnea\"}],\"correct\":\"B\",\"explanation\":\"<p>--- Agrees with the exam key.</p>\\n<p>In the ATLS hemorrhagic shock classification, pulse pressure narrows (decreases) beginning in class II shock and is markedly reduced by class IV, because rising catecholamine-driven systemic vascular resistance raises the diastolic pressure while systolic pressure falls. An increased (widened) pulse pressure is therefore not a feature of class IV shock (ATLS, American College of Surgeons).</p>\\n<ul>\\n<li><strong>a (incorrect as the &quot;NOT&quot; answer --- it IS a finding):</strong> Class IV shock (&gt;40% blood volume loss) produces depressed mental status ranging from confusion to lethargy.</li>\\n\\n<li><strong>c (incorrect as the &quot;NOT&quot; answer --- it IS a finding):</strong> Urine output is negligible/absent in class IV.</li>\\n\\n<li><strong>d (incorrect as the &quot;NOT&quot; answer --- it IS a finding):</strong> Respiratory rate is markedly elevated (&gt;35) in class IV.</li>\\n</ul>\\n<p>Background: Class IV is the extreme end --- HR &gt;140, marked hypotension, negligible urine output, and obtundation --- representing an immediately life-threatening loss of more than 40% of blood volume.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"115\",\"stem\":\"A FAST (focused Assessment Sonography in Trauma) exam contains all of the following EXCEPT?\",\"options\":[{\"letter\":\"A\",\"text\":\"hepatorenal fossa\"},{\"letter\":\"B\",\"text\":\"splenorenal fossa\"},{\"letter\":\"C\",\"text\":\"pouch of douglas\"},{\"letter\":\"D\",\"text\":\"aorta and IVC\"}],\"correct\":\"D\",\"explanation\":\"<p>--- Agrees with the exam key.</p>\\n<p>The FAST exam comprises four acoustic windows to detect free fluid: the pericardial (subxiphoid) view, the right upper quadrant (hepatorenal recess/Morrison&#x27;s pouch), the left upper quadrant (splenorenal recess), and the suprapubic/pelvic view (pouch of Douglas). Dedicated assessment of the aorta and IVC is not part of the FAST protocol; it belongs to other focused ultrasound applications (e.g., aortic aneurysm scanning or volume-status assessment) (American College of Surgeons Best Practices Guidelines in Imaging, 2018; King, New England Journal of Medicine, 2019).</p>\\n<ul>\\n<li><strong>a, b, c (incorrect as the &quot;EXCEPT&quot; answer --- they ARE included):</strong> The hepatorenal fossa, splenorenal fossa, and pelvic view (pouch of Douglas) are three of the four standard FAST windows.</li>\\n</ul>\\n<p>Background: The extended FAST (eFAST) adds bilateral thoracic views to evaluate for pneumothorax and hemothorax, but still does not include the aorta/IVC.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"116\",\"stem\":\"Which of the following are NOT part of the \\\"AMPLE\\\" history\",\"options\":[{\"letter\":\"A\",\"text\":\"Allergies\"},{\"letter\":\"B\",\"text\":\"Medications currently used\"},{\"letter\":\"C\",\"text\":\"Past illnesses/Pregnancy\"},{\"letter\":\"D\",\"text\":\"Loss of consciousness\"}],\"correct\":\"D\",\"explanation\":\"<p>--- Agrees with the exam key.</p>\\n<p>The AMPLE mnemonic (ATLS) stands for Allergies, Medications, Past illnesses/Pregnancy, Last meal, and Events/Environment related to the injury. Loss of consciousness is not one of its components (ATLS, American College of Surgeons).</p>\\n<ul>\\n<li><strong>a, b, c (incorrect as the &quot;NOT&quot; answer --- they ARE part of AMPLE):</strong> Allergies (A), Medications (M), and Past illnesses/Pregnancy (P) are the first three elements.</li>\\n</ul>\\n<p>Background: The &quot;L&quot; is Last meal (relevant to aspiration risk and anesthetic timing) and the &quot;E&quot; is Events/Environment. Level of consciousness is assessed separately via the GCS and the primary survey, not the AMPLE history.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"117\",\"stem\":\"The parkland formula (4ml/kg per %body surface burn area) is a guideline for the amount of fluid resuscitation a burn patient should receive during the first 24 hours. How many hours should half the total fluid be provided during?\",\"options\":[{\"letter\":\"A\",\"text\":\"4\"},{\"letter\":\"B\",\"text\":\"6\"},{\"letter\":\"C\",\"text\":\"8\"},{\"letter\":\"D\",\"text\":\"12\"}],\"correct\":\"C\",\"explanation\":\"<p>--- Agrees with the exam key.</p>\\n<p>The Parkland formula estimates the 24-hour crystalloid requirement as 4 mL/kg per %TBSA burned, with half of that total volume delivered in the first 8 hours (timed from the moment of injury, not from arrival) and the remaining half over the subsequent 16 hours (Greenhalgh, New England Journal of Medicine, 2019).</p>\\n<ul>\\n<li><strong>a, b, d (incorrect):</strong> 4, 6, and 12 hours do not correspond to the Parkland schedule.</li>\\n</ul>\\n<p>Background: For example, a 100-kg patient with 80% TBSA burns requires 4 \\u00d7 100 \\u00d7 80 = 32,000 mL over 24 hours, with 16,000 mL in the first 8 hours (\\u22482,000 mL/hr). The estimate only sets the starting rate; fluids are subsequently titrated to a urine output of ~0.5 mL/kg/hr in adults (1 mL/kg/hr in children &lt;30 kg). Over-resuscitation (&quot;fluid creep&quot;) is a recognized hazard.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"118\",\"stem\":\"Which antibiotic is a second generation cephalosporin?\",\"options\":[{\"letter\":\"A\",\"text\":\"cefotaxime\"},{\"letter\":\"B\",\"text\":\"cephalexin\"},{\"letter\":\"C\",\"text\":\"cefoxitin\"},{\"letter\":\"D\",\"text\":\"ceftriaxone\"}],\"correct\":\"C\",\"explanation\":\"<p>--- Agrees with the exam key.</p>\\n<p>Cefoxitin (a cephamycin grouped with the second-generation cephalosporins) provides gram-positive coverage plus expanded gram-negative and notable anaerobic activity, making it useful for intra-abdominal and colorectal prophylaxis (Schwartz&#x27;s Principles of Surgery, 10th edition).</p>\\n<ul>\\n<li><strong>a (incorrect):</strong> Cefotaxime is a third-generation cephalosporin.</li>\\n\\n<li><strong>b (incorrect):</strong> Cephalexin is a first-generation cephalosporin (predominantly gram-positive coverage).</li>\\n\\n<li><strong>d (incorrect):</strong> Ceftriaxone is a third-generation cephalosporin.</li>\\n</ul>\\n<p>Background: Generational progression broadly moves from gram-positive toward gram-negative coverage: 1st (cefazolin, cephalexin) \\u2192 2nd (cefuroxime, cefoxitin) \\u2192 3rd (ceftriaxone, cefotaxime, ceftazidime) \\u2192 4th (cefepime) \\u2192 5th (ceftaroline, with MRSA activity).</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"119\",\"stem\":\"The best treatment for a diabetic foot infection is:\",\"options\":[{\"letter\":\"A\",\"text\":\"broad spectrum antibiotics\"},{\"letter\":\"B\",\"text\":\"surgical drainage and debridement\"},{\"letter\":\"C\",\"text\":\"revascularization\"},{\"letter\":\"D\",\"text\":\"pressor support\"}],\"correct\":\"B\",\"explanation\":\"<p>--- Agrees with the exam key.</p>\\n<p>Source control is the cornerstone of managing a diabetic foot infection: undrained pus and nonviable tissue must be surgically drained and debrided as soon as possible. Guidelines direct urgent surgical evaluation to drain abscesses, remove necrotic and infected tissue, and release compartment pressure, and state explicitly that addressing infection should take precedence over revascularization (IWGDF/IDSA 2023; Gallagher et al., American Heart Association Scientific Statement, 2024).</p>\\n<ul>\\n<li><strong>a (incorrect):</strong> Antibiotics are an essential adjunct but do not achieve source control; they cannot penetrate or sterilize an undrained abscess or devitalized tissue. Empiric broad-spectrum antibiotics accompany, but do not replace, surgical drainage.</li>\\n\\n<li><strong>c (incorrect):</strong> Revascularization is important when peripheral arterial disease coexists, but it follows source control --- infection should generally be controlled first.</li>\\n\\n<li><strong>d (incorrect):</strong> Pressor support treats hemodynamic collapse and has no role in routine management of the infection itself.</li>\\n</ul>\\n<p>Background: Management is severity-stratified. Mild, superficial infections may be treated with debridement plus oral antibiotics targeting staphylococci and streptococci; moderate-to-severe (deep, limb-threatening) infections require urgent surgical intervention, parenteral broad-spectrum antibiotics covering gram-positives, gram-negatives, and anaerobes, and assessment for PAD.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"120\",\"stem\":\"The diagnosis of a necrotizing soft tissue infection is made by:\",\"options\":[{\"letter\":\"A\",\"text\":\"bacterial cultures\"},{\"letter\":\"B\",\"text\":\"air on x-ray\"},{\"letter\":\"C\",\"text\":\"clinical findings\"},{\"letter\":\"D\",\"text\":\"operative findings\"}],\"correct\":\"C\",\"explanation\":\"<p>Both C and D have legitimate support, and the item is ambiguous as written:</p>\\n<ul>\\n<li>The case for <strong>C (clinical findings)</strong> --- the exam key: NSTI is fundamentally a clinical diagnosis. Because laboratory scores (LRINEC) and even imaging have insufficient sensitivity to rule it out, the decision to act must rest on clinical suspicion --- pain out of proportion, rapid progression, systemic toxicity, and hard signs such as crepitus, bullae, or skin necrosis. Treatment must never be delayed to await tests.</li>\\n\\n<li>The case for <strong>D (operative findings)</strong> --- arguably more correct per current sources: surgical exploration is repeatedly described as the gold standard for confirming the diagnosis, revealing characteristic intraoperative findings --- gray, non-bleeding necrotic fascia, &quot;dishwater&quot; pus, non-contracting muscle, and a positive &quot;finger test&quot; (lack of resistance to blunt finger dissection). Roughly 50% of cases are initially misdiagnosed on clinical grounds alone, which is precisely why operative confirmation is definitive (Hua et al., Lancet Infectious Diseases, 2023; Hua et al., Cochrane Database of Systematic Reviews, 2018; Pelletier et al., Journal of Emergency Medicine, 2022).</li>\\n\\n<li><strong>a (incorrect):</strong> Bacterial cultures confirm the organism and guide antibiotic therapy but are retrospective and do not establish the diagnosis in time to act.</li>\\n\\n<li><strong>b (incorrect):</strong> Soft-tissue gas on plain radiography is specific but very insensitive (present in only ~25% of cases); its absence never excludes NSTI.</li>\\n</ul>\\n<p>Reconciliation: The safest reading is that a high clinical suspicion (C) mandates immediate surgical exploration, and that exploration (D) provides the definitive/gold-standard confirmation. If the item intends &quot;what prompts you to act,&quot; C is defensible; if it intends &quot;what confirms the diagnosis,&quot; D is the better answer by current evidence.</p>\\n<p>Background: Given the poor sensitivity of physical exam, LRINEC, and imaging, a high index of suspicion should trigger early surgical consultation. Treatment rests on prompt, aggressive surgical debridement (repeated at 24--36 hours and daily as needed) plus empiric broad-spectrum antibiotics covering aerobes (including MRSA) and anaerobes, typically with clindamycin added for antitoxin effect.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"121\",\"stem\":\"Each of the following is an expected alteration in the immune system with aging EXCEPT:\",\"options\":[{\"letter\":\"A\",\"text\":\"involution of the thymus gland\"},{\"letter\":\"B\",\"text\":\"relative increase in inflammatory cytokines\"},{\"letter\":\"C\",\"text\":\"decreased autoantibody production\"},{\"letter\":\"D\",\"text\":\"decreased T-cell mitogenic activity\"},{\"letter\":\"E\",\"text\":\"decreased production and differentiation of na\\u00efve T-cells\"}],\"correct\":\"C\",\"explanation\":\"<p>--- agrees with the original key.</p>\\n<p><strong>Why C is correct (the EXCEPT):</strong> Aging is associated with an <em>increase</em>, not a decrease, in autoantibody production and a higher incidence of autoimmunity. Immunosenescence impairs self-tolerance mechanisms, so autoantibodies accumulate with age (Plaza-Florido et al., Nature Reviews Immunology, 2026; Cisneros et al., Frontiers in Immunology, 2023).</p>\\n<p><strong>Why the others are expected changes (and therefore wrong choices):</strong></p>\\n<ul>\\n<li>a. Thymic involution is a cardinal, near-universal feature of immune aging, beginning in early life and reducing na\\u00efve T-cell output (Cipriano et al., Nature Medicine, 2026).</li>\\n\\n<li>b. &quot;Inflammaging&quot; --- chronic low-grade elevation of IL-6, IL-8, TNF-\\u03b1 --- is a defining feature (Upadhyay et al., Frontiers in Immunology, 2025).</li>\\n\\n<li>d. Decreased T-cell mitogenic/proliferative activity results from loss of CD28 costimulation and reduced IL-2 (Slimovitch et al., AAAAI Work Group Report, 2026).</li>\\n\\n<li>e. Reduced production and differentiation of na\\u00efve T cells follows directly from thymic involution and contracted T-cell receptor diversity (Cisneros et al., 2023).</li>\\n</ul>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"122\",\"stem\":\"Which of the following inhalation anesthetic agents has the fastest onset of action and quickest emergence?\",\"options\":[{\"letter\":\"A\",\"text\":\"Halothane\"},{\"letter\":\"B\",\"text\":\"Nitrous oxide\"},{\"letter\":\"C\",\"text\":\"Isoflurane\"},{\"letter\":\"D\",\"text\":\"Desflurane\"},{\"letter\":\"E\",\"text\":\"Diethyl ether\"}],\"correct\":\"D\",\"explanation\":\"<p>--- agrees with the original key.</p>\\n<p><strong>Why D is correct:</strong> The speed of induction and emergence is governed by the blood-gas partition coefficient --- the lower the solubility, the faster the wash-in and wash-out. Desflurane has the lowest blood-gas coefficient of the volatile agents (0.42), lower than isoflurane (1.4), sevoflurane (0.69), and halothane, and even slightly lower than nitrous oxide, giving it the fastest emergence (Smiley, Anesthesia &amp; Analgesia, 1992; Tsukamoto et al., Clinical Oral Investigations, 2019).</p>\\n<p><strong>Why the others are incorrect:</strong></p>\\n<ul>\\n<li>a. Halothane has a high blood-gas solubility, producing slow induction and emergence.</li>\\n\\n<li>b. Nitrous oxide has a low coefficient but is a weak anesthetic (high MAC) and cannot be used as a sole agent; it is not the &quot;fastest onset and quickest emergence&quot; full anesthetic among the choices, and its coefficient is marginally higher than desflurane&#x27;s.</li>\\n\\n<li>c. Isoflurane is more soluble than desflurane, so both onset and emergence are slower.</li>\\n\\n<li>e. Diethyl ether is extremely soluble, giving very slow, prolonged induction and emergence.</li>\\n</ul>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"123\",\"stem\":\"Which of the following cardiac conditions is NOT associated with a high risk of adverse outcome from infective endocarditis and thereby does NOT necessitate peri-operative antibiotic prophylaxis?\",\"options\":[{\"letter\":\"A\",\"text\":\"Prosthetic cardiac valve\"},{\"letter\":\"B\",\"text\":\"History of infective endocarditis\"},{\"letter\":\"C\",\"text\":\"cardiac transplant patient\"},{\"letter\":\"D\",\"text\":\"unrepaired congenital cyanotic heart disease\"},{\"letter\":\"E\",\"text\":\"Repaired congenital heart disease with residual defect adjacent to a prosthetic patch\"}],\"correct\":\"C\",\"explanation\":\"<p>--- agrees with the original key, with an important caveat.</p>\\n<p><strong>Why C is correct:</strong> Under the AHA framework, solid-organ transplantation <em>by itself</em> is not an indication for endocarditis prophylaxis. The high-risk category specifically names &quot;cardiac transplant recipients who develop cardiac valvulopathy&quot; --- not the transplanted heart per se (Wilson et al., AHA Scientific Statement, 2007/2021). Because option C describes only &quot;cardiac transplant patient&quot; without valvulopathy, it falls outside the high-risk group.</p>\\n<p><strong>Caveat / nuance:</strong> This item is worded imprecisely. A cardiac transplant recipient who develops valvulopathy <em>is</em> in the high-risk group and would warrant prophylaxis; several transplant centers empirically give prophylaxis to all heart-transplant recipients given the difficulty of assessing valvular regurgitation (Goodlet et al., Open Forum Infectious Diseases, 2024). The answer holds only because the option omits valvulopathy.</p>\\n<p><strong>Why the others are high-risk (and therefore wrong choices):</strong></p>\\n<ul>\\n<li>a. Prosthetic cardiac valve (or prosthetic material used for valve repair) is the prototypical high-risk lesion.</li>\\n\\n<li>b. Previous infective endocarditis is explicitly high-risk.</li>\\n\\n<li>d. Unrepaired cyanotic congenital heart disease, including palliative shunts and conduits, is high-risk.</li>\\n\\n<li>e. Repaired CHD with a residual defect at/adjacent to a prosthetic patch (which inhibits endothelialization) is high-risk (Wilson et al., 2007; ACC/AHA valvular guideline, 2008).</li>\\n</ul>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"124\",\"stem\":\"What is the most common clinical complication encountered in the non-cardiac surgery post-anesthesia care unit?\",\"options\":[{\"letter\":\"A\",\"text\":\"Hypotension\"},{\"letter\":\"B\",\"text\":\"Cardiac dysrhythmia\"},{\"letter\":\"C\",\"text\":\"Nausea and vomiting\"},{\"letter\":\"D\",\"text\":\"Altered mental status\"},{\"letter\":\"E\",\"text\":\"Upper airway problems\"}],\"correct\":\"C\",\"explanation\":\"<p>--- agrees with the original key.</p>\\n<p><strong>Why C is correct:</strong> Postoperative nausea and vomiting (PONV) is the most frequent PACU complication, with a reported incidence of roughly 10--30%. In a large retrospective PACU series, after PONV the next most common problems were upper airway issues (~6.9%), hypotension (~2.7%), dysrhythmias (~1.4%), and altered mental status (~0.6%).</p>\\n<p><strong>Why the others are incorrect:</strong> Each of the remaining options (hypotension, dysrhythmia, altered mental status, upper airway problems) occurs at a substantially lower incidence than PONV, as above.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"125\",\"stem\":\"Which of the following inhalational anesthetic agents causes little to no bronchodilatation?\",\"options\":[{\"letter\":\"A\",\"text\":\"Desflurane\"},{\"letter\":\"B\",\"text\":\"Halothane\"},{\"letter\":\"C\",\"text\":\"Enflurane\"},{\"letter\":\"D\",\"text\":\"Isoflurane\"},{\"letter\":\"E\",\"text\":\"Nitrous oxide\"}],\"correct\":\"E\",\"explanation\":\"<p>--- agrees with the original key, with a teaching caveat.</p>\\n<p><strong>Why E is correct:</strong> Nitrous oxide has essentially no effect on airway smooth muscle tone and does not produce meaningful bronchodilation. In a controlled human study, a thiopental/nitrous oxide regimen failed to reduce respiratory-system resistance after intubation, whereas halothane, isoflurane, and sevoflurane all significantly decreased it (Rooke et al., Anesthesiology, 1997).</p>\\n<p><strong>Caveat:</strong> The potent volatile agents (halothane, isoflurane, sevoflurane, and enflurane) are direct bronchodilators via reduced airway smooth-muscle intracellular calcium (Moya et al., Critical Care, 2026). Desflurane is the exception among the potent volatiles --- it is pungent and can <em>increase</em> bronchial tone and airway resistance and provoke bronchospasm, particularly in reactive airways (Regli et al., Pediatric Anesthesia, 2022). Thus a case can be made for desflurane, but nitrous oxide remains the best answer because it has no bronchodilating action at all, whereas desflurane still relaxes isolated human bronchi in vitro (Mercier et al., European Respiratory Journal, 2002).</p>\\n<p><strong>Why the others are incorrect:</strong> Halothane (b), enflurane (c), and isoflurane (d) are all established bronchodilators.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"126\",\"stem\":\"Which of the following statements regarding Lean Body Mass is FALSE?\",\"options\":[{\"letter\":\"A\",\"text\":\"Distributing protein throughout the day improves building of lean body mass.\"},{\"letter\":\"B\",\"text\":\"The elderly are unable to build new lean body mass.\"},{\"letter\":\"C\",\"text\":\"The elderly lose lean body mass faster than younger patients\"},{\"letter\":\"D\",\"text\":\"Loss of lean body mass slows down and inhibits wound healing\"},{\"letter\":\"E\",\"text\":\"Protein supplements are useful for building lean body mass\"}],\"correct\":\"B\",\"explanation\":\"<p>--- agrees with the original key.</p>\\n<p><strong>Why B is the false statement:</strong> Older adults retain the capacity to build new lean body mass in response to adequate protein intake and resistance activity, although the anabolic response is blunted (&quot;anabolic resistance&quot;). &quot;Unable to build new lean body mass&quot; is categorically false.</p>\\n<p><strong>Why the others are true (and therefore wrong choices):</strong></p>\\n<ul>\\n<li>a. Even distribution of protein across meals optimizes muscle protein synthesis.</li>\\n\\n<li>c. The elderly do lose lean body mass faster (sarcopenia of aging).</li>\\n\\n<li>d. Depletion of lean body mass impairs wound healing.</li>\\n\\n<li>e. Protein supplementation supports lean-mass accretion.</li>\\n</ul>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"127\",\"stem\":\"Which of the following is NOT a contraindication for Enteral Feeding?\",\"options\":[{\"letter\":\"A\",\"text\":\"Neurological disease\"},{\"letter\":\"B\",\"text\":\"Intestinal Obstruction\"},{\"letter\":\"C\",\"text\":\"High output fistulas\"},{\"letter\":\"D\",\"text\":\"GI Bleed\"},{\"letter\":\"E\",\"text\":\"Acute peritonitis\"}],\"correct\":\"A\",\"explanation\":\"<p>--- agrees with the original key.</p>\\n<p><strong>Why A is correct:</strong> Neurological disease (e.g., stroke, traumatic brain injury) is not a contraindication to enteral feeding; on the contrary, such patients frequently require enteral access precisely because of impaired swallowing, and the enteral route is preferred whenever the gut is functional.</p>\\n<p><strong>Why the others are contraindications (and therefore wrong choices):</strong></p>\\n<ul>\\n<li>b. Mechanical intestinal obstruction precludes distal enteral delivery.</li>\\n\\n<li>c. High-output fistulas may be worsened by feeding proximal to the fistula.</li>\\n\\n<li>d. Active GI bleeding is a contraindication until controlled.</li>\\n\\n<li>e. Acute peritonitis reflects a non-functioning/compromised gut and is a contraindication.</li>\\n</ul>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"128\",\"stem\":\"An example of class II clean contaminated wound includes:\",\"options\":[{\"letter\":\"A\",\"text\":\"open AAA repair\"},{\"letter\":\"B\",\"text\":\"cholecystectomy\"},{\"letter\":\"C\",\"text\":\"perforated diverticulitis\"},{\"letter\":\"D\",\"text\":\"hernia repair\"}],\"correct\":\"B\",\"explanation\":\"<p>--- agrees with the original key.</p>\\n<p><strong>Why B is correct:</strong> A clean-contaminated (Class II) wound involves controlled entry into the respiratory, alimentary, genitourinary, or biliary tract under controlled conditions and without unusual contamination. Elective cholecystectomy, which enters the biliary tract without significant spillage, is the classic Class II example (Schwartz, 10th ed., p. 148).</p>\\n<p><strong>Why the others are incorrect:</strong></p>\\n<ul>\\n<li>a. Open AAA repair (no hollow viscus entered, no break in aseptic technique) is a clean (Class I) wound.</li>\\n\\n<li>c. Perforated diverticulitis, with gross fecal/purulent contamination, is a dirty/infected (Class IV) wound.</li>\\n\\n<li>d. Elective hernia repair is a clean (Class I) wound.</li>\\n</ul>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"129\",\"stem\":\"One of the criteria for systemic inflammatory response syndrome (SIRS) includes:\",\"options\":[{\"letter\":\"A\",\"text\":\"temperature >38.3\\u00b0C\"},{\"letter\":\"B\",\"text\":\"temperature < 37\\u00b0C\"},{\"letter\":\"C\",\"text\":\"WBC < 12000\"},{\"letter\":\"D\",\"text\":\"MAP < 75 mmHg\"}],\"correct\":\"A\",\"explanation\":\"<p>--- agrees with the original key.</p>\\n<p><strong>Why A is correct:</strong> SIRS is defined by \\u22652 of: abnormal temperature, heart rate &gt;90/min, respiratory rate &gt;20/min (or PaCO\\u2082 &lt;32 mmHg), and abnormal WBC. Temperature elevation is a core criterion. The classic ACCP/SCCM threshold is &gt;38\\u00b0C (some sources, including the Schwartz text this exam draws from, cite &gt;38.3\\u00b0C, and others &gt;38.5\\u00b0C --- see caveat).</p>\\n<p><strong>Caveat on the exact threshold:</strong> The temperature cutoff varies across sources --- &gt;38\\u00b0C in the original Bone/ACCP-SCCM criteria, &gt;38.3\\u00b0C in several references, and &gt;38.5\\u00b0C in some calculators. Any of these makes option A the only defensible choice; the exact number is not standardized.</p>\\n<p><strong>Why the others are incorrect:</strong></p>\\n<ul>\\n<li>b. The hypothermia criterion is temperature &lt;36\\u00b0C, not &lt;37\\u00b0C.</li>\\n\\n<li>c. The WBC criterion is &gt;12,000/mm\\u00b3 or &lt;4,000/mm\\u00b3 (or &gt;10% bands) --- &quot;&lt;12,000&quot; is not a criterion.</li>\\n\\n<li>d. MAP &lt;75 mmHg is not a SIRS criterion; hypotension (SBP &lt;90) belongs to sepsis/septic-shock definitions, not SIRS itself.</li>\\n</ul>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"130\",\"stem\":\"What is a finding in neurogenic shock?\",\"options\":[{\"letter\":\"A\",\"text\":\"hypotension & bradycardia\"},{\"letter\":\"B\",\"text\":\"hypertension & bradycardia\"},{\"letter\":\"C\",\"text\":\"hypotension & tachycardia\"},{\"letter\":\"D\",\"text\":\"hypertension & tachycardia\"}],\"correct\":\"A\",\"explanation\":\"<p>--- agrees with the original key.</p>\\n<p><strong>Why A is correct:</strong> Neurogenic shock results from loss of sympathetic vasomotor tone after spinal cord injury (typically above T6), producing vasodilation, hypotension, a wide pulse pressure, and warm extremities. Unopposed vagal tone produces bradycardia --- the key feature that distinguishes neurogenic from hypovolemic shock, in which tachycardia would be expected (Ahuja et al., Nature Reviews Disease Primers, 2017; Chiles &amp; Cooper, New England Journal of Medicine, 1996).</p>\\n<p><strong>Why the others are incorrect:</strong></p>\\n<ul>\\n<li>b, d. Hypertension is not a feature of established neurogenic shock (a transient initial hypertensive surge may precede it, but shock itself is hypotensive).</li>\\n\\n<li>c. Tachycardia points to hypovolemic/hemorrhagic shock; the presence of bradycardia is what flags a neurogenic mechanism. Because trauma patients often have concurrent hemorrhage, other causes of shock must always be excluded first.</li>\\n</ul>\\n<p>Worked answers for the final items of the F2017 National Surgical Foundations In-Service Examination. Each question restates the stem and options verbatim, identifies the best answer, explains the correct and incorrect choices, and notes any disagreement with the original answer key.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"131\",\"stem\":\"Using the following table to classify the results of a screening study, how do you calculate sensitivity? [Table: Test outcome Positive -> Condition Positive: True Positive (TP); Condition Negative: False Positive (FP). Test outcome Negative -> Condition Positive: False Negative (FN); Condition Negative: True Negative (TN).]\",\"options\":[{\"letter\":\"A\",\"text\":\"TP / (TP + FN)\"},{\"letter\":\"B\",\"text\":\"FP / (FN + TN)\"},{\"letter\":\"C\",\"text\":\"TN / (TN + FP)\"},{\"letter\":\"D\",\"text\":\"FN / (FP + TN)\"}],\"correct\":\"A\",\"explanation\":\"<p>(No answer was recorded in the original document for this item.)</p>\\n<p>Sensitivity --- also called the true-positive rate or recall --- is the proportion of people who truly have the condition that the test correctly identifies as positive. Working down the &quot;Condition Positive&quot; column, the diseased patients are the true positives plus the false negatives, so sensitivity = TP / (TP + FN) (Thomas et al., Pediatric Radiology, 2015; Grimes and Schulz, Lancet, 2002).</p>\\n<ul>\\n<li><strong>B is incorrect:</strong> FP / (FN + TN) does not correspond to any standard index; it mixes a false positive numerator with a denominator drawn from both columns.</li>\\n\\n<li><strong>C is incorrect:</strong> TN / (TN + FP) is specificity --- the proportion of non-diseased patients correctly called negative.</li>\\n\\n<li><strong>D is incorrect:</strong> FN / (FP + TN) is not a standard measure. The false-negative rate is FN / (TP + FN), i.e., 1 \\u2212 sensitivity.</li>\\n</ul>\\n<p>Background: A sensitive test, when negative, helps rule out disease (&quot;SnNout&quot;), whereas a specific test, when positive, helps rule in disease (&quot;SpPin&quot;). Sensitivity and specificity are properties of the test itself, while positive and negative predictive values additionally depend on disease prevalence (Grimes and Schulz, Lancet, 2002).</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"132\",\"stem\":\"The number of all individuals affected by a disease at any given time is called?\",\"options\":[{\"letter\":\"A\",\"text\":\"Incidence\"},{\"letter\":\"B\",\"text\":\"Cumulative Frequency\"},{\"letter\":\"C\",\"text\":\"Attack Rate\"},{\"letter\":\"D\",\"text\":\"Prevalence\"}],\"correct\":\"D\",\"explanation\":\"<p>Prevalence is the proportion of a defined population that has a disease at a given point (point prevalence) or over a specified interval (period prevalence). It reflects the existing burden of disease and is a function of both incidence and disease duration; roughly, prevalence \\u2248 incidence \\u00d7 average duration (Vetter and Jesser, Anesthesia &amp; Analgesia, 2017; Jager et al., Kidney International, 2007).</p>\\n<ul>\\n<li><strong>A is incorrect:</strong> Incidence is the rate of new cases arising in an at-risk population over a defined time period --- it captures new occurrences, not existing cases.</li>\\n\\n<li><strong>B is incorrect:</strong> Cumulative frequency is a general descriptive-statistics term (a running total of frequencies), not a measure of disease burden.</li>\\n\\n<li><strong>C is incorrect:</strong> Attack rate is a form of cumulative incidence used in outbreak/epidemic settings (new cases during an outbreak divided by the population at risk), again a measure of new cases.</li>\\n</ul>\\n<p>Background: Prevalence is preferred for planning health-care resources and estimating burden; incidence is preferred for studying etiology and evaluating prevention. Prevalence exceeds incidence for chronic conditions with long duration and low mortality (Jager et al., Kidney International, 2007).</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"132-2\",\"stem\":\"The principalist approach incorporates which guiding principles:\",\"options\":[{\"letter\":\"A\",\"text\":\"disclosure, autonomy, beneficence, and justice\"},{\"letter\":\"B\",\"text\":\"disclosure, autonomy, beneficence, and nonmaleficence\"},{\"letter\":\"C\",\"text\":\"autonomy, beneficence, nonmaleficence, and capacity\"},{\"letter\":\"D\",\"text\":\"autonomy, justice, beneficence, and nonmaleficence\"}],\"correct\":\"D\",\"explanation\":\"<p>Principlism, as described by Beauchamp and Childress, is built on four prima facie principles of equal standing: respect for autonomy, beneficence, nonmaleficence, and justice (Elmer et al., AHA Guidelines, Circulation, 2025; Executive Committee/Benjamin et al., Journal of the American College of Cardiology, 2021). Only option D lists all four.</p>\\n<ul>\\n<li><strong>A and B are incorrect:</strong> Both substitute &quot;disclosure&quot; for one of the four principles. Disclosure is an element of informed consent (an application of respect for autonomy), not itself one of the four principles.</li>\\n\\n<li><strong>C is incorrect:</strong> It substitutes &quot;capacity&quot; for justice. Capacity is a component of decision-making and informed consent, not one of the four foundational principles.</li>\\n</ul>\\n<p>Background: The four principles are: respect for autonomy (support uncoerced patient choice), beneficence (act in the patient&#x27;s best interest), nonmaleficence (do no harm), and justice (fairness in distribution of benefits and burdens). No principle automatically outranks another; conflicts are resolved by specification and balancing (Elmer et al., Circulation, 2025).</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"133\",\"stem\":\"According to ECOG, a patient who sleeps up to 50% or more of waking hours and requires some assistance with basic ADLs (performance status 3) has a prognosis of:\",\"options\":[{\"letter\":\"A\",\"text\":\"days\"},{\"letter\":\"B\",\"text\":\"weeks\"},{\"letter\":\"C\",\"text\":\"weeks to a few months\"},{\"letter\":\"D\",\"text\":\"months\"}],\"correct\":\"C\",\"explanation\":\"<p>ECOG performance status 3 denotes a patient capable of only limited self-care, confined to bed or chair more than 50% of waking hours. In advanced cancer this level of functional decline carries a prognosis on the order of weeks to a few months. Real-world data bear this out: in a large registry of patients receiving palliative immune-checkpoint inhibitors, median overall survival for PS 3 was 3.8 months, with 45.7% dying within 90 days (Nodbrant et al., Acta Oncologica, 2026). Poor performance status (PS 3--4) is one of the strongest independent predictors of short survival in advanced cancer (Simmons et al., The Oncologist, 2019).</p>\\n<ul>\\n<li><strong>A (&quot;days&quot;) is incorrect:</strong> A prognosis measured in days corresponds to a near-moribund, largely bedbound state (closer to PS 4 and actively dying), not PS 3.</li>\\n\\n<li><strong>B (&quot;weeks&quot;) is incorrect:</strong> Too short; understates typical PS 3 survival, which extends to a few months in many cancers.</li>\\n\\n<li><strong>D (&quot;months&quot;) is incorrect:</strong> Too optimistic as a categorical answer; while some PS 3 patients survive several months, the best-fitting descriptor spanning the observed range is &quot;weeks to a few months.&quot;</li>\\n</ul>\\n<p>Background: ECOG PS is a robust, reproducible prognostic tool and a key determinant of eligibility for systemic therapy; patients with PS \\u22653 generally derive little survival benefit from palliative chemotherapy and warrant a palliative-focused approach (Nodbrant et al., Acta Oncologica, 2026).</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"134\",\"stem\":\"A palliative care consultation would be required for:\",\"options\":[{\"letter\":\"A\",\"text\":\"initiation of comfort care\"},{\"letter\":\"B\",\"text\":\"withdrawal of medications\"},{\"letter\":\"C\",\"text\":\"initiation of transdermal narcotics\"},{\"letter\":\"D\",\"text\":\"implementation of palliative home care services\"}],\"correct\":\"D\",\"explanation\":\"<p>Under the framework used by the source text (Schwartz&#x27;s Principles of Surgery), initiation of comfort care, withdrawal/de-prescribing of medications, and starting transdermal opioids are all within the scope of the primary treating team and do not by themselves mandate a specialty palliative-care consultation. Arranging and implementing formal palliative home-care services is the item that typically requires a palliative-care consultation to coordinate.</p>\\n<ul>\\n<li><strong>A is incorrect:</strong> Comfort care can be initiated by the primary/surgical team as part of goals-of-care management.</li>\\n\\n<li><strong>B is incorrect:</strong> Discontinuing non-beneficial medications is a routine part of end-of-life care and does not require a consult.</li>\\n\\n<li><strong>C is incorrect:</strong> Prescribing transdermal opioids (e.g., fentanyl patches) for pain is within the primary team&#x27;s competence.</li>\\n</ul>\\n<p>Note on interpretation: This is a systems/scope-of-practice teaching point rather than an evidence-based clinical threshold, and local practice varies --- many institutions involve palliative care earlier and for any of these tasks. Early specialty palliative-care involvement improves symptom burden and quality of life in serious illness, so the item should be read as reflecting the source&#x27;s specific framing rather than a universal rule.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"135\",\"stem\":\"Informed consent requires:\",\"options\":[{\"letter\":\"A\",\"text\":\"capacity, disclosure, understanding, free of coercion\"},{\"letter\":\"B\",\"text\":\"capacity, disclosure, maturity, autonomy\"},{\"letter\":\"C\",\"text\":\"capacity, disclosure, maturity, autonomy\"},{\"letter\":\"D\",\"text\":\"capacity, competence, autonomy, free of coercion\"}],\"correct\":\"A\",\"explanation\":\"<p>Valid informed consent requires that the patient have decision-making capacity, that relevant information be disclosed (diagnosis, nature and purpose of the intervention, risks, benefits, and alternatives including no treatment), that the patient understand that information, and that the decision be made voluntarily and free of coercion (ACOG Committee on Ethics, 2021; ACR--SIR--SPR Practice Parameter on Informed Consent, 2021).</p>\\n<ul>\\n<li><strong>B and C are incorrect (and are duplicates of each other):</strong> &quot;Maturity&quot; is not a formal element; it is subsumed within capacity/competence. These options also omit the essential requirement of voluntariness (freedom from coercion) and understanding.</li>\\n\\n<li><strong>D is incorrect:</strong> It lists &quot;competence&quot; and &quot;autonomy&quot; but omits both disclosure and understanding --- without disclosure of risks, benefits, and alternatives, and patient understanding of them, consent is not informed.</li>\\n</ul>\\n<p>Background: Informed consent is an ongoing process, not merely a signature, and operationalizes the principle of respect for autonomy. Three recognized standards govern how much to disclose: the professional (reasonable-physician) standard, the reasonable-patient standard, and the subjective-patient standard (Kinnersley et al., Cochrane Database of Systematic Reviews, 2013).</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"136\",\"stem\":\"Common causes of lawsuits in surgery include:\",\"options\":[{\"letter\":\"A\",\"text\":\"coerced blood transfusions\"},{\"letter\":\"B\",\"text\":\"positional nerve injury\"},{\"letter\":\"C\",\"text\":\"medications causing allergic reactions\"},{\"letter\":\"D\",\"text\":\"inappropriate use of blood thinners\"}],\"correct\":\"B\",\"explanation\":\"<p>Among the four options, positional (patient-positioning) nerve injury is the recognized, classically litigated surgical complication --- it is largely preventable with proper padding and positioning, which is why it features prominently as a source of intraoperative-liability claims. This matches the source text (Schwartz&#x27;s Principles of Surgery).</p>\\n<ul>\\n<li><strong>A is incorrect:</strong> Coerced transfusion is not a common basis for surgical malpractice claims; consent and refusal issues around transfusion arise but are not a leading category.</li>\\n\\n<li><strong>C is incorrect:</strong> Medication allergic reactions are a general prescribing issue and are not specific to, or a leading driver of, surgical litigation.</li>\\n\\n<li><strong>D is incorrect:</strong> Anticoagulant misuse contributes to adverse events but is not among the classically cited common causes of surgical lawsuits relative to positioning injury.</li>\\n</ul>\\n<p>Note on broader evidence: Large medicolegal analyses identify failure or delay in diagnosis, failure or delay in treatment, intraoperative/surgical error, and inadequate informed consent as the most frequent overall causes of surgical claims (Magowan et al., Annals of the Royal College of Surgeons of England, 2023; Schaffer et al., JAMA Internal Medicine, 2017). Positional nerve injury falls under the intraoperative-error/technical category and is the best fit among the four specific options offered, but it is not the single most common cause of surgical litigation when all categories are considered.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null}];<\/script>\n<script>\n(function(){\n  const STORAGE_KEY = 'progress-v1';\n  // Namespaced by page title so multiple quiz files hosted/opened together\n  // (outside Claude, where window.storage isn't available) don't clobber\n  // each other's saved progress in the same browser's localStorage.\n  const LOCAL_STORAGE_KEY = 'examquiz-progress:' + (document.title || 'default');\n  let state = { answers: {}, flagged: {}, struck: {} }; // answers[num]={selected,correct}; struck[num]={LETTER:true}\n  let filter = 'all';\n  let currentIndex = 0;\n  let pendingSelections = {}; // qnum -> letter, chosen but not yet confirmed (session-only)\n\n  const FILTERS = [\n    ['all', 'All'],\n    ['unanswered', 'Unanswered'],\n    ['incorrect', 'Incorrect'],\n    ['flagged', 'Flagged'],\n  ];\n\n  function questionStatus(q) {\n    const a = state.answers[q.number];\n    if (!a) return 'unanswered';\n    if (q.no_options || q.no_key) return 'nokey-done';\n    return a.correct ? 'correct' : 'incorrect';\n  }\n\n  function visibleList() {\n    return QUIZ_DATA.filter(q => {\n      if (filter === 'unanswered') return !state.answers[q.number];\n      if (filter === 'incorrect') {\n        const a = state.answers[q.number];\n        return a && !a.correct && !q.no_options && !q.no_key;\n      }\n      if (filter === 'flagged') return !!state.flagged[q.number];\n      return true;\n    });\n  }\n\n  function renderFilters() {\n    const el = document.getElementById('filter-tabs');\n    el.innerHTML = '';\n    FILTERS.forEach(([key, label]) => {\n      const b = document.createElement('button');\n      b.textContent = label;\n      if (filter === key) b.classList.add('active');\n      b.onclick = () => { filter = key; currentIndex = 0; renderAll(); };\n      el.appendChild(b);\n    });\n  }\n\n  function renderGrid() {\n    const grid = document.getElementById('qgrid');\n    grid.innerHTML = '';\n    const list = visibleList();\n    if (list.length === 0) {\n      const empty = document.createElement('div');\n      empty.style.gridColumn = '1 / -1';\n      empty.style.color = 'var(--muted)';\n      empty.style.fontSize = '12.5px';\n      empty.style.textAlign = 'center';\n      empty.style.padding = '10px 0';\n      empty.textContent = 'No questions here.';\n      grid.appendChild(empty);\n      return;\n    }\n    list.forEach((q, i) => {\n      const b = document.createElement('button');\n      b.textContent = q.number;\n      const status = questionStatus(q);\n      if (status !== 'unanswered') b.classList.add(status);\n      if (i === currentIndex) b.classList.add('current');\n      if (state.flagged[q.number]) {\n        const dot = document.createElement('span');\n        dot.className = 'flagdot';\n        b.appendChild(dot);\n      }\n      b.onclick = () => { currentIndex = i; renderAll(); scrollToTop(); };\n      grid.appendChild(b);\n    });\n  }\n\n  function renderStats() {\n    const answeredNums = Object.keys(state.answers);\n    const gradable = answeredNums.filter(n => {\n      const q = QUIZ_DATA.find(x => x.number == n);\n      return q && !q.no_options && !q.no_key;\n    });\n    const correctCount = gradable.filter(n => state.answers[n].correct).length;\n    document.getElementById('stat-answered').textContent = answeredNums.length;\n    document.getElementById('stat-correct').textContent = correctCount;\n    document.getElementById('stat-pct').textContent = gradable.length\n      ? Math.round(100 * correctCount / gradable.length) + '%'\n      : '\u2014';\n  }\n\n  function escapeHtml(s) {\n    const d = document.createElement('div');\n    d.textContent = s;\n    return d.innerHTML;\n  }\n\n  function scrollToTop() {\n    window.scrollTo({ top: 0, behavior: 'smooth' });\n  }\n\n  function renderPanel() {\n    const panel = document.getElementById('qpanel');\n    const list = visibleList();\n    if (list.length === 0) {\n      panel.innerHTML = '<div class=\"empty-state\">Nothing to show for this filter. Try a different tab on the left.</div>';\n      return;\n    }\n    if (currentIndex >= list.length) currentIndex = list.length - 1;\n    const q = list[currentIndex];\n    const answer = state.answers[q.number];\n    const flagged = !!state.flagged[q.number];\n    const pending = pendingSelections[q.number]; // letter picked but not confirmed yet\n\n    let html = '';\n    html += '<div class=\"qmeta\">';\n    html += '<div class=\"qnum\">Question ' + q.number + '</div>';\n    html += '<button class=\"flag-toggle ' + (flagged ? 'on' : '') + '\" id=\"flag-btn\">' + (flagged ? '&#9873; Flagged' : '&#9872; Flag for review') + '</button>';\n    html += '</div>';\n    html += '<div class=\"stem\">' + escapeHtml(q.stem) + '</div>';\n\n    if (q.no_options) {\n      if (!answer) {\n        html += '<div class=\"noopts-box\">This question\\'s original answer choices weren\\'t fully captured in the source material \u2014 only the key fact is available.</div>';\
