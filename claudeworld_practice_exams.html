<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OrthoWorld — Practice Exams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F3F5F3;
    --surface: #FFFFFF;
    --ink: #1B2430;
    --muted: #64707D;
    --border: #DFE3E0;
    --accent: #3B7DD8;
    --accent-dark: #2A5DA8;
    --accent-tint: #E8F1FC;
    --correct: #1E8A5F;
    --correct-bg: #E7F5EE;
    --correct-border: #A9DDC4;
    --incorrect: #BF3F27;
    --incorrect-bg: #FBEAE5;
    --incorrect-border: #EFB7A8;
    --flag: #B9821A;
    --flag-bg: #FCF1DC;
    --flag-border: #ECD9AC;
    --nokey: #7C6FB0;
    --nokey-bg: #EFEBFA;
    --nokey-border: #D6CDEE;
    --explain-text: #384250;
    --claude-orange: #3B7DD8;
    --claude-orange-dark: #2A5DA8;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(27,36,48,0.06), 0 4px 14px rgba(27,36,48,0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15181B;
      --surface: #1E2226;
      --ink: #E8EAEC;
      --muted: #97A1A9;
      --border: #333A40;
      --accent: #6FA8E8;
      --accent-dark: #4A82C4;
      --accent-tint: #1C2C40;
      --correct: #58D399;
      --correct-bg: #17301F;
      --correct-border: #2D5238;
      --incorrect: #F0876D;
      --incorrect-bg: #3A211B;
      --incorrect-border: #62362A;
      --flag: #E3B04B;
      --flag-bg: #362C15;
      --flag-border: #5B4A24;
      --nokey: #BBA9F5;
      --nokey-bg: #2A2440;
      --nokey-border: #453B66;
      --explain-text: #C7CDD3;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.25);
    }
  }
  /* Explicit user override (Settings menu), regardless of system preference */
  :root[data-theme="dark"] {
    --bg: #15181B;
    --surface: #1E2226;
    --ink: #E8EAEC;
    --muted: #97A1A9;
    --border: #333A40;
    --accent: #6FA8E8;
    --accent-dark: #4A82C4;
    --accent-tint: #1C2C40;
    --correct: #58D399;
    --correct-bg: #17301F;
    --correct-border: #2D5238;
    --incorrect: #F0876D;
    --incorrect-bg: #3A211B;
    --incorrect-border: #62362A;
    --flag: #E3B04B;
    --flag-bg: #362C15;
    --flag-border: #5B4A24;
    --nokey: #BBA9F5;
    --nokey-bg: #2A2440;
    --nokey-border: #453B66;
    --explain-text: #C7CDD3;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.25);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }
  .cw-quiz-view {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 30;
    background: var(--bg);
  }
  .cw-quiz-view.active { display: block; }
  .cw-quiz-view iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }
  #view-menu.hidden { display: none; }
  .bg-fill {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: -1;
  }
  #app {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px 20px 60px;
  }

  /* Banner (no score pill on the menu page — just brand + settings) */
  .cw-banner {
    background: linear-gradient(135deg, var(--claude-orange), var(--claude-orange-dark));
    color: #fff;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Inter', sans-serif;
  }
  .cw-banner-inner {
    max-width: 900px;
    margin: 0 auto;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
  }
  .cw-brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .cw-banner-icon {
    flex: 0 0 30px;
    width: 30px;
    height: 30px;
  }
  .cw-banner-title {
    font-weight: 700;
    font-size: 1.4667rem;
    letter-spacing: -0.01em;
  }
  .cw-settings { position: relative; }
  .settings-gear {
    background: rgba(255,255,255,0.16);
    border: none;
    border-radius: 8px;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    line-height: 1;
    cursor: pointer;
  }
  .settings-gear:hover { background: rgba(255,255,255,0.26); }
  .settings-panel {
    position: absolute;
    top: 42px;
    right: 0;
    width: 264px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    padding: 14px;
    z-index: 20;
    color: var(--ink);
  }
  .settings-panel.hidden { display: none; }
  .settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .settings-row + .settings-row { margin-top: 14px; }
  .settings-label {
    font-size: 0.8667rem;
    font-weight: 600;
    color: var(--muted);
  }
  .settings-stepper {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .settings-stepper button {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    font-weight: 700;
    font-size: 0.8rem;
    cursor: pointer;
    font-family: inherit;
  }
  .settings-stepper button:hover { border-color: var(--accent); color: var(--accent-dark); }
  #font-pct {
    font-size: 0.8rem;
    color: var(--muted);
    min-width: 34px;
    text-align: center;
  }
  .settings-seg {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 7px;
    overflow: hidden;
  }
  .settings-seg button {
    background: var(--bg);
    border: none;
    border-left: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.7333rem;
    font-weight: 600;
    padding: 5px 7px;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
  }
  .settings-seg button:first-child { border-left: none; }
  .settings-seg button.active { background: var(--accent); color: #fff; }

  /* Page content */
  header.top {
    margin-bottom: 26px;
  }
  header.top h1 {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 1.7rem;
    margin: 20px 0 6px;
    letter-spacing: -0.01em;
  }
  header.top .sub {
    color: var(--muted);
    font-size: 0.95rem;
    line-height: 1.55;
  }

  .quiz-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .quiz-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 22px;
    box-shadow: var(--shadow);
    text-decoration: none;
    color: var(--ink);
    transition: border-color 0.15s ease, transform 0.1s ease;
  }
  .quiz-card:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }
  .quiz-card-main h2 {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 1.25rem;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  .quiz-card-main p {
    margin: 0;
    color: var(--muted);
    font-size: 0.88rem;
    line-height: 1.5;
  }
  .quiz-card-cta {
    flex: 0 0 auto;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    font-size: 0.9rem;
    padding: 9px 18px;
    border-radius: 8px;
    white-space: nowrap;
  }
  .quiz-card:hover .quiz-card-cta { background: var(--accent-dark); }

  @media (max-width: 520px) {
    .quiz-card { flex-direction: column; align-items: stretch; text-align: left; }
    .quiz-card-cta { text-align: center; }
  }
</style>
</head>
<body>
<div class="bg-fill"></div>
<div class="cw-banner">
  <div class="cw-banner-inner">
    <div class="cw-brand">
      <span class="cw-banner-icon" style="font-size:26px;line-height:30px;display:inline-block;text-align:center;">🦴</span>
      <span class="cw-banner-title">OrthoWorld</span>
    </div>
    <div class="cw-settings">
      <button id="settings-toggle" class="settings-gear" title="Settings" aria-label="Settings">⚙️</button>
      <div id="settings-panel" class="settings-panel hidden">
        <div class="settings-row">
          <span class="settings-label">Text size</span>
          <div class="settings-stepper">
            <button id="font-dec" aria-label="Decrease text size">A−</button>
            <span id="font-pct">100%</span>
            <button id="font-inc" aria-label="Increase text size">A+</button>
          </div>
        </div>
        <div class="settings-row">
          <span class="settings-label">Appearance</span>
          <div class="settings-seg" id="theme-seg">
            <button data-theme-choice="system">System</button>
            <button data-theme-choice="light">Light</button>
            <button data-theme-choice="dark">Dark</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="view-menu">
<div id="app">
  <header class="top">
    <h1>Practice Exams</h1>
    <div class="sub">Pick a set to start practicing. Your progress in each quiz is saved separately.</div>
  </header>

  <div class="quiz-list">
    <a class="quiz-card" href="#" onclick="event.preventDefault(); showQuiz('2017');">
      <div class="quiz-card-main">
        <h2>2017 Practice Exam</h2>
        <p>115 questions · 115 with a keyed answer</p>
      </div>
      <div class="quiz-card-cta">Start →</div>
    </a>

    <a class="quiz-card" href="#" onclick="event.preventDefault(); showQuiz('2018');">
      <div class="quiz-card-main">
        <h2>2018 Practice Exam</h2>
        <p>130 questions · 123 with a keyed answer</p>
      </div>
      <div class="quiz-card-cta">Start →</div>
    </a>
  </div>
</div>
</div><!-- /view-menu -->

<div id="view-2017" class="cw-quiz-view"><iframe id="frame-2017" title="2017 Practice Exam"></iframe></div>
<div id="view-2018" class="cw-quiz-view"><iframe id="frame-2018" title="2018 Practice Exam"></iframe></div>

<script>
(function(){
  const SETTINGS_KEY = 'ui-settings-v1';
  const SETTINGS_LOCAL_KEY = 'examquiz-ui-settings';
  const FONT_STEPS = [13, 14, 15, 16, 17, 18, 19];
  let settings = { fontStep: 2, theme: 'system' };

  const THEME_VARS = {
    light: {
      '--bg': '#F3F5F3', '--surface': '#FFFFFF', '--ink': '#1B2430', '--muted': '#64707D',
      '--border': '#DFE3E0', '--accent': '#3B7DD8', '--accent-dark': '#2A5DA8', '--accent-tint': '#E8F1FC',
      '--correct': '#1E8A5F', '--correct-bg': '#E7F5EE', '--correct-border': '#A9DDC4',
      '--incorrect': '#BF3F27', '--incorrect-bg': '#FBEAE5', '--incorrect-border': '#EFB7A8',
      '--flag': '#B9821A', '--flag-bg': '#FCF1DC', '--flag-border': '#ECD9AC',
      '--nokey': '#7C6FB0', '--nokey-bg': '#EFEBFA', '--nokey-border': '#D6CDEE',
      '--explain-text': '#384250',
      '--shadow': '0 1px 2px rgba(27,36,48,0.06), 0 4px 14px rgba(27,36,48,0.05)',
    },
    dark: {
      '--bg': '#15181B', '--surface': '#1E2226', '--ink': '#E8EAEC', '--muted': '#97A1A9',
      '--border': '#333A40', '--accent': '#6FA8E8', '--accent-dark': '#4A82C4', '--accent-tint': '#1C2C40',
      '--correct': '#58D399', '--correct-bg': '#17301F', '--correct-border': '#2D5238',
      '--incorrect': '#F0876D', '--incorrect-bg': '#3A211B', '--incorrect-border': '#62362A',
      '--flag': '#E3B04B', '--flag-bg': '#362C15', '--flag-border': '#5B4A24',
      '--nokey': '#BBA9F5', '--nokey-bg': '#2A2440', '--nokey-border': '#453B66',
      '--explain-text': '#C7CDD3',
      '--shadow': '0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.25)',
    },
  };

  async function loadSettings() {
    let raw = null;
    try {
      if (window.storage) {
        const res = await window.storage.get(SETTINGS_KEY, false);
        if (res && res.value) raw = res.value;
      }
    } catch (e) {}
    if (raw === null) {
      try { raw = localStorage.getItem(SETTINGS_LOCAL_KEY); } catch (e) {}
    }
    if (raw) {
      try {
        const parsed = JSON.parse(raw);
        if (parsed) settings = Object.assign(settings, parsed);
      } catch (e) {}
    }
  }

  async function saveSettings() {
    const payload = JSON.stringify(settings);
    try {
      if (window.storage) { await window.storage.set(SETTINGS_KEY, payload, false); return; }
    } catch (e) {}
    try { localStorage.setItem(SETTINGS_LOCAL_KEY, payload); } catch (e) {}
  }

  function applyFontStep() {
    const px = FONT_STEPS[settings.fontStep];
    document.documentElement.style.fontSize = px + 'px';
    const pctEl = document.getElementById('font-pct');
    if (pctEl) pctEl.textContent = Math.round((px / 15) * 100) + '%';
  }

  function applyTheme() {
    const rootStyle = document.documentElement.style;
    const allVarNames = Object.keys(THEME_VARS.light);
    if (settings.theme === 'system') {
      allVarNames.forEach(name => rootStyle.removeProperty(name));
      document.documentElement.removeAttribute('data-theme');
    } else {
      const vars = THEME_VARS[settings.theme] || THEME_VARS.light;
      allVarNames.forEach(name => rootStyle.setProperty(name, vars[name]));
      document.documentElement.setAttribute('data-theme', settings.theme);
    }
    document.querySelectorAll('#theme-seg button').forEach(btn => {
      btn.classList.toggle('active', btn.getAttribute('data-theme-choice') === settings.theme);
    });
  }

  function initSettingsUI() {
    const toggle = document.getElementById('settings-toggle');
    const panel = document.getElementById('settings-panel');
    toggle.onclick = (e) => {
      e.stopPropagation();
      panel.classList.toggle('hidden');
    };
    document.addEventListener('click', (e) => {
      if (!panel.classList.contains('hidden') && !panel.contains(e.target) && e.target !== toggle) {
        panel.classList.add('hidden');
      }
    });

    document.getElementById('font-dec').onclick = () => {
      settings.fontStep = Math.max(0, settings.fontStep - 1);
      applyFontStep();
      saveSettings();
    };
    document.getElementById('font-inc').onclick = () => {
      settings.fontStep = Math.min(FONT_STEPS.length - 1, settings.fontStep + 1);
      applyFontStep();
      saveSettings();
    };
    document.querySelectorAll('#theme-seg button').forEach(btn => {
      btn.onclick = () => {
        settings.theme = btn.getAttribute('data-theme-choice');
        applyTheme();
        saveSettings();
      };
    });

    applyFontStep();
    applyTheme();
  }

  (async function init() {
    await loadSettings();
    initSettingsUI();
  })();
})();
</script>

ndum-label {\n    font-size: 0.7333rem;\n    font-weight: 700;\n    text-transform: uppercase;\n    letter-spacing: 0.04em;\n    color: var(--flag);\n    margin-bottom: 4px !important;\n  }\n\n  .footer-nav {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    margin-top: 24px;\n    padding-top: 16px;\n    border-top: 1px solid var(--border);\n  }\n  .navbtn {\n    background: var(--surface);\n    border: 1px solid var(--border);\n    padding: 9px 18px;\n    border-radius: 8px;\n    font-weight: 600;\n    font-size: 0.9rem;\n    cursor: pointer;\n    color: var(--ink);\n    font-family: inherit;\n  }\n  .navbtn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-dark); }\n  .navbtn:disabled { opacity: 0.4; cursor: not-allowed; }\n  .navbtn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }\n  .navbtn.primary:hover { background: var(--accent-dark); }\n  .position { color: var(--muted); font-size: 0.8667rem; }\n\n  .empty-state {\n    text-align: center;\n    color: var(--muted);\n    padding: 60px 20px;\n    font-size: 0.9667rem;\n  }\n</style>\n</head>\n<body>\n<div class=\"bg-fill\"></div>\n<div class=\"cw-banner\">\n  <div class=\"cw-banner-inner\">\n    <div class=\"cw-brand\">\n      <span class=\"cw-banner-icon\" style=\"font-size:26px;line-height:30px;display:inline-block;text-align:center;\">🦴</span>\n      <span class=\"cw-banner-title\">OrthoWorld</span>\n      <a href=\"#\" class=\"cw-home-link\" title=\"Return to main menu\" onclick=\"event.preventDefault(); parent.postMessage('cw-go-home', '*');\">\u2190 <span class=\"home-label\">All Quizzes</span></a>\n    </div>\n    <div class=\"cw-banner-score\">\n      <div class=\"score-pill\">\n        <div class=\"stat\"><div class=\"num\" id=\"stat-answered\">0</div><div class=\"lbl\">Answered</div></div>\n        <div class=\"divider\"></div>\n        <div class=\"stat\"><div class=\"num\" id=\"stat-correct\">0</div><div class=\"lbl\">Correct</div></div>\n        <div class=\"divider\"></div>\n        <div class=\"stat\"><div class=\"num\" id=\"stat-pct\">&mdash;</div><div class=\"lbl\">Score</div></div>\n      </div>\n    </div>\n    <div class=\"cw-settings\">\n      <button id=\"settings-toggle\" class=\"settings-gear\" title=\"Settings\" aria-label=\"Settings\">\u2699\ufe0f</button>\n      <div id=\"settings-panel\" class=\"settings-panel hidden\">\n        <div class=\"settings-row\">\n          <span class=\"settings-label\">Text size</span>\n          <div class=\"settings-stepper\">\n            <button id=\"font-dec\" aria-label=\"Decrease text size\">A\u2212</button>\n            <span id=\"font-pct\">100%</span>\n            <button id=\"font-inc\" aria-label=\"Increase text size\">A+</button>\n          </div>\n        </div>\n        <div class=\"settings-row\">\n          <span class=\"settings-label\">Appearance</span>\n          <div class=\"settings-seg\" id=\"theme-seg\">\n            <button data-theme-choice=\"system\">System</button>\n            <button data-theme-choice=\"light\">Light</button>\n            <button data-theme-choice=\"dark\">Dark</button>\n          </div>\n        </div>\n      </div>\n    </div>\n  </div>\n</div>\n<div id=\"app\">\n  <header class=\"top\">\n    <div>\n      <h1>2017 Practice Exam</h1>\n      <div class=\"sub\">115 questions (Q1\u201320, Q41\u2013137; Q21\u201340 not provided; Q70, Q71, Q137 excluded \u2014 no usable question/answer in the source) \u00b7 115 with a keyed answer \u00b7 pick an answer, then confirm to reveal the explanation</div>\n    </div>\n  </header>\n\n  <div class=\"layout\">\n    <div class=\"nav-panel\">\n      <div class=\"filter-tabs\" id=\"filter-tabs\"></div>\n      <div class=\"grid-label\">Questions</div>\n      <div class=\"qgrid\" id=\"qgrid\"></div>\n      <div class=\"legend\">\n        <div><span class=\"sw\" style=\"background:var(--correct-bg);border:1px solid var(--correct-border)\"></span>Correct</div>\n        <div><span class=\"sw\" style=\"background:var(--incorrect-bg);border:1px solid var(--incorrect-border)\"></span>Incorrect</div>\n        <div><span class=\"sw\" style=\"background:var(--nokey-bg);border:1px solid var(--nokey-border)\"></span>No key / reviewed</div>\n        <div><span class=\"sw\" style=\"background:var(--flag)\"></span>Flagged</div>\n      </div>\n      <button class=\"reset-btn\" id=\"reset-btn\">Reset all progress</button>\n    </div>\n\n    <div class=\"qpanel\" id=\"qpanel\"><!-- rendered by JS --></div>\n  </div>\n</div>\n\n<script>\n<\/script>\n<script>\nconst QUIZ_DATA = [{\"number\":\"1\",\"stem\":\"A patient under general anaesthesia rapidly develops elevated core body temperature, muscle rigidity and sympathetic nervous system activation. Which of the following statements is correct regarding this presentation?\",\"options\":[{\"letter\":\"A\",\"text\":\"this condition is associated with hypercarbia, hypoxemia and rhabdomyolysis\"},{\"letter\":\"B\",\"text\":\"this condition is inherited according to an autosomal recessive pattern\"},{\"letter\":\"C\",\"text\":\"this condition is most commonly triggered by volatile anaesthetic such as nitrous oxide or xenon gas\"},{\"letter\":\"D\",\"text\":\"this condition is associated with arrhythmias, hypokalemia, and alkalosis\"}],\"correct\":\"A\",\"explanation\":\"<p>--- Agrees with original key (A).</p>\\n<p>This describes malignant hyperthermia (MH). The hypermetabolic state produces increased CO\\u2082 production (hypercarbia), high oxygen consumption with hypoxemia, and muscle breakdown (rhabdomyolysis) with hyperCKemia (Rosenberg et al., <em>Orphanet Journal of Rare Diseases</em>, 2015; Riazi et al., <em>GeneReviews</em>, 2025).</p>\\n<ul>\\n<li><strong>B is incorrect:</strong> In humans MH is inherited in an <strong>autosomal dominant</strong> pattern (most commonly RYR1 variants); the recessive pattern applies to pigs (Rosenberg et al., 2015).</li>\\n\\n<li><strong>C is incorrect:</strong> Triggers are <strong>potent volatile agents (halothane, sevoflurane, isoflurane, desflurane, enflurane) and succinylcholine</strong>. Nitrous oxide and xenon are considered non-triggering (&quot;safe&quot;) agents (Riazi et al., <em>GeneReviews</em>, 2025).</li>\\n\\n<li><strong>D is incorrect:</strong> MH causes <strong>hyperkalemia and metabolic (lactic) acidosis</strong>, not hypokalemia and alkalosis; arrhythmias occur but are driven by hyperkalemia (Litman &amp; Rosenberg, <em>JAMA</em>, 2005).</li>\\n</ul>\\n<p>Background: Rosenberg et al., &quot;Malignant Hyperthermia: A Review,&quot; <em>Orphanet Journal of Rare Diseases</em>, 2015. Treatment is immediate discontinuation of the trigger, IV dantrolene, active cooling, and hyperventilation.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"2\",\"stem\":\"It is recommended that patients stop this herbal medicine, as there is a potential risk of increased bleeding due to its effect on platelet aggregation.\",\"options\":[{\"letter\":\"A\",\"text\":\"Gingko\"},{\"letter\":\"B\",\"text\":\"Kava\"},{\"letter\":\"C\",\"text\":\"St. John's Wort\"},{\"letter\":\"D\",\"text\":\"Echinacea\"}],\"correct\":\"A\",\"explanation\":\"<p>--- Agrees with original key (A).</p>\\n<p>Ginkgo biloba&#x27;s ginkgolide B is a potent platelet-activating-factor (PAF) antagonist, the mechanism implicated in perioperative bleeding; case reports include spontaneous intracranial hemorrhage and post-operative bleeding (Ang-Lee et al., <em>JAMA</em>, 2001). Ginkgo is on the SPAQI consensus list of supplements to hold before surgery (Cummings et al., SPAQI Consensus Statement, 2021).</p>\\n<ul>\\n<li><strong>B (Kava):</strong> Associated with hepatotoxicity and prolonged anesthetic/sedative effects (GABA potentiation), not platelet-mediated bleeding.</li>\\n\\n<li><strong>C (St. John&#x27;s Wort):</strong> A potent CYP450/P-glycoprotein inducer causing drug-interaction concerns (e.g., reduced levels of cyclosporine, warfarin, oral contraceptives), not a platelet effect.</li>\\n\\n<li><strong>D (Echinacea):</strong> Concerns relate to immunomodulation, hepatotoxicity, and allergy, not platelet function.</li>\\n</ul>\\n<p>Background: Ang-Lee et al., &quot;Herbal Medicines and Perioperative Care,&quot; <em>JAMA</em>, 2001. Classic teaching pairs ginkgo, garlic, and ginseng as the &quot;three G&#x27;s&quot; affecting hemostasis; ginkgo is typically stopped \\u226536 hours before surgery.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"3\",\"stem\":\"Following completion of a surgical procedure, what are essential elements of the post-operative safety checklist?\",\"options\":[{\"letter\":\"A\",\"text\":\"Procedure completed, instrument and sponge counts\"},{\"letter\":\"B\",\"text\":\"Names of surgical team members and anesthesia involved in the case\"},{\"letter\":\"C\",\"text\":\"The checklist must be performed within 24 hours of completion of the case\"},{\"letter\":\"D\",\"text\":\"It must be conducted by the attending surgeon with the attending anaesthetist present\"}],\"correct\":\"A\",\"explanation\":\"<p>--- Agrees with original key (A).</p>\\n<p>The WHO Surgical Safety Checklist &quot;Sign Out,&quot; performed before the patient leaves the OR, has the nurse verbally confirm the <strong>name of the procedure recorded, completeness of needle/sponge/instrument counts, correct specimen labeling, equipment issues,</strong> and key recovery concerns (Haynes et al., <em>NEJM</em>, 2009).</p>\\n<ul>\\n<li><strong>B is incorrect:</strong> Team introductions by name and role occur during the pre-incision <strong>time-out</strong>, not the post-operative sign-out (Haynes et al., 2009).</li>\\n\\n<li><strong>C is incorrect:</strong> Sign-out is completed <strong>before the patient leaves the operating room</strong>, not within 24 hours.</li>\\n\\n<li><strong>D is incorrect:</strong> The sign-out is typically <strong>led by the nurse</strong> with the whole team; it does not require the attending surgeon and attending anaesthetist specifically.</li>\\n</ul>\\n<p>Background: Haynes et al., &quot;A Surgical Safety Checklist to Reduce Morbidity and Mortality in a Global Population,&quot; <em>NEJM</em>, 2009.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"4\",\"stem\":\"Routine pre-operative lab testing and imaging for an elective coronary artery bypass graft would not include:\",\"options\":[{\"letter\":\"A\",\"text\":\"Type and cross for packed red blood cells\"},{\"letter\":\"B\",\"text\":\"INR / PTT\"},{\"letter\":\"C\",\"text\":\"Chest X-ray\"},{\"letter\":\"D\",\"text\":\"CT chest\"},{\"letter\":\"E\",\"text\":\"ECG\"}],\"correct\":\"D\",\"explanation\":\"<p>--- Agrees with original key (D).</p>\\n<p>Routine pre-CABG workup includes a <strong>type and cross</strong> (anticipated transfusion), <strong>coagulation studies (INR/PTT)</strong>, a <strong>chest X-ray</strong>, and an <strong>ECG</strong>, along with CBC, chemistry/renal panel, and often HbA1c and lipid panel (Chaer et al., Society for Vascular Surgery perioperative guidance, 2023). <strong>CT chest is not a routine pre-operative study</strong> and is reserved for specific indications (e.g., re-operative sternotomy planning, suspected aortic pathology).</p>\\n<ul>\\n<li><strong>A, B, C, E are incorrect choices</strong> because each is a standard component of routine pre-CABG assessment.</li>\\n</ul>\\n<p>Background: routine surgical labs/imaging as summarized in the SVS multidisciplinary perioperative guide (Chaer et al., 2023).</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"5\",\"stem\":\"Describe how the kidney is involved in control of pH.\",\"options\":[{\"letter\":\"A\",\"text\":\"sodium is transported into the filtrate in the distal convoluted tubule\"},{\"letter\":\"B\",\"text\":\"glycine is converted into ammonium, which buffers the filtrate\"},{\"letter\":\"C\",\"text\":\"protons are secreted into the filtrate in the distal convoluted tubule\"},{\"letter\":\"D\",\"text\":\"ammonium is the only important buffer of protons in the filtrate\"}],\"correct\":\"C\",\"explanation\":\"<p>--- Agrees with original key (C).</p>\\n<p>In the distal tubule and collecting duct, <strong>type A (\\u03b1) intercalated cells actively secrete H\\u207a into the lumen</strong> via apical H\\u207a-ATPase and H\\u207a/K\\u207a-ATPase, while bicarbonate is returned to blood via basolateral AE1 (Lee, <em>Renal Tubular Acidosis in the Neonate</em>, AAP, 2024; Wagner et al., <em>Nature Reviews Nephrology</em>, 2023).</p>\\n<ul>\\n<li><strong>A is incorrect:</strong> In the distal tubule sodium is <strong>reabsorbed from the filtrate</strong> (e.g., via NCC/ENaC), not transported into it.</li>\\n\\n<li><strong>B is incorrect:</strong> Ammoniagenesis derives ammonium chiefly from <strong>glutamine</strong> (via glutaminase and glutamate dehydrogenase) in the proximal tubule, not glycine (Lee, 2024).</li>\\n\\n<li><strong>D is incorrect:</strong> Ammonium is a major buffer but <strong>not the only one</strong>; phosphate and other titratable acids also buffer secreted protons (Lee, 2024).</li>\\n</ul>\\n<p>Background: Wagner et al., &quot;The pathophysiology of distal renal tubular acidosis,&quot; <em>Nature Reviews Nephrology</em>, 2023.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"6\",\"stem\":\"When performing surgical briefs prior to the start of an operation, which of the following is not required?\",\"options\":[{\"letter\":\"A\",\"text\":\"Names and roles of the team members\"},{\"letter\":\"B\",\"text\":\"Have antibiotics been given\"},{\"letter\":\"C\",\"text\":\"Anticipated problems / complications\"},{\"letter\":\"D\",\"text\":\"Anticipated duration of the surgical procedure\"}],\"correct\":\"D\",\"explanation\":\"<p>--- Agrees with original key (D), with a caveat noted below.</p>\\n<p>Among these options, <strong>anticipated duration is the least essential mandatory element</strong>; team introductions by name/role (a), confirmation that prophylactic antibiotics have been given within 60 minutes (b), and review of anticipated critical events/complications (c) are core required checks (Haynes et al., <em>NEJM</em>, 2009).</p>\\n<ul>\\n<li><strong>A, B, C are incorrect choices</strong> because they are explicitly required components of the pre-incision time-out/brief.</li>\\n</ul>\\n<p><strong>Caveat / partial disagreement:</strong> In the actual WHO checklist the surgeon does review <strong>operative duration</strong> alongside critical steps and anticipated blood loss during the time-out (Haynes et al., 2009). Anticipated duration is therefore <em>part of</em> the WHO time-out, so calling it &quot;not required&quot; is arguable. Option D remains the best answer because a, b, and c are unambiguously mandatory safety checks, whereas anticipated duration is the most dispensable of the four. The item is worth flagging as imperfectly worded.</p>\\n<p>Background: Haynes et al., <em>NEJM</em>, 2009 (WHO Surgical Safety Checklist elements).</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"7\",\"stem\":\"Which of the following is true with respect to von Willebrand's Disease?\",\"options\":[{\"letter\":\"A\",\"text\":\"It is an autosomal recessive disorder of Factor XI deficiency\"},{\"letter\":\"B\",\"text\":\"It is the third most common congenital bleeding disorder, behind hemophilia A and B\"},{\"letter\":\"C\",\"text\":\"It is characterized by a defect in platelet adhesion\"},{\"letter\":\"D\",\"text\":\"In severe cases, treatment options include transfusion of FFP\"},{\"letter\":\"E\",\"text\":\"In severe cases treatment options include transfusion of platelets\"}],\"correct\":\"C\",\"explanation\":\"<p>--- Agrees with original key (C).</p>\\n<p>Von Willebrand disease (VWD) is defined by <strong>defective platelet adhesion and aggregation</strong> due to quantitative or qualitative von Willebrand factor defects; VWF mediates platelet binding to subendothelial collagen and carries factor VIII (Leebeek &amp; Eikenboom, <em>NEJM</em>, 2016).</p>\\n<ul>\\n<li><strong>A is incorrect:</strong> VWD is not Factor XI deficiency (that is hemophilia C). Inheritance is generally <strong>autosomal</strong> (dominant for most type 1/2, recessive for type 3), not defined by Factor XI (Leebeek &amp; Eikenboom, 2016).</li>\\n\\n<li><strong>B is incorrect:</strong> VWD is the <strong>most common</strong> inherited bleeding disorder, not the third (Connell et al., ASH/ISTH/NHF/WFH Guidelines, 2021).</li>\\n\\n<li><strong>D and E are incorrect:</strong> Treatment increases VWF levels with <strong>desmopressin</strong> or <strong>VWF-containing concentrates</strong> (VWF/FVIII); FFP and platelet transfusion are not the primary/severe-case therapies (Leebeek &amp; Eikenboom, 2016).</li>\\n</ul>\\n<p>Background: Leebeek &amp; Eikenboom, &quot;Von Willebrand&#x27;s Disease,&quot; <em>NEJM</em>, 2016.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"8\",\"stem\":\"Accurately describe how body composition changes with advanced age. (ICW = intracellular water; ECW = extracellular water; TBW = total body water)\",\"options\":[{\"letter\":\"A\",\"text\":\"decreased ICW, increased ECW, decreased TBW, decreased protein, decreased fat\"},{\"letter\":\"B\",\"text\":\"decreased ICW, decreased ECW, decreased TBW, decreased protein, increased fat\"},{\"letter\":\"C\",\"text\":\"decreased ICW, increased ECW, unchanged TBW, decreased protein, increased fat\"},{\"letter\":\"D\",\"text\":\"increased ICW, decreased ECW, unchanged TBW, decreased protein, decreased fat\"}],\"correct\":\"B\",\"explanation\":\"<p>--- Agrees with original key (B).</p>\\n<p>With aging, <strong>total body water falls</strong> (driven largely by loss of lean/muscle mass and intracellular water), <strong>body protein/lean mass declines</strong>, and <strong>fat mass rises</strong>. Only option B captures decreased TBW with increased fat.</p>\\n<ul>\\n<li><strong>A is incorrect:</strong> Fat <strong>increases</strong> with age, not decreases.</li>\\n\\n<li><strong>C is incorrect:</strong> TBW <strong>decreases</strong>; it is not unchanged.</li>\\n\\n<li><strong>D is incorrect:</strong> ICW <strong>decreases</strong>; it does not increase, and TBW is not unchanged.</li>\\n</ul>\\n<p>Note: the intracellular-to-extracellular water ratio shifts (proportion of ECW relatively rises as ICW falls), but among the offered choices B is the only internally consistent answer on the discriminating variables (\\u2193TBW, \\u2191fat, \\u2193protein, \\u2193ICW).</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"9\",\"stem\":\"A young diabetic patient is seen in the ER with nausea and vomiting, pronounced thirst, excessive urine production and severe abdominal pain. What is expected to be seen on blood tests and ABGs?\",\"options\":[{\"letter\":\"A\",\"text\":\"metabolic alkalosis with a compensatory respiratory acidosis and elevated blood glucose levels\"},{\"letter\":\"B\",\"text\":\"metabolic acidosis with a compensatory respiratory alkalosis and elevated blood levels of sodium and potassium\"},{\"letter\":\"C\",\"text\":\"metabolic acidosis with a compensatory respiratory alkalosis and elevated blood glucose levels\"},{\"letter\":\"D\",\"text\":\"metabolic acidosis with elevated blood levels of phosphate, magnesium, and calcium\"}],\"correct\":\"C\",\"explanation\":\"<p>--- Agrees with original key (C).</p>\\n<p>This is diabetic ketoacidosis: a <strong>high-anion-gap metabolic acidosis</strong> from ketoacid accumulation with <strong>compensatory respiratory alkalosis</strong> (Kussmaul hyperventilation lowering PaCO\\u2082) and <strong>hyperglycemia</strong>.</p>\\n<ul>\\n<li><strong>A is incorrect:</strong> The primary disturbance is a metabolic acidosis, not alkalosis.</li>\\n\\n<li><strong>B is incorrect:</strong> The acid--base description is right, but the hallmark lab is <strong>elevated glucose</strong>; serum sodium is often low (dilutional/pseudohyponatremia) and total-body potassium is depleted despite variable serum values.</li>\\n\\n<li><strong>D is incorrect:</strong> DKA is not characterized by elevated phosphate, magnesium, and calcium; phosphate and potassium are typically <strong>depleted overall</strong>.</li>\\n</ul>\\n<p>Note on potassium (relevant to Question 18 in the exam): serum potassium may be normal or high initially but falls rapidly with insulin therapy as potassium shifts intracellularly.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"10\",\"stem\":\"When obtaining informed consent, which of the following is not required?\",\"options\":[{\"letter\":\"A\",\"text\":\"Discuss anticipated risks of the procedure\"},{\"letter\":\"B\",\"text\":\"Discuss alternatives to the treatment proposed\"},{\"letter\":\"C\",\"text\":\"Discuss the anticipated length of time required for the procedure\"},{\"letter\":\"D\",\"text\":\"Discuss post-operative care plans\"}],\"correct\":\"C\",\"explanation\":\"<p>--- Agrees with original key (C).</p>\\n<p>Valid informed consent requires <strong>capacity, disclosure (nature of the procedure, material risks, benefits, and alternatives, including no treatment), understanding, and voluntariness (freedom from coercion)</strong>. Post-operative care and recovery expectations are appropriately part of disclosure. The <strong>anticipated length of the procedure is not a required element</strong> of informed consent.</p>\\n<ul>\\n<li><strong>A, B, D are incorrect choices</strong> because disclosure of risks, alternatives, and the expected post-operative course are standard components of consent.</li>\\n</ul>\\n<p>Background: standard elements of informed consent (capacity, disclosure, understanding, free of coercion), consistent with Schwartz&#x27;s <em>Principles of Surgery</em> medico-legal chapter.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"11\",\"stem\":\"Which of the following are not associated with an increased risk of retained surgical sponges following an operation?\",\"options\":[{\"letter\":\"A\",\"text\":\"Emergency surgery\"},{\"letter\":\"B\",\"text\":\"Resident or fellow acting in role as lead surgeon\"},{\"letter\":\"C\",\"text\":\"Multiple surgeons involved in the same case\"},{\"letter\":\"D\",\"text\":\"Extended case durations covering multiple nursing shifts\"}],\"correct\":\"B\",\"explanation\":\"<p>--- Agrees with the original key.</p>\\n<p>The landmark case-control study of retained instruments and sponges (Gawande et al., New England Journal of Medicine, 2003) identified three independent risk factors on multivariate analysis: emergency procedure, unplanned change in the operation, and higher body-mass index. A subsequent meta-analysis (Moffatt-Bruce et al., Journal of Surgical Research, 2014) confirmed intraoperative blood loss &gt;500 mL, longer operative duration, more than one subprocedure, more than one surgical team, incorrect counts, and unexpected intraoperative events as significant contributors. Trainee presence/level was examined and was <strong>not</strong> shown to independently raise the risk of a retained item, making B the correct &quot;not associated&quot; choice.</p>\\n<ul>\\n<li><strong>a. Emergency surgery</strong> --- Incorrect (it <em>is</em> a risk factor); associated with roughly an 8- to 9-fold increased risk.</li>\\n\\n<li><strong>c. Multiple surgical teams</strong> --- Incorrect (it <em>is</em> a risk factor) in pooled analysis.</li>\\n\\n<li><strong>d. Extended cases across nursing shifts / long duration</strong> --- Incorrect (it <em>is</em> a risk factor); prolonged operative time raises risk.</li>\\n</ul>\\n<p>Background: Sponges are the most commonly retained item (~69%). Adjuncts such as standardized counts, radiographic verification, and radiofrequency-tagged sponges are used for prevention.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"12\",\"stem\":\"How long can Vancomycin Resistant Enterococcus (VRE) survive on a countertop?\",\"options\":[{\"letter\":\"A\",\"text\":\"10 minutes\"},{\"letter\":\"B\",\"text\":\"24 hours\"},{\"letter\":\"C\",\"text\":\"48 hours\"},{\"letter\":\"D\",\"text\":\"7 days\"}],\"correct\":\"D\",\"explanation\":\"<p>--- Agrees with the original key.</p>\\n<p>In the classic controlled study of VRE environmental survival (Noskin et al., Infection Control and Hospital Epidemiology, 1995), <em>Enterococcus faecium</em> persisted on countertops for 7 days and <em>E. faecalis</em> for 5 days; both survived at least 60 minutes on fingertips and 24 hours on bedrails. Broader reviews note VRE viability on dry surfaces ranging from days to as long as 4 months, underscoring why environmental reservoirs and contact precautions matter for nosocomial transmission.</p>\\n<ul>\\n<li><strong>a. 10 minutes / b. 24 hours / c. 48 hours</strong> --- All incorrect; they grossly understate enterococcal environmental persistence.</li>\\n</ul>\\n<p>Background: Enterococci are relatively tolerant of heat, chlorine, and some alcohol preparations, so mechanical cleaning plus effective disinfection and hand hygiene are required for control.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"13\",\"stem\":\"According to the NRC Classification of Operative Wounds, entrance of the genitourinary or biliary tracts in the presence of infected urine or bile, is classified as:\",\"options\":[{\"letter\":\"A\",\"text\":\"Class I wound\"},{\"letter\":\"B\",\"text\":\"Class II wound\"},{\"letter\":\"C\",\"text\":\"Class III wound\"},{\"letter\":\"D\",\"text\":\"Class IV wound\"}],\"correct\":\"C\",\"explanation\":\"<p>--- Agrees with the original key.</p>\\n<p>Under the CDC/NRC surgical wound classification, entry into the genitourinary or biliary tract <em>under controlled conditions without infection</em> is Class II (clean-contaminated). When infected urine or bile is present, gross contamination of the field converts the wound to Class III (contaminated), which encompasses gross spillage from the GI tract and incisions with acute nonpurulent inflammation.</p>\\n<ul>\\n<li><strong>a. Class I (clean)</strong> --- Incorrect; requires no entry into a hollow viscus/tract and no inflammation.</li>\\n\\n<li><strong>b. Class II (clean-contaminated)</strong> --- Incorrect; applies only when the tract is entered under controlled conditions <em>without</em> infection.</li>\\n\\n<li><strong>d. Class IV (dirty-infected)</strong> --- Incorrect; reserved for old traumatic wounds with devitalized tissue, established clinical infection (e.g., abscess/pus), or perforated viscera.</li>\\n</ul>\\n<p>Background: The distinction hinges on infected urine/bile representing contamination rather than pre-existing purulent infection or perforation (which would be Class IV).</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"14\",\"stem\":\"An ASA class 4 patient under the American Society of Anesthesiologists risk classification for surgical patients refers to:\",\"options\":[{\"letter\":\"A\",\"text\":\"A normal healthy patient\"},{\"letter\":\"B\",\"text\":\"A patient with mild systemic disease\"},{\"letter\":\"C\",\"text\":\"A patient with severe systemic disease\"},{\"letter\":\"D\",\"text\":\"A patient with severe systemic disease that is a constant threat to life\"},{\"letter\":\"E\",\"text\":\"A moribund patient who is not expected to survive without the operation\"}],\"correct\":\"D\",\"explanation\":\"<p>--- Agrees with the original key.</p>\\n<p>The ASA Physical Status Classification (per the American Society of Anesthesiologists) defines Class IV as &quot;a patient with severe systemic disease that is a constant threat to life&quot; (e.g., recent MI/CVA/TIA within 3 months, ongoing cardiac ischemia, severe valve dysfunction, sepsis, DIC, ARDS, ESRD not on scheduled dialysis).</p>\\n<ul>\\n<li><strong>a. ASA I</strong> --- normal healthy patient.</li>\\n\\n<li><strong>b. ASA II</strong> --- mild systemic disease without substantive functional limitation.</li>\\n\\n<li><strong>c. ASA III</strong> --- severe systemic disease with substantive functional limitation but not an immediate constant threat to life.</li>\\n\\n<li><strong>e. ASA V</strong> --- moribund patient not expected to survive without the operation.</li>\\n</ul>\\n<p>Background: The suffix &quot;E&quot; denotes an emergency operation; ASA VI designates a declared brain-dead organ donor.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"15\",\"stem\":\"Which of the following is associated with Malignant hyperthermia?\",\"options\":[{\"letter\":\"A\",\"text\":\"It is an autosomal recessive disorder\"},{\"letter\":\"B\",\"text\":\"The incidence is approximately 1:10,000 in adults\"},{\"letter\":\"C\",\"text\":\"Triggering agents include sevoflurane and isoflurane\"},{\"letter\":\"D\",\"text\":\"Screening blood testing for individuals at risk is expensive and time consuming, but reliable\"},{\"letter\":\"E\",\"text\":\"The classic MH crisis entails hypotension, bradycardia, and elevation of end-tidal CO2\"}],\"correct\":\"C\",\"explanation\":\"<p>--- Agrees with the original key.</p>\\n<p>Malignant hyperthermia is precipitated by volatile inhalational anesthetics --- halothane, isoflurane, sevoflurane, desflurane, enflurane --- alone or with the depolarizing muscle relaxant succinylcholine (GeneReviews, 2025; Pinyavat et al., Critical Care Medicine, 2024). Triggers cause uncontrolled RYR1-mediated calcium release from the sarcoplasmic reticulum, producing hypermetabolism.</p>\\n<ul>\\n<li><strong>a. Autosomal recessive</strong> --- Incorrect; human MH susceptibility is inherited in an autosomal dominant pattern (most commonly RYR1 variants).</li>\\n\\n<li><strong>b. Incidence ~1:10,000 in adults</strong> --- Incorrect as stated; genetic susceptibility is estimated near 1:2000, whereas clinical reactions during anesthesia are considerably rarer in adults, so this figure is not accurate.</li>\\n\\n<li><strong>d. Blood screening is reliable</strong> --- Incorrect; definitive susceptibility testing is the in-vitro/caffeine-halothane contracture test on a fresh muscle biopsy (supplemented by genetic testing), not a simple blood test.</li>\\n\\n<li><strong>e. Hypotension/bradycardia</strong> --- Incorrect; the classic crisis features tachycardia, hypercarbia (rising end-tidal CO2), muscle rigidity, and hyperthermia, with hyperkalemia and arrhythmia.</li>\\n</ul>\\n<p>Background: Treatment is immediate cessation of the trigger, IV dantrolene, active cooling, and hyperventilation; untreated mortality can exceed 80%.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"16\",\"stem\":\"Which of the following are true with respect to clinical manifestations of hyponatremia?\",\"options\":[{\"letter\":\"A\",\"text\":\"Headache, seizures and decreased intracranial pressure\"},{\"letter\":\"B\",\"text\":\"Constipation, abdominal cramping\"},{\"letter\":\"C\",\"text\":\"Hypotension, tachycardia\"},{\"letter\":\"D\",\"text\":\"Anorexia, nausea, vomiting\"},{\"letter\":\"E\",\"text\":\"Visual disturbances, auditory hallucinations\"}],\"correct\":\"D\",\"explanation\":\"<p>--- Agrees with the original key.</p>\\n<p>Symptomatic hyponatremia produces cerebral edema; the most consistent early symptoms are headache, nausea, vomiting, and generalized weakness, progressing to somnolence, seizures, and coma (Adrogu\\u00e9 et al., JAMA, 2022). Anorexia, nausea, and vomiting are therefore correct.</p>\\n<ul>\\n<li><strong>a. Decreased ICP</strong> --- Incorrect; hypotonic water entry into brain cells <em>increases</em> intracranial pressure. Headache and seizures do occur, but the &quot;decreased ICP&quot; component makes the option false.</li>\\n\\n<li><strong>b. Constipation/abdominal cramping</strong> --- Incorrect; not characteristic of hyponatremia.</li>\\n\\n<li><strong>c. Hypotension/tachycardia</strong> --- Incorrect; these reflect volume status (e.g., hypovolemia) rather than the neurologic manifestations of low sodium itself.</li>\\n\\n<li><strong>e. Auditory hallucinations</strong> --- Incorrect; not a recognized hallmark.</li>\\n</ul>\\n<p>Background: Severity depends on the rapidity of onset --- acute (&lt;48 h) hyponatremia is more dangerous because the brain has not adapted.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"17\",\"stem\":\"Which statement is correct regarding postoperative hyponatremia?\",\"options\":[{\"letter\":\"A\",\"text\":\"the most common initial symptoms are severe thirst and muscle twitching\"},{\"letter\":\"B\",\"text\":\"menstruating women are at special risk of developing postoperative hyponatremia\"},{\"letter\":\"C\",\"text\":\"it is caused by reduced activity of arginine vasopressin\"},{\"letter\":\"D\",\"text\":\"it can be improved by a mannitol infusion, which helps to retain sodium\"}],\"correct\":\"B\",\"explanation\":\"<p>--- Agrees with the original key.</p>\\n<p>In the defining case-control study of postoperative hyponatremic encephalopathy (Ayus, Wheeler, Arieff, Annals of Internal Medicine, 1992), menstruant women were approximately 25 times more likely to die or sustain permanent brain damage than men or postmenopausal women once encephalopathy developed. This heightened vulnerability in reproductive-age women is echoed in later reviews (Moritz &amp; Ayus, New England Journal of Medicine, 2015).</p>\\n<p>Note on wording: The strongest evidence is that menstruant women have a far worse <em>outcome</em> (encephalopathy, death, brain damage), rather than a higher <em>incidence</em> of hyponatremia per se --- but B remains the correct choice among these options.</p>\\n<ul>\\n<li><strong>a. Thirst and muscle twitching</strong> --- Incorrect; the most consistent early symptoms are headache, nausea, vomiting, and weakness.</li>\\n\\n<li><strong>c. Reduced AVP activity</strong> --- Incorrect; postoperative hyponatremia results from <em>increased</em>, nonosmotic arginine vasopressin (ADH) release combined with hypotonic fluid administration.</li>\\n\\n<li><strong>d. Mannitol to retain sodium</strong> --- Incorrect; severely symptomatic (encephalopathic) hyponatremia is treated with hypertonic (3%) saline, not mannitol.</li>\\n</ul>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"18\",\"stem\":\"Which statement is correct regarding abnormalities in serum potassium levels?\",\"options\":[{\"letter\":\"A\",\"text\":\"ECG evidence of lost P waves and broad slurring of QRS requires immediate treatment with intravenous infusion of calcium salts\"},{\"letter\":\"B\",\"text\":\"ECG evidence of peaked T waves requires immediate promotion of renal kaliuresis with loop diuretics\"},{\"letter\":\"C\",\"text\":\"potassium infusion to treat hypokalemia should not exceed a rate of 1 mmol/kg/hr to avoid overcorrection\"},{\"letter\":\"D\",\"text\":\"diabetics in ketoacidosis may present with normal serum potassium but rapidly develop hyperkalemia as insulin is administered and glucose shifts into cells\"}],\"correct\":\"A\",\"explanation\":\"<p>--- Agrees with the original key.</p>\\n<p>Loss of P waves with a widened/slurred QRS signifies advanced, life-threatening hyperkalemia; the immediate intervention is IV calcium (gluconate or chloride) to stabilize the myocardial membrane and reduce arrhythmia risk (Cochrane, 2005; AAP, 2023). This precedes potassium-shifting and potassium-removing therapies.</p>\\n<ul>\\n<li><strong>b. Peaked T waves \\u2192 loop diuretics</strong> --- Incorrect priority; membrane stabilization with calcium (for ECG changes) and intracellular shifting with insulin/glucose plus a beta-agonist are the immediate steps. Diuresis is a slower, adjunctive potassium-removal measure.</li>\\n\\n<li><strong>c. KCl infusion up to 1 mmol/kg/hr</strong> --- Incorrect; peripheral potassium replacement is generally limited to about 10 mmol/hr (up to ~20 mmol/hr via a central line with monitoring). 1 mmol/kg/hr (~70 mmol/hr in a 70-kg adult) is dangerously high.</li>\\n\\n<li><strong>d. Insulin causing hyperkalemia</strong> --- Incorrect and physiologically backwards; DKA patients often have normal or elevated measured potassium with a total-body deficit, and insulin drives potassium <em>into</em> cells, precipitating <strong>hypokalemia</strong>.</li>\\n</ul>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"19\",\"stem\":\"Anticipated surgical site infection rate for a \\\"dirty\\\" wound, such as perforated diverticulitis, would be:\",\"options\":[{\"letter\":\"A\",\"text\":\"2-4%\"},{\"letter\":\"B\",\"text\":\"4-12%\"},{\"letter\":\"C\",\"text\":\"12-20%\"},{\"letter\":\"D\",\"text\":\"25-40%\"}],\"correct\":\"B\",\"explanation\":\"<p>Standard wound-classification infection rates place a dirty/infected (Class IV) wound at roughly 25--40%. A Cochrane overview table lists Class 4/dirty-infected wounds at 30--40% (and clean-contaminated Class II at ~10%). Contemporary series of dirty emergency surgery for perforation peritonitis report SSI rates of ~17--25%, and prospective diverticulitis-colectomy cohorts report ~21% overall (rising to ~46% with multiple risk factors). By any of these benchmarks, option D (25--40%) is the closest match.</p>\\n<ul>\\n<li><strong>a. 2-4%</strong> --- Corresponds to a clean (Class I) wound.</li>\\n\\n<li><strong>b. 4-12%</strong> --- Corresponds to a clean-contaminated (Class II) wound; this is the option marked correct on the exam but understates the infection risk of a dirty wound.</li>\\n\\n<li><strong>c. 12-20%</strong> --- Corresponds roughly to a contaminated (Class III) wound.</li>\\n\\n<li><strong>d. 25-40%</strong> --- Correct; matches the accepted dirty/infected wound range.</li>\\n</ul>\\n<p>Rationale for disagreement: The exam&#x27;s designated answer (B) reflects the clean-contaminated range, not the dirty category the question describes. The classic Cruse-Foord and CDC/HICPAC-derived teaching, and the supporting literature above, assign dirty wounds the highest infection rate (~\\u226525%).</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"20\",\"stem\":\"Appropriate antibiotic prophylaxis for colorectal surgery would include:\",\"options\":[{\"letter\":\"A\",\"text\":\"Cefazolin plus metronidazole\"},{\"letter\":\"B\",\"text\":\"Vancomycin plus cefuroxime\"},{\"letter\":\"C\",\"text\":\"Piperacillin / Tazobactam\"},{\"letter\":\"D\",\"text\":\"Ceftriaxone plus fluoroquinolone\"}],\"correct\":\"A\",\"explanation\":\"<p>--- Agrees with the original key.</p>\\n<p>Guideline-endorsed IV prophylaxis for colorectal surgery must cover both aerobes and anaerobes. The combination of cefazolin plus metronidazole achieves this and is explicitly recommended as an effective, cost-effective regimen (ASHP/IDSA/SIS/SHEA Clinical Practice Guidelines for Antimicrobial Prophylaxis in Surgery, 2013). First-generation cephalosporins alone are inadequate because they lack <em>Bacteroides fragilis</em> coverage, which the added metronidazole supplies.</p>\\n<ul>\\n<li><strong>b. Vancomycin plus cefuroxime</strong> --- Incorrect; not a standard colorectal regimen and provides inadequate/atypical anaerobic coverage. Vancomycin is reserved for MRSA-colonized patients or beta-lactam allergy, typically combined with an agent providing gram-negative and anaerobic coverage.</li>\\n\\n<li><strong>c. Piperacillin/tazobactam</strong> --- Incorrect for routine prophylaxis; broad-spectrum agents are generally avoided to limit resistance, though it is an acceptable alternative in some protocols.</li>\\n\\n<li><strong>d. Ceftriaxone plus fluoroquinolone</strong> --- Incorrect; a fluoroquinolone-based combination is a beta-lactam-allergy alternative (typically with metronidazole for anaerobes), and routine third-generation cephalosporin use is discouraged.</li>\\n</ul>\\n<p>Background: Combined oral (nonabsorbable) antibiotics with mechanical bowel preparation plus IV prophylaxis further reduces SSI in elective colorectal surgery.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"41\",\"stem\":\"With regard to clinical rejection in transplant medicine which of the following is true.\",\"options\":[{\"letter\":\"A\",\"text\":\"Chronic rejection is the most common\"},{\"letter\":\"B\",\"text\":\"Acute rejection occurs within 12 hours\"},{\"letter\":\"C\",\"text\":\"Hyper-acute rejection is triggered by the donors ABO blood group antigens\"},{\"letter\":\"D\",\"text\":\"Pre-transplant blood cross-matching does not decrease the incidence\"}],\"correct\":\"C\",\"explanation\":\"<p>--- agrees with the exam key, with a caveat noted below.</p>\\n<p>Hyperacute rejection occurs within minutes to hours of reperfusion and is caused by recipient preformed antibodies directed against donor ABO blood group antigens and/or donor HLA (MHC) antigens, which fix complement and produce vascular thrombosis and necrosis (Alelign et al., Journal of Immunology Research, 2017; Ruiz et al., Journal of Immunology Research, 2013). The statement is slightly loose --- the trigger is the recipient&#x27;s preformed antibody against the donor&#x27;s antigens, not the antigen itself --- but it is the intended and best answer.</p>\\n<ul>\\n<li><strong>b is incorrect:</strong> hyperacute rejection, not acute rejection, occurs within minutes to hours. Acute rejection is typically T-cell--mediated and occurs over days to months, rarely before postoperative day 4 (Alelign et al., Journal of Immunology Research, 2017).</li>\\n\\n<li><strong>d is incorrect:</strong> ABO typing and crossmatching are precisely what prevent hyperacute rejection; hyperacute rejection is now rare because of them (Ruiz et al., Journal of Immunology Research, 2013).</li>\\n</ul>\\n<p>Note of partial disagreement on option A: &quot;Chronic rejection is the most common&quot; is defensible depending on interpretation. Chronic rejection (chronic allograft nephropathy) is today the leading cause of late allograft loss (Pascual et al., New England Journal of Medicine, 2002; Becker et al., Clinical Biochemistry, 2016). If the item intends &quot;most common cause of graft loss,&quot; A is also true, making this a two-answer item; if it intends &quot;most common rejection episode encountered,&quot; acute rejection is more common and A is false. Answer C avoids that ambiguity and remains the single best answer.</p>\\n<p>Background reading: mechanisms and timing of hyperacute, acute, and chronic rejection (Alelign et al., 2017; Ruiz et al., 2013).</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"42\",\"stem\":\"Which one of the following oncological definitions is true?\",\"options\":[{\"letter\":\"A\",\"text\":\"In situ cancer refers to tumors in which the malignant cells are demonstrated to breach the basement membrane and penetrate into the surrounding stroma.\"},{\"letter\":\"B\",\"text\":\"Dysplasia is cells that look abnormal under a microscope but are not cancer\"},{\"letter\":\"C\",\"text\":\"Metaplasia is the uncontrolled proliferation of cells\"},{\"letter\":\"D\",\"text\":\"Neoplasia is the state of being not typical or normal (abnormality in cells tissue)\"}],\"correct\":\"B\",\"explanation\":\"<p>--- agrees with the exam key.</p>\\n<p>Dysplasia describes disordered, abnormal-appearing cells that have not yet become malignant; it is a premalignant change, not cancer.</p>\\n<ul>\\n<li><strong>a is incorrect:</strong> it describes invasive carcinoma. Carcinoma in situ by definition has not breached the basement membrane.</li>\\n\\n<li><strong>c is incorrect:</strong> metaplasia is the reversible replacement of one differentiated cell type by another (e.g., Barrett&#x27;s esophagus), not uncontrolled proliferation --- that describes neoplasia.</li>\\n\\n<li><strong>d is incorrect:</strong> the description given (being not typical/abnormal) corresponds to atypia; neoplasia is new, autonomous, uncontrolled cellular proliferation.</li>\\n</ul>\\n<p>Background reading: Schwartz&#x27;s Principles of Surgery, Oncology chapter (definitions of dysplasia, metaplasia, neoplasia, atypia, carcinoma in situ).</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"43\",\"stem\":\"The American Joint Committee on Cancer (AJCC) is one of most widely accepted and regularly updated staging systems. Which of the following statements is true with regards to the AJCC staging system (TNM)?\",\"options\":[{\"letter\":\"A\",\"text\":\"If no distant metastases are found on imaging the term MX is used.\"},{\"letter\":\"B\",\"text\":\"T is best based on the initial physical exam findings\"},{\"letter\":\"C\",\"text\":\"Many solid tumors are graded as N0 or N1 depending on the absence or presence of lymph node involvement.\"},{\"letter\":\"D\",\"text\":\"M1, M2, M3 and M4 suggest increasing abnormalities based on size, characteristics and location.\"}],\"correct\":\"C\",\"explanation\":\"<p>--- agrees with the exam key.</p>\\n<p>N status reflects regional lymph node involvement, with N0 indicating no nodal disease and higher N categories indicating progressively greater involvement.</p>\\n<ul>\\n<li><strong>a is incorrect:</strong> absence of distant metastases is M0. MX (no longer favored in current AJCC editions) denotes metastasis that cannot be assessed, not the absence of metastasis.</li>\\n\\n<li><strong>b is incorrect:</strong> T is based on physical exam or imaging and reflects the invasive component of the primary tumor, not physical exam alone.</li>\\n\\n<li><strong>d is incorrect:</strong> the M category is M0 or M1; there is no M2--M4. Increasing nodal abnormality is captured by N1, N2, N3.</li>\\n</ul>\\n<p>Background reading: Schwartz&#x27;s Principles of Surgery, Oncology chapter (AJCC TNM staging).</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"44\",\"stem\":\"Which area in the typical tertiary hospital is at highest risk for medical errors?\",\"options\":[{\"letter\":\"A\",\"text\":\"Operating room\"},{\"letter\":\"B\",\"text\":\"Intensive care unit\"},{\"letter\":\"C\",\"text\":\"Inpatient wards\"},{\"letter\":\"D\",\"text\":\"Emergency department\"}],\"correct\":\"A\",\"explanation\":\"<p>The exam keys the operating room, and there is support for the OR being a high-error environment: in a multicenter US surgical cohort, adverse events occurred in 38% of surgical admissions, with the OR the second most frequent site after general care units (Duclos et al., BMJ, 2024).</p>\\n<p>However, the more widely cited answer is the <strong>intensive care unit</strong>. The ICU is repeatedly described as the hospital setting with the highest prevalence of adverse events (estimated 15--51%), owing to illness severity, invasive procedures, polypharmacy, and workload (Roncal-Red\\u00edn et al., Critical Care, 2026; Garrouste-Orgeas et al., Annals of Intensive Care, 2012). ICU errors are also more likely to cause serious harm or death than errors elsewhere (Latif et al., Critical Care Medicine, 2013). By per-patient error rate, the ICU is the stronger answer; by raw counts within a surgical population, the general ward and OR dominate. The &quot;correct&quot; answer therefore depends on whether the question means rate or absolute number, and on the source text used. This item should be considered ambiguous.</p>\\n<p>Background reading: adverse-event epidemiology by hospital location (Duclos et al., 2024; Roncal-Red\\u00edn et al., 2026).</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"45\",\"stem\":\"A 65 yo woman has been hospitalized for 2 months following a below-knee amputation related to vascular insufficiency. Her course was complicated by STEMI. She is discharged by a new resident team who dictated the summary and arranges follow-up with the surgeon, but no follow-up is arranged with regard to her cardiac status. This is an example of an error of:\",\"options\":[{\"letter\":\"A\",\"text\":\"Diagnosis\"},{\"letter\":\"B\",\"text\":\"Treatment\"},{\"letter\":\"C\",\"text\":\"Prevention\"},{\"letter\":\"D\",\"text\":\"Communication\"}],\"correct\":\"C\",\"explanation\":\"<p>--- agrees with the exam key.</p>\\n<p>In the classic Leape/Institute of Medicine error taxonomy, preventive errors include failure to provide prophylactic treatment and, specifically, inadequate monitoring or follow-up of treatment. Failure to arrange cardiology follow-up after an in-hospital STEMI is a failure of follow-up and thus a preventive error.</p>\\n<ul>\\n<li><strong>a (diagnosis) is incorrect:</strong> the myocardial infarction was correctly diagnosed; the lapse was in follow-up.</li>\\n\\n<li><strong>b (treatment) is incorrect:</strong> the error was not in performing or selecting a treatment/procedure.</li>\\n\\n<li><strong>d (communication) is tempting</strong> because the lapse occurred at a discharge handoff, but in the standard taxonomy the discrete category for absent follow-up of a diagnosed condition is a preventive error. Communication failures are frequently the underlying root cause of errors generally (Skrisovska et al., PLoS One, 2024), but the taxonomic category of this specific error is prevention.</li>\\n</ul>\\n<p>Background reading: medical-error taxonomies and the preventive-error category (Skrisovska et al., PLoS One, 2024).</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"46\",\"stem\":\"A patient undergoes a complex revision total knee arthroplasty with over 500cc of blood lost according to the surgeon. Post-operative day one the patient has low hemoglobin and is rapidly given 2 units of PRBC. Approximately 90 minutes after the blood transfusion begins, the patient develops hypoxemia, dyspnea, and a cough. Rales are audible bilateral lung bases.\",\"options\":[{\"letter\":\"A\",\"text\":\"Initiate diuresis, stop unnecessary fluids, get chest x-ray and slow transfusion.\"},{\"letter\":\"B\",\"text\":\"Stop transfusion, treat with antihistamines or epinephrine as needed.\"},{\"letter\":\"C\",\"text\":\"Discontinue transfusion, give patient acetaminophen and oxygen, and obtain blood cultures.\"},{\"letter\":\"D\",\"text\":\"Discontinue transfusion, send sample of patient's blood for coombs test, send urine to rule out hemoglobinuria, and hydrate patient/monitor urine output.\"}],\"correct\":\"A\",\"explanation\":\"<p>--- agrees with the exam key.</p>\\n<p>The presentation --- dyspnea, hypoxemia, cough, and bilateral basal rales during rapid transfusion of 2 units --- is transfusion-associated circulatory overload (TACO), a hydrostatic (cardiogenic) pulmonary edema occurring within 6 hours of transfusion. Management is to stop or slow the transfusion, give supplemental oxygen, and administer diuretics; diuresis is both diagnostic and therapeutic (Delaney et al., Lancet, 2016; Semple et al., Blood, 2019). A chest radiograph and reassessment of fluid balance are appropriate.</p>\\n<ul>\\n<li><strong>b describes management of an allergic/anaphylactic reaction</strong> (antihistamines, epinephrine), which typically presents with urticaria, bronchospasm, or hypotension rather than bibasilar rales and volume overload.</li>\\n\\n<li><strong>c describes management of a febrile or septic/bacterial-contamination reaction</strong> (acetaminophen, cultures).</li>\\n\\n<li><strong>d describes management of an acute hemolytic reaction</strong> (direct antiglobulin/Coombs test, hemoglobinuria workup, maintaining urine output).</li>\\n</ul>\\n<p>The main alternative diagnosis to consider is TRALI (noncardiogenic permeability edema, also within 6 hours); the volume-overload context, rapid transfusion, and bibasilar rales favor TACO, and diuresis distinguishes the two (Gajic et al., Critical Care Medicine, 2006; Roubinian et al., Transfusion, 2017).</p>\\n<p>Background reading: differentiation and management of TACO versus TRALI (Semple et al., Blood, 2019; Delaney et al., Lancet, 2016).</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"47\",\"stem\":\"In regards to the Oxygen-hemoglobin dissociation curve, which statement is correct?\",\"options\":[{\"letter\":\"A\",\"text\":\"As the curve is shifted to the right, hemoglobin has an increased affinity for oxygen (easier to bind oxygen).\"},{\"letter\":\"B\",\"text\":\"Red blood cell storage may cause a reduction in 2,3-diphosphoglycerate (2,3-DPG aka 2,3-BPG), which leads to a left shift in the curve.\"},{\"letter\":\"C\",\"text\":\"Hemorrhagic shock can lead to hypothermia, which leads to a rightward shift in the curve.\"},{\"letter\":\"D\",\"text\":\"Decreased tissue perfusion in shock can lead to inadequate tissue perfusion and acidosis, leading to a left shift in the curve.\"}],\"correct\":\"B\",\"explanation\":\"<p>--- agrees with the exam key.</p>\\n<p>Stored RBCs progressively deplete 2,3-DPG --- levels fall by roughly 90% and may be undetectable within about 2 weeks of storage --- which increases hemoglobin&#x27;s oxygen affinity and shifts the dissociation curve to the left, impairing oxygen offloading (Scott et al., Anesthesia &amp; Analgesia, 2016; Adams et al., BioMed Research International, 2014). Levels normalize within ~24--72 hours after transfusion.</p>\\n<ul>\\n<li><strong>a is incorrect:</strong> a rightward shift indicates decreased oxygen affinity (easier offloading), not increased affinity.</li>\\n\\n<li><strong>c is incorrect:</strong> hypothermia shifts the curve to the left (increased affinity), not to the right.</li>\\n\\n<li><strong>d is incorrect:</strong> acidosis (the Bohr effect) shifts the curve to the right, not left.</li>\\n</ul>\\n<p>Background reading: the RBC storage lesion and 2,3-DPG depletion (Scott et al., 2016; Adams et al., 2014).</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"48\",\"stem\":\"What is the most crucial element in the pre operative assessment of the surgical patient?\",\"options\":[{\"letter\":\"A\",\"text\":\"Chest X-Ray and ECG\"},{\"letter\":\"B\",\"text\":\"Medical and surgical history\"},{\"letter\":\"C\",\"text\":\"Pregnancy test\"},{\"letter\":\"D\",\"text\":\"Blood work including a coagulation profile\"}],\"correct\":\"B\",\"explanation\":\"<p>--- agrees with the exam key.</p>\\n<p>A thorough medical and surgical history (with physical examination) is the single most important element of preoperative assessment; it identifies comorbidities, functional capacity, medications, and prior anesthetic issues, and it directs any selective, targeted testing. Routine, undirected investigations in the absence of relevant history rarely change management.</p>\\n<ul>\\n<li><strong>a, c, d are incorrect</strong> as the &quot;most crucial&quot; element: chest X-ray, ECG, pregnancy testing, and coagulation studies are adjuncts ordered selectively when the history and exam or the planned procedure indicate them, not as the foundation of assessment.</li>\\n</ul>\\n<p>Background reading: principles of preoperative evaluation and selective testing (any standard surgical text; ASA/perioperative evaluation guidance).</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"49\",\"stem\":\"Which of the following is most useful in the pre operative cardiac assessment of a surgical patient?\",\"options\":[{\"letter\":\"A\",\"text\":\"Electrocardiogram\"},{\"letter\":\"B\",\"text\":\"Cardiac Echo\"},{\"letter\":\"C\",\"text\":\"Stress test\"},{\"letter\":\"D\",\"text\":\"Chest X-Ray\"}],\"correct\":\"C\",\"explanation\":\"<p>The exam keys the stress test, on the rationale that it assesses functional capacity and detects inducible myocardial ischemia, historically the test most likely to change perioperative cardiac management. In earlier guidance, exercise ECG stress testing was the ambulatory test of choice because it estimates functional capacity and detects ischemia simultaneously (Fleisher et al., ACC/AHA, Journal of the American College of Cardiology, 2007).</p>\\n<p>Important update: current guidance no longer supports routine preoperative stress testing. The 2024 AHA/ACC perioperative guideline gives stress testing only a Class 2b recommendation, limited to patients undergoing elevated-risk surgery with poor or unknown functional capacity and elevated risk by a validated tool, and explicitly recommends against routine stress testing (Class 3, no benefit) in low-risk patients, those with adequate functional capacity, or low-risk procedures --- because its positive predictive value is modest and it adds little beyond validated risk indices and biomarkers (Thompson et al., 2024 AHA/ACC Perioperative Guideline, Journal of the American College of Cardiology, 2024). Assessment of functional capacity and use of a validated risk score (e.g., RCRI), with the resting 12-lead ECG as the baseline test, now anchor preoperative cardiac evaluation (Smilowitz and Berger, JAMA, 2020). Against a modern standard, the stress test is not the &quot;most useful&quot; first-line element for the general surgical patient.</p>\\n<p>Background reading: 2024 AHA/ACC perioperative cardiovascular guideline (Thompson et al., 2024); perioperative risk assessment review (Smilowitz and Berger, JAMA, 2020).</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"50\",\"stem\":\"An adult trauma patient with extensive facial injuries cannot be intubated. What are your landmarks for an emergency airway?\",\"options\":[{\"letter\":\"A\",\"text\":\"Palpate the sternal notch and make the incision into the airway approximately 2 cm above this\"},{\"letter\":\"B\",\"text\":\"Palpate the thyroid notch of the thyroid cartilage and make the incision just above this\"},{\"letter\":\"C\",\"text\":\"Palpate the cricoid cartilage and make the incision into the airway just above this\"},{\"letter\":\"D\",\"text\":\"Palpate the cricoid cartilage and make the incision into the airway just below this\"}],\"correct\":\"C\",\"explanation\":\"<p>--- agrees with the exam key.</p>\\n<p>Emergency surgical airway (cricothyroidotomy) is performed through the cricothyroid membrane, which lies between the inferior border of the thyroid cartilage above and the cricoid cartilage below. Palpating the cricoid cartilage and incising just above it enters the airway through the cricothyroid membrane (Accilien et al., Journal of Medical Insight, 2024; McNiven et al., Clinical Otolaryngology, 2018).</p>\\n<ul>\\n<li><strong>a is incorrect:</strong> the sternal-notch approach corresponds to a low tracheostomy, not an emergency cricothyroidotomy, and is more time-consuming and hemorrhagic.</li>\\n\\n<li><strong>b is incorrect:</strong> incising above the thyroid notch would enter above the thyroid cartilage (thyrohyoid region), not the cricothyroid membrane.</li>\\n\\n<li><strong>d is incorrect:</strong> incising just below the cricoid cartilage enters the trachea below the cricoid ring rather than through the cricothyroid membrane.</li>\\n</ul>\\n<p>Background reading: cricothyroidotomy technique and the &quot;laryngeal handshake&quot; for landmark identification (McNiven et al., Clinical Otolaryngology, 2018; Accilien et al., Journal of Medical Insight, 2024).</p>\\n<p>Worked answer key for questions 51--60, following the original exam&#x27;s answer choices verbatim. Where the original key is debatable or wrong, a disagreement note is added.</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"51\",\"stem\":\"A 23 year old male is brought in by ambulance with a stab wound to the anterior chest just to the right of midline with a large amount of blood loss at the scene. During transport we was initially talking normally, then he lost consciousness. He has no palpable pulse and no recordable blood pressure. He was intubated and CPR (chest compressions) was started. He arrives in the trauma room 5 minutes later. Two large bore IV's have been running with 2 liters of ringer's lactate infused already. What do you do next?\",\"options\":[{\"letter\":\"A\",\"text\":\"Confirm that there is no pulse, no respiratory effort, and no electrical activity, and pronounce the patient dead.\"},{\"letter\":\"B\",\"text\":\"Cross match and transfuse 4 units of packed red blood cells\"},{\"letter\":\"C\",\"text\":\"Place a right chest tube\"},{\"letter\":\"D\",\"text\":\"Do a resuscitative left thoracotomy\"}],\"correct\":\"D\",\"explanation\":\"<p>This is a patient in traumatic cardiac arrest who had witnessed signs of life (talking) that were lost immediately before/during transport, with a short arrest interval (&lt;15 minutes of CPR) after penetrating thoracic injury. The Eastern Association for the Surgery of Trauma (EAST) issues its single <em>strong</em> recommendation for emergency department thoracotomy in exactly this scenario: patients who are pulseless but had signs of life after penetrating thoracic injury (Seamon et al., Journal of Trauma and Acute Care Surgery, 2015). The Western Trauma Association sets the threshold at penetrating torso trauma with less than 15 minutes of prehospital CPR (Burlew et al., 2012). The physiologic goals are to relieve pericardial tamponade, control intrathoracic hemorrhage, perform open cardiac massage, and cross-clamp the aorta; survival approaches 15--35% for penetrating injury (and is highest with an isolated cardiac wound and tamponade), versus &lt;2% for blunt trauma (Dewey et al., 2025).</p>\\n<ul>\\n<li><strong>A is incorrect:</strong> the patient does not meet criteria for termination --- he had recent signs of life and a short down-time, which is precisely the group that benefits from thoracotomy.</li>\\n\\n<li><strong>B is incorrect:</strong> transfusion is a necessary adjunct but does not address the likely tamponade or intrathoracic hemorrhage in an arresting patient; it is not the definitive next maneuver.</li>\\n\\n<li><strong>C is incorrect:</strong> the injury is a right-sided chest wound, but in arrest the resuscitative thoracotomy (left anterolateral, extendable to clamshell) provides access to the heart, aorta, and both hemithoraces. An isolated right chest tube does not treat tamponade or allow aortic cross-clamping.</li>\\n</ul>\\n<p>Background reading: EAST practice management guideline (Seamon et al., Journal of Trauma and Acute Care Surgery, 2015); Western Trauma Association algorithm (Burlew et al., 2012).</p>\",\"no_key\":false,\"no_options\":false,\"free_answer\":null},{\"number\":\"52\",\"stem\":\"A 55 year old male suffers serious head trauma from an MVA. In the emergency department is mumbling incomprehensibly and not following any commands. When you apply sternal rub, he moans with his eyes closed. When you apply pressure to his thumb nail he pulls his hand away. What is his GCS?\",\"options\":[{\"letter\":\"A\",\"text\":\"5\"},{\"letter\":\"B\",\"text\":\"6\"},{\"letter\":\"C\",\"text\":\"7\"},{\"letter\":\"D\",\"text\":\"8\"}],\"correct\":\"C\",\"explanation\":\"<p>Scoring the three components:</p>\\n<ul>\\n<li><strong>Eye opening = 1 (none):</strong> eyes remain closed even to a painful sternal rub. Eye opening to pain would score 2; no eye opening scores 1.</li>\\n\\n<li><strong>Verbal = 2 (incomprehensible sounds):</strong> he moans and mumbles incomprehensibly. Moaning/incomprehensible sounds score 2; inappropriate words would score 3.</li>\\n\\n<li><strong>Motor = 4 (withdrawal from pain):</strong> he pulls his hand away from a nail-bed pressure stimulus. Withdrawal from pain scores 4; localizing would score 5, abnormal flexion 3.</li>\\n</ul>\\n<p>Total = 1 + 2 + 4 = <strong>7.</strong></p>\\n<ul>\\n<li><strong>A (5) and B (6) are incor
