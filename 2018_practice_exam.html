D is correct:</strong> In patients with acute intracranial hemorrhage, the priority is avoiding expansion of the bleed. Intermittent pneumatic compression devices provide mechanical VTE prophylaxis without any bleeding risk and are the recommended initial method (often with thigh-high graduated compression). Pharmacologic prophylaxis is deferred until the hemorrhage is stable.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<ul>\n<li><strong>A, B, C, E:</strong> All are anticoagulants (DOACs, IV/SC unfractionated heparin, LMWH) and carry a risk of worsening or precipitating rebleeding in the setting of acute intracranial hemorrhage, making them relatively contraindicated in the immediate phase. Pharmacologic prophylaxis may be cautiously introduced later once bleeding is confirmed stable.</li>\n</ul>\n<p><strong>Background:</strong> Uncritical anticoagulation in the head-injured/ICH patient can also worsen iatrogenic coagulopathy (Maegele et al., Lancet Neurology, 2017).</p>","no_key":false,"no_options":false,"free_answer":null},{"number":42,"stem":"A 76-year-old lady presented with a type-A dissection needing emergent cardiac surgery... In aortic replacement under circulatory arrest was undertaken. The patient had severe coagulopathy needing transfusion and several hours of hemostasis. 3 days after surgery, she is more alert and complains of numbness and tingling along the right little finger and the ulnar half of her ring finger. This discomfort is also accompanied by weakness of her right grip. Which of the following can cause this patient's symptoms?","options":[{"letter":"A","text":"Axillary artery dissection"},{"letter":"B","text":"Ulnar nerve compression"},{"letter":"C","text":"Deep vein thrombosis"},{"letter":"D","text":"Stroke"},{"letter":"E","text":"Hyperventilation"}],"correct":"B","explanation":"<p><strong>Why B is correct:</strong> Numbness/tingling of the little finger and the ulnar half of the ring finger plus grip weakness is the classic sensorimotor distribution of the ulnar nerve. Prolonged surgery, especially in an obese patient, predisposes to positioning-related ulnar nerve compression at the elbow (cubital tunnel). Safe arm positioning and padding are mandatory to prevent this well-recognized perioperative injury.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<ul>\n<li><strong>A:</strong> Axillary artery dissection would produce limb ischemia (cold, pulseless, pale arm), not an isolated ulnar sensory/motor deficit.</li>\n\n<li><strong>C:</strong> DVT causes limb swelling, pain, and warmth---not a focal peripheral nerve sensory pattern.</li>\n\n<li><strong>D:</strong> Stroke would typically cause a wider deficit (e.g., whole-hand/arm or hemispheric findings) rather than an isolated ulnar-nerve territory pattern; the localized dermatomal/peripheral-nerve distribution argues against a central lesion.</li>\n\n<li><strong>E:</strong> Hyperventilation causes bilateral, non-focal perioral and distal paresthesias, not a unilateral single-nerve deficit with weakness.</li>\n</ul>\n<p><strong>Background:</strong> Ulnar neuropathy is among the most common perioperative peripheral nerve injuries; risk factors include prolonged surgery, elbow positioning, and higher body habitus.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":43,"stem":"Prophylactic antibiotics are recommended to decrease the incidence of wound infection after surgical procedures. Which of the following statements is TRUE?","options":[{"letter":"A","text":"IV vancomycin is recommended for elective neurosurgery"},{"letter":"B","text":"IV cefazolin is recommended for an elective aortic valve repair"},{"letter":"C","text":"IV metronidazole is recommended for an urgent obstructed small intestine surgery"},{"letter":"D","text":"IV vancomycin is recommended for urgent vascular surgery repair"},{"letter":"E","text":"IV ciprofloxacin is recommended for elective hernia repair"}],"correct":"B","explanation":"<p><strong>Why B is correct:</strong> Cefazolin is the standard first-line surgical prophylaxis for cardiac procedures including valve surgery, providing coverage against the skin flora (staphylococci, streptococci) that cause most surgical site infections.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<ul>\n<li><strong>A:</strong> Cefazolin, not vancomycin, is the standard prophylaxis for clean neurosurgery. Vancomycin is reserved for beta-lactam allergy or documented/high MRSA risk.</li>\n\n<li><strong>C:</strong> Metronidazole alone is inadequate---it lacks aerobic gram-negative coverage. Bowel surgery prophylaxis requires added coverage (e.g., cefazolin plus metronidazole). The question also distinguishes prophylaxis from empiric therapy of established contamination.</li>\n\n<li><strong>D:</strong> Cefazolin, not vancomycin, is standard for vascular surgery prophylaxis (vancomycin only for allergy/MRSA risk).</li>\n\n<li><strong>E:</strong> Clean elective hernia repair, when prophylaxis is used, is covered by cefazolin; ciprofloxacin is not the appropriate agent.</li>\n</ul>\n<p><strong>Background:</strong> Cefazolin is the workhorse of surgical prophylaxis for skin flora; give within 60 minutes before incision and weight-dose (2 g for adults, 3 g if \u2265120 kg).</p>","no_key":false,"no_options":false,"free_answer":null},{"number":44,"stem":"A young man presents to the emergency room with a stab wound to the left chest. His examination reveals subcutaneous emphysema and absent breath sounds on the left chest with right-sided tracheal deviation. His BP is 70/30. What is the most probable diagnosis?","options":[{"letter":"A","text":"Massive hemothorax"},{"letter":"B","text":"Tension pneumothorax"},{"letter":"C","text":"Cardiac tamponade"},{"letter":"D","text":"Flail chest"}],"correct":"B","explanation":"<p><strong>Why B is correct:</strong> The combination of absent breath sounds on the affected side, subcutaneous emphysema, tracheal deviation away from the affected side, and hypotension (obstructive shock) is the classic clinical picture of tension pneumothorax. This is a clinical diagnosis requiring immediate needle/finger decompression before imaging.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<ul>\n<li><strong>A:</strong> Massive hemothorax causes absent breath sounds and shock, but with dullness to percussion and typically no tracheal deviation toward the contralateral side or subcutaneous emphysema; neck veins are usually flat.</li>\n\n<li><strong>C:</strong> Cardiac tamponade produces Beck&#x27;s triad (hypotension, distended neck veins, muffled heart sounds) with normal breath sounds bilaterally and no tracheal deviation.</li>\n\n<li><strong>D:</strong> Flail chest shows paradoxical chest wall movement from multiple segmental rib fractures; it does not cause tracheal deviation or the classic tension physiology described.</li>\n</ul>\n<p><strong>Background:</strong> Tension pneumothorax and open pneumothorax are among the immediately life-threatening chest injuries identified in the ATLS primary survey.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":45,"stem":"Which of the following is NOT a clinical finding of class IV hemorrhagic shock:","options":[{"letter":"A","text":"Blood loss of greater than 40%"},{"letter":"B","text":"Confused or lethargic"},{"letter":"C","text":"Increased pulse pressure"},{"letter":"D","text":"Respiratory rate greater than 35/minute"}],"correct":"C","explanation":"<p><strong>Why C is correct (the exception):</strong> In class IV hemorrhagic shock, pulse pressure is decreased (narrowed), not increased. Narrowing occurs because compensatory catecholamine-driven vasoconstriction raises diastolic pressure while systolic pressure falls---an early and sensitive sign of significant hemorrhage.</p>\n<p><strong>Why the others are correct findings of class IV shock:</strong></p>\n<ul>\n<li><strong>A:</strong> Class IV corresponds to blood loss &gt;40% of blood volume.</li>\n\n<li><strong>B:</strong> Cerebral hypoperfusion produces confusion and lethargy in class IV.</li>\n\n<li><strong>D:</strong> Marked tachypnea (respiratory rate &gt;35/min) is characteristic of class IV.</li>\n</ul>\n<p><strong>Background:</strong> ATLS hemorrhagic shock classification (I--IV) uses heart rate, blood pressure, pulse pressure, respiratory rate, urine output, and mental status. Narrowed pulse pressure appears as early as class II.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":46,"stem":"Which of the following is TRUE regarding the oxyhemoglobin dissociation curve:","options":[{"letter":"A","text":"Acidosis causes hemoglobin to have a decreased affinity for oxygen"},{"letter":"B","text":"Alkalosis causes hemoglobin to have a decreased affinity for oxygen"},{"letter":"C","text":"Lower temperature causes hemoglobin to have a decreased affinity for oxygen"},{"letter":"D","text":"Lower CO2 causes hemoglobin to have a decreased affinity for oxygen"}],"correct":"A","explanation":"<div class=\"addendum\"><p class=\"addendum-label\">Correction</p><p>The compiled key marked <strong>B</strong> as correct here, but its own explanation directly contradicts that: by the Bohr effect, alkalosis actually <strong>increases</strong> hemoglobin's oxygen affinity (making B false), while acidosis (option A) <strong>decreases</strong> it (making A the true statement). The source document flags this itself \u2014 \"the marked key conflicts with standard physiology\" \u2014 so this quiz uses <strong>A</strong> as the correct answer, per standard physiology and the explanation's own reasoning below.</p></div><p><strong>Note on this item:</strong> Strictly by physiology, <strong>alkalosis shifts the curve LEFT and INCREASES oxygen affinity</strong> (facilitating uptake in the lungs). The physiologically accurate statement is that acidosis (option A) DECREASES affinity via the Bohr effect (rightward shift), which promotes tissue oxygen unloading. If the intended key is B, the item as written is physiologically inconsistent; the correct relationships are summarized below.</p>\n<p><strong>Correct physiology of each option:</strong></p>\n<ul>\n<li><strong>A:</strong> Acidosis (\u2191H\u207a, \u2193pH) \u2192 right shift \u2192 <strong>decreased</strong> affinity (this statement is actually TRUE by physiology).</li>\n\n<li><strong>B:</strong> Alkalosis (\u2191pH) \u2192 left shift \u2192 <strong>increased</strong> affinity (so this statement is physiologically FALSE).</li>\n\n<li><strong>C:</strong> Lower temperature \u2192 left shift \u2192 <strong>increased</strong> affinity (statement is FALSE).</li>\n\n<li><strong>D:</strong> Lower CO2 \u2192 left shift \u2192 <strong>increased</strong> affinity (statement is FALSE).</li>\n</ul>\n<p><strong>Background (Bohr effect):</strong> Rightward shift (decreased O2 affinity, better tissue unloading) occurs with increased H\u207a/acidosis, increased CO2, increased temperature, and increased 2,3-DPG. Leftward shift (increased affinity) occurs with the opposite. Verify the intended answer against the course&#x27;s source, as the marked key conflicts with standard physiology.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":47,"stem":"All the following types of shock result in hypotension and tachycardia EXCEPT:","options":[{"letter":"A","text":"Hemorrhagic shock"},{"letter":"B","text":"Septic shock"},{"letter":"C","text":"Neurogenic shock"},{"letter":"D","text":"Cardiogenic shock"}],"correct":"C","explanation":"<p><strong>Why C is correct (the exception):</strong> Neurogenic shock results from loss of sympathetic tone below a spinal cord injury, producing hypotension with <strong>bradycardia</strong> (unopposed vagal tone) plus warm, dry skin. The absence of a compensatory tachycardia distinguishes it from the other shock states.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<ul>\n<li><strong>A:</strong> Hemorrhagic (hypovolemic) shock causes hypotension with reflex tachycardia.</li>\n\n<li><strong>B:</strong> Septic (distributive) shock causes hypotension with tachycardia.</li>\n\n<li><strong>D:</strong> Cardiogenic shock causes hypotension with tachycardia.</li>\n</ul>\n<p><strong>Background:</strong> The bradycardia-with-hypotension combination is a hallmark that should prompt consideration of neurogenic shock in a trauma patient with a spinal cord injury.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":48,"stem":"Nutrition affects wound healing in several ways. Which of the following is TRUE?","options":[{"letter":"A","text":"Vitamin C deficiency affects collagen contraction"},{"letter":"B","text":"Vitamin B6 deficiency causes impaired collagen cross-linking"},{"letter":"C","text":"Vitamin A deficiency affects collagen production"},{"letter":"D","text":"Vitamin K deficiency leads to impaired fibroplasia"},{"letter":"E","text":"Vitamin E delays fibroblast proliferation"}],"correct":"B","explanation":"<p><strong>Why B is correct:</strong> Vitamin B6 (pyridoxine) is a cofactor for lysyl oxidase-related steps and amino acid metabolism required for collagen cross-linking; deficiency impairs cross-link formation and thus wound tensile strength.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<ul>\n<li><strong>A:</strong> Vitamin C deficiency (scurvy) impairs collagen synthesis via defective prolyl/lysyl hydroxylation (proline \u2192 hydroxyproline), leading to poor wound healing and dehiscence---not primarily &quot;collagen contraction&quot; (Padayatty &amp; Levine, Oral Diseases, 2016).</li>\n\n<li><strong>C:</strong> Vitamin A deficiency impairs epithelialization, fibroplasia, and the inflammatory response; the statement as narrowly worded (&quot;collagen production&quot;) is not the best characterization, and this option is not the intended TRUE answer.</li>\n\n<li><strong>D:</strong> Vitamin K is essential for coagulation factor synthesis (II, VII, IX, X); its deficiency causes bleeding, not primarily impaired fibroplasia.</li>\n\n<li><strong>E:</strong> Vitamin E is generally not shown to delay fibroblast proliferation as a defining nutritional effect on healing.</li>\n</ul>\n<p><strong>Background:</strong> Vitamin C is a required cofactor for prolyl and lysyl hydroxylases; without it, procollagen is poorly hydroxylated, unstable, and inadequately secreted, producing the classic scurvy picture of impaired healing and wound dehiscence (Padayatty &amp; Levine, Oral Diseases, 2016).</p>","no_key":false,"no_options":false,"free_answer":null},{"number":49,"stem":"Which of the following has been shown to have detrimental effects on wound healing?","options":[{"letter":"A","text":"Obesity"},{"letter":"B","text":"Hypothyroidism"},{"letter":"C","text":"Diabetes mellitus"},{"letter":"D","text":"C-reactive protein deficiency"},{"letter":"E","text":"Anemia"}],"correct":"C","explanation":"<p><strong>Why C is correct:</strong> Diabetes mellitus has well-established detrimental effects on wound healing through microvascular disease, neuropathy, impaired neutrophil/immune function, deranged inflammatory cell recruitment, and reduced collagen deposition---clinically evident in diabetic foot ulcers.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<ul>\n<li><strong>A:</strong> Obesity predisposes to wound separation and infection mechanically, but is not proven to directly impair the biology of wound healing to the same degree.</li>\n\n<li><strong>B:</strong> Hypothyroidism is not a classic established cause of impaired healing in this context.</li>\n\n<li><strong>D:</strong> &quot;C-reactive protein deficiency&quot; is not a recognized clinical entity affecting wound healing.</li>\n\n<li><strong>E:</strong> Anemia may theoretically slow healing via reduced oxygen delivery, but this has not been convincingly proven as an independent factor.</li>\n</ul>\n<p><strong>Background:</strong> In diabetes, deregulated immune cell recruitment and impaired inflammatory resolution contribute to chronic, non-healing wounds (Sawaya et al., Nature Communications, 2020).</p>","no_key":false,"no_options":false,"free_answer":null},{"number":50,"stem":"A woman undergoes a total gastrectomy for huge proximal gastric adenocarcinoma. To protect her from developing anemia she must be given a regular dose of IV or subcutaneous:","options":[{"letter":"A","text":"Folic acid"},{"letter":"B","text":"Ferrous sulfate"},{"letter":"C","text":"Vitamin B12"},{"letter":"D","text":"Transferrin"}],"correct":"C","explanation":"<p>Total gastrectomy removes the gastric parietal cells that produce intrinsic factor, which is required for ileal absorption of vitamin B12. Without intrinsic factor, oral B12 is not reliably absorbed, so parenteral (IM/subcutaneous) supplementation is the classic teaching to prevent megaloblastic anemia and irreversible B12 neuropathy. Cumulative B12 deficiency approaches 100% by 4 years after total gastrectomy, with a median onset around 15 months (Hu et al., Annals of Surgery, 2013). Guidelines recommend lifelong supplementation and monitoring (NCCN Gastric Cancer, 2026).</p>\n<ul>\n<li><strong>a. Folic acid</strong> --- Folate is absorbed in the proximal small intestine and does not depend on intrinsic factor or the stomach; deficiency is not the expected consequence of gastrectomy.</li>\n\n<li><strong>B. Ferrous sulfate</strong> --- Iron deficiency does occur after gastrectomy (loss of gastric acid impairs iron absorption), but iron is replaced orally or IV, and the question specifies an agent given &quot;IV or subcutaneous&quot; to prevent anemia from a loss of gastric function, pointing to B12. Note that emerging data show oral/sublingual B12 can also normalize levels, but the traditional exam answer is parenteral B12.</li>\n\n<li><strong>D. Transferrin</strong> --- Transferrin is an iron-transport protein, not a therapeutic supplement.</li>\n</ul>\n<p>Background: Post-gastrectomy patients also require monitoring for iron, calcium, and vitamin D deficiency and osteoporosis.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":51,"stem":"Increased additional support appears to aggravate tachypnea in a septic patient with respiratory failure. Lessening the amount of the substrate may alleviate the problem:","options":[{"letter":"A","text":"F emulsion (fat/lipid emulsion)"},{"letter":"B","text":"Essential amino acids"},{"letter":"C","text":"Nonessential amino acids"},{"letter":"D","text":"Carbohydrate"}],"correct":"D","explanation":"<p>Carbohydrate metabolism has the highest respiratory quotient (RQ \u2248 1.0), meaning it generates the most CO2 per unit of oxygen consumed. In an overfed patient with fixed or limited ventilatory reserve, the excess CO2 production drives increased minute ventilation (tachypnea) and can precipitate hypercapnic respiratory failure or impede ventilator weaning (Covelli et al., Annals of Internal Medicine, 1981; Dark et al., Chest, 1985). Reducing the carbohydrate load lowers CO2 production and alleviates the problem.</p>\n<ul>\n<li><strong>a. Fat emulsion</strong> --- Fat has a lower RQ (\u22480.7) and produces less CO2; reducing it would not relieve, and fat is used to offset carbohydrate calories.</li>\n\n<li><strong>B/C. Amino acids</strong> --- Protein has an intermediate RQ (\u22480.8); excess protein raises the metabolic rate somewhat but is not the primary driver of CO2-related tachypnea.</li>\n</ul>\n<p>Background: Rather than using specialty high-fat/low-carbohydrate formulas, current SCCM/ASPEN guidance emphasizes avoiding overfeeding overall, as macronutrient ratio matters mainly in overfed patients (McClave et al., SCCM/ASPEN, 2016).</p>","no_key":false,"no_options":false,"free_answer":null},{"number":52,"stem":"A 35-year-old male presents with long-standing severe hypertension with associated muscle weakness, headache, polyuria, and polydipsia. His laboratory investigations revealed an elevated aldosterone level and elevated serum potassium. His most likely diagnosis is:","options":[{"letter":"A","text":"Cushing's syndrome"},{"letter":"B","text":"Pheochromocytoma"},{"letter":"C","text":"Conn's syndrome"},{"letter":"D","text":"Waterhouse--Friderichsen syndrome"}],"correct":"C","explanation":"<p>Conn&#x27;s syndrome is autonomous aldosterone overproduction (most often an adrenal adenoma or bilateral hyperplasia) causing hypertension, suppressed renin, sodium retention, and increased potassium excretion (Funder et al., Endocrine Society, 2016). The classic florid presentation is hypertension with hypokalemia, and hypokalemia produces the muscle weakness, polyuria, and polydipsia described.</p>\n<p>Note a likely typo in the question: primary aldosteronism causes hypo-kalemia, not &quot;elevated&quot; potassium. The clinical picture (young patient, severe hypertension, elevated aldosterone, hypokalemic symptoms of weakness/polyuria) is diagnostic of Conn&#x27;s syndrome; the potassium value should read low.</p>\n<ul>\n<li><strong>a. Cushing&#x27;s syndrome</strong> --- Cortisol excess causes central obesity, striae, glucose intolerance, and hypertension, but aldosterone is not the primary driver.</li>\n\n<li><strong>B. Pheochromocytoma</strong> --- Catecholamine excess causes episodic/paroxysmal hypertension with headache, palpitations, and diaphoresis, not elevated aldosterone.</li>\n\n<li><strong>D. Waterhouse--Friderichsen syndrome</strong> --- Adrenal hemorrhage/infarction (classically meningococcemia) causing acute adrenal insufficiency and shock, the opposite of hyperaldosteronism.</li>\n</ul>\n<p>Background: Screening uses the aldosterone-to-renin ratio; hypokalemia is present in only a minority of cases, so normokalemia does not exclude the diagnosis.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":53,"stem":"A 65-year-old woman with chronic renal failure and undergoing hemodialysis 2 to 3 times/week develops calcinosis. Her parathyroid hormone is markedly elevated as well as ionized calcium is normal. Most likely diagnosis is:","options":[{"letter":"A","text":"Primary hyperparathyroidism"},{"letter":"B","text":"Secondary hyperparathyroidism"},{"letter":"C","text":"Tertiary hyperparathyroidism"},{"letter":"D","text":"Parathyroid carcinoma"}],"correct":"B","explanation":"<p>In CKD, phosphate retention, reduced 1,25-dihydroxyvitamin D, elevated FGF23, and a tendency to hypocalcemia drive a compensatory rise in PTH with parathyroid hyperplasia (Fraser, Lancet, 2009). The hallmark distinguishing feature here is a markedly elevated PTH with a normal (not elevated) calcium --- an appropriate adaptive response to renal disease. Soft-tissue/vascular calcification (calcinosis) reflects the disordered calcium-phosphate product of CKD-MBD.</p>\n<ul>\n<li><strong>a. Primary hyperparathyroidism</strong> --- Characterized by elevated PTH with hyper-calcemia; the normal calcium here argues against it.</li>\n\n<li><strong>C. Tertiary hyperparathyroidism</strong> --- Develops after long-standing secondary disease when the glands become autonomous and cause hyper-calcemia; calcium would be high, not normal.</li>\n\n<li><strong>D. Parathyroid carcinoma</strong> --- Rare; typically causes markedly elevated PTH with very high calcium.</li>\n</ul>\n<p>Background: Management targets phosphate control (binders), vitamin D analogs, and calcimimetics (cinacalcet); refractory cases may require parathyroidectomy.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":54,"stem":"An 82-year-old woman is assessed after falling down a flight of stairs. She takes rivaroxaban for permanent atrial fibrillation. She was stabilized and secured on a backboard with a C-collar. Pulse 65/min, BP 155/85, RR 12, GCS 7. A large left scalp hematoma is present, with a nonreactive left pupil, and a large left flank bruise. Which of the following statements is the most appropriate management?","options":[{"letter":"A","text":"Provide oxygen by facemask, administer IV fluids, obtain a head and abdomen CT scan, and call in neurosurgical consultation"},{"letter":"B","text":"Perform endotracheal intubation, administer 3% saline, obtain an abdomen CT scan and call for a neurosurgical consultation"},{"letter":"C","text":"Perform endotracheal intubation and a FAST examination, administer IV fluids, call in neurosurgeon for a decompressive craniectomy"},{"letter":"D","text":"Perform endotracheal intubation, call neurosurgeon, transfer the patient to the operating room for a decompressive craniectomy"},{"letter":"E","text":"Perform endotracheal intubation, administer IV fluids, perform FAST examination, obtain CT head, and request neurosurgical consultation"}],"correct":"E","explanation":"<p>This patient has a severe traumatic brain injury (GCS 7) with a lateralizing sign (fixed left pupil) suggesting a left hemispheric mass effect/herniation, and she is anticoagulated. GCS \u22648 mandates definitive airway control (intubation) for airway protection and controlled ventilation. She is hemodynamically stable, so the priority sequence is: secure the airway, support circulation with IV fluids, perform FAST to exclude intra-abdominal hemorrhage (she has a flank bruise), and obtain a head CT to define the intracranial lesion before neurosurgical intervention.</p>\n<ul>\n<li><strong>A</strong> --- Omits airway control; a GCS-7 patient cannot protect the airway, so facemask oxygen alone is inadequate.</li>\n\n<li><strong>B</strong> --- Empiric 3% saline without imaging and skipping abdominal assessment (FAST) is premature; hyperosmolar therapy is reserved for signs of herniation as a temporizing measure, and the head CT is still needed.</li>\n\n<li><strong>C/D</strong> --- Proceeding to decompressive craniectomy before a head CT is inappropriate; the surgical lesion must first be identified. Anticoagulation reversal is also needed.</li>\n</ul>\n<p>Background: Reversal of rivaroxaban (e.g., andexanet alfa or PCC) is a critical additional step in this anticoagulated patient with intracranial hemorrhage.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":55,"stem":"A 26-year-old man is brought to the ER after a head-on automobile accident. On arrival he is breathing normally, with multiple chest bruises and multiple points of tenderness over the ribs. Chest x-ray shows multiple bilateral rib fractures with normal lung parenchyma and normal lung expansion. Two days later he is in respiratory distress with \"wet lungs\" on chest x-ray. Which of the following is the most likely diagnosis?","options":[{"letter":"A","text":"Flail chest"},{"letter":"B","text":"Myocardial contusion"},{"letter":"C","text":"Pulmonary contusion"},{"letter":"D","text":"Tension pneumothorax"},{"letter":"E","text":"Traumatic rupture of the aorta"}],"correct":"C","explanation":"<p>Pulmonary contusion frequently accompanies blunt chest trauma with rib fractures and characteristically evolves over 24--72 hours, so the initial chest x-ray can look normal before infiltrates (&quot;wet lungs&quot;) and hypoxemia appear. The delayed deterioration at 48 hours is the classic pattern. Contused lung is sensitive to fluid overload.</p>\n<ul>\n<li><strong>A. Flail chest</strong> --- Requires \u22653 contiguous ribs fractured in \u22652 places with paradoxical chest wall motion; not described, and it presents immediately.</li>\n\n<li><strong>B. Myocardial contusion</strong> --- Presents with arrhythmias/hemodynamic instability, not delayed pulmonary infiltrates.</li>\n\n<li><strong>D. Tension pneumothorax</strong> --- An acute emergency with absent breath sounds, tracheal deviation, and hemodynamic collapse, not a delayed radiographic infiltrate.</li>\n\n<li><strong>E. Traumatic aortic rupture</strong> --- Presents with a widened mediastinum and is usually rapidly fatal or discovered acutely, not as delayed alveolar edema.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":56,"stem":"A 21-year-old gang member is stabbed in the neck just right of the midline. Examination shows paralysis and loss of proprioception distal to the injury on the right side, and loss of pain perception distal to the injury on the left side. Which of the following is the most likely diagnosis?","options":[{"letter":"A","text":"Anterior cord syndrome"},{"letter":"B","text":"Central cord syndrome"},{"letter":"C","text":"Complete transection of the spinal cord"},{"letter":"D","text":"Hemi-section of the spinal cord (Brown-S\u00e9quard syndrome)"},{"letter":"E","text":"Posterior cord syndrome"}],"correct":"D","explanation":"<p>Cord hemisection produces ipsilateral loss of motor function and dorsal-column sensation (proprioception/vibration) with contralateral loss of pain and temperature, because the corticospinal tract and dorsal columns are uncrossed at that level while the spinothalamic tract has already decussated (Ahuja et al., Nature Reviews Disease Primers, 2017). The described right-sided paralysis/proprioceptive loss with left-sided pain loss is the textbook pattern, and penetrating knife trauma is the classic cause.</p>\n<ul>\n<li><strong>A. Anterior cord syndrome</strong> --- Bilateral loss of motor function and pain/temperature with preserved proprioception (usually vascular, anterior spinal artery).</li>\n\n<li><strong>B. Central cord syndrome</strong> --- Disproportionate upper-limb weakness, typically from hyperextension in older patients with cervical spondylosis.</li>\n\n<li><strong>C. Complete transection</strong> --- Bilateral loss of all modalities below the lesion, not the crossed pattern described.</li>\n\n<li><strong>E. Posterior cord syndrome</strong> --- Isolated loss of proprioception/vibration; rare.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":57,"stem":"Aggressive fluid resuscitation after a blunt trauma victim has a systolic BP of 100 mmHg, cold extremities, a rapid but strong peripheral pulse, and a central venous pressure of 12 cm H2O. The patient most likely has:","options":[{"letter":"A","text":"Increased systemic vascular resistance"},{"letter":"B","text":"Decreased stroke volume index"},{"letter":"C","text":"Decreased cardiac index"},{"letter":"D","text":"Excessive cardiac preload"}],"correct":"A","explanation":"<p>Cold, clamped extremities reflect peripheral vasoconstriction --- the compensatory sympathetic response that raises systemic vascular resistance (SVR) to preserve central blood pressure. With a maintained systolic BP of 100, a strong pulse, and an adequate/replete CVP of 12 after resuscitation, the dominant hemodynamic finding is elevated SVR.</p>\n<ul>\n<li><strong>B/C. Decreased stroke volume/cardiac index</strong> --- With adequate preload restored (CVP 12) and a strong pulse, cardiac output is being supported; the cold periphery is due to vasoconstriction, not necessarily low output.</li>\n\n<li><strong>D. Excessive cardiac preload</strong> --- CVP of 12 cm H2O is within/near the normal range and does not indicate excessive preload.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":58,"stem":"After falling from a 10-foot ladder, a patient is brought to the ED, alert, reporting back pain and difficulty moving the lower extremities. Systolic BP is 100 mmHg. Which additional finding would be consistent with neurogenic shock?","options":[{"letter":"A","text":"Cool and pale skin"},{"letter":"B","text":"Increased systolic blood pressure"},{"letter":"C","text":"Poor skin turgor"},{"letter":"D","text":"Bradycardia"}],"correct":"D","explanation":"<p>Neurogenic shock from spinal cord injury interrupts sympathetic outflow, causing vasodilation (hypotension) with unopposed vagal tone producing bradycardia and warm, well-perfused (&quot;pink&quot;) skin. The combination of hypotension with bradycardia distinguishes it from hemorrhagic shock.</p>\n<ul>\n<li><strong>A. Cool and pale skin</strong> --- Characteristic of hypovolemic/hemorrhagic shock with peripheral vasoconstriction; neurogenic shock causes warm, dry skin.</li>\n\n<li><strong>B. Increased systolic BP</strong> --- Neurogenic shock causes hypotension.</li>\n\n<li><strong>C. Poor skin turgor</strong> --- Suggests volume depletion, not neurogenic shock.</li>\n</ul>\n<p>Background: Hemorrhage must always be excluded first in a trauma patient before attributing hypotension to a neurogenic cause.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":59,"stem":"A young man is involved in an MVC with a GCS of 7. CT demonstrates a cerebral contusion. What should be avoided as it can cause secondary brain injury through deleterious effects on intracranial pressure?","options":[{"letter":"A","text":"Elevation of the head"},{"letter":"B","text":"Respiratory acidosis"},{"letter":"C","text":"Mild hypovolemia"},{"letter":"D","text":"Sedation of the agitated patient"}],"correct":"B","explanation":"<p>Hypercapnia (respiratory acidosis) is a potent cerebral vasodilator; rising PaCO2 increases cerebral blood volume and thereby raises intracranial pressure, worsening secondary brain injury (Brain Trauma Foundation, 2016; Kim et al., Chest, 2022). Normocapnia (PaCO2 35--45 mmHg) is the goal in TBI, and hypercapnia must be avoided.</p>\n<ul>\n<li><strong>A. Elevation of the head</strong> --- Head-of-bed elevation (~30\u00b0) promotes cerebral venous drainage and lowers ICP; it is beneficial.</li>\n\n<li><strong>C. Mild hypovolemia</strong> --- Marked hypotension harms cerebral perfusion, but mild hypovolemia is not the primary CO2-mediated ICP driver targeted by this question; euvolemia is the goal.</li>\n\n<li><strong>D. Sedation of the agitated patient</strong> --- Sedation lowers cerebral metabolic demand and ICP and is therapeutic in agitated TBI patients.</li>\n</ul>\n<p>Background: Hyperventilation lowers PaCO2 and transiently reduces ICP but risks ischemia, so it is reserved for acute herniation, not routine use.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":60,"stem":"A poly trauma patient has a persistently low urine output. The oliguria is most likely due to prerenal failure rather than acute tubular necrosis if the tests reveal:","options":[{"letter":"A","text":"Low urine specific gravity"},{"letter":"B","text":"Low urinary excretion of sodium"},{"letter":"C","text":"Low BUN/creatinine ratio"},{"letter":"D","text":"Low creatinine clearance"}],"correct":"B","explanation":"<p>In prerenal azotemia the kidney is structurally intact and appropriately conserves sodium and water in response to renal hypoperfusion. This produces a low urine sodium (typically &lt;20 mEq/L) and a low fractional excretion of sodium (FENa &lt;1%), along with a concentrated urine (high specific gravity/osmolality). In established acute tubular necrosis (ATN), tubular cells can no longer reabsorb sodium, so urine sodium rises (&gt;40 mEq/L) and FENa exceeds 2%, with an isosthenuric urine.</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li><strong>A. Low urine specific gravity</strong> --- Prerenal states produce a <em>high</em> (concentrated) specific gravity because ADH-driven water conservation is intact; a low specific gravity points toward ATN.</li>\n\n<li><strong>C. Low BUN/creatinine ratio</strong> --- Prerenal failure raises the BUN/creatinine ratio (&gt;20:1) from enhanced urea reabsorption; a low ratio suggests intrinsic renal disease.</li>\n\n<li><strong>D. Low creatinine clearance</strong> --- A depressed creatinine clearance reflects reduced GFR and occurs in both prerenal failure and ATN, so it does not distinguish between them.</li>\n</ul>\n<p>Background: The urinary indices distinguishing prerenal azotemia from ATN are FENa (&lt;1% vs &gt;2%), urine sodium (&lt;20 vs &gt;40 mEq/L), urine osmolality (&gt;500 vs &lt;350 mOsm/kg), and BUN/Cr ratio (&gt;20:1 vs 10--15:1). FENa is unreliable in patients on diuretics; FEUrea (&lt;35% prerenal) is an alternative in that setting.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":61,"stem":"An elevated aPTT is associated with abnormal function of any of the following except:","options":[{"letter":"A","text":"Factor VII"},{"letter":"B","text":"Factor XI"},{"letter":"C","text":"Factor IX"},{"letter":"D","text":"Factor XII"},{"letter":"E","text":"Factor II"}],"correct":"A","explanation":"<p>The activated partial thromboplastin time (aPTT) tests the intrinsic and common pathways: factors XII, XI, IX, VIII, X, V, II (prothrombin), and I (fibrinogen). Factor VII is the sole factor unique to the extrinsic pathway and is measured by the prothrombin time (PT/INR), not the aPTT. An isolated factor VII deficiency prolongs the PT while leaving the aPTT normal.</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li><strong>B. Factor XI</strong> --- Intrinsic-pathway factor; deficiency (hemophilia C) prolongs aPTT.</li>\n\n<li><strong>C. Factor IX</strong> --- Intrinsic-pathway factor; deficiency (hemophilia B) prolongs aPTT.</li>\n\n<li><strong>D. Factor XII</strong> --- Contact-activation (intrinsic) factor; deficiency prolongs aPTT (though without clinical bleeding).</li>\n\n<li><strong>E. Factor II</strong> --- A common-pathway factor; its deficiency prolongs both PT and aPTT.</li>\n</ul>\n<p>Background: An isolated prolonged PT with a normal aPTT points to factor VII deficiency (or early warfarin effect/vitamin K deficiency, as VII has the shortest half-life). An isolated prolonged aPTT suggests deficiency of VIII, IX, XI, or XII, or a factor inhibitor/heparin effect. Prolongation of both suggests a common-pathway (X, V, II, fibrinogen) defect, liver disease, or DIC.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":62,"stem":"Which of the following chest radiographic findings are suggestive of a descending aorta injury?","options":[{"letter":"A","text":"Nasogastric tube shift"},{"letter":"B","text":"Left apical cap"},{"letter":"C","text":"Depression of left mainstem bronchus"},{"letter":"D","text":"Widened mediastinum"},{"letter":"E","text":"All the above"}],"correct":"E","explanation":"<p>Traumatic aortic injury from rapid deceleration classically occurs at the aortic isthmus, just distal to the left subclavian artery. A contained periaortic hematoma displaces adjacent structures, producing a constellation of plain-film signs, all of which are recognized markers:</p>\n<ul>\n<li><strong>Widened mediastinum</strong> (&gt;8 cm on supine AP film) --- the most frequently cited finding.</li>\n\n<li><strong>Nasogastric/esophageal tube deviation</strong> to the right --- the hematoma pushes the esophagus rightward.</li>\n\n<li><strong>Depression of the left mainstem bronchus</strong> (&gt;140\u00b0 below horizontal) --- mass effect from the hematoma.</li>\n\n<li><strong>Left apical pleural cap</strong> --- blood tracking over the lung apex.</li>\n</ul>\n<p>Additional signs include loss of the aortic knob contour, tracheal deviation to the right, widened paratracheal stripe, left hemothorax, and depression of the left mainstem bronchus. Because none is sufficiently sensitive or specific, any suggestive finding in the right mechanism warrants definitive imaging.</p>\n<p>Why E is correct over the single options: Each of A--D is an individually valid radiographic sign, so the inclusive answer is correct.</p>\n<p>Background: CT angiography of the chest is the diagnostic study of choice for confirming/excluding blunt aortic injury. A normal mediastinum on a good-quality film makes aortic injury unlikely but does not fully exclude it when clinical suspicion is high.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":63,"stem":"A 58-year-old male was brought to the emergency department after being stabbed in zone 1 of the cervical area, just under and right of the clavicle. He has signs of acute right upper limb ischemia. The paramedic controlled an active bleed in the wound by manual compression. The patient is rushed to the OR for surgical exploration. The surgeon needed to proceed to a trapdoor incision in addition to immediate sternotomy to control the bleeding. They repaired a transected right subclavian artery with an interrupted saphenous vein graft. The day after his surgery the patient is hypoxic with SaO2 = 90% even with an FiO2 = 60%. What is the most likely diagnosis?","options":[{"letter":"A","text":"Pneumonia"},{"letter":"B","text":"Lung contusion"},{"letter":"C","text":"Pneumothorax"},{"letter":"D","text":"Expanding cervical hematoma"},{"letter":"E","text":"Pulmonary edema"}],"correct":"C","explanation":"<p>A zone 1 neck/thoracic inlet stab wound near the subclavian vessels lies immediately adjacent to the lung apex and pleural dome. The pleura was likely violated at the time of injury; under positive-pressure ventilation in the OR, air is forced into the pleural space, producing (or enlarging) a pneumothorax. This presents as acute postoperative hypoxemia refractory to increased FiO2, and can progress to tension physiology on a ventilated patient.</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li><strong>A. Pneumonia</strong> --- Too early (postoperative day 1) and would typically present with fever, infiltrate, and purulent secretions rather than isolated acute hypoxemia.</li>\n\n<li><strong>B. Lung contusion</strong> --- From a penetrating stab this would be limited; contusions evolve over 24--48 h but the mechanism here (apical penetration + positive-pressure ventilation) favors pneumothorax.</li>\n\n<li><strong>D. Expanding cervical hematoma</strong> --- Causes airway compression and swelling, not primarily gas-exchange failure with a secured airway.</li>\n\n<li><strong>E. Pulmonary edema</strong> --- Possible after resuscitation but less likely than a directly injured pleura releasing air under positive pressure; would show bilateral findings and fluid overload signs.</li>\n</ul>\n<p>Background: Any penetrating injury near the thoracic inlet mandates a high index of suspicion for occult pneumothorax, which can convert to tension pneumothorax once positive-pressure ventilation begins. Immediate management is chest decompression and tube thoracostomy.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":64,"stem":"A 35-year-old male was found unconscious after a robbery took place in the shop he worked in. A witness saw the robbers hit the man on the side of the head with a baseball bat. He also said the man was unconscious for 5 minutes before regaining consciousness in the ambulance. After a brief period of time he became somnolent. On arrival at the emergency department he opens his eyes to painful stimuli, makes incomprehensible sounds, and withdraws from painful stimuli. He has a 1 cm laceration of the temporoparietal region of the scalp. His right pupil is 8 mm with sluggish reactivity to light. His left pupil is 4 mm with normal reaction to light. What is the most likely diagnosis?","options":[{"letter":"A","text":"Subdural hematoma"},{"letter":"B","text":"Subarachnoid hemorrhage"},{"letter":"C","text":"Epidural hematoma"},{"letter":"D","text":"Diffuse axonal injury"},{"letter":"E","text":"Cerebral concussion"}],"correct":"C","explanation":"<p>The vignette is a textbook epidural hematoma: blunt temporoparietal trauma (over the thin squamous temporal bone and middle meningeal artery), a brief loss of consciousness followed by a lucid interval, then progressive deterioration (&quot;talk and deteriorate&quot;). The ipsilateral fixed/dilated right pupil (8 mm, sluggish) reflects uncal herniation compressing the third cranial nerve as the rapidly expanding arterial hematoma raises intracranial pressure.</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li><strong>A. Subdural hematoma</strong> --- From bridging vein tears; more common in elderly/anticoagulated patients, usually without a discrete lucid interval and with a slower (venous) course; CT shows a crescentic, non-suture-limited collection.</li>\n\n<li><strong>B. Subarachnoid hemorrhage</strong> --- Traumatic SAH causes headache and meningismus but does not typically produce the classic lucid interval followed by a unilateral blown pupil from a focal mass.</li>\n\n<li><strong>D. Diffuse axonal injury</strong> --- Follows high-acceleration/deceleration, causes immediate and persistent coma without a lucid interval, and shows little on early CT.</li>\n\n<li><strong>E. Cerebral concussion</strong> --- A transient functional disturbance with no structural mass lesion; would not cause a fixed dilated pupil or progressive somnolence.</li>\n</ul>\n<p>Background: Epidural hematoma classically appears as a biconvex (lentiform), hyperdense collection on CT that does not cross suture lines. It is a neurosurgical emergency; prompt craniotomy and evacuation yield excellent outcomes if performed before irreversible herniation.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":65,"stem":"Which of the following is true with regard to prophylactic antibiotics for surgical site infections?","options":[{"letter":"A","text":"Poor glycemic control, hypothermia, and hypoxia are associated with higher rates of SSIs"},{"letter":"B","text":"First-generation cephalosporin would be considered appropriate prophylaxis prior to laparoscopic appendectomy for uncomplicated appendicitis."},{"letter":"C","text":"A patient with documented allergy to cephalosporin is undergoing mastectomy. An appropriate alternative prophylactic antibiotic to cefazolin would be ciprofloxacin."},{"letter":"D","text":"Elective laparoscopic cholecystectomy does not require prophylactic antibiotics unless indicated by other patient factors."}],"correct":"A","explanation":"<ul>\n<li><strong>A is true.</strong> Perioperative hyperglycemia, hypothermia, and tissue hypoxia all independently increase SSI risk. Maintaining normothermia, adequate oxygenation, and tight perioperative glucose control are established SSI-prevention measures.</li>\n\n<li><strong>D is true.</strong> Low-risk elective laparoscopic cholecystectomy in patients without specific risk factors does not require antibiotic prophylaxis; it is reserved for higher-risk situations (e.g., acute cholecystitis, advanced age, diabetes, converted/open procedures, bile spillage).</li>\n</ul>\n<p>Why the others are incorrect:</p>\n<ul>\n<li><strong>B is incorrect</strong> --- Appendectomy involves the colonized bowel, so prophylaxis must cover gram-negative aerobes and anaerobes (e.g., cefazolin <strong>plus</strong> metronidazole, or cefoxitin). A first-generation cephalosporin alone provides inadequate anaerobic coverage.</li>\n\n<li><strong>C is incorrect</strong> --- For a clean breast procedure the target organisms are skin flora (staphylococci/streptococci). The appropriate beta-lactam-allergy alternative to cefazolin is clindamycin or vancomycin, not ciprofloxacin (a fluoroquinolone with poor gram-positive skin-flora coverage for this indication).</li>\n</ul>\n<p>Background: Effective prophylaxis requires the right agent (matched to expected flora), given within 60 minutes before incision (120 minutes for vancomycin/fluoroquinolones), with redosing for long cases or major blood loss, and generally discontinued within 24 hours.</p><div class=\"addendum\"><p class=\"addendum-label\">Note (from answer-key addendum)</p><p>Keyed: A &amp; D. Note: Both statements are true --- this is a &quot;select all that apply&quot; item, not single-best-answer.</p></div>","no_key":false,"no_options":false,"free_answer":null},{"number":66,"stem":"A 65-year-old male type II diabetic underwent elective laparotomy and right hemicolectomy for colon cancer one day ago. You are called to assess the patient because of a fever of 39.1\u00b0C and tachycardia of 120 bpm. Blood pressure and other vital signs remain normal. To determine the source of this infection, initial steps should include:","options":[{"letter":"A","text":"Blood and urine cultures."},{"letter":"B","text":"Wound evaluation and possible exploration"},{"letter":"C","text":"Chest x-ray."},{"letter":"D","text":"CT scan of the abdomen and pelvis"}],"correct":"B","explanation":"<p>On postoperative day 1, a high fever should prompt direct evaluation of the surgical wound. Early, high fever soon after abdominal surgery raises concern for a wound/soft-tissue infection---most urgently necrotizing streptococcal or clostridial infection---which is diagnosed and treated by direct wound inspection and exploration. Examination also assesses for other early causes.</p>\n<p>Why the others are relevant but not the single best initial step:</p>\n<ul>\n<li><strong>A. Blood and urine cultures</strong> --- Appropriate as part of the fever work-up and should be obtained, but they do not immediately localize or treat a wound source.</li>\n\n<li><strong>C. Chest x-ray</strong> --- Useful to evaluate for atelectasis/pneumonia (a classic early postoperative fever consideration), but secondary to direct wound assessment in this scenario.</li>\n\n<li><strong>D. CT of the abdomen and pelvis</strong> --- Reserved for later postoperative fevers (typically day 5--7) when an intra-abdominal collection or anastomotic leak is suspected; premature on day 1.</li>\n</ul>\n<p>Background: The classic differential of postoperative fever by timing (&quot;the five W&#x27;s&quot;): Wind (atelectasis/pneumonia, days 1--2), Water (UTI, days 3--5), Wound (SSI, days 4--7, but earlier for necrotizing infection), Walking (DVT/PE, days 5+), and Wonder drugs/Weird reactions (drug fever, transfusion). An immediate high fever on day 1 warrants exclusion of an aggressive wound infection.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":67,"stem":"Empiric therapy for intra-abdominal sepsis secondary to an anastomotic leak should be continued until:","options":[{"letter":"A","text":"The patient is otherwise ready for discharge."},{"letter":"B","text":"14 days of total therapy have been given."},{"letter":"C","text":"White blood cell count is normalized, bands are absent in the peripheral blood smear, and fevers have resolved."},{"letter":"D","text":"Until cross-sectional imaging shows complete resolution of any non-drainable collections."}],"correct":"C","explanation":"<p>Provided adequate source control has been achieved, the duration of antibiotics for complicated intra-abdominal infection is guided by clinical and laboratory resolution of the systemic inflammatory response---normalization of the white blood cell count, absence of a left shift (bands), and defervescence---rather than a fixed calendar course.</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li><strong>A. Ready for discharge</strong> --- Discharge readiness depends on many factors unrelated to infection control and is not the endpoint for antibiotic duration.</li>\n\n<li><strong>B. Fixed 14 days</strong> --- Prolonged fixed courses are unnecessary once source control is achieved; the STOP-IT trial showed a short, fixed ~4-day course after adequate source control was equivalent to a longer course. Fourteen days is not a required standard.</li>\n\n<li><strong>D. Complete radiographic resolution</strong> --- Imaging findings lag behind clinical recovery; treating to complete radiographic clearance leads to excessively long, harmful courses.</li>\n</ul>\n<p>Background: Source control (drainage/diversion/repair) is the decisive intervention. With inadequate source control, ongoing clinical signs persist and re-intervention---not simply longer antibiotics---is required.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":68,"stem":"In terms of advance care directives, \"affective forecasting\" refers to:","options":[{"letter":"A","text":"Healthy patients cannot reliably predict their medical care preferences when they are actually sick"},{"letter":"B","text":"Family can override the documented wishes of a patient once the patient is rendered incompetent"},{"letter":"C","text":"Lawyers can word advance care directives so that patients can still have options regarding end-of-life care."},{"letter":"D","text":"Patients can understand the nuances of medical care in complex situations"}],"correct":"A","explanation":"<p>Affective forecasting is the psychological phenomenon whereby people poorly predict their future emotional states and the value they will place on a given health condition. In advance-care planning, this means that preferences expressed while healthy may not match what a patient actually wants once critically ill, and people commonly underestimate their future adaptation and quality of life in a disabled or ill state.</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li><strong>B</strong> --- Describes surrogate override of an advance directive, a separate ethical/legal issue, not affective forecasting.</li>\n\n<li><strong>C</strong> --- Concerns the drafting/wording of directives, unrelated to the forecasting concept.</li>\n\n<li><strong>D</strong> --- States the opposite of the limitation affective forecasting highlights.</li>\n</ul>\n<p>Background: Recognition of affective forecasting supports iterative, ongoing goals-of-care conversations rather than reliance on a single document written in health, and underscores the value of a designated substitute decision-maker who can apply the patient&#x27;s values to the actual clinical situation.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":69,"stem":"Which element is NOT part of the double effect principle:","options":[{"letter":"A","text":"The good effect is produced by the action and not by the bad effect"},{"letter":"B","text":"The person must intend the good effect despite the bad effect foreseen"},{"letter":"C","text":"The act itself is not intrinsically wrong"},{"letter":"D","text":"The bad effect physically is more likely an outcome than the good effect"}],"correct":"D","explanation":"<p>The doctrine of double effect permits an action with both a good and a foreseen bad effect under four traditional conditions: (1) the act itself is morally good or neutral (not intrinsically wrong); (2) the agent intends only the good effect, with the bad effect merely foreseen and not intended; (3) the good effect is not produced by means of the bad effect; and (4) there is proportionality---the good effect must be sufficiently desirable to outweigh (be proportionate to) the bad effect.</p>\n<p>Option D reverses the proportionality condition. The doctrine does not require, and in fact argues against, the bad effect being the more likely or dominant outcome; the good must be proportionate to (i.e., justify) the risk of harm.</p>\n<p>Why the others are correct elements:</p>\n<ul>\n<li><strong>A</strong> --- Restates the condition that the good effect must not be achieved through the bad effect.</li>\n\n<li><strong>B</strong> --- Restates the intention requirement (good intended, bad only foreseen).</li>\n\n<li><strong>C</strong> --- Restates that the act must not be intrinsically wrong.</li>\n</ul>\n<p>Background: The classic clinical application is administering opioids/sedatives to relieve intractable pain or dyspnea at the end of life, accepting the foreseen (but unintended) risk of hastening death---permissible because the intent is symptom relief, the act is proper medical care, relief is not achieved by causing death, and the benefit is proportionate.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":70,"stem":"Three most common symptoms affecting quality of life during end-of-life care","options":[{"letter":"A","text":"Loss of bladder function, respiratory distress, pain"},{"letter":"B","text":"Confusion, pain, and decision-making difficulty"},{"letter":"C","text":"Respiratory distress, pain, and cognitive impairment"},{"letter":"D","text":"Delirium, withdrawal, pain"}],"correct":"C","explanation":"<p>Pain, dyspnea/respiratory distress, and cognitive impairment (delirium/confusion) are consistently the dominant symptom burdens at the end of life.</p>\n<p>Why the others are wrong: (a) and (b) each contain a plausible symptom but pair it with a less central item; (d) &quot;withdrawal&quot; is not a core end-of-life symptom cluster.</p>\n<p><em>Note (nuance):</em> This item is somewhat arbitrary --- delirium and pain are near-universal, but the &quot;third&quot; symptom varies by source (fatigue, anorexia, and nausea also rank highly). Options (c) and (d) overlap heavily (cognitive impairment \u2248 delirium), making the distinction between them soft.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":71,"stem":"To improve survival in sepsis, guidelines recommend all but which of the following","options":[{"letter":"A","text":"Early initiation of antibiotic therapy"},{"letter":"B","text":"Initial bolus of 1 L crystalloid followed by further resuscitation with colloid (preferably albumin) if necessary"},{"letter":"C","text":"Source control measures immediately after initial resuscitation"},{"letter":"D","text":"Consideration of steroids if poor response to fluids and vasopressor"}],"correct":"B","explanation":"<p>The Surviving Sepsis Campaign recommends crystalloids as first-line resuscitation (at least 30 mL/kg within the first 3 hours), not a 1 L bolus followed routinely by colloid. Albumin is only a <em>suggested adjunct</em> when substantial crystalloid volumes are required, not a standard next step.</p>\n<p>Why the others are correct recommendations: (a) early broad-spectrum antibiotics (ideally within 1 hour of recognition), (c) source control as soon as feasible, and (d) IV hydrocortisone for refractory septic shock are all endorsed.</p>\n<p><em>Note:</em> The flaw in (b) is twofold --- both the small fixed 1 L volume and the preferential shift to colloid contradict guideline crystalloid-first, weight-based dosing.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":72,"stem":"The diagnosis of a nosocomial urinary tract infection should be based on","options":[{"letter":"A","text":"Presence of bacteria on urine dip"},{"letter":"B","text":"Demonstration of white blood cells, bacteria, or positive leukocyte esterase on urinalysis"},{"letter":"C","text":"Symptoms of dysuria, fever, incomplete voiding"},{"letter":"D","text":"Cloudy, foul-smelling urine in a patient with recent catheterization"}],"correct":"B","explanation":"<p>Laboratory evidence of pyuria/bacteriuria on urinalysis (WBCs, bacteria, or positive leukocyte esterase) is the objective diagnostic basis being tested here.</p>\n<p>Why the others are wrong: (a) a single dip finding is insufficient; (c) symptoms are supportive but nonspecific and often absent in catheterized/ICU patients; (d) appearance and odor are unreliable.</p>\n<p><em>Note (important qualifier):</em> By formal CDC/IDSA criteria, a true catheter-associated UTI (CAUTI) requires <strong>both</strong> a positive quantitative culture (\u226510\u00b3--10\u2075 CFU/mL) <strong>and</strong> signs/symptoms attributable to the urinary tract. Urinalysis findings alone indicate asymptomatic bacteriuria, which should generally <strong>not</strong> be treated. Option (b) is the best of the choices offered but is not, by itself, a complete diagnostic standard.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":73,"stem":"Which blood-borne pathogen has by far the highest transmission rate to healthcare workers from hospital needlestick injuries","options":[{"letter":"A","text":"HIV"},{"letter":"B","text":"Hepatitis B virus"},{"letter":"C","text":"Hepatitis C virus"},{"letter":"D","text":"Epstein--Barr virus"}],"correct":"B","explanation":"<p>Hepatitis B carries the highest per-exposure transmission risk after percutaneous injury from a positive source --- roughly 6--30% (up to ~62% if HBeAg-positive), versus ~1.8% for HCV and ~0.3% for HIV.</p>\n<p>Why the others are wrong: (a) HIV and (c) HCV transmit far less efficiently per exposure; (d) EBV is not a classic needlestick-transmitted occupational pathogen.</p>\n<p><em>Note:</em> This is a per-exposure comparison; effective HBV vaccination has dramatically reduced actual occupational HBV infections despite its high intrinsic transmissibility.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":74,"stem":"Which of the following is NOT a common adverse patient event in contemporary Canadian hospitals","options":[{"letter":"A","text":"Contracting a nosocomial infection in a pediatric hospital"},{"letter":"B","text":"Receiving an incorrect medication or dose"},{"letter":"C","text":"Contracting a nosocomial infection in an adult acute care hospital"},{"letter":"D","text":"Experiencing an adverse blood transfusion event"},{"letter":"E","text":"Needing to refinance your home to pay for hospital parking"}],"correct":"D","explanation":"<p>Among the genuine options, serious adverse transfusion events are comparatively rare, whereas nosocomial infections and medication errors are among the most common adverse events.</p>\n<p><em>Note:</em> Option (e) is a joke distractor and not a clinical event; the intended contrast is between the (rare) transfusion reaction and the (common) infection/medication categories.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":75,"stem":"The principlist approach to ethical dilemmas incorporates","options":[{"letter":"A","text":"Autonomy, beneficence, nonmaleficence, justice"},{"letter":"B","text":"Self-preservation, cost-effectiveness, age of consent"},{"letter":"C","text":"Capacity, autonomy, understanding, coercion"},{"letter":"D","text":"Hippocratic oath"}],"correct":"A","explanation":"<p>The four classic principles of biomedical ethics (Beauchamp and Childress) are autonomy, beneficence, nonmaleficence, and justice.</p>\n<p>Why the others are wrong: (b) and (c) mix in unrelated or consent-specific concepts; (d) the Hippocratic oath is a historical pledge, not the principlist framework.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":76,"stem":"Regarding informed consent, which element is NOT a consideration","options":[{"letter":"A","text":"Capacity"},{"letter":"B","text":"Disclosure of diagnosis and treatment options"},{"letter":"C","text":"Understanding of the disclosed information"},{"letter":"D","text":"Freedom from undue influence"},{"letter":"E","text":"Code status"}],"correct":"E","explanation":"<p>Code status is a separate goals-of-care decision, not one of the core elements of valid informed consent.</p>\n<p>Why the others are correct elements: capacity, adequate disclosure, understanding, and voluntariness (freedom from coercion/undue influence) are the pillars of valid consent.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":77,"stem":"The most common cause of hypercalcemia","options":[{"letter":"A","text":"Malignancy"},{"letter":"B","text":"Granulomatous disease"},{"letter":"C","text":"Primary hyperparathyroidism"}],"correct":"C","explanation":"<p>Primary hyperparathyroidism is the most common cause of hypercalcemia overall, particularly in the <strong>outpatient/ambulatory</strong> setting.</p>\n<p><em>Note (important qualifier):</em> Together, primary hyperparathyroidism and malignancy account for the large majority of cases. <strong>Malignancy is the most common cause among hospitalized/inpatients</strong> and typically produces higher, more symptomatic calcium levels. The &quot;correct&quot; answer therefore depends on the setting implied by the question.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":78,"stem":"All of the following statements about hyponatremia are true EXCEPT","options":[{"letter":"A","text":"In severe cases it causes headache, lethargy, and seizures"},{"letter":"B","text":"Extrarenal sodium loss can occur with severe wounds, burns, and excessive sweating"},{"letter":"C","text":"Furosemide (Lasix) or mannitol administration is a common cause of mild-to-moderate hyponatremia"},{"letter":"D","text":"Poor ADH response is a common cause of hyponatremia in the ICU population"},{"letter":"E","text":"Severe hyponatremia is defined as serum sodium <120 mEq/L"}],"correct":"D","explanation":"<p>Hyponatremia in ICU patients is far more often driven by <strong>excess/inappropriate ADH activity (SIADH-type physiology)</strong>, not a poor ADH response. Impaired ADH action (as in diabetes insipidus) causes hypernatremia, not hyponatremia.</p>\n<p>Why the others are true: (a) neurologic symptoms in severe cases; (b) extrarenal sodium/volume losses; (c) diuretic-induced hyponatremia; (e) a commonly used severity threshold.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":79,"stem":"All of the following are common causes of compartment syndrome EXCEPT","options":[{"letter":"A","text":"Arterial/intramuscular hematoma"},{"letter":"B","text":"Venous thrombosis"},{"letter":"C","text":"Crush injuries"},{"letter":"D","text":"Reperfusion injuries"},{"letter":"E","text":"Puncture injuries"}],"correct":"E","explanation":"<p>Isolated puncture injuries rarely raise compartment pressures enough to cause compartment syndrome.</p>\n<p>Why the others are recognized causes: hematoma, venous outflow obstruction, crush injury, and post-ischemic reperfusion (edema) all increase compartment volume/pressure. Fractures (especially tibial) remain the single most common cause overall, though not listed here.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":80,"stem":"IVC filters are indicated all the following EXCEPT:","options":[{"letter":"A","text":"Patients with recent DVT needing urgent surgery"},{"letter":"B","text":"Failure of anticoagulation patients with high risk of pulmonary embolus"},{"letter":"C","text":"Patients with DVT/PE but contraindications to anticoagulation"},{"letter":"D","text":"Patients with superficial venous thrombosis needing urgent surgery"}],"correct":"D","explanation":"<p><strong>Why D is correct (as the EXCEPTION):</strong> Inferior vena cava (IVC) filters interrupt the pathway of large emboli from the deep venous system of the legs/pelvis to the pulmonary arteries. A superficial venous thrombosis (SVT) lies outside the deep system and carries a low risk of clinically significant pulmonary embolism, so an IVC filter offers no meaningful protection and is not indicated --- even when surgery is needed. SVT is managed with anticoagulation (e.g., fondaparinux or a therapeutic-dose regimen) when extensive or near the saphenofemoral junction, not with caval interruption.</p>\n<p><strong>Why the others are incorrect (they ARE accepted indications):</strong></p>\n<ul>\n<li><strong>A</strong> --- A recent (especially &lt;1 month) proximal DVT with a mandatory interruption of anticoagulation for urgent surgery is a classic &quot;relative/prophylactic&quot; indication for a (preferably retrievable) filter.</li>\n\n<li><strong>B</strong> --- Recurrent PE or DVT despite adequate, therapeutic anticoagulation (&quot;failure of anticoagulation&quot;) in a high-risk patient is a core indication.</li>\n\n<li><strong>C</strong> --- Acute proven VTE (DVT/PE) with an absolute contraindication to anticoagulation (e.g., active bleeding, recent hemorrhagic stroke) is the strongest, most universally accepted indication.</li>\n</ul>\n<p><strong>Background:</strong> The two undisputed (&quot;absolute&quot;) indications are documented VTE with a contraindication to anticoagulation and VTE with failure of anticoagulation. Retrievable filters are preferred, with a plan for removal once anticoagulation can resume.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":81,"stem":"The following is not a component of the \"debrief\" in the surgical safety checklist:","options":[{"letter":"A","text":"Recording of the procedure"},{"letter":"B","text":"Wound classification verification"},{"letter":"C","text":"Completion of accounts (counts)"},{"letter":"D","text":"Patient positioning verified"},{"letter":"E","text":"Identification of any adverse events or equipment problems"}],"correct":"D","explanation":"<p><strong>Why D is correct:</strong> In the WHO Surgical Safety Checklist, verification of patient positioning is addressed during the &quot;briefing/time-out&quot; (Sign In / Time Out) before the procedure --- not during the &quot;debrief&quot; (Sign Out) at the end. The debrief occurs before the patient leaves the operating room.</p>\n<p><strong>Why the others are incorrect (they ARE debrief components):</strong></p>\n<ul>\n<li><strong>A</strong> --- The nurse verbally confirms the name of the procedure that was recorded/performed.</li>\n\n<li><strong>B</strong> --- Wound classification and specimen labeling are reviewed at sign-out.</li>\n\n<li><strong>C</strong> --- Instrument, sponge, and needle counts must be confirmed complete during the debrief.</li>\n\n<li><strong>E</strong> --- The team reviews any equipment problems and key concerns for recovery/management.</li>\n</ul>\n<p><strong>Background:</strong> The WHO checklist has three phases --- Sign In (before induction of anesthesia), Time Out (before skin incision), and Sign Out (debrief, before the patient leaves the room). Sign Out addresses: name of procedure, counts, specimen labeling, equipment problems, and key recovery concerns.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":82,"stem":"Which of the following regarding healthcare workers is true?","options":[{"letter":"A","text":"Physicians have higher rates of suicide than the general population"},{"letter":"B","text":"Physicians have the highest suicide rates of all professions taken as a group"},{"letter":"C","text":"The chief modality of physician suicide is self-inflicted gunshot wound"},{"letter":"D","text":"Patient demands, interpersonal and role conflicts, and poor working conditions have NOT been linked to physician suicide"},{"letter":"E","text":"Physician suicide rates are roughly equal amongst males versus females"}],"correct":"B","explanation":"<p><strong>Why B is correct:</strong> Physicians as a professional group have among the highest suicide rates of any profession, exceeding that of the general population and most other occupations. This is a longstanding, well-documented occupational finding.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<ul>\n<li><strong>A</strong> --- This statement is also true in isolation (physicians do exceed the general population), but the exam&#x27;s intended &quot;most complete/strongest&quot; answer is B, which captures the profession-specific magnitude. Both A and B are factually supportable; B is the designated key.</li>\n\n<li><strong>C</strong> --- Physicians more often use self-poisoning/medication overdose (reflecting knowledge of and access to lethal drugs), not primarily firearms.</li>\n\n<li><strong>D</strong> --- Occupational stressors (patient demands, role and interpersonal conflict, poor working conditions, burnout) are clearly linked to physician suicide.</li>\n\n<li><strong>E</strong> --- Female physicians have a disproportionately elevated suicide risk relative to women in the general population; rates are not simply &quot;equal&quot; by sex, and the female excess relative risk is a notable finding.</li>\n</ul>\n<p><strong>Background:</strong> Contributing factors include depression, burnout, substance use, access to lethal means, and reluctance to seek help. Note that A and B overlap; the item is best answered by selecting the strongest occupational claim (B).</p>","no_key":false,"no_options":false,"free_answer":null},{"number":83,"stem":"Which of the following is NOT a rare potential cause of healthcare worker personal risk in the operating room?","options":[{"letter":"A","text":"Explosion"},{"letter":"B","text":"Toxic chemical spill"},{"letter":"C","text":"Smoke plume inhalation"},{"letter":"D","text":"Fire"},{"letter":"E","text":"Hostage situation"}],"correct":"C","explanation":"<p><strong>Why C is correct:</strong> Surgical smoke plume --- generated routinely by electrocautery, lasers, and ultrasonic devices --- is a common, everyday occupational exposure in the OR, not a rare event. It contains toxic gases, ultrafine particulates, viable bacteria/viruses, and potential carcinogens, which is why smoke evacuation is a standard safety recommendation.</p>\n<p><strong>Why the others are incorrect (they ARE rare events):</strong></p>\n<ul>\n<li><strong>Explosion</strong> and <strong>Fire</strong> --- Surgical fires/explosions (oxygen-enriched field, ignition source, fuel) are recognized but uncommon &quot;never events.&quot;</li>\n\n<li><strong>Toxic chemical spill</strong> --- An uncommon environmental hazard.</li>\n\n<li><strong>Hostage situation</strong> --- A rare workplace-violence scenario.</li>\n</ul>\n<p><strong>Background:</strong> Because smoke plume exposure is continuous and frequent rather than rare, mitigation (local smoke evacuators, high-filtration masks) is emphasized as routine OR practice.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":84,"stem":"A 4-year-old male presents to the ER following a motor vehicle collision. He is crying but consoled by his mother. He opens his eyes when his name is called, and he withdraws from painful stimuli. Which of the following is an appropriate calculation for the child's current GCS?","options":[{"letter":"A","text":"9"},{"letter":"B","text":"10"},{"letter":"C","text":"11"},{"letter":"D","text":"12"},{"letter":"E","text":"8"}],"correct":"C","explanation":"<p><strong>Why C is correct:</strong> Using the pediatric GCS (modified verbal scale for young children):</p>\n<ul>\n<li><strong>Eye opening = 3</strong> --- opens eyes to speech/voice (to name).</li>\n\n<li><strong>Verbal = 4</strong> --- &quot;cries but consolable&quot; corresponds to the pediatric V4 (irritable, consolable).</li>\n\n<li><strong>Motor = 4</strong> --- withdraws to (from) painful stimuli.</li>\n</ul>\n<p>Total = E3 + V4 + M4 = <strong>11</strong>.</p>\n<p><strong>Why the others are incorrect:</strong> They result from misassigning one or more components. Eye-to-speech is 3 (not 4), consolable crying is the pediatric V4 (not V5, which is age-appropriate/socially interactive/coos-babbles), and withdrawal to pain is M4 (not M5 localizing or M3 flexion).</p>\n<p><strong>Background:</strong> The pediatric verbal scale replaces adult responses for pre-verbal/young children: V5 coos/babbles or is interactive; V4 irritable, consolable crying; V3 cries to pain; V2 moans to pain; V1 none. Eye and motor scales are essentially the same as the adult scale.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":85,"stem":"A 37-year-old man is involved in a high-speed motor vehicle collision. He is hemodynamically stable. A supine chest x-ray shows a pulmonary contusion and possible widened mediastinum. What is the most appropriate study to diagnose the presence of a traumatic injury to the aorta?","options":[{"letter":"A","text":"Diagnostic peritoneal lavage"},{"letter":"B","text":"Helical thin-cut CT angiography"},{"letter":"C","text":"Thoracic aortography"},{"letter":"D","text":"MRI of the chest"},{"letter":"E","text":"FAST scan"}],"correct":"B","explanation":"<p><strong>Why B is correct:</strong> In the hemodynamically stable trauma patient with a widened mediastinum or other signs of possible blunt thoracic aortic injury, CT angiography of the chest is the diagnostic study of choice. It is fast, widely available, highly sensitive and specific, and non-invasive, and it simultaneously evaluates other thoracic injuries.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<ul>\n<li><strong>A (DPL)</strong> and <strong>E (FAST)</strong> evaluate the abdomen/pericardium for hemorrhage; neither assesses the thoracic aorta.</li>\n\n<li><strong>C (Aortography)</strong> was the historic gold standard but is now reserved for equivocal cases or when endovascular repair is planned; it is invasive and slower.</li>\n\n<li><strong>D (MRI)</strong> is not practical for acute trauma (time, monitoring, and access constraints).</li>\n</ul>\n<p><strong>Background:</strong> Blunt thoracic aortic injury classically occurs at the aortic isthmus (distal to the left subclavian artery). Plain-film clues include a widened mediastinum, obscured aortic knob, left apical cap, depressed left mainstem bronchus, and NG-tube deviation --- all indications to proceed to CT angiography.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":86,"stem":"Which ONE of the following is correct?","options":[{"letter":"A","text":"Inclusion/exclusion criteria determine internal validity"},{"letter":"B","text":"Decreasing chance outcomes not related to treatment increases external validity"},{"letter":"C","text":"An effectiveness trial determines whether the treatment helps under ideal circumstances"},{"letter":"D","text":"Benefits of RCTs include comparable groups and lack of bias"}],"correct":"D","explanation":"<p><strong>Why D is correct:</strong> Randomization distributes both known and unknown confounders evenly, producing comparable groups at baseline and minimizing selection and confounding bias. This is the defining strength of the randomized controlled trial (RCT).</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<ul>\n<li><strong>A</strong> --- Inclusion/exclusion criteria primarily determine external validity (generalizability), by defining the population to whom results apply --- not internal validity.</li>\n\n<li><strong>B</strong> --- Reducing outcomes unrelated to treatment (i.e., controlling for extraneous factors/bias) increases internal validity, not external validity.</li>\n\n<li><strong>C</strong> --- A trial testing a treatment under ideal/controlled conditions is an efficacy trial. An effectiveness (pragmatic) trial tests performance under real-world, routine conditions.</li>\n</ul>\n<p><strong>Background:</strong> Internal validity = the degree to which the observed effect is truly due to the intervention (freedom from bias/confounding). External validity = generalizability to other populations/settings. Efficacy = ideal conditions; effectiveness = real-world conditions.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":87,"stem":"Which ONE of the following is true regarding systematic reviews?","options":[{"letter":"A","text":"A Forest plot is a graphical representation of individual studies, typically representing the area under the curve"},{"letter":"B","text":"Statistical heterogeneity means the similarity in results between studies which have different research questions"},{"letter":"C","text":"A sensitivity analysis is a technique to determine whether the inclusion of poor-quality studies influences the size of the effect"},{"letter":"D","text":"Precision refers to the extent to which the result represents the \"truth\""}],"correct":"C","explanation":"<p><strong>Why C is correct:</strong> A sensitivity analysis re-runs the meta-analysis after altering assumptions or excluding certain studies (e.g., low-quality or high-risk-of-bias studies) to test how robust the pooled estimate is. If the effect size changes materially when poor-quality studies are removed, the result is not robust.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<ul>\n<li><strong>A</strong> --- A forest plot displays the point estimate and confidence interval of each individual study plus the pooled summary estimate; it does not represent an &quot;area under the curve.&quot;</li>\n\n<li><strong>B</strong> --- Statistical heterogeneity refers to variability/differences in results across studies beyond chance (quantified by I\u00b2, Cochran&#x27;s Q), not similarity.</li>\n\n<li><strong>D</strong> --- Precision reflects the degree of random error (width of the confidence interval); it is validity/accuracy that refers to closeness to the &quot;truth.&quot;</li>\n</ul>\n<p><strong>Background:<
