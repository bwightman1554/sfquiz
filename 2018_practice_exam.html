<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2018 Practice Exam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F3F5F3;
    --surface: #FFFFFF;
    --ink: #1B2430;
    --muted: #64707D;
    --border: #DFE3E0;
    --accent: #3B7DD8;
    --accent-dark: #2A5DA8;
    --accent-tint: #E8F1FC;
    --correct: #1E8A5F;
    --correct-bg: #E7F5EE;
    --correct-border: #A9DDC4;
    --incorrect: #BF3F27;
    --incorrect-bg: #FBEAE5;
    --incorrect-border: #EFB7A8;
    --flag: #B9821A;
    --flag-bg: #FCF1DC;
    --flag-border: #ECD9AC;
    --nokey: #7C6FB0;
    --nokey-bg: #EFEBFA;
    --nokey-border: #D6CDEE;
    --explain-text: #384250;
    --claude-orange: #3B7DD8;
    --claude-orange-dark: #2A5DA8;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(27,36,48,0.06), 0 4px 14px rgba(27,36,48,0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15181B;
      --surface: #1E2226;
      --ink: #E8EAEC;
      --muted: #97A1A9;
      --border: #333A40;
      --accent: #6FA8E8;
      --accent-dark: #4A82C4;
      --accent-tint: #1C2C40;
      --correct: #58D399;
      --correct-bg: #17301F;
      --correct-border: #2D5238;
      --incorrect: #F0876D;
      --incorrect-bg: #3A211B;
      --incorrect-border: #62362A;
      --flag: #E3B04B;
      --flag-bg: #362C15;
      --flag-border: #5B4A24;
      --nokey: #BBA9F5;
      --nokey-bg: #2A2440;
      --nokey-border: #453B66;
      --explain-text: #C7CDD3;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.25);
    }
  }
  /* Explicit user override (Settings menu), regardless of system preference */
  :root[data-theme="dark"] {
    --bg: #15181B;
    --surface: #1E2226;
    --ink: #E8EAEC;
    --muted: #97A1A9;
    --border: #333A40;
    --accent: #6FA8E8;
    --accent-dark: #4A82C4;
    --accent-tint: #1C2C40;
    --correct: #58D399;
    --correct-bg: #17301F;
    --correct-border: #2D5238;
    --incorrect: #F0876D;
    --incorrect-bg: #3A211B;
    --incorrect-border: #62362A;
    --flag: #E3B04B;
    --flag-bg: #362C15;
    --flag-border: #5B4A24;
    --nokey: #BBA9F5;
    --nokey-bg: #2A2440;
    --nokey-border: #453B66;
    --explain-text: #C7CDD3;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.25);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }
  /* Explicit full-viewport backdrop, independent of document/content height
     or the host page's own background. Covers overscroll/bounce areas on
     iOS and any gap if the rendered content is shorter than the viewport,
     both of which can otherwise reveal the host app's own background
     color showing through instead of ours. Always in sync with the
     current theme since it references the same live CSS variable. */
  .bg-fill {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: -1;
  }
  #app {
    max-width: 1180px;
    margin: 0 auto;
    padding: 20px 20px 60px;
  }
  .cw-banner {
    background: linear-gradient(135deg, var(--claude-orange), var(--claude-orange-dark));
    color: #fff;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Inter', sans-serif;
  }
  .cw-banner-inner {
    max-width: 1180px;
    margin: 0 auto;
    width: 100%;
    display: grid;
    grid-template-columns: auto 1fr auto;
    grid-template-areas: "brand score settings";
    align-items: center;
    gap: 14px;
  }
  @media (max-width: 640px) {
    .cw-banner-inner {
      grid-template-columns: 1fr auto;
      grid-template-areas:
        "brand settings"
        "score score";
      row-gap: 10px;
    }
  }
  .cw-brand {
    grid-area: brand;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .cw-banner-score {
    grid-area: score;
    display: flex;
    justify-content: center;
    min-width: 0;
  }
  .cw-banner-icon {
    flex: 0 0 30px;
    width: 30px;
    height: 30px;
  }
  .cw-banner-title {
    font-weight: 700;
    font-size: 1.4667rem;
    letter-spacing: -0.01em;
  }
  .cw-home-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-left: 4px;
    padding: 5px 11px;
    border-radius: 999px;
    background: rgba(255,255,255,0.16);
    color: #fff;
    text-decoration: none;
    font-size: 0.8rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .cw-home-link:hover { background: rgba(255,255,255,0.26); }
  @media (max-width: 640px) {
    .cw-home-link span.home-label { display: none; }
  }
  .cw-settings {
    grid-area: settings;
    position: relative;
  }
  .settings-gear {
    background: rgba(255,255,255,0.16);
    border: none;
    border-radius: 8px;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    line-height: 1;
    cursor: pointer;
  }
  .settings-gear:hover { background: rgba(255,255,255,0.26); }
  .settings-panel {
    position: absolute;
    top: 42px;
    right: 0;
    width: 264px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    padding: 14px;
    z-index: 20;
    color: var(--ink);
  }
  .settings-panel.hidden { display: none; }
  .settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .settings-row + .settings-row { margin-top: 14px; }
  .settings-label {
    font-size: 0.8667rem;
    font-weight: 600;
    color: var(--muted);
  }
  .settings-stepper {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .settings-stepper button {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    font-weight: 700;
    font-size: 0.8rem;
    cursor: pointer;
    font-family: inherit;
  }
  .settings-stepper button:hover { border-color: var(--accent); color: var(--accent-dark); }
  #font-pct {
    font-size: 0.8rem;
    color: var(--muted);
    min-width: 34px;
    text-align: center;
  }
  .settings-seg {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 7px;
    overflow: hidden;
  }
  .settings-seg button {
    background: var(--bg);
    border: none;
    border-left: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.7333rem;
    font-weight: 600;
    padding: 5px 7px;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
  }
  .settings-seg button:first-child { border-left: none; }
  .settings-seg button.active { background: var(--accent); color: #fff; }
    font-size: 1rem;
    letter-spacing: -0.01em;
  }
  header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px;
    margin-bottom: 18px;
  }
  header.top h1 {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 1.4rem;
    margin: 0;
    letter-spacing: -0.01em;
  }
  header.top .sub {
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.55;
    margin-top: 6px;
  }
  .score-pill {
    display: flex;
    align-items: center;
    gap: 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--ink);
    border-radius: 999px;
    padding: 8px 20px;
    box-shadow: var(--shadow);
  }
  .score-pill .stat { text-align: center; }
  .score-pill .stat .num { font-size: 1.1333rem; font-weight: 700; font-family: 'Source Serif 4', serif; }
  .score-pill .stat .lbl { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .score-pill .divider { width: 1px; height: 26px; background: var(--border); }

  .layout {
    display: grid;
    grid-template-columns: 250px 1fr;
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
    .nav-panel { order: 2; position: static; }
    .qgrid { grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); }
  }
  @media (max-width: 480px) {
    #app { padding: 14px 14px 40px; }
    header.top h1 { font-size: 1.4rem; }
    header.top { margin-bottom: 18px; gap: 16px; }
    .score-pill { padding: 7px 14px; gap: 12px; }
    .score-pill .stat .num { font-size: 1rem; }
    .score-pill .divider { height: 22px; }
    .qpanel { padding: 18px 16px 16px; min-height: 0; }
    .stem { font-size: 1.1333rem; margin-bottom: 16px; }
    .opt { padding: 11px 12px; font-size: 0.9667rem; }
    .strike-btn { flex-basis: 30px; }
    .confirm-btn { width: 100%; text-align: center; }
    .footer-nav { margin-top: 18px; padding-top: 12px; }
    .navbtn { padding: 9px 14px; font-size: 0.8667rem; }
    .position { font-size: 0.8rem; }
  }

  .nav-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    position: sticky;
    top: 16px;
    box-shadow: var(--shadow);
  }
  .filter-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
  }
  .filter-tabs button {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--muted);
    font-size: 0.8rem;
    font-weight: 600;
    padding: 5px 9px;
    border-radius: 7px;
    cursor: pointer;
    font-family: inherit;
  }
  .filter-tabs button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .grid-label {
    font-size: 0.7333rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 8px;
    font-weight: 600;
  }
  .qgrid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    max-height: 360px;
    overflow-y: auto;
    padding-right: 2px;
  }
  .qgrid button {
    aspect-ratio: 1;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    position: relative;
    padding: 0;
  }
  .qgrid button.current { box-shadow: inset 0 0 0 2px var(--accent-dark); }
  .qgrid button.correct { background: var(--correct-bg); border-color: var(--correct-border); color: var(--correct); }
  .qgrid button.incorrect { background: var(--incorrect-bg); border-color: var(--incorrect-border); color: var(--incorrect); }
  .qgrid button.nokey-done { background: var(--nokey-bg); border-color: var(--nokey-border); color: var(--nokey); }
  .qgrid button .flagdot {
    position: absolute; top: 2px; right: 2px;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--flag);
  }
  .legend {
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    font-size: 0.7667rem;
    color: var(--muted);
  }
  .legend span.sw { display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:6px; vertical-align: -1px;}
  .reset-btn {
    margin-top: 14px;
    width: 100%;
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.8rem;
    padding: 7px;
    border-radius: 7px;
    cursor: pointer;
    font-family: inherit;
  }
  .reset-btn:hover { color: var(--incorrect); border-color: var(--incorrect-border); }

  .qpanel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 26px 28px 22px;
    box-shadow: var(--shadow);
    min-height: 420px;
  }
  .qmeta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .qmeta .qnum {
    font-size: 0.8333rem;
    font-weight: 700;
    color: var(--accent-dark);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .flag-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: 1px solid var(--border);
    padding: 5px 11px;
    border-radius: 7px;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    font-family: inherit;
  }
  .flag-toggle.on {
    background: var(--flag-bg);
    border-color: var(--flag-border);
    color: var(--flag);
  }
  .stem {
    font-family: 'Source Serif 4', serif;
    font-size: 1.2667rem;
    line-height: 1.5;
    margin-bottom: 20px;
  }
  .options { display: flex; flex-direction: column; gap: 9px; }
  .opt-row { display: flex; align-items: stretch; gap: 8px; }
  .opt-row .opt { flex: 1; }
  .strike-btn {
    flex: 0 0 34px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    border-radius: 8px;
    cursor: pointer;
    color: var(--muted);
    font-size: 0.8667rem;
    font-weight: 600;
    font-family: inherit;
  }
  .strike-btn:hover { border-color: var(--muted); color: var(--ink); }
  .strike-btn.active { background: var(--ink); border-color: var(--ink); color: #fff; }
  .opt {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    text-align: left;
    width: 100%;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    font-family: inherit;
    font-size: 1rem;
    color: var(--ink);
    transition: border-color .12s, background .12s;
  }
  .opt:hover:not(.locked):not(.struck) { border-color: var(--accent); background: var(--accent-tint); }
  .opt .letter {
    flex: 0 0 26px;
    height: 26px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.8333rem;
    color: var(--muted);
  }
  .opt .text { padding-top: 2px; }
  .opt.selected .letter { background: var(--accent); border-color: var(--accent); color: #fff; }
  .opt.correct-answer { border-color: var(--correct-border); background: var(--correct-bg); }
  .opt.correct-answer .letter { background: var(--correct); border-color: var(--correct); color: #fff; }
  .opt.wrong-answer { border-color: var(--incorrect-border); background: var(--incorrect-bg); }
  .opt.wrong-answer .letter { background: var(--incorrect); border-color: var(--incorrect); color: #fff; }
  .opt.locked { cursor: default; }
  .opt.struck { cursor: default; background: var(--bg); opacity: 0.6; }
  .opt.struck .text { text-decoration: line-through; }
  .opt.pending-selected { border-color: var(--accent); background: var(--accent-tint); }
  .opt.pending-selected .letter { background: var(--accent); border-color: var(--accent); color: #fff; }

  .confirm-btn {
    margin-top: 6px;
    align-self: flex-start;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    font-family: inherit;
  }
  .confirm-btn:hover:not(:disabled) { background: var(--accent-dark); }
  .confirm-btn:disabled {
    background: var(--border);
    color: var(--muted);
    cursor: not-allowed;
  }

  .noopts-box {
    background: var(--nokey-bg);
    border: 1px solid var(--nokey-border);
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 0.9333rem;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .reveal-btn {
    margin-top: 8px;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    font-family: inherit;
  }

  .explain {
    margin-top: 20px;
    border-top: 1px solid var(--border);
    padding-top: 18px;
    animation: fadein .15s ease-in;
  }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px);} to { opacity:1; transform: translateY(0);} }
  .verdict {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-weight: 700;
    font-size: 0.9rem;
    padding: 5px 12px;
    border-radius: 999px;
    margin-bottom: 12px;
  }
  .verdict.correct { background: var(--correct-bg); color: var(--correct); }
  .verdict.incorrect { background: var(--incorrect-bg); color: var(--incorrect); }
  .verdict.nokey { background: var(--nokey-bg); color: var(--nokey); }
  .verdict-emoji { font-size: 1rem; margin-left: 2px; }
  .explain-body { font-size: 0.9667rem; color: var(--explain-text); }
  .explain-body p { margin: 0 0 10px; }
  .explain-body ul { margin: 0 0 10px; padding-left: 20px; }
  .explain-body li { margin-bottom: 6px; }
  .explain-body strong { color: var(--ink); }
  .nokey-note {
    font-size: 0.8667rem;
    color: var(--nokey);
    background: var(--nokey-bg);
    border-radius: 7px;
    padding: 8px 12px;
    margin-bottom: 12px;
  }
  .addendum {
    margin-top: 12px;
    background: var(--flag-bg);
    border: 1px solid var(--flag-border);
    border-radius: 8px;
    padding: 10px 14px;
  }
  .addendum p { margin: 0 0 6px; }
  .addendum p:last-child { margin-bottom: 0; }
  .addendum-label {
    font-size: 0.7333rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--flag);
    margin-bottom: 4px !important;
  }

  .footer-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .navbtn {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 9px 18px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    color: var(--ink);
    font-family: inherit;
  }
  .navbtn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-dark); }
  .navbtn:disabled { opacity: 0.4; cursor: not-allowed; }
  .navbtn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .navbtn.primary:hover { background: var(--accent-dark); }
  .position { color: var(--muted); font-size: 0.8667rem; }

  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
    font-size: 0.9667rem;
  }
</style>
</head>
<body>
<div class="bg-fill"></div>
<div class="cw-banner">
  <div class="cw-banner-inner">
    <div class="cw-brand">
      <span class="cw-banner-icon" style="font-size:26px;line-height:30px;display:inline-block;text-align:center;">🦴</span>
      <span class="cw-banner-title">OrthoWorld</span>
      <a href="index.html" class="cw-home-link" title="Return to main menu">← <span class="home-label">All Quizzes</span></a>
    </div>
    <div class="cw-banner-score">
      <div class="score-pill">
        <div class="stat"><div class="num" id="stat-answered">0</div><div class="lbl">Answered</div></div>
        <div class="divider"></div>
        <div class="stat"><div class="num" id="stat-correct">0</div><div class="lbl">Correct</div></div>
        <div class="divider"></div>
        <div class="stat"><div class="num" id="stat-pct">&mdash;</div><div class="lbl">Score</div></div>
      </div>
    </div>
    <div class="cw-settings">

<script>
const QUIZ_DATA = [{"number":1,"stem":"Which of the following is an indication for the use of FFP?","options":[{"letter":"A","text":"vWD"},{"letter":"B","text":"Factor VIII Deficiency"},{"letter":"C","text":"Fibrinogen Deficiency"},{"letter":"D","text":"Massive Transfusion"}],"correct":"D","explanation":"<p>Fresh frozen plasma (FFP) contains all coagulation factors and is indicated when multiple factors must be replaced simultaneously, as in massive transfusion/massive hemorrhage, dilutional coagulopathy, and DIC. Balanced resuscitation with high plasma-to-red-cell ratios (approaching 1:1:1) is standard in massive transfusion protocols (Sihler and Napolitano, Chest, 2009; Mesar et al., JAMA Surgery, 2017).</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li><strong>a) vWD</strong> --- treated with desmopressin or VWF-containing concentrate, not FFP.</li>\n\n<li><strong>b) Factor VIII deficiency (hemophilia A)</strong> --- treated with recombinant or plasma-derived factor VIII concentrate.</li>\n\n<li><strong>c) Fibrinogen deficiency</strong> --- treated with cryoprecipitate or fibrinogen concentrate, which are far more concentrated sources of fibrinogen than FFP.</li>\n</ul>\n<p>Background: Targeted factor or component therapy is preferred over FFP whenever a single deficiency can be corrected with a specific product; FFP is reserved for multifactorial deficiency, typically when PT/INR or aPTT exceeds ~1.5\u00d7 normal with clinical bleeding (Goobie and Haas, Paediatric Anaesthesia, 2014).</p><div class=\"addendum\"><p class=\"addendum-label\">Note (from answer-key addendum)</p><p>Keyed: D (massive transfusion). Note: Defensible, but (c) fibrinogen deficiency is also a legitimate FFP indication when concentrate/cryoprecipitate is unavailable. Not cleanly single-answer.</p></div>","no_key":false,"no_options":false,"free_answer":null},{"number":2,"stem":"Which of the following is a contraindication to the use of Octaplex:","options":[{"letter":"A","text":"Factor V Leiden"},{"letter":"B","text":"Heparin induced thrombocytopenia"},{"letter":"C","text":"Patient with DVT within last year"},{"letter":"D","text":"Patient on Apixaban (Eliquis)"}],"correct":"B","explanation":"<p>Octaplex is a 4-factor prothrombin complex concentrate (PCC) containing factors II, VII, IX, and X plus proteins C and S. Many PCCs, including those with added heparin, are contraindicated in patients with a history of HIT because the residual heparin can trigger the immune response (Rodgers, American Journal of Hematology, 2012; Baumann Kreuziger et al., BioMed Research International, 2014). Current NEJM review reiterates HIT as a specific safety concern for PCC use (Rocca and Ten Cate, New England Journal of Medicine, 2026).</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li><strong>a) Factor V Leiden</strong> --- a thrombophilia; a relative caution, not an absolute contraindication.</li>\n\n<li><strong>c) Remote DVT (&gt;1 year)</strong> --- not a contraindication; active thrombosis warrants caution but a remote event does not preclude use.</li>\n\n<li><strong>d) Patient on apixaban</strong> --- PCC is actually <strong>used</strong> to reverse factor Xa inhibitor--associated bleeding, so this is an indication, not a contraindication.</li>\n</ul>\n<p>Background: For patients with HIT requiring PCC-type reversal, a heparin-free 3-factor PCC (factor IX complex without heparin) is the recommended alternative (NCCN Cancer-Associated VTE guideline, 2026).</p>","no_key":false,"no_options":false,"free_answer":null},{"number":3,"stem":"Which one of the following statements is true:","options":[{"letter":"A","text":"Indications for surgical debridement of a gunshot wound include: retention of bullet in a major joint, the subarachnoid space and the parietal pleura"},{"letter":"B","text":"A Grade 2 Gustilo-Anderson open fracture has a characteristic of a 5cm laceration, heavy bacterial contamination, and 25-50% infection rate"},{"letter":"C","text":"The most sensitive sign of compartment syndrome is both the loss of pulse and sensation"},{"letter":"D","text":"Indication for an angiography include a pulseless, cold, pale foot with poor refill and lower extremity with ABI <0.9"}],"correct":"D","explanation":"<p>An abnormal ankle-brachial index (ABI &lt;0.9) together with signs of limb ischemia (pulseless, cold, pale, poor capillary refill) indicates possible arterial injury and is an indication for CT angiography or formal angiography in extremity trauma.</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li><strong>a)</strong> Overstates the indications; retained bullets are debrided/removed selectively (e.g., intra-articular bullets to prevent lead arthropathy), but the statement as constructed is not a correct blanket rule.</li>\n\n<li><strong>b)</strong> Gustilo--Anderson Grade II is a wound 1--10 cm with <strong>moderate</strong> soft-tissue damage and contamination --- not &quot;heavy contamination with 25--50% infection rate&quot; (that better fits Grade III).</li>\n\n<li><strong>c)</strong> The <strong>earliest and most sensitive</strong> sign of compartment syndrome is pain out of proportion and pain on passive stretch. Loss of pulse and sensation are <strong>late</strong> findings.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":4,"stem":"Which of the following are life threatening chest injuries:","options":[{"letter":"A","text":"Tension pneumothorax, flail chest with pulmonary contusion, esophageal rupture"},{"letter":"B","text":"Flail chest with pulmonary contusion, pneumothorax, cardiac contusion"},{"letter":"C","text":"Laryngotracheal injury, pericardial tamponade, open pneumothorax"},{"letter":"D","text":"Traumatic aortic disruption, acute respiratory distress syndrome, tracheobronchial injury"}],"correct":"C","explanation":"<p>These are all among the ATLS immediately life-threatening thoracic injuries (&quot;lethal six&quot;): airway obstruction/laryngotracheal injury, cardiac tamponade, and open pneumothorax, each requiring immediate intervention in the primary survey.</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li><strong>a)</strong> Esophageal rupture is serious but is a &quot;hidden six&quot; (potentially lethal) injury, not an immediate primary-survey threat.</li>\n\n<li><strong>b)</strong> Simple pneumothorax and cardiac contusion are not among the immediately life-threatening six.</li>\n\n<li><strong>d)</strong> ARDS is not a primary chest injury; aortic disruption is a &quot;hidden six&quot; injury.</li>\n</ul>\n<p>Note: This item depends on the specific list the course uses; option C best matches the classic immediately life-threatening group.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":5,"stem":"Which of the following is not associated with the lethal triad of trauma coagulopathy:","options":[{"letter":"A","text":"Tachycardia"},{"letter":"B","text":"Hypothermia"},{"letter":"C","text":"Acidemia"},{"letter":"D","text":"Resuscitation with hypercoagulable fluids"}],"correct":"A","explanation":"<div class=\"addendum\"><p class=\"addendum-label\">Addendum correction</p><p>The compiled key originally flagged this item as flawed and leaned toward D, but the answer key's final corrections pass concluded the best single answer is <strong>A (Tachycardia)</strong>, since \"resuscitation with hypercoagulable fluids\" (D) is not a real clinical entity and tachycardia is the more defensible \"not part of the triad\" choice.</p></div><p>The lethal triad of trauma is <strong>coagulopathy, hypothermia, and acidosis</strong> (Moore et al., Nature Reviews Disease Primers, 2021; Simmons and Powell, British Journal of Anaesthesia, 2016). Therefore the true triad components among the options are <strong>hypothermia (b)</strong> and <strong>acidemia (c)</strong>.</p>\n<p>The item is internally inconsistent because it asks for one answer but has <strong>two</strong> non-triad options:</p>\n<ul>\n<li><strong>d) &quot;Resuscitation with hypercoagulable fluids&quot;</strong> is not a recognized clinical entity and is a nonsense distractor --- likely the intended &quot;not associated&quot; answer.</li>\n\n<li><strong>a) Tachycardia</strong> is also <strong>not</strong> a component of the lethal triad (it is a sign of hemorrhagic shock).</li>\n</ul>\n<p>Best answer as written: <strong>D</strong> (the fabricated/nonsense option). Flag: tachycardia (a) is equally defensible as &quot;not part of the triad,&quot; making this a poorly constructed question.</p><div class=\"addendum\"><p class=\"addendum-label\">Note (from answer-key addendum)</p><p>No answer was originally marked. Flawed item: both (a) tachycardia and (d) &quot;resuscitation with hypercoagulable fluids&quot; are not components of the triad (hypothermia, acidemia, coagulopathy). &quot;Hypercoagulable fluids&quot; is not a real entity --- resuscitation fluids are dilutional/hypocoagulable. Best single answer: <strong>(a)</strong>.</p></div>","no_key":false,"no_options":false,"free_answer":null},{"number":6,"stem":"Which type of von Willebrand disease is usually unresponsive to treatment with Desmopressin and may require von Willebrand factor concentrates:","options":[{"letter":"A","text":"Type I"},{"letter":"B","text":"Type II"},{"letter":"C","text":"Type III"},{"letter":"D","text":"The acquired variant"}],"correct":"C","explanation":"<p>Type 3 VWD is the near-complete quantitative deficiency of VWF; because there is essentially no endogenous VWF to release, desmopressin is <strong>ineffective</strong>, and VWF-containing concentrate (with factor VIII) is the treatment of choice (Leebeek and Eikenboom, New England Journal of Medicine, 2016; Johnsen, GeneReviews, 2024; Mannucci et al., Blood, 2002).</p>\n<p>Why the others are less correct:</p>\n<ul>\n<li><strong>a) Type 1</strong> --- typically <strong>responsive</strong> to desmopressin (response should be confirmed with a trial).</li>\n\n<li><strong>b) Type 2</strong> --- desmopressin response is generally <strong>poor/variable</strong>, and type 2B can worsen thrombocytopenia; concentrate is often required. However, type 3 is the classic, near-universally unresponsive type the question targets.</li>\n\n<li><strong>d) Acquired von Willebrand syndrome</strong> --- response is variable and depends on the underlying cause; not the classic textbook answer here.</li>\n</ul>\n<p>Background: In type 3 disease, high-purity VWF concentrate normalizes VWF instantly, and factor VIII rises secondarily; for acute bleeding or surgery, added factor VIII concentrate provides immediate hemostatic factor VIII levels (Leebeek and Eikenboom, New England Journal of Medicine, 2016).</p>","no_key":false,"no_options":false,"free_answer":null},{"number":7,"stem":"Which of the following is most significant factor in preventing a diathermy injury?","options":[{"letter":"A","text":"Strength of the current"},{"letter":"B","text":"The contact surface area the ground"},{"letter":"C","text":"Distance of the ground to the cathode"},{"letter":"D","text":"The wave form of the current"}],"correct":"B","explanation":"<p>In monopolar electrosurgery, current is concentrated at the small active electrode tip (producing the desired effect) and must return through a large-surface-area dispersive (grounding) pad. A large contact area keeps current <strong>density</strong> low at the return site, preventing heat concentration and burns. A pad that is partially detached (reduced contact area) raises current density and is the classic cause of a diathermy return-electrode burn.</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li><strong>A/D)</strong> Current strength and waveform determine the cutting/coagulation effect but are not the principal safeguard against return-site burns.</li>\n\n<li><strong>C)</strong> Distance to the cathode is not the governing safety factor.</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":8,"stem":"What is the most common predominant cell type in wound healing seven days after a repair?","options":[{"letter":"A","text":"Fibroblasts"},{"letter":"B","text":"Neutrophils"},{"letter":"C","text":"Macrophages"},{"letter":"D","text":"Plasma cells"}],"correct":"A","explanation":"<p>By day 7 the wound is in the <strong>proliferative phase</strong>, in which <strong>fibroblasts</strong> predominate, laying down collagen and granulation tissue. This supports answer A.</p>\n<p>Note/flag: Cell-type timelines vary by source. The classic sequence is neutrophils (days 1--2) \u2192 macrophages (days 2--3, peaking ~day 3--5) \u2192 fibroblasts (from ~day 3--5 onward, dominating the proliferative phase). Some texts still cite macrophages as predominant into the end of the first week (making C defensible), but at <strong>day 7</strong> fibroblasts are the standard answer.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":9,"stem":"Postoperative abdominal wound disruption/dehiscence is associated with a variety of contributing factors. Which of the following is most often found for these cases?","options":[{"letter":"A","text":"Advanced age"},{"letter":"B","text":"Anemia"},{"letter":"C","text":"Diabetes mellitus"},{"letter":"D","text":"Increase intra-abdominal pressure"}],"correct":"D","explanation":"<p>Acutely elevated intra-abdominal pressure (coughing, vomiting, ileus, straining, ascites) is the most common mechanical factor precipitating fascial dehiscence, often combined with technical closure failure and impaired healing.</p>\n<p>Why the others are incorrect:</p>\n<ul>\n<li><strong>A) Advanced age, B) anemia, C) diabetes mellitus</strong> --- all contribute to impaired wound healing and are risk factors, but the mechanical driver most often implicated in acute disruption is raised intra-abdominal pressure. (Note: many texts list wound infection and technical/suture failure as leading causes overall; among the listed options, increased intra-abdominal pressure is the intended answer.)</li>\n</ul>","no_key":false,"no_options":false,"free_answer":null},{"number":10,"stem":"A tension pneumothorax is most commonly to be misdiagnosed as a:","options":null,"correct":null,"explanation":"<p>Best answer: Pericardial (cardiac) tamponade**</p>\n<p>Both tension pneumothorax and cardiac tamponade cause <strong>obstructive shock</strong> with hypotension, distended neck veins (elevated JVP), and tachycardia, so they are the classic clinical mimics of one another. The distinguishing bedside features favoring tension pneumothorax are <strong>absent/decreased unilateral breath sounds, hyperresonance, and tracheal deviation away from the affected side</strong>, whereas tamponade classically gives muffled heart sounds (Beck triad) with equal breath sounds.</p>\n<p>Note: The full option list for this question was not provided; the answer is given based on the single stated option and standard trauma teaching. Immediate management of suspected tension pneumothorax is clinical (needle/finger decompression), not imaging.</p><div class=\"addendum\"><p class=\"addendum-label\">Note (from answer-key addendum)</p><p>Only option (a) pericardial tamponade was provided; remaining stem/options missing. Cardiac tamponade is the classic mimic, so <strong>(a)</strong> is defensible, but the question cannot be fully validated.</p></div>","no_key":false,"no_options":true,"free_answer":"Pericardial (cardiac) tamponade"},{"number":11,"stem":"Which of the following locations on the human body generally does not possess resident microflora (microbes) in healthy individuals?","options":[{"letter":"A","text":"Skin"},{"letter":"B","text":"Biliary tract"},{"letter":"C","text":"Oropharynx"},{"letter":"D","text":"Distal Colon"}],"correct":"B","explanation":"<p>The biliary tree is normally sterile in healthy individuals; bile flow, IgA, and the sphincter of Oddi keep it free of resident flora. Bactibilia occurs pathologically with obstruction, stones, stents, or advancing age.</p>\n<p>Why the others are wrong:</p>\n<ul>\n<li>A. Skin --- heavily colonized with resident flora (coagulase-negative staphylococci, corynebacteria, Cutibacterium acnes).</li>\n\n<li>C. Oropharynx --- densely colonized (viridans streptococci, Neisseria, anaerobes).</li>\n\n<li>D. Distal colon --- the most heavily colonized site in the body (10^11--10^12 organisms/g, predominantly anaerobes such as Bacteroides).</li>\n</ul>\n<p>Background: Normally sterile sites also include blood, CSF, pleural/peritoneal/pericardial fluid, the lower urinary tract/bladder, and the deep tissues. Contamination of the biliary tract is central to the microbiology of cholangitis and cholecystitis.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":12,"stem":"Which of the following antimicrobial agents has very limited activity (i.e., significant rate of resistance) against Pseudomonas?","options":[{"letter":"A","text":"Ceftazidime"},{"letter":"B","text":"Tobramycin"},{"letter":"C","text":"Levofloxacin"},{"letter":"D","text":"Vancomycin"}],"correct":"D","explanation":"<p>Vancomycin is a glycopeptide active only against gram-positive organisms; it has no meaningful activity against Pseudomonas aeruginosa (a gram-negative rod) because it cannot penetrate the gram-negative outer membrane.</p>\n<p>Why the others are wrong:</p>\n<ul>\n<li>A. Ceftazidime --- a third-generation cephalosporin with reliable antipseudomonal activity.</li>\n\n<li>B. Tobramycin --- an aminoglycoside with strong antipseudomonal activity, frequently used synergistically.</li>\n\n<li>C. Levofloxacin --- a respiratory fluoroquinolone with antipseudomonal activity (ciprofloxacin is more potent, but levofloxacin retains coverage).</li>\n</ul>\n<p>Background: Antipseudomonal agents include piperacillin-tazobactam, ceftazidime, cefepime, carbapenems (not ertapenem), aztreonam, ciprofloxacin/levofloxacin, aminoglycosides, and colistin. Gram-positive-only agents (vancomycin, linezolid, daptomycin) have no Pseudomonas activity.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":13,"stem":"Based on the summary of Surviving Sepsis Campaign guidelines, which of the following is true?","options":[{"letter":"A","text":"Transfusion of red blood cells should occur when the hemoglobin drops below 90 (less than 9.0 g/dL)"},{"letter":"B","text":"Source control always occurs before starting empiric antibiotics"},{"letter":"C","text":"Intravenous hydrocortisone should be initiated once aggressive fluid resuscitation fails"},{"letter":"D","text":"The first-line choice vasopressor is norepinephrine"}],"correct":"D","explanation":"<p>The Surviving Sepsis Campaign recommends norepinephrine as the first-line vasopressor in septic shock, adding vasopressin (and then epinephrine) if the mean arterial pressure target is not met.</p>\n<p>Why the others are wrong:</p>\n<ul>\n<li>A. The recommended transfusion threshold is a restrictive strategy at hemoglobin &lt;70 g/L (7.0 g/dL), not 90 g/L.</li>\n\n<li>B. Empiric broad-spectrum antibiotics should be started immediately (ideally within 1 hour for shock) and must not be delayed for source control; source control is pursued as soon as feasible but does not precede antibiotics.</li>\n\n<li>C. Corticosteroids (IV hydrocortisone, typically 200 mg/day) are recommended for septic shock with ongoing vasopressor requirement --- i.e., when norepinephrine/vasopressin cannot maintain hemodynamics --- not simply when fluid resuscitation &quot;fails.&quot; The phrasing here is imprecise, whereas D is unambiguously correct.</li>\n</ul>\n<p>Background: Other core bundle elements include measuring lactate, obtaining blood cultures before antibiotics, and giving \u226530 mL/kg crystalloid for hypotension or lactate \u22654 mmol/L.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":14,"stem":"Vitamin C is important for which of the following steps in wound healing?","options":[{"letter":"A","text":"Hydroxylation of proline to hydroxyproline"},{"letter":"B","text":"Conversion of Procollagen to collagen"},{"letter":"C","text":"Collagen cross-linking"},{"letter":"D","text":"Collagen secretion by fibroblasts"}],"correct":"A","explanation":"<p>Vitamin C (ascorbic acid) is an essential cofactor for prolyl hydroxylase (and lysyl hydroxylase), enabling hydroxylation of proline and lysine residues on the nascent collagen chain. Hydroxyproline is required to stabilize the collagen triple helix; without it, unstable collagen is degraded, producing the impaired healing and vascular fragility of scurvy.</p>\n<p>Why the others are wrong:</p>\n<ul>\n<li>B. Cleavage of procollagen to tropocollagen is performed by procollagen peptidases extracellularly, not a vitamin C--dependent step.</li>\n\n<li>C. Collagen cross-linking is mediated by lysyl oxidase, a copper-dependent enzyme (vitamin C indirectly supports it by enabling lysine hydroxylation, but cross-linking itself is not the vitamin C step being asked).</li>\n\n<li>D. Secretion of procollagen by fibroblasts is a general cellular process, not vitamin C--specific.</li>\n</ul>\n<p>Background: Vitamin C deficiency (scurvy) causes poor wound healing, perifollicular hemorrhage, bleeding gums, and reopening of healed wounds. Vitamin C is rapidly consumed at wound sites and also has antioxidant and anti-inflammatory roles.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":15,"stem":"Which of the following will elicit the least local inflammatory response?","options":[{"letter":"A","text":"Silk"},{"letter":"B","text":"Catgut"},{"letter":"C","text":"Polypropylene"},{"letter":"D","text":"Teflon-coated Dexon"}],"correct":"C","explanation":"<p>Polypropylene (e.g., Prolene) is a synthetic, non-absorbable monofilament that is essentially inert, provoking the least tissue reaction of the options. Its monofilament structure also resists bacterial adherence.</p>\n<p>Why the others are wrong:</p>\n<ul>\n<li>A. Silk --- a braided natural (protein) material that is highly reactive and elicits a marked inflammatory response.</li>\n\n<li>B. Catgut --- a natural absorbable suture broken down by proteolysis/phagocytosis, producing a substantial inflammatory reaction.</li>\n\n<li>D. Teflon-coated Dexon (polyglycolic acid) --- a braided synthetic absorbable suture; it is less reactive than natural materials but its absorption by hydrolysis and multifilament structure evoke more reaction than inert monofilament polypropylene.</li>\n</ul>\n<p>Background: In general, tissue reactivity is greatest for natural materials (catgut &gt; silk) and least for inert synthetic monofilaments (polypropylene, nylon). Braided sutures harbor bacteria more readily than monofilaments.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":16,"stem":"Which of the following factors initiates the intrinsic (contact activation) pathway of the coagulation system?","options":[{"letter":"A","text":"12 (Factor XII)"},{"letter":"B","text":"9 (Factor IX)"},{"letter":"C","text":"10 (Factor X)"},{"letter":"D","text":"7 (Factor VII)"}],"correct":"A","explanation":"<p>The intrinsic (contact activation) pathway is initiated by factor XII (Hageman factor), which is activated on contact with negatively charged surfaces (in vitro, this is measured by the aPTT). Activated XIIa then activates XI, which activates IX.</p>\n<p>Why the others are wrong:</p>\n<ul>\n<li>B. Factor IX --- a downstream intrinsic pathway factor, not the initiator.</li>\n\n<li>C. Factor X --- the first factor of the common pathway, where the intrinsic and extrinsic pathways converge.</li>\n\n<li>D. Factor VII --- the initiator of the extrinsic pathway (activated by tissue factor), measured by the PT/INR.</li>\n</ul>\n<p>Background: aPTT assesses the intrinsic and common pathways (XII, XI, IX, VIII, X, V, II, fibrinogen); PT assesses the extrinsic and common pathways (VII, X, V, II, fibrinogen). Factor XII deficiency prolongs the aPTT but paradoxically does not cause clinical bleeding.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":17,"stem":"Wound strength at three days (72 hours) is due to:","options":[{"letter":"A","text":"Quantity of collagen"},{"letter":"B","text":"Collagen cross-linking"},{"letter":"C","text":"Epithelialization"},{"letter":"D","text":"Suture"}],"correct":"D","explanation":"<p>At 72 hours the wound is still in the inflammatory phase; meaningful collagen deposition and cross-linking have not yet occurred, so the mechanical integrity of the wound depends almost entirely on the closure material (sutures/staples).</p>\n<p>Why the others are wrong:</p>\n<ul>\n<li>A. Collagen quantity --- fibroblast collagen synthesis becomes significant only during the proliferative phase (roughly days 5--21); it does not account for early strength.</li>\n\n<li>B. Collagen cross-linking --- occurs during remodeling (weeks to months) and is responsible for the long-term tensile strength gain, not early strength.</li>\n\n<li>C. Epithelialization --- restores the epithelial barrier within 24--48 hours but contributes negligibly to tensile strength.</li>\n</ul>\n<p>Background: A healed wound regains only ~5% of strength at 1 week, ~30% at 3 weeks, and plateaus at ~70--80% of original strength by ~3 months. This is why sutures matter most early and why fascial/high-tension closures use slowly absorbed or permanent material.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":18,"stem":"The following is true about the surgical safety checklist (developed by the World Health Organization):","options":[{"letter":"A","text":"Includes three components: 1 -- before the patient enters the operating room, 2 -- before induction of anesthesia, and 3 -- before skin incision"},{"letter":"B","text":"Includes an informed consent discussion with the patient (or alternate decision-maker)"},{"letter":"C","text":"The entire surgical safety checklist should be skipped during an imminently life-threatening emergency"},{"letter":"D","text":"Anticipated critical events should be discussed before the skin incision with input from the surgeon, the anesthetist, and the nursing team"},{"letter":"E","text":"If the patient does not speak English or French, the surgical safety checklist before induction of anesthesia can be omitted as long as it is documented in the patient medical record"}],"correct":"D","explanation":"<p>During the &quot;Time Out&quot; phase (immediately before skin incision), the team reviews anticipated critical events --- the surgeon states critical/unexpected steps, operative duration, and anticipated blood loss; the anesthetist reviews patient-specific concerns; and the nursing team confirms sterility, equipment, and imaging. This shared briefing is a core function of the checklist.</p>\n<p>Why the others are wrong:</p>\n<ul>\n<li>A. The three phases are Sign In (before induction of anesthesia), Time Out (before skin incision), and Sign Out (before the patient leaves the OR) --- not &quot;before the patient enters the OR.&quot;</li>\n\n<li>B. Confirming that consent has been obtained is part of the checklist, but conducting the informed consent discussion itself is a separate process, not a checklist component.</li>\n\n<li>C. The checklist should not be skipped in emergencies; it may be abbreviated but the safety steps remain essential.</li>\n\n<li>E. A language barrier is a reason to use an interpreter, never to omit the checklist; omission is never acceptable.</li>\n</ul>\n<p>Background: Implementation of the WHO Surgical Safety Checklist has been associated with reductions in perioperative mortality and complications by improving team communication and reducing errors.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":19,"stem":"A patient with an unrecognized latex allergy has developed an anaphylactic reaction intraoperatively. What treatment is recommended?","options":[{"letter":"A","text":"Switch to non-latex gloves and equipment"},{"letter":"B","text":"Diphenhydramine and ranitidine (H1 and H2 histamine blockers) intravenously"},{"letter":"C","text":"Epinephrine subcutaneously or endotracheally"},{"letter":"D","text":"Hydrocortisone intravenously"},{"letter":"E","text":"All of the above"}],"correct":"E","explanation":"<p>Management of intraoperative anaphylaxis requires removing the trigger (switch to a latex-free environment), giving epinephrine (the first-line, life-saving agent), and adding adjuncts: H1 and H2 antihistamines and corticosteroids. All listed measures are part of comprehensive management, so E is the intended composite answer.</p>\n<p>Caveat on option C: For anaphylaxis, epinephrine should be given intramuscularly (or IV in a monitored setting with cardiovascular collapse) --- the &quot;subcutaneous or endotracheal&quot; route stated is suboptimal, but E remains the intended answer because all components together constitute correct management.</p>\n<p>Why the single options are individually incomplete: Removing latex (A), antihistamines (B), and corticosteroids (D) are each necessary but insufficient alone; epinephrine (C) is the critical life-saving drug but must be combined with trigger removal and supportive care. Only E captures the full regimen.</p>\n<p>Background: Intraoperative anaphylaxis also requires stopping suspected agents, IV fluids for distributive shock, airway/oxygen support, and considering a tryptase level to confirm the diagnosis. Antihistamines and steroids are adjuncts and never substitutes for epinephrine.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":20,"stem":"Which of the following best describes the mechanism of action of low molecular weight heparin on coagulation?","options":[{"letter":"A","text":"Block the synthesis of vitamin K--dependent factors, reducing levels of prothrombin and factors VII, IX, X"},{"letter":"B","text":"Block the activation of factor X by binding with AT-III and antithrombin"},{"letter":"C","text":"Produce a selective anti-Xa activity"},{"letter":"D","text":"Inhibit the pro-coagulant activity of thrombin"}],"correct":"C","explanation":"<p>Low molecular weight heparin binds antithrombin and, because of its shorter chain length, preferentially accelerates inhibition of factor Xa while having relatively little effect on thrombin (factor IIa). This yields a predominant, more predictable anti-Xa effect, which is why monitoring (when needed) uses anti-Xa levels rather than the aPTT.</p>\n<p>Why the others are wrong:</p>\n<ul>\n<li>A. Describes warfarin (a vitamin K antagonist blocking synthesis of factors II, VII, IX, X and proteins C/S).</li>\n\n<li>B. This describes the general antithrombin-dependent mechanism but is worded as blocking factor X &quot;activation&quot;; more importantly it does not capture the selective anti-Xa (over anti-IIa) property that distinguishes LMWH from unfractionated heparin. Unfractionated heparin inhibits both Xa and IIa roughly equally.</li>\n\n<li>D. Describes direct thrombin inhibitors (e.g., argatroban, dabigatran, bivalirudin).</li>\n</ul>\n<p>Background: To inhibit thrombin, heparin must simultaneously bind antithrombin and thrombin, requiring a chain of \u226518 saccharides; most LMWH chains are too short for this, so their anti-IIa activity is reduced while anti-Xa activity is preserved. Unfractionated heparin has an anti-Xa:anti-IIa ratio of ~1:1, whereas LMWHs range from roughly 2:1 to 4:1.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":21,"stem":"Which of the following is associated with the highest risk of transmission from a blood transfusion in North America?","options":[{"letter":"A","text":"Hepatitis A virus"},{"letter":"B","text":"HIV"},{"letter":"C","text":"Hepatitis B virus"},{"letter":"D","text":"Hepatitis C virus"}],"correct":"C","explanation":"<p>Among the classic transfusion-transmitted viruses, HBV has the highest residual per-unit transmission risk in North America because its window period and screening limitations exceed those of HIV and HCV, both of which are now vanishingly rare (~1 in 1--2 million) with nucleic acid testing. Hepatitis A (A) is enterically transmitted and only exceptionally rare via transfusion. HIV (B) and HCV (D) have lower residual risk than HBV due to highly sensitive NAT screening.</p>\n<p><em>Note / qualifier:</em> This is a &quot;highest among viruses&quot; framing. If the question is interpreted as the highest overall infectious risk per unit, bacterial contamination (especially of platelets) exceeds all of these viral risks --- so the item is only cleanly answerable when restricted to the listed viral options.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":22,"stem":"A 30-year-old patient is undergoing lower extremity surgery. Which of the following factors may increase the duration of action of local anesthetics used for subarachnoid block?","options":[{"letter":"A","text":"Patient's position"},{"letter":"B","text":"Vasodilators"},{"letter":"C","text":"Young patient"},{"letter":"D","text":"Hypertension"}],"correct":"A","explanation":"<p>Positioning influences the spread, level, and duration of the block by altering distribution of anesthetic relative to baricity and gravity, which can prolong the effect in dependent segments. Vasodilators (B) increase vascular uptake and shorten duration. Youth (C) is associated with faster metabolism/clearance, not prolongation. Hypertension (D) does not prolong block duration.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":23,"stem":"A 72-year-old had an epidural catheter placed before a right colectomy. Which of the following recommendations is appropriate for low-molecular-weight heparin administration in the postoperative period?","options":[{"letter":"A","text":"Start \u22656 hours after catheter placement"},{"letter":"B","text":"Remove the catheter \u22656 hours after the last dose"},{"letter":"C","text":"Start more than one hour after catheter removal"},{"letter":"D","text":"Remove more than 8 hours after the last dose"}],"correct":"A","explanation":"<p>Neuraxial anticoagulation guidance permits initiating prophylactic LMWH no sooner than ~6 hours after atraumatic catheter placement to reduce spinal/epidural hematoma risk. The other distractors misstate the accepted intervals: prophylactic LMWH generally requires ~12 hours (and therapeutic dosing ~24 hours) between the last dose and catheter removal, and dosing should resume ~4 hours after catheter removal --- so B, C, and D use incorrect timing thresholds.</p>\n<p><em>Note / qualifier:</em> Exact intervals depend on prophylactic vs. therapeutic dosing and the specific society guideline; the item tests the general principle of a safe delay after placement.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":24,"stem":"Which of the following components help to develop a culture of safety in surgical practice?","options":[{"letter":"A","text":"Allowing the surgeon to be in charge in the operating room without question"},{"letter":"B","text":"Promoting individualism and professional autonomy"},{"letter":"C","text":"Recognizing the effects of stress and fatigue on a surgeon's decision-making"},{"letter":"D","text":"Recognizing that surgery is generally a low-risk field and generally not prone to errors"},{"letter":"E","text":"Ensuring students and residents are reprimanded for medical errors causing harm"}],"correct":"C","explanation":"<p>A safety culture depends on acknowledging human factors (fatigue, stress) that degrade performance. Unquestioned hierarchy (A) and individualism (B) suppress the speaking-up behavior that prevents error. Surgery is high-risk and error-prone (D is false). A punitive response to errors (E) discourages reporting and undermines a just culture.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":25,"stem":"In terms of medical errors, which of the following is correct:","options":[{"letter":"A","text":"Operating on the wrong side is an example of a \"never event\" that is identifiable, preventable, and has serious consequences"},{"letter":"B","text":"Near misses should not be reported as no patient harm occurred"},{"letter":"C","text":"A superficial skin infection after a second-year resident is left to close skin is negligence on the part of both surgeon and resident"},{"letter":"D","text":"...negligence on the part of the surgeon but not the resident"},{"letter":"E","text":"...negligence of the resident only"}],"correct":"A","explanation":"<p>Never events are serious, largely preventable, and clearly identifiable --- wrong-side surgery is the prototype. Near misses should always be reported because they reveal system vulnerabilities (B is false). A superficial skin infection after appropriate, supervised resident closure is a recognized complication, not negligence, so C, D, and E all mischaracterize an expected adverse outcome as negligence.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":26,"stem":"A healthy 75-year-old man undergoing minor surgery (overnight stay) should have the following preoperative tests ordered:","options":[{"letter":"A","text":"Chest x-ray"},{"letter":"B","text":"Creatinine"},{"letter":"C","text":"PT (INR) and PTT"},{"letter":"D","text":"Urinalysis"},{"letter":"E","text":"All the above"}],"correct":"B","explanation":"<p>Renal function is the most defensible selective test in an older patient, informing drug dosing and fluid management. Routine chest x-ray (A), coagulation studies (C), and urinalysis (D) are not indicated in an asymptomatic healthy patient without specific risk factors, so &quot;all the above&quot; (E) is incorrect.</p>\n<p><em>Note / qualifier:</em> Most contemporary preoperative-testing guidelines discourage any routine testing in a healthy patient for minor surgery. Creatinine is the &quot;least unreasonable&quot; choice here rather than a clearly mandated test; a strict evidence-based reading could favor no routine testing at all.</p><div class=\"addendum\"><p class=\"addendum-label\">Note (from answer-key addendum)</p><p>Keyed: B (creatinine), per Sabiston. Note: Most modern preoperative guidelines discourage any routine testing in a healthy patient for minor surgery --- creatinine is the &quot;least unreasonable,&quot; not clearly indicated.</p></div>","no_key":false,"no_options":false,"free_answer":null},{"number":27,"stem":"Which of the following blood products will be viable after storage at less than \u221218\u00b0C for 6 months?","options":[{"letter":"A","text":"FFP"},{"letter":"B","text":"Platelets"},{"letter":"C","text":"Packed red blood cells"},{"letter":"D","text":"Whole blood"}],"correct":"A","explanation":"<p>Fresh frozen plasma is stored frozen (typically \u2264 \u221218\u00b0C) and remains viable for up to ~12 months, so 6 months is well within its shelf life. Platelets (B) are stored at room temperature with agitation for only ~5--7 days and cannot be frozen conventionally. Packed RBCs (C) and whole blood (D) are refrigerated (1--6\u00b0C) for weeks, not frozen at \u221218\u00b0C.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":28,"stem":"A 65-year-old woman undergoing preoperative evaluation for bowel resection is taking Valerian. Which important effect is associated with this herb?","options":[{"letter":"A","text":"A benzodiazepine-like acute withdrawal"},{"letter":"B","text":"Induction of cytochrome P-450"},{"letter":"C","text":"Hypoglycemia"},{"letter":"D","text":"Potential to increase risk for bleeding"}],"correct":"A","explanation":"<p>Valerian acts on GABAergic pathways, and abrupt perioperative discontinuation can precipitate a benzodiazepine-like withdrawal; it also potentiates anesthetic sedation. CYP-450 induction (B) is characteristic of St. John&#x27;s wort. Hypoglycemia (C) is linked to agents such as ginseng. Increased bleeding risk (D) is associated with the &quot;G&quot; herbs (garlic, ginkgo, ginger, ginseng) --- not valerian.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":29,"stem":"Which of the following strategies may help prevent ventilator-associated pneumonia (VAP)?","options":[{"letter":"A","text":"Nasotracheal intubation"},{"letter":"B","text":"Post-pyloric feeding"},{"letter":"C","text":"Antibiotic cycling"},{"letter":"D","text":"Transfusion restriction"}],"correct":"D","explanation":"<p>A restrictive transfusion strategy reduces immunomodulatory and infectious complications, including VAP. Nasotracheal intubation (A) increases sinusitis and VAP risk versus the oral route. Post-pyloric feeding (B) has not consistently reduced VAP in trials. Antibiotic cycling (C) is aimed at resistance patterns, not VAP prevention.</p>\n<p><em>Note / qualifier:</em> Core VAP bundle measures (head-of-bed elevation, oral chlorhexidine, subglottic suctioning, daily sedation interruption/spontaneous breathing trials) are the primary evidence-based interventions; transfusion restriction is the best answer among the options listed rather than a first-line VAP-specific measure.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":30,"stem":"Which of the following is NOT part of the American College of Surgeons code of professional conduct:","options":[{"letter":"A","text":"Acknowledge and support the needs of patients' families"},{"letter":"B","text":"Respect the knowledge, dignity, and perspective of other healthcare professionals"},{"letter":"C","text":"Disclose adverse events and medical errors only if these cause serious harm"},{"letter":"D","text":"Serve as effective advocates of our patients' needs"}],"correct":"C","explanation":"<p>The ACS code calls for transparent disclosure of adverse events and errors, not disclosure contingent on the severity of harm --- making C the statement that is NOT part of the code. Supporting families (A), respecting other professionals (B), and advocating for patients (D) are all explicit elements of the code.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":31,"stem":"Essential skills for developing cultural competence include all the following EXCEPT:","options":[{"letter":"A","text":"Knowledge, respect, and validation of differing values, cultures, and beliefs, including sexual orientation, gender, age, race, ethnicity, and class"},{"letter":"B","text":"Dealing with hostility and discomfort as a result of cultural discord"},{"letter":"C","text":"Understanding language barriers and working with interpreters"},{"letter":"D","text":"Eliciting a social and medical history based on the culture of the current country in which the patient lives"}],"correct":"D","explanation":"<p><strong>Why D is correct (i.e., the EXCEPTION):</strong> Cultural competence requires eliciting a history grounded in the <em>patient&#x27;s own</em> cultural background, values, and beliefs --- not the culture of the country in which the patient currently resides. Assuming the patient conforms to the dominant local culture is itself a failure of cultural competence and risks stereotyping and missed diagnoses.</p>\n<p><strong>Why the others are genuine components of cultural competence:</strong></p>\n<ul>\n<li><strong>A</strong> --- Knowledge, respect, and validation of a patient&#x27;s values across all dimensions of diversity is a foundational skill.</li>\n\n<li><strong>B</strong> --- Recognizing and managing one&#x27;s own discomfort and any hostility arising from cultural discord is an explicit competence.</li>\n\n<li><strong>C</strong> --- Recognizing language barriers and appropriately using professional interpreters is central to equitable care.</li>\n</ul>\n<p><strong>Background:</strong> Cultural competence is patient-centered, not location-centered. The clinician adapts to the individual patient&#x27;s cultural framework rather than expecting the patient to conform to local norms.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":32,"stem":"A 33-year-old man sustained an MVA and is brought to the emergency room. Imaging reveals a type I odontoid (tip) fracture. Which of the following is the best treatment?","options":[{"letter":"A","text":"Hard collar"},{"letter":"B","text":"Surgery"},{"letter":"C","text":"Traction"},{"letter":"D","text":"Halo"}],"correct":"A","explanation":"<p><strong>Why A is correct:</strong> A Type I odontoid fracture involves the tip of the dens above the transverse ligament and is generally mechanically stable. It is typically managed non-operatively with external immobilization in a hard (rigid) cervical collar, and it heals well.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<ul>\n<li><strong>B (Surgery)</strong> --- Reserved for unstable fractures, most commonly Type II fractures with displacement, nonunion, or in select patients; a stable Type I tip fracture does not require operative fixation.</li>\n\n<li><strong>C (Traction)</strong> --- Not indicated for a stable Type I fracture and carries risk (particularly with certain odontoid patterns).</li>\n\n<li><strong>D (Halo)</strong> --- Halo vest immobilization is more commonly used for Type II fractures in patients managed non-operatively; it is more than is required for a stable Type I injury.</li>\n</ul>\n<p><strong>Background:</strong> The Anderson-D&#x27;Alonzo classification: Type I = tip (avulsion, usually stable); Type II = base of the dens (highest nonunion risk, often needs halo or surgery); Type III = extends into the vertebral body (generally heals with immobilization).</p>","no_key":false,"no_options":false,"free_answer":null},{"number":33,"stem":"During the wound healing phase, which of the following cells are the 1st to appear?","options":[{"letter":"A","text":"Fibroblast"},{"letter":"B","text":"Neutrophils"},{"letter":"C","text":"Macrophages"},{"letter":"D","text":"Lymphocytes"}],"correct":"B","explanation":"<p><strong>Why B is correct:</strong> Neutrophils are the first inflammatory cells to arrive at a wound, appearing within hours (peaking around 24--48 hours). They d\u00e9bride the wound by phagocytosing bacteria and debris during the early inflammatory phase.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<ul>\n<li><strong>A (Fibroblasts)</strong> --- Appear later, dominating the proliferative phase (around day 3 onward), laying down collagen and granulation tissue.</li>\n\n<li><strong>C (Macrophages)</strong> --- Follow neutrophils, becoming the predominant cell around days 2--3 and orchestrating the transition to the proliferative phase; they are not the <em>first</em> to appear.</li>\n\n<li><strong>D (Lymphocytes)</strong> --- Appear later still, around the end of the first week.</li>\n</ul>\n<p><strong>Background:</strong> Inflammatory phase sequence: neutrophils first \u2192 macrophages \u2192 lymphocytes. This distinguishes Q37 (first cell = neutrophils) from Q12 (predominant cell at day 7 = fibroblasts).[27][28]</p>","no_key":false,"no_options":false,"free_answer":null},{"number":34,"stem":"Which of the following is NOT part of the lethal triad of shock:","options":[{"letter":"A","text":"Acidosis"},{"letter":"B","text":"Hypothermia"},{"letter":"C","text":"Hypotension"},{"letter":"D","text":"Coagulopathy"}],"correct":"C","explanation":"<p><strong>Why C is correct (the EXCEPTION):</strong> The lethal triad (also called the &quot;trauma triad of death&quot;) consists of <strong>acidosis, hypothermia, and coagulopathy</strong>. Hypotension is not a component of the triad --- it is a manifestation of shock, not one of the three self-perpetuating derangements.</p>\n<p><strong>Why the others are components:</strong></p>\n<ul>\n<li><strong>A (Acidosis)</strong> --- Metabolic acidosis from hypoperfusion impairs the coagulation cascade and myocardial function.</li>\n\n<li><strong>B (Hypothermia)</strong> --- Impairs enzymatic clotting factor activity and platelet function.</li>\n\n<li><strong>D (Coagulopathy)</strong> --- Results from and worsens bleeding, completing the vicious cycle.</li>\n</ul>\n<p><strong>Background:</strong> These three derangements reinforce one another, and each worsens the others; interrupting the cycle (warming, correcting acidosis, hemostatic resuscitation) is central to damage-control resuscitation. Note this overlaps with Q9&#x27;s lethal triad of trauma-induced coagulopathy.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":35,"stem":"Which of the following conditions is caused by a biotin, vitamin A, and zinc deficiency?","options":[{"letter":"A","text":"Dermatitis"},{"letter":"B","text":"Bruising"},{"letter":"C","text":"Osteoporosis"},{"letter":"D","text":"Cardiomyopathy"}],"correct":"A","explanation":"<p><strong>Why A is correct:</strong> Deficiencies of biotin, vitamin A, and zinc each classically cause skin/mucosal manifestations --- dermatitis. Biotin deficiency causes a scaly periorificial dermatitis and alopecia; zinc deficiency causes acrodermatitis (periorificial and acral dermatitis); vitamin A deficiency causes follicular hyperkeratosis and dry skin.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<ul>\n<li><strong>B (Bruising)</strong> --- Suggests vitamin C or vitamin K deficiency (or platelet/coagulation problems), not this triad.</li>\n\n<li><strong>C (Osteoporosis)</strong> --- Associated with vitamin D, calcium, and vitamin C deficiencies, not this combination.</li>\n\n<li><strong>D (Cardiomyopathy)</strong> --- Associated with thiamine (wet beriberi) and selenium (Keshan disease) deficiencies.</li>\n</ul>\n<p><strong>Background:</strong> Zinc, biotin, and vitamin A share a common dermatologic footprint, which is a frequent clue in nutritional-deficiency questions.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":36,"stem":"You are asked to assess a 65-year-old inpatient in the ICU following transfer from his surgical inpatient unit for hypotension. He looks pale, his peripheries are cold and clammy. On examination pulse is 60 bpm, BP 70/45, and O2 saturation is 96% on 4 L of oxygen. His central venous pressure is elevated at 14 cm H2O. The most likely diagnosis is:","options":[{"letter":"A","text":"Septic shock"},{"letter":"B","text":"Cardiogenic shock"},{"letter":"C","text":"Anaphylactic shock"},{"letter":"D","text":"Hypovolemic shock"}],"correct":"B","explanation":"<p><strong>Why B is correct:</strong> The combination of hypotension, cold and clammy peripheries (high systemic vascular resistance/low cardiac output), and an <strong>elevated CVP (14 cm H2O)</strong> is classic for cardiogenic shock. The heart fails as a pump, causing venous congestion (high CVP) and compensatory peripheral vasoconstriction.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<ul>\n<li><strong>A (Septic shock)</strong> --- Distributive shock; typically produces warm, vasodilated peripheries early with a <em>low</em> CVP and usually tachycardia.</li>\n\n<li><strong>C (Anaphylactic shock)</strong> --- Distributive; associated with vasodilation, low CVP, and often bronchospasm/urticaria, not an elevated CVP.</li>\n\n<li><strong>D (Hypovolemic shock)</strong> --- Produces cold peripheries but with a <em>low</em> CVP due to reduced preload --- the opposite of this patient&#x27;s elevated CVP.</li>\n</ul>\n<p><strong>Background:</strong> CVP is the key discriminator here: elevated CVP with cold peripheries points to cardiogenic (or obstructive) shock, whereas low CVP points to hypovolemic or distributive shock.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":37,"stem":"A man is brought to the emergency department with blood spurting from a wound in his right distal thigh. He is alert and has a systolic BP of 100 mmHg. What is the next most appropriate initial management step?","options":[{"letter":"A","text":"Apply direct pressure on the wound with sterile gauze"},{"letter":"B","text":"Apply direct pressure on the proximal femoral artery"},{"letter":"C","text":"Apply a thigh tourniquet above the wound"},{"letter":"D","text":"Open the wound and clamp the bleeders"}],"correct":"A","explanation":"<p><strong>Why A is correct:</strong> For active external hemorrhage, the first-line maneuver is <strong>direct pressure on the wound</strong> with sterile gauze. It is fast, effective for most bleeding, and controls the majority of extremity hemorrhage without additional tissue injury.</p>\n<p><strong>Why the others are incorrect (or second-line):</strong></p>\n<ul>\n<li><strong>B (Proximal arterial pressure)</strong> --- Indirect pressure is a secondary technique used only if direct pressure fails.</li>\n\n<li><strong>C (Tourniquet)</strong> --- Reserved for hemorrhage not controlled by direct pressure (and is highly appropriate in the field/combat setting); as the <em>initial</em> hospital step, direct pressure is applied first, with a tourniquet escalated if it fails.</li>\n\n<li><strong>D (Open and clamp)</strong> --- Blind clamping in the ED risks injuring adjacent nerves and vessels; hemorrhage control is achieved by pressure first, with definitive repair in the OR.</li>\n</ul>\n<p><strong>Background:</strong> The escalation ladder for external hemorrhage: direct pressure \u2192 pressure dressing \u2192 tourniquet (for uncontrolled extremity bleeding) \u2192 surgical control.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":38,"stem":"Which of the following is TRUE about informed consent:","options":[{"letter":"A","text":"Ensures the patient understands the diagnostic or therapeutic intervention, while giving the patient an opportunity to ask questions or seek a 2nd opinion"},{"letter":"B","text":"Is synonymous with signing the consent form"},{"letter":"C","text":"Is different from shared decision-making"},{"letter":"D","text":"Involves autonomy of the patient and can occur regardless of the capacity of the patient to make their own decisions"}],"correct":"A","explanation":"<p>(the original key noted &quot;B&quot; was marked but the answer is likely A)</p>\n<p><strong>Why A is correct:</strong> Informed consent is a <em>process</em>, not a signature. It ensures the patient understands the nature of the proposed intervention, its risks, benefits, and alternatives, and provides an opportunity to ask questions and seek a second opinion. This reflects the core elements of disclosure, understanding, and voluntary choice.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<ul>\n<li><strong>B</strong> --- Consent is <strong>not</strong> synonymous with signing the form; the signed form merely documents that the consent process occurred. A signature without understanding is not valid consent.</li>\n\n<li><strong>C</strong> --- Informed consent is closely aligned with (not distinct from) shared decision-making; both center on patient participation.</li>\n\n<li><strong>D</strong> --- Valid informed consent <strong>requires</strong> capacity. If a patient lacks capacity, a substitute decision-maker must be involved --- consent cannot occur &quot;regardless of capacity.&quot;</li>\n</ul>\n<p><strong>Background:</strong> The four pillars of valid consent: (1) capacity, (2) disclosure, (3) understanding, and (4) voluntariness (freedom from coercion/undue influence).</p><div class=\"addendum\"><p class=\"addendum-label\">Note (from answer-key addendum)</p><p>Originally contradictory (marked &quot;B&quot; but annotated &quot;likely a&quot;). Corrected answer: <strong>(a)</strong>. Informed consent is a process, not synonymous with signing the form; (B) is a common misconception, not the truth.</p></div>","no_key":false,"no_options":false,"free_answer":null},{"number":39,"stem":"Confidentiality includes all the following EXCEPT:","options":[{"letter":"A","text":"Information can be disclosed to anyone as long as you have consent from your patient"},{"letter":"B","text":"Confidential information can be disclosed if there is a threat to the general public"},{"letter":"C","text":"Mandatory reporting to the authorities is required for suspected cases of child abuse"},{"letter":"D","text":"A court order to testify in court is not required without the consent of the patient"}],"correct":"D","explanation":"<p><strong>Why D is correct (the EXCEPTION / false statement):</strong> This statement is incorrect/self-contradictory. A <strong>court order (subpoena) compels a physician to testify or disclose information <em>without</em> the patient&#x27;s consent</strong> --- it is one of the recognized legal exceptions to confidentiality. Physician-patient confidentiality does not override a valid court order.</p>\n<p><strong>Why the others are true statements about confidentiality:</strong></p>\n<ul>\n<li><strong>A</strong> --- With the patient&#x27;s valid consent, information may be disclosed to the designated party.</li>\n\n<li><strong>B</strong> --- Confidentiality may be breached to protect the public or an identifiable third party from a serious threat (duty to warn/protect).</li>\n\n<li><strong>C</strong> --- Suspected child abuse is subject to mandatory reporting to the appropriate authorities, overriding confidentiality.</li>\n</ul>\n<p><strong>Background:</strong> Recognized exceptions to confidentiality include: patient consent, mandatory reporting (e.g., child abuse, certain communicable diseases), risk of serious harm to identifiable third parties or the public, and legal compulsion by court order.</p>","no_key":false,"no_options":false,"free_answer":null},{"number":40,"stem":"Regarding a power of attorney for personal care, which of the following is TRUE:","options":[{"letter":"A","text":"A power of attorney can override decisions on the patient's behalf, even if the patient is still competent"},{"letter":"B","text":"It is an instrument through which one person grants another the legal authority to make decisions on their behalf in the event they should become incapable"},{"letter":"C","text":"A power of attorney does not need to act on behalf of the patient's best interest"},{"letter":"D","text":"Keeping a record of decisions made on the incapable person's behalf is not a requirement of the power of attorney"}],"correct":"B","explanation":"<p><strong>Why B is correct:</strong> A power of attorney for personal care is a legal instrument by which a capable person (the grantor) appoints a substitute decision-maker to make personal-care/health decisions only if and when the grantor loses capacity. This is the defining feature and aligns with the principle that substitute decision-making applies only when the patient lacks decision-making capacity.</p>\n<p><strong>Why the others are incorrect:</strong></p>\n<ul>\n<li><strong>A:</strong> The authority activates only upon incapacity. A competent patient retains full autonomy; the attorney cannot override a still-competent patient&#x27;s decisions.</li>\n\n<li><strong>C:</strong> The attorney has a fiduciary duty to act in the incapable person&#x27;s best interests (and consistent with prior expressed wishes/values), not against them.</li>\n\n<li><strong>D:</strong> Attorneys are generally required to keep records of decisions made on the incapable person&#x27;s behalf.</li>\n</ul>\n<p><strong>Background:</strong> Substitute decision-making follows a hierarchy of prior expressed wishes \u2192 best-interests standard, and respects patient autonomy as one of the four pillars of biomedical ethics (autonomy, beneficence, nonmaleficence, justice) (Levin, Headache, 2020).</p>","no_key":false,"no_options":false,"free_answer":null},{"number":41,"stem":"Which of the following way to reduce deep vein thrombosis (DVT) in patients with intracranial hemorrhages?","options":[{"letter":"A","text":"Direct oral anticoagulants"},{"letter":"B","text":"Intravenous unfractionated heparin"},{"letter":"C","text":"Subcutaneous unfractionated heparin"},{"letter":"D","text":"Pneumatic compression devices"},{"letter":"E","text":"Low-molecular-weight heparin"}],"correct":"D","explanation":"<p><strong>Why
